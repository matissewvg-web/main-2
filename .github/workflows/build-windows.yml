name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build interface
        run: npm run build

      - name: Smoke test host server
        shell: pwsh
        run: |
          $p = Start-Process node -ArgumentList '--no-warnings','server/standalone.js','.ci-data','4751' -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          $r = Invoke-RestMethod http://127.0.0.1:4751/api/ping
          Stop-Process -Id $p.Id
          if ($r.app -ne 'The Break 5') { throw "Server did not answer" }
          Write-Host "Server OK: $($r.app) $($r.version)"

      - name: Package .exe
        run: npx electron-builder --win --x64 --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: The-Break-5-Windows
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
