name: Build Windows app

on:
  push:
    branches: ['**']
    # Studyover has its own build (studyover-windows.yml).
    paths-ignore:
      - 'studyover/**'
      - '.github/workflows/studyover-windows.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build interface
        run: npm run build

      - name: Smoke test host server
        shell: pwsh
        run: |
          $p = Start-Process node -ArgumentList '--no-warnings','server/standalone.js','.ci-data','4751' -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          $r = Invoke-RestMethod http://127.0.0.1:4751/api/ping
          Stop-Process -Id $p.Id
          if ($r.app -ne 'The Break 5') { throw "Server did not answer" }
          Write-Host "Server OK: $($r.app) $($r.version)"

      - name: Package .exe
        run: npx electron-builder --win --x64 --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Break-5-Windows
          path: release/*.exe
          if-no-files-found: error

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Every successful build becomes the newest GitHub Release, so this link
      # always downloads the latest installer:
      # https://github.com/<owner>/<repo>/releases/latest/download/The-Break-5-Setup.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: The Break 5 ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          make_latest: true
          files: |
            release/The-Break-5-Setup.exe
            release/The-Break-5-Portable.exe
          body: |
            ## Downloaden
            - **The-Break-5-Setup.exe**: installatieprogramma (aanbevolen)
            - **The-Break-5-Portable.exe**: werkt zonder installeren

            Installeer eerst op de host-pc (kantoor-pc die altijd aan staat), daarna op de andere pc's.
            Windows waarschuwt omdat de app niet ondertekend is: klik *Meer informatie* → *Toch uitvoeren*.

            Updaten: installeer de nieuwe Setup over de oude heen. Je gegevens blijven bewaard.
