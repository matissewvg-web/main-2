name: Build Boekschrijfprogramma (Windows)

on:
  push:
    branches: ['**']
    paths:
      - 'boekprogramma/**'
      - '.github/workflows/boekprogramma-windows.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: boekprogramma
    steps:
      - uses: actions/checkout@v4

      # WeasyPrint needs Pango. Take it from MSYS2 and ship the DLLs inside the .exe.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-pango

      - name: Collect Pango DLLs and fontconfig
        shell: msys2 {0}
        run: |
          mkdir -p gtk fonts
          # Every DLL MSYS2 installed for Pango (glib, cairo, harfbuzz, fontconfig, gcc runtime, ...).
          cp /mingw64/bin/*.dll gtk/
          cp -r /mingw64/etc/fonts/. fonts/
          ls gtk
          du -sh gtk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            boekprogramma/requirements.txt
            boekprogramma/requirements-exe.txt

      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-exe.txt

      - name: Tests
        env:
          WEASYPRINT_DLL_DIRECTORIES: ${{ github.workspace }}\boekprogramma\gtk
          FONTCONFIG_PATH: ${{ github.workspace }}\boekprogramma\fonts
          FONTCONFIG_FILE: ${{ github.workspace }}\boekprogramma\fonts\fonts.conf
        run: python -m pytest -q -p no:warnings

      - name: Package .exe
        run: python bouw_exe.py

      # Run the real .exe on a clean PATH: spelling, a PDF and the window library must work from the bundle alone.
      - name: Smoke test .exe
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $log = "$env:RUNNER_TEMP\zelftest.txt"
          $p = Start-Process dist\Boekschrijfprogramma.exe -ArgumentList '--zelftest', $log -Wait -PassThru
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "Zelftest mislukt (exit $($p.ExitCode))" }
          Write-Host ("Grootte: {0:N0} MB" -f ((Get-Item dist\Boekschrijfprogramma.exe).Length / 1MB))

      # Start the .exe the way a user does (double-click, no arguments) and check that it
      # stays up, the server answers and the window loaded the page.
      - name: Start test .exe
        shell: pwsh
        run: |
          $env:BOEKEN_MAP = "$env:RUNNER_TEMP\boeken-start"
          $p = Start-Process dist\Boekschrijfprogramma.exe -PassThru
          $pagina = $false
          for ($i = 0; $i -lt 60 -and -not $p.HasExited; $i++) {
            Start-Sleep -Seconds 1
            $log = Get-Content "$env:BOEKEN_MAP\boekprogramma.log" -Raw -ErrorAction SilentlyContinue
            if ($log -match 'GET /static/app.js' -and $log -match 'GET /api/boeken/') { $pagina = $true; break }
          }
          Start-Sleep -Seconds 5
          $levend = -not $p.HasExited
          try { $antwoord = Invoke-RestMethod http://127.0.0.1:5123/api/boeken; $server = $true } catch { $server = $false }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $scherm = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $scherm.Width, $scherm.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($scherm.Location, [System.Drawing.Point]::Empty, $scherm.Size)
          $bmp.Save("$env:RUNNER_TEMP\starttest.png")
          Get-Process Boekschrijfprogramma -ErrorAction SilentlyContinue | Select-Object Id, MainWindowTitle | Format-Table | Out-String | Write-Host
          Write-Host "---- boekprogramma.log ----"
          Get-Content "$env:BOEKEN_MAP\boekprogramma.log" -ErrorAction SilentlyContinue
          Copy-Item "$env:BOEKEN_MAP\boekprogramma.log" $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          Get-Process Boekschrijfprogramma -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "levend=$levend server=$server pagina=$pagina"
          if (-not ($levend -and $server -and $pagina)) { throw "Starttest mislukt" }

      - name: Upload start test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starttest
          path: |
            ${{ runner.temp }}/starttest.png
            ${{ runner.temp }}/boekprogramma.log
          if-no-files-found: ignore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boekschrijfprogramma-Windows
          path: boekprogramma/dist/Boekschrijfprogramma.exe
          if-no-files-found: error

      # One fixed release, refreshed on every build, so this link never changes:
      # https://github.com/<owner>/<repo>/releases/download/boekprogramma/Boekschrijfprogramma.exe
      # make_latest stays false so The Break 5 keeps the repo's "latest" download link.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: boekprogramma
          name: Boekschrijfprogramma voor Windows
          make_latest: false
          overwrite_files: true
          files: boekprogramma/dist/Boekschrijfprogramma.exe
          body: |
            ## Downloaden
            **Boekschrijfprogramma.exe**: één bestand, niet installeren. Dubbelklik om te starten.

            - Windows waarschuwt omdat het programma niet ondertekend is: klik *Meer informatie* → *Toch uitvoeren*.
            - Opstarten duurt een paar seconden (het programma pakt zichzelf eerst uit).
            - Je boeken komen in de map *Boeken* in je gebruikersmap. Maak daar zelf back-ups van.
            - Werkt op Windows 10 en 11. Het venster gebruikt Microsoft Edge WebView2; ontbreekt dat, dan opent het programma in je browser.
