document.addEventListener("input", e => { const ps = e.target.dataset && e.target.dataset.prijs; if (ps && G.game){ const p = (G.game.producten || []).find(x => x.id === ps); if (!p) return; const f = +e.target.value / 100, x = prijsProef(G.game, p, f), out = document.getElementById("pp_" + ps), bt = document.getElementById("pps_" + ps);
    if (out) out.textContent = `${Math.round(f * 100)}%: ${prijsRegel(p, x)}`; if (bt){ bt.dataset.f = f; bt.disabled = Math.abs(f - prijsF(p)) < 0.005; } return; }
  if (e.target.id === "q"){ S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos,pos); } });

async function openMail(id){
  const m = G.mails.find(x => x.id === id);
  if (!m) return toast("Mail niet gevonden.", true);
  S.mailBody = {id, meta: {Onderwerp: m.onderwerp, Van: m.van, Aan: m.aan || "CEO", Datum: m.datum, Prioriteit: m.prio}, body: m.body};
  S.view = "inbox"; localSet("view","inbox"); S.decrypt = true; S.compose = null;
  render();
  if (!m.gelezen) Store.patchMail(id, {gelezen: true}).then(render).catch(() => {});
}
async function doTick(force){
  if (S.busy) return;
  const d = S.state.datum, nm = d.month === 12 ? [1, d.year+1] : [d.month+1, d.year];
  const ov = showSync(MONTHS[d.month-1].toUpperCase() + " " + d.year + "  →  " + MONTHS[nm[0]-1].toUpperCase() + " " + nm[1]);
  if (S.sound) sweep();
  const [r] = await Promise.all([act("/api/tick", {force}, {silent:true}), sleep(1150)]);
  hideSync(ov);
  if (!r) return;
  document.getElementById("main")?.classList.add("shake");
  if (r.vraag){ if (await ask("Opdrachten staan nog open", r.bericht, "Toch doorgaan")) return doTick(true); return; }
  if (!r.ok) return toast(r.bericht, true);
  if (r.status && r.status !== "actief") { toast("Het is voorbij: " + r.status, true); return; }
  toast(`Nieuwe maand. ${S.state.mails.filter(m=>!m.gelezen).length} ongelezen mail(s).`);
  if (r.rapport_mail) openMail(r.rapport_mail);
}

/* ---- cyberpunk-laag: glitch, ticker, ontsleutelen, opstart, sync, geluid ---- */
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function afterRender(){
  document.querySelectorAll("main h1").forEach(h => { h.classList.add("glitch"); h.dataset.text = h.textContent; });
  updateTicker();
  if (S.decrypt){ S.decrypt = false; scramble(document.getElementById("subj")); }
  const gl = document.getElementById("gmlog"); if (gl) gl.scrollTop = gl.scrollHeight;
}
let tickerKey = "";
function updateTicker(){
  const st = S.state, el = document.getElementById("ticker");
  if (!st || !st.setup_done){ el.hidden = true; return; }
  el.hidden = false;
  const items = st.mails.filter(m => !/^Maandrapport/.test(m.onderwerp)).slice(0, 12).map(m => [m.van.toUpperCase(), m.onderwerp]);
  st.rivalen.slice(0, 4).forEach(r => items.push(["MARKT", `${r.naam} houdt ~${r.aandeel}% van ${r.sector}`]));
  items.push(["STAD", `Heat-index ${esc(st.speler.corp_name)}: ${Math.round(st.heat)}`]);
  const key = JSON.stringify(items);
  if (key === tickerKey) return;
  tickerKey = key;
  const run = document.getElementById("tickrun");
  run.innerHTML = items.map(([a,b]) => `<span class="it"><b>${esc(a)}</b>${esc(b)}</span>`).join("");
  run.style.setProperty("--dur", Math.max(35, items.reduce((n,[a,b]) => n + a.length + b.length, 0) / 5) + "s");
}
function scramble(el){
  if (!el || REDUCED) return;
  const final = el.textContent, chars = "▓▒░#$%&@*+=?/\\<>01ABCDEFX";
  let f = 0; const total = 16;
  const iv = setInterval(() => {
    f++;
    const n = Math.floor(final.length * f / total);
    el.textContent = final.slice(0, n) + Array.from(final.slice(n)).map(c => c === " " ? " " : chars[Math.random()*chars.length|0]).join("");
    if (f >= total){ clearInterval(iv); el.textContent = final; }
  }, 28);
}
function showSync(sub){
  const o = document.createElement("div"); o.className = "sync";
  o.innerHTML = `<div class="t glitch" data-text="SYNCHRONISEREN">SYNCHRONISEREN</div><div class="pb"><i></i></div><div class="s">${esc(sub)}</div>`;
  document.body.appendChild(o); return o;
}
function hideSync(o){ o.classList.add("out"); setTimeout(() => o.remove(), 500); }
S.rustig = (localGet("rustig") ?? (REDUCED ? "1" : "0")) === "1"; if (S.rustig) document.documentElement.classList.add("rustig");
async function boot(){
  let seen = false; try { seen = localStorage.getItem("cl_boot_ooit") === "1"; localStorage.setItem("cl_boot_ooit", "1"); } catch(e){}
  if (seen || REDUCED || S.rustig) return;
  const st = S.state || {}, corp = st.setup_done ? st.speler.corp_name : "ONBEKEND";
  if (!S.loaded) await sleep(50);
  const lines = [
    `<span class="m">${G.game && G.game.map && G.game.map.kind !== "wereld" ? esc(((G.game && G.game.city) || "Meridian Bay").toUpperCase()) + " CITYNET" : "GLOBAL CORPNET"}</span>  //  CHROME LEDGER ${VERSION}  //  node ${(Math.random()*9000+1000|0)}`,
    "> handshake ............... <span class=\"g\">OK</span>",
    "> versleuteling ........... ICE-7 / 2048",
    `> identiteit .............. CEO // ${esc(corp).toUpperCase()}`,
    "> marktfeed ............... <span class=\"g\">LIVE</span>",
    st.setup_done ? `> heat-scanner ............ ${Math.round(st.heat)}` : "> registratie ............. <span class=\"m\">VEREIST</span>",
    "", `<span class="m">█</span> TOEGANG VERLEEND`];
  const o = document.createElement("div"); o.className = "boot";
  o.innerHTML = '<pre></pre><div class="skip">KLIK OM OVER TE SLAAN</div>';
  document.body.appendChild(o);
  const pre = o.querySelector("pre"); let skip = false;
  const end = () => { skip = true; o.classList.add("out"); setTimeout(() => o.remove(), 500); };
  o.addEventListener("click", end); window.addEventListener("keydown", end, {once:true});
  for (const l of lines){ if (skip) return; pre.innerHTML += l + "\n"; if (S.sound) blip(1200, .02); await sleep(170); }
  await sleep(450); if (!skip) end();
}
let AC = null;
function audio(){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} return AC; }
function blip(freq, dur){
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "square"; o.frequency.value = freq; g.gain.value = .035;
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
}
function sweep(){
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sawtooth"; o.frequency.setValueAtTime(90, ac.currentTime); o.frequency.exponentialRampToValueAtTime(700, ac.currentTime + 1.0);
  g.gain.setValueAtTime(.03, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + 1.1);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 1.15);
}

(async () => {
  const sp = (async () => { try { G.sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch(e){ G.sample = null; } })();

})();
