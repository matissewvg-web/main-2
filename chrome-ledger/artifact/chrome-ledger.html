/* ---- events ---- */
document.addEventListener("click", async e => {
  if (S.sound && e.target.closest("button,.dist")) blip(e.target.closest(".next") ? 220 : 660, .045);
  const t = e.target.closest("[data-view],[data-a],[data-open],[data-filter],[data-dist],[data-chip]");
  if (!t) return;
  if (t.dataset.view){ S.view = t.dataset.view; localSet("view", S.view); try { history.replaceState(null, "", "#" + S.view); } catch(_){} if (S.view!=="inbox") S.mailBody = null; render(); document.getElementById("main")?.scrollTo(0,0); return; }
  if (t.dataset.filter){ S.filter = t.dataset.filter; render(); return; }
  if (t.dataset.dist){ S.dist = t.dataset.dist; render(); return; }
  if (t.dataset.chip){
    const key = t.dataset.chip, v = t.dataset.v;
    if (t.dataset.multi){ const a = S.setup[key]; const i = a.indexOf(v); if (i>=0) { if (a.length>1) a.splice(i,1); } else { a.push(v); if (a.length>2) a.shift(); } }
    else S.setup[key] = v;
    render(); return;
  }
  if (t.dataset.open){ await openMail(t.dataset.open); return; }
  const a = t.dataset.a, val = id => (document.getElementById(id)||{}).value;
  switch (a){
    case "sound": S.sound = !S.sound; localSet("sound", S.sound ? "1" : ""); if (S.sound) blip(880,.06); render(); return;
    case "tick": return doTick(false);
    case "order": {
      const txt = val("ordertxt"); if (!txt || !txt.trim()) return toast("Schrijf eerst wat je wilt doen.", true);
      return act("/api/opdracht", {tekst: txt});
    }
    case "compose": S.view = "opdrachten"; render(); return;
    case "reply": { const b = document.getElementById("replybox"); b.style.display = b.style.display==="none"?"block":"none"; document.getElementById("replytxt").focus(); return; }
    case "sendreply": {
      const txt = val("replytxt"); if (!txt || !txt.trim()) return;
      return act("/api/opdracht", {tekst: txt, context: "Re: " + S.mailBody.meta.Onderwerp + " (" + S.mailBody.meta.Van + ")"});
    }
    case "archive": { const m = S.state.mails.find(m=>m.id===S.mailBody.id); await act("/api/mail/flag", {ids:[S.mailBody.id], soort:"archief", waarde:!m.archief}, {silent:true}); S.mailBody = null; render(); return; }
    case "unread": await act("/api/mail/flag", {ids:[S.mailBody.id], soort:"gelezen", waarde:false}, {silent:true}); S.mailBody = null; render(); return;
    case "allread": return act("/api/mail/flag", {ids: S.state.mails.map(m=>m.id), soort:"gelezen", waarde:true}, {silent:true});
    case "closemail": S.mailBody = null; render(); return;
    case "decide": {
      const bud = document.getElementById(`bud_${t.dataset.arc}_${t.dataset.keuze}`);
      if (!await ask("Besluit nemen?", "Dit besluit is definitief.", "Kiezen")) return;
      return act("/api/besluit", {arc:t.dataset.arc, keuze:t.dataset.keuze, budget: bud ? Number(bud.value) : 0});
    }
    case "district": if (!await ask("Vestiging openen?", "Het geld gaat er nu af. Het duurt 3 maanden.", "Openen")) return; return act("/api/project", {soort:"district", id:t.dataset.id});
    case "distorder": { const txt = val("disttxt"); if (!txt || !txt.trim()) return; const d = S.state.districten.find(x=>x.id===t.dataset.id); return act("/api/opdracht", {tekst: txt, context: `District ${d.id} ${d.naam}`}); }
    case "upgrade": if (!await ask("Divisie uitbreiden?", "Het geld gaat er nu af. Het duurt 2 maanden.", "Uitbreiden")) return; return act("/api/project", {soort:"upgrade", divisie:t.dataset.div});
    case "newdiv": return act("/api/project", {soort:"divisie", type: val("ndtype"), naam: val("ndname")});
    case "transfer": return act("/api/geld", {soort:"transfer", van:val("tvan"), naar:val("tnaar"), bedrag:val("tbedrag")});
    case "lening": return act("/api/geld", {soort:"lening", bedrag:val("lbedrag")});
    case "aflossen": return act("/api/geld", {soort:"aflossen", bedrag:val("lbedrag") || S.state.schuld});
    case "autopay": return act("/api/factuur", {alles: !S.state.auto_pay});
    case "pay": return act("/api/factuur", {id:t.dataset.id, actie:"betaal"});
    case "hold": return act("/api/factuur", {id:t.dataset.id, actie:"toggle"});
    case "rivalorder": { S.view = "opdrachten"; render(); const ta = document.getElementById("ordertxt"); ta.value = `${t.dataset.naam}: `; ta.focus(); return; }
    case "cancel": return act("/api/opdracht/intrekken", {id:t.dataset.id}, {silent:true});
    case "gmgo": { const r = await act("/api/gm/uitvoeren", {id:t.dataset.id}, {silent:true}); if (r){ toast(r.bericht, !r.ok); if (r.ok && S.sound) sweep(); } return; }
    case "gmretry": return act("/api/gm/beoordeel", {id:t.dataset.id}, {silent:true});
    case "rephrase": { const o = G.orders.find(x => x.id === t.dataset.id); S.view = "opdrachten"; render(); const ta = document.getElementById("ordertxt"); if (ta && o){ ta.value = o.tekst + "\n"; ta.focus(); } return; }
    case "nieuw": if (!await ask("Nieuw spel beginnen?", "Je huidige bedrijf blijft bewaard in de opslag, maar je speelt verder met een nieuw bedrijf.", "Nieuw spel", true)) return; S.setup = null; return act("/api/nieuw", {zeker:true});
    case "setup": {
      if (!S.setup.corp_name.trim()) return toast("Geef je bedrijf een naam.", true);
      const r = await act("/api/setup", S.setup); if (r && r.ok){ S.view = "inbox"; localSet("view","inbox"); render(); }
      return;
    }
  }
});
document.addEventListener("input", e => { if (e.target.id === "q"){ S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos,pos); } });

async function openMail(id){
  const m = G.mails.find(x => x.id === id);
  if (!m) return toast("Mail niet gevonden.", true);
  S.mailBody = {id, meta: {Onderwerp: m.onderwerp, Van: m.van, Aan: m.aan || "CEO", Datum: m.datum, Prioriteit: m.prio}, body: m.body};
  S.view = "inbox"; localSet("view","inbox"); S.decrypt = true;
  render();
  if (!m.gelezen) Store.patchMail(id, {gelezen: true}).then(render).catch(() => {});
}
async function doTick(force){
  if (S.busy) return;
  const d = S.state.datum, nm = d.month === 12 ? [1, d.year+1] : [d.month+1, d.year];
  const ov = showSync(MONTHS[d.month-1].toUpperCase() + " " + d.year + "  →  " + MONTHS[nm[0]-1].toUpperCase() + " " + nm[1]);
  if (S.sound) sweep();
  const [r] = await Promise.all([act("/api/tick", {force}, {silent:true}), sleep(1150)]);
  hideSync(ov);
  if (!r) return;
  document.getElementById("main")?.classList.add("shake");
  if (r.vraag){ if (await ask("Opdrachten staan nog open", r.bericht, "Toch doorgaan")) return doTick(true); return; }
  if (!r.ok) return toast(r.bericht, true);
  if (r.status && r.status !== "actief") { toast("Het is voorbij: " + r.status, true); return; }
  toast(`Nieuwe maand. ${S.state.mails.filter(m=>!m.gelezen).length} ongelezen mail(s).`);
  if (r.rapport_mail) openMail(r.rapport_mail);
}

/* ---- cyberpunk-laag: glitch, ticker, ontsleutelen, opstart, sync, geluid ---- */
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function afterRender(){
  document.querySelectorAll("main h1").forEach(h => { h.classList.add("glitch"); h.dataset.text = h.textContent; });
  updateTicker();
  if (S.decrypt){ S.decrypt = false; scramble(document.getElementById("subj")); }
}
let tickerKey = "";
function updateTicker(){
  const st = S.state, el = document.getElementById("ticker");
  if (!st || !st.setup_done){ el.hidden = true; return; }
  el.hidden = false;
  const items = st.mails.filter(m => !/^Maandrapport/.test(m.onderwerp)).slice(0, 12).map(m => [m.van.toUpperCase(), m.onderwerp]);
  st.rivalen.slice(0, 4).forEach(r => items.push(["MARKT", `${r.naam} houdt ~${r.aandeel}% van ${r.sector}`]));
  items.push(["STAD", `Heat-index ${esc(st.speler.corp_name)}: ${Math.round(st.heat)}`]);
  const key = JSON.stringify(items);
  if (key === tickerKey) return;
  tickerKey = key;
  const run = document.getElementById("tickrun");
  run.innerHTML = items.map(([a,b]) => `<span class="it"><b>${esc(a)}</b>${esc(b)}</span>`).join("");
  run.style.setProperty("--dur", Math.max(35, items.reduce((n,[a,b]) => n + a.length + b.length, 0) / 5) + "s");
}
function scramble(el){
  if (!el || REDUCED) return;
  const final = el.textContent, chars = "▓▒░#$%&@*+=?/\\<>01ABCDEFX";
  let f = 0; const total = 16;
  const iv = setInterval(() => {
    f++;
    const n = Math.floor(final.length * f / total);
    el.textContent = final.slice(0, n) + Array.from(final.slice(n)).map(c => c === " " ? " " : chars[Math.random()*chars.length|0]).join("");
    if (f >= total){ clearInterval(iv); el.textContent = final; }
  }, 28);
}
function showSync(sub){
  const o = document.createElement("div"); o.className = "sync";
  o.innerHTML = `<div class="t glitch" data-text="SYNCHRONISEREN">SYNCHRONISEREN</div><div class="pb"><i></i></div><div class="s">${esc(sub)}</div>`;
  document.body.appendChild(o); return o;
}
function hideSync(o){ o.classList.add("out"); setTimeout(() => o.remove(), 500); }
async function boot(){
  let seen = false; try { seen = sessionStorage.getItem("cl_boot") === "1"; sessionStorage.setItem("cl_boot", "1"); } catch(e){}
  if (seen || REDUCED) return;
  const st = S.state || {}, corp = st.setup_done ? st.speler.corp_name : "ONBEKEND";
  if (!S.loaded) await sleep(50);
  const lines = [
    `<span class="m">MERIDIAN BAY CITYNET</span>  v4.0.4  //  node ${(Math.random()*9000+1000|0)}`,
    "> handshake ............... <span class=\"g\">OK</span>",
    "> versleuteling ........... ICE-7 / 2048",
    `> identiteit .............. CEO // ${esc(corp).toUpperCase()}`,
    "> marktfeed ............... <span class=\"g\">LIVE</span>",
    st.setup_done ? `> heat-scanner ............ ${Math.round(st.heat)}` : "> registratie ............. <span class=\"m\">VEREIST</span>",
    "", `<span class="m">█</span> TOEGANG VERLEEND`];
  const o = document.createElement("div"); o.className = "boot";
  o.innerHTML = '<pre></pre><div class="skip">KLIK OM OVER TE SLAAN</div>';
  document.body.appendChild(o);
  const pre = o.querySelector("pre"); let skip = false;
  const end = () => { skip = true; o.classList.add("out"); setTimeout(() => o.remove(), 500); };
  o.addEventListener("click", end); window.addEventListener("keydown", end, {once:true});
  for (const l of lines){ if (skip) return; pre.innerHTML += l + "\n"; if (S.sound) blip(1200, .02); await sleep(170); }
  await sleep(450); if (!skip) end();
}
let AC = null;
function audio(){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} return AC; }
function blip(freq, dur){
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "square"; o.frequency.value = freq; g.gain.value = .035;
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
}
function sweep(){
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sawtooth"; o.frequency.setValueAtTime(90, ac.currentTime); o.frequency.exponentialRampToValueAtTime(700, ac.currentTime + 1.0);
  g.gain.setValueAtTime(.03, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + 1.1);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 1.15);
}

window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v && v !== S.view && VIEWS[v]){ S.view = v; render(); } });
render();
(async () => {
  const sp = (async () => { try { G.sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch(e){ G.sample = null; } })();
  await Store.init(); await sp; render(); boot();
})();
