<title>Chrome Ledger</title>
<meta name="theme-color" content="#06020e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* layout: één scherm-app; neon-HUD op diep violet, vaste nieuwsband onderaan */
:root{
  color-scheme:dark;
  --bg:#06020e; --panel:rgba(17,9,34,.86); --panel2:#1b0f36; --panel3:#241449; --line:#2c1b52; --line2:#4b2d86;
  --text:#ece6ff; --muted:#a297cc; --dim:#6d6299;
  --cyan:#05d9e8; --cyan-d:rgba(5,217,232,.12); --mag:#ff2a6d; --mag-d:rgba(255,42,109,.13);
  --amber:#ffb400; --amber-d:rgba(255,180,0,.10); --red:#ff2a6d; --red-d:rgba(255,42,109,.14);
  --violet:#b967ff; --green:#2bff9a;
  --mono:"Share Tech Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --sans:"Rajdhani","Segoe UI",system-ui,sans-serif;
  --disp:"Orbitron","Rajdhani","Segoe UI",sans-serif;
  --cut:12px; --r:0px;
  --glow-c:0 0 6px rgba(5,217,232,.55),0 0 18px rgba(5,217,232,.25);
  --glow-m:0 0 6px rgba(255,42,109,.6),0 0 20px rgba(255,42,109,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
html{background:#06020e}
body{color:var(--text);font:500 16px/1.45 var(--sans);letter-spacing:.01em;
  background:
    radial-gradient(ellipse 60% 50% at 8% -10%,rgba(255,42,109,.16),transparent 60%),
    radial-gradient(ellipse 55% 45% at 105% 110%,rgba(5,217,232,.13),transparent 60%),
    radial-gradient(ellipse 40% 30% at 70% 20%,rgba(185,103,255,.07),transparent 70%),
    linear-gradient(rgba(124,77,255,.06) 1px,transparent 1px) 0 0/100% 34px,
    linear-gradient(90deg,rgba(124,77,255,.06) 1px,transparent 1px) 0 0/34px 100%,
    var(--bg);
  background-attachment:fixed}
::selection{background:var(--mag);color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)} .dim{color:var(--dim)}
::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--bg)} ::-webkit-scrollbar-thumb:hover{background:var(--violet)}

/* ---- overlays: scanlines, vignette, ruis ---- */
.fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.fx.scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.fx.vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.fx.roll{background:linear-gradient(180deg,transparent 0,rgba(5,217,232,.05) 48%,rgba(255,255,255,.06) 50%,transparent 52%);background-size:100% 260px;background-repeat:no-repeat;animation:roll 9s linear infinite;opacity:.6}
@keyframes roll{from{background-position:0 -260px}to{background-position:0 calc(100vh + 260px)}}

/* ---- afgeschuinde panelen ---- */
.cut{clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.card,.stat,.date,.btn,.opt,.inbox,.toast div,.modal .box,svg.map,.chip{
  clip-path:polygon(0 0,calc(100% - var(--c,8px)) 0,100% var(--c,8px),100% 100%,var(--c,8px) 100%,0 calc(100% - var(--c,8px)))}
.card,.inbox,svg.map,.modal .box{--c:var(--cut)}

/* ---- layout ---- */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto 1fr;height:calc(100% - 34px)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 18px;position:relative;
  background:linear-gradient(180deg,rgba(27,15,54,.95),rgba(10,5,22,.92));border-bottom:1px solid var(--line2)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--mag),transparent 30%,transparent 70%,var(--cyan));opacity:.9}
.brand{font-family:var(--disp);font-weight:800;letter-spacing:.16em;color:#fff;font-size:15px;white-space:nowrap;line-height:1.1}
.brand b{color:var(--mag);text-shadow:var(--glow-m);font-weight:800}
.brand .neon{color:var(--cyan);text-shadow:var(--glow-c);animation:flicker 7s infinite}
.brand small{display:block;color:var(--muted);letter-spacing:.12em;font:600 13px/1.4 var(--sans);text-transform:uppercase;margin-top:4px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.35}}
.date{font-family:var(--mono);font-size:14px;padding:6px 12px;background:var(--panel2);color:var(--cyan);border-left:2px solid var(--cyan);white-space:nowrap;letter-spacing:.08em}
.date::before{content:"// ";color:var(--dim)}
.stats{display:flex;gap:8px;flex:1;min-width:0;overflow-x:auto;padding-bottom:2px}
.stat{min-width:104px;padding:5px 10px 6px;background:rgba(27,15,54,.7);border-top:1px solid var(--line2)}
.stat .k{font:700 12.5px/1.2 var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.16em}
.stat .v{font-family:var(--mono);font-size:17px;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.15)}
.bar{height:5px;margin-top:4px;background:repeating-linear-gradient(90deg,rgba(124,77,255,.22) 0 5px,transparent 5px 7px)}
.bar i{display:block;height:100%;background:var(--cyan);box-shadow:var(--glow-c);
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px)}
.bar.heat i{background:linear-gradient(90deg,var(--amber),var(--mag));box-shadow:var(--glow-m)}

/* ---- knoppen ---- */
.btn{position:relative;background:var(--panel2);border:0;box-shadow:inset 0 0 0 1px var(--line2);padding:7px 14px;cursor:pointer;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13.5px;transition:background .12s,box-shadow .12s,color .12s;white-space:nowrap}
.btn:hover{box-shadow:inset 0 0 0 1px var(--cyan),0 0 14px rgba(5,217,232,.25);color:#fff;background:var(--panel3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:inset 0 0 0 1px var(--line)}
.btn.primary{background:var(--cyan);color:#03141a;box-shadow:0 0 16px rgba(5,217,232,.35)}
.btn.primary:hover{background:#5ff0fa;color:#03141a}
.btn.warn{box-shadow:inset 0 0 0 1px var(--amber);color:var(--amber)}
.btn.warn:hover{background:var(--amber);color:#1b1000}
.btn.danger{box-shadow:inset 0 0 0 1px var(--mag);color:var(--mag)}
.btn.danger:hover{background:var(--mag);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.next{--c:10px;font-family:var(--disp);font-weight:800;letter-spacing:.14em;padding:11px 20px;font-size:14px;
  background:var(--mag);color:#fff;box-shadow:0 0 22px rgba(255,42,109,.45);text-shadow:0 0 6px rgba(255,255,255,.5)}
.btn.next:hover{background:#ff4f88;color:#fff;animation:jit .25s steps(2) 2}
@keyframes jit{0%{transform:translate(0)}50%{transform:translate(-1px,1px)}100%{transform:translate(1px,0)}}

/* ---- navigatie ---- */
nav{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;background:rgba(8,3,18,.6)}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 12px;
  cursor:pointer;color:var(--muted);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;position:relative}
nav button .ix{font:13px var(--mono);color:var(--dim);margin-right:9px;letter-spacing:0}
nav button:hover{color:#fff;background:linear-gradient(90deg,rgba(5,217,232,.10),transparent)}
nav button.on{color:#fff;background:linear-gradient(90deg,rgba(255,42,109,.22),transparent 85%)}
nav button.on::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--mag);box-shadow:var(--glow-m)}
nav button.on .ix{color:var(--mag)}
nav .sep{height:1px;background:linear-gradient(90deg,var(--line2),transparent);margin:10px 6px}
nav .sys{margin-top:auto;padding:10px 12px 2px;font:13px/1.6 var(--mono);color:var(--dim)}
nav .sys .on{color:var(--green)}
nav .sys button{all:unset;cursor:pointer;color:var(--muted);text-decoration:underline dotted}
.badge{font:700 13px/1.5 var(--mono);background:var(--cyan);color:#03141a;padding:0 7px;box-shadow:var(--glow-c);letter-spacing:0}
.badge.amber{background:var(--amber);box-shadow:0 0 10px rgba(255,180,0,.5);color:#1b1000}

main{overflow-y:auto;padding:22px 26px 40px;min-width:0}
h1{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 18px;color:#fff;position:relative;display:inline-block}
main h1::after{content:"";display:block;height:2px;width:60px;margin-top:8px;background:var(--mag);box-shadow:var(--glow-m)}
h2{font:700 13px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.22em;color:var(--cyan);margin:24px 0 10px;display:flex;align-items:center;gap:10px}
h2::before{content:"▚";color:var(--mag);font-size:12.5px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.glitch{position:relative}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;pointer-events:none;opacity:0}
.glitch::before{color:var(--mag);animation:gl1 4.2s infinite steps(1)}
.glitch::after{color:var(--cyan);animation:gl2 4.2s infinite steps(1)}
@keyframes gl1{0%,90%,100%{opacity:0;transform:none;clip-path:inset(0 0 0 0)}91%{opacity:.9;transform:translate(3px,-1px);clip-path:inset(10% 0 55% 0)}93%{opacity:.9;transform:translate(-3px,1px);clip-path:inset(60% 0 5% 0)}95%{opacity:0}}
@keyframes gl2{0%,90%,100%{opacity:0;transform:none;clip-path:inset(0 0 0 0)}92%{opacity:.85;transform:translate(-2px,1px);clip-path:inset(45% 0 25% 0)}94%{opacity:.85;transform:translate(2px,0);clip-path:inset(5% 0 70% 0)}96%{opacity:0}}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.card{position:relative;background:var(--panel);padding:15px 17px;box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(3px)}
.card::before{content:"";position:absolute;top:0;right:0;width:var(--cut);height:var(--cut);background:linear-gradient(225deg,transparent 46%,var(--line2) 47% 53%,transparent 54%)}
.card::after{content:"";position:absolute;left:0;top:0;width:28px;height:2px;background:var(--cyan);box-shadow:var(--glow-c)}
.card h3{margin:0 0 6px;font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.card.decision{box-shadow:inset 0 0 0 1px rgba(255,180,0,.55),0 0 30px rgba(255,180,0,.06);background:linear-gradient(160deg,rgba(255,180,0,.10),var(--panel) 55%)}
.card.decision::after{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:blink 1.4s infinite}
.card.decision h3{color:var(--amber);text-shadow:0 0 10px rgba(255,180,0,.35)}
.card.decision h3::before{content:"⚠ ";}
@keyframes blink{50%{opacity:.2}}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 11px;background:rgba(6,2,14,.6);box-shadow:inset 0 0 0 1px var(--line2)}
.opt:hover{box-shadow:inset 0 0 0 1px var(--amber)}
.opt .t{font-weight:700;letter-spacing:.04em}
.opt .u{font-size:14px;color:var(--muted)}
.starter{border:1px dashed var(--line);padding:10px 12px;margin-top:4px}
.stappen{margin-bottom:14px;box-shadow:inset 0 0 0 1px var(--cyan)}
@media (min-width:1150px){.app.gmopen main{padding-right:452px}}
.prodblad{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 16px;margin:8px 0;padding:10px 12px;background:rgba(5,217,232,.04);box-shadow:inset 0 0 0 1px var(--line)}.prodblad .wide{grid-column:1/-1}
.spec{display:grid;grid-template-columns:110px minmax(0,1fr) 24px;gap:8px;align-items:center;font-size:13.5px;margin:3px 0}
.pspark{display:flex;align-items:flex-end;gap:3px;height:44px}.pspark i{flex:1;background:var(--cyan);opacity:.7;min-width:4px}
.planstap{margin:6px 0;padding-left:20px;font-size:14px}.planstap li.af{opacity:.5;text-decoration:line-through}.planstap li.nu{color:var(--amber);font-weight:700}
.gmsnel{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid var(--line)}.gmsnel .chip{font-size:12.5px;padding:4px 9px}
.stapl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.stapl li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center}
.stapl .vink{width:20px;height:20px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--green);font-weight:700}
.stapl li.af{opacity:.55}.stapl li.af b{text-decoration:line-through}
.chip.on .dim,.chip.on span{color:#03141a;opacity:.8}
.gmfab{position:fixed;right:18px;bottom:62px;z-index:40;width:56px;height:56px;border-radius:50%;background:var(--panel2);color:var(--cyan);border:1px solid var(--cyan);font-weight:700;letter-spacing:.08em;box-shadow:0 0 18px rgba(5,217,232,.35);cursor:pointer}
.gmfab .gmdot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--amber)}
.gmpanel{position:fixed;right:16px;bottom:56px;top:96px;width:min(420px,calc(100vw - 32px));z-index:45;display:flex;flex-direction:column;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--cyan),0 10px 40px rgba(0,0,0,.6)}
@media (max-width:700px){.gmpanel{left:8px;right:8px;width:auto;top:64px;bottom:48px}.gmfab{right:12px;bottom:56px}}
.opt .keff{font-size:13px;color:var(--text);opacity:.85;margin-top:2px;font-family:var(--mono)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
input[type=text],input[type=number],select,textarea{background:rgba(6,2,14,.85);border:0;box-shadow:inset 0 0 0 1px var(--line2);padding:8px 10px;min-width:0;font-family:var(--mono);font-size:14.5px;color:#fff}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:inset 0 0 0 1px var(--cyan),0 0 12px rgba(5,217,232,.2)}
input::placeholder,textarea::placeholder{color:var(--dim)}
textarea{width:100%;resize:vertical;min-height:88px;caret-color:var(--mag)}
select option{background:#120a26}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
th{color:var(--cyan);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.14em}
tbody tr:hover td{background:rgba(5,217,232,.04)}
td.num,th.num{text-align:right;font-family:var(--mono)}
.tag{display:inline-block;font:13px/1.5 var(--mono);box-shadow:inset 0 0 0 1px var(--line2);padding:0 6px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tag.KRITIEK{box-shadow:inset 0 0 0 1px var(--mag);color:#fff;background:var(--mag);text-shadow:none}
.tag.HOOG{box-shadow:inset 0 0 0 1px var(--amber);color:var(--amber)}
.tag.LAAG{color:var(--dim)}
.tag.ok{box-shadow:inset 0 0 0 1px var(--green);color:var(--green)}
.tag.cyan{box-shadow:inset 0 0 0 1px var(--cyan);color:var(--cyan)}

/* ---- inbox ---- */
.inbox{display:grid;grid-template-columns:minmax(260px,390px) 1fr;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);height:calc(100dvh - 210px);min-height:420px;overflow:hidden}
.ilist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.itools{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:rgba(6,2,14,.4)}

.news{display:grid;gap:8px}
.nws{border-left:3px solid var(--line2);padding:6px 10px;background:rgba(6,2,14,.35)}
.nws.jij{border-color:var(--amber);background:var(--amber-d)}
.nws.gerucht b{font-style:italic;color:var(--muted)}
.nws.onderwereld{border-color:var(--mag)}
.nws.special{border-color:var(--violet);background:rgba(185,103,255,.10)}.nws.special b{color:var(--violet)}
.nws.mensen{border-color:var(--cyan)}
.person .acts{gap:6px;margin-top:10px}
.perk{font-size:13.5px;color:var(--muted);margin:6px 0;padding:5px 8px;box-shadow:inset 0 0 0 1px var(--line)}
.perk.on{color:var(--text);box-shadow:inset 0 0 0 1px var(--green);background:rgba(43,255,154,.06)}
.perk .kpi{margin-right:6px}
.yield{margin-top:12px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line2);background:rgba(6,2,14,.45)}
.ylist{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.ylist li{margin:3px 0}.ylist li.bad{color:#ff8fb0}.ylist li.good{color:var(--green)}
.sbonus{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:10px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--cyan);background:var(--cyan-d)}
.sbonus b{color:var(--cyan);font-size:17px}
.crow{display:grid;grid-template-columns:30px minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr) 100px 54px;gap:8px;align-items:center;padding:7px 4px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;font-size:14.5px;cursor:pointer}
.crow.head{cursor:default;font:12.5px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.crow:not(.head):hover,.crow.sel{background:linear-gradient(90deg,rgba(5,217,232,.10),transparent)}
.crow.speler{background:rgba(5,217,232,.08)}
.crow .num{text-align:right}.crow small{font-size:12.5px}
.crow .dot{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:middle}
.crow > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 80px 40px 60px 46px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.glands{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.gl{font:13px var(--mono);padding:2px 6px;box-shadow:inset 0 0 0 1px var(--line2);color:var(--muted)}
.gl.mijn{box-shadow:inset 0 0 0 1px var(--amber);color:var(--amber)}
@media (max-width:700px){.crow{grid-template-columns:24px minmax(0,1fr) 92px}.crow .hm{display:none}.srow{grid-template-columns:minmax(0,1fr) 40px 56px}.srow svg,.srow .dim{display:none}}

.helpov{position:fixed;inset:0;background:rgba(3,0,8,.78);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.helpov .box{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--cyan),0 0 40px rgba(5,217,232,.15);padding:18px 20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
kbd{font:13px var(--mono);padding:2px 7px;box-shadow:inset 0 0 0 1px var(--line2),0 2px 0 var(--line2);color:var(--cyan);white-space:nowrap}
.badge.ok{background:var(--green);color:#03140c}
.setupapp .stats .v{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapwrap > *{min-width:0}
.person .opt > div{min-width:0;flex:1}.person .opt select,.card .acts select{max-width:100%;min-width:0}


.ptags{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:5px;font-size:13px}
.pe{font:12.5px var(--mono);padding:1px 5px;box-shadow:inset 0 0 0 1px var(--line2)}
.pe.good{color:var(--green)}.pe.bad{color:#ff8fb0}
.rev{color:var(--amber);font-size:13px}.rev i{color:var(--text)}
.prijzen{display:flex;gap:4px;margin-top:6px}
.plog{display:flex;flex-direction:column;gap:1px;margin-top:5px;font-size:12.5px;color:var(--dim)}
.plog .mono{color:var(--muted)}.prijzen .chip{font-size:12.5px;padding:3px 8px}

.devbox{margin-top:10px;padding:10px;box-shadow:inset 0 0 0 1px var(--line2);background:rgba(6,2,14,.4)}
.devbox .newprod{margin-top:0}

@media (min-width:700px){.newprod{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto}}
.landchips .chip{font-size:13px;padding:5px 9px}

:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.rustig .fx,.rustig .glitch::before,.rustig .glitch::after{display:none!important}

.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:3px 10px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.tabs button:hover{color:#fff}
.tabs button.on{color:#03141a;background:var(--cyan)}
.mails{overflow-y:auto;flex:1}
.mail{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 13px;cursor:pointer;color:var(--text);position:relative}
.mail:hover{background:linear-gradient(90deg,rgba(5,217,232,.08),transparent)}
.mail.sel{background:linear-gradient(90deg,rgba(255,42,109,.16),transparent)}
.mail.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mag);box-shadow:var(--glow-m)}
.mail .from{font-size:13.5px;display:flex;justify-content:space-between;gap:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mail .from b{font-weight:700}
.mail .subj{font-size:16px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mail .prev{font:13px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail.unread .subj{color:#fff;font-weight:700}
.mail.unread .from b{color:var(--cyan)}
.mail.unread .from b::before{content:"";display:inline-block;width:7px;height:7px;background:var(--cyan);box-shadow:var(--glow-c);margin-right:7px;vertical-align:1px;animation:blink 1.6s infinite}
.reader{overflow-y:auto;padding:20px 24px;min-height:0;background:linear-gradient(180deg,rgba(6,2,14,.35),transparent 200px)}
.reader .hdr{border-bottom:1px dashed var(--line2);padding-bottom:13px;margin-bottom:15px}
.reader .hdr h2{margin:0 0 8px;font:700 22px/1.25 var(--sans);color:#fff;text-transform:none;letter-spacing:.02em;display:block}
.reader .hdr h2::before,.reader .hdr h2::after{display:none}
.reader .meta{font-size:14px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.reader .meta>span:nth-child(odd){font:13px/1.9 var(--mono);text-transform:uppercase;color:var(--dim)}
.reader .stamp{float:right;font:12.5px var(--mono);color:var(--green);box-shadow:inset 0 0 0 1px var(--green);padding:1px 6px;letter-spacing:.1em}
.md{font:14.5px/1.65 var(--mono);color:#d9d2f5}
.md p{margin:0 0 11px}
.md h1{font:800 15px var(--disp);letter-spacing:.14em;margin:4px 0 12px;color:var(--cyan);text-shadow:var(--glow-c)}
.md h1::after{display:none}
.md b{color:#fff}
.md table{margin:6px 0 14px;max-width:660px;display:block;overflow-x:auto;font-size:14px}
.md code{background:var(--panel2);padding:0 4px}
.empty{color:var(--dim);text-align:center;padding:50px 10px;font:14px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.back{display:none}

/* ---- kaart ---- */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,1fr);gap:16px;align-items:start}
svg.map{width:100%;height:auto;display:block;background:
  linear-gradient(rgba(5,217,232,.07) 1px,transparent 1px) 0 0/100% 22px,
  linear-gradient(90deg,rgba(5,217,232,.07) 1px,transparent 1px) 0 0/22px 100%,#05010c;
  box-shadow:inset 0 0 0 1px var(--line2)}
.dist{cursor:pointer}
.dist rect{fill:rgba(20,10,42,.82);stroke:#43297a;stroke-width:1.4;transition:fill .15s,stroke .15s}
.dist:hover rect{fill:rgba(36,20,73,.9);stroke:var(--violet)}
.dist.player rect{fill:rgba(5,217,232,.11);stroke:var(--cyan);filter:drop-shadow(0 0 6px rgba(5,217,232,.6));animation:pulse 2.6s ease-in-out infinite}
.dist.sel rect{stroke:var(--mag);stroke-width:2.5;filter:drop-shadow(0 0 8px rgba(255,42,109,.7))}
@keyframes pulse{50%{filter:drop-shadow(0 0 2px rgba(5,217,232,.3))}}
.dist text{font-family:var(--mono)}
.dist text:not([fill]){fill:var(--text)}
.dist .nm{fill:#fff}
.dist .hqm rect{fill:#2a0717;stroke:var(--mag);filter:drop-shadow(0 0 4px rgba(255,42,109,.8));animation:none}
.dist .hqm text{fill:var(--mag);font-family:var(--mono)}
.dist .nm{font-family:var(--disp);font-weight:800;letter-spacing:.06em}
.dist .id{fill:var(--dim);font-size:13px}
.dist.player .id{fill:var(--cyan)}
.dist .hqm{animation:hq 1.6s infinite}
@keyframes hq{50%{opacity:.55}}
.ring{animation:dash 3s linear infinite}
@keyframes dash{to{stroke-dashoffset:-44}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:13px var(--mono);color:var(--muted);margin-top:9px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}

/* ---- overig ---- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:15px}
.kv dt{color:var(--dim);font:13px/1.9 var(--mono);text-transform:uppercase}
.kv dd{margin:0;font-family:var(--mono);color:#fff}
.big{font:22px/1.2 var(--mono);color:#fff;text-shadow:0 0 10px rgba(255,255,255,.15)}
.kpi{font:700 12.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.prog{height:6px;margin-top:7px;background:repeating-linear-gradient(90deg,rgba(124,77,255,.2) 0 6px,transparent 6px 8px)}
.prog i{display:block;height:100%;background:var(--violet);box-shadow:0 0 8px var(--violet);-webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px)}
.fac{display:grid;grid-template-columns:96px 1fr 92px;gap:12px;align-items:center;padding:6px 0;font-size:15px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.fbar{position:relative;height:6px;background:rgba(124,77,255,.15)}
.fbar::after{content:"";position:absolute;left:50%;top:-3px;width:1px;height:12px;background:var(--line2)}
.fbar i{position:absolute;top:0;height:100%}
.toast{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(128px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(430px,calc(100vw - 32px))}
.toast div{background:rgba(20,10,42,.96);box-shadow:inset 0 0 0 1px var(--line2),0 10px 30px rgba(0,0,0,.6);border-left:3px solid var(--cyan);padding:10px 14px;
  white-space:pre-wrap;font:14px/1.45 var(--mono);animation:tin .25s ease-out}
.toast div::before{content:"> ";color:var(--cyan)}
.toast div.bad{border-left-color:var(--mag)} .toast div.bad::before{content:"! ";color:var(--mag)}
@keyframes tin{from{transform:translateX(20px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(3,0,8,.8);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal .box{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2);max-width:720px;width:100%;max-height:calc(100vh - 32px);overflow-y:auto;padding:20px 22px}
.setup{max-width:900px;margin:0 auto}
.setup .card{margin-bottom:14px}
.setup .hero{font:800 34px/1.05 var(--disp);letter-spacing:.14em;color:#fff;margin:6px 0 6px}
.setup .hero b{color:var(--mag);text-shadow:var(--glow-m)}
.setup .hero span{color:var(--cyan);text-shadow:var(--glow-c)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;box-shadow:inset 0 0 0 1px var(--line2);padding:6px 13px;cursor:pointer;background:rgba(6,2,14,.6);font-weight:700;font-size:14px;letter-spacing:.04em}
.chip:hover{box-shadow:inset 0 0 0 1px var(--cyan)}
.chip.on{box-shadow:inset 0 0 0 1px var(--cyan),0 0 12px rgba(5,217,232,.3);color:#03141a;background:var(--cyan)}
.over{text-align:center;padding:70px 20px}
.over .big{font:800 44px/1.1 var(--disp);color:var(--mag);letter-spacing:.14em;text-shadow:var(--glow-m)}
pre.rolls{font:13px/1.6 var(--mono);white-space:pre-wrap;color:var(--green);margin:0;text-shadow:0 0 6px rgba(43,255,154,.25)}

/* ---- nieuwsticker ---- */
.ticker{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;height:34px;overflow:hidden;border-top:1px solid var(--line2);background:rgba(6,2,14,.92);font:13.5px var(--mono)}
.ticker .lbl{flex:none;height:100%;display:flex;align-items:center;padding:0 14px;background:var(--mag);color:#fff;font:800 13px var(--disp);letter-spacing:.16em;box-shadow:var(--glow-m);
  clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);padding-right:22px}
.ticker .lane{flex:1;overflow:hidden;white-space:nowrap;-webkit-mask:linear-gradient(90deg,transparent,#000 30px,#000 calc(100% - 30px),transparent);mask:linear-gradient(90deg,transparent,#000 30px,#000 calc(100% - 30px),transparent)}
.ticker .run{display:inline-block;padding-left:100%;animation:tick var(--dur,60s) linear infinite}
.ticker:hover .run{animation-play-state:paused}
.ticker .it{margin-right:46px;color:var(--muted)} .ticker .it b{color:var(--cyan);font-weight:400;margin-right:8px}
@keyframes tick{to{transform:translateX(-100%)}}

/* ---- opstart & sync ---- */
.boot,.sync{position:fixed;inset:0;z-index:100;background:#030008;display:flex;align-items:center;justify-content:center;padding:24px}
.boot pre{font:15px/1.7 var(--mono);color:var(--cyan);text-shadow:var(--glow-c);margin:0;max-width:640px;width:100%;white-space:pre-wrap}
.boot pre .m{color:var(--mag);text-shadow:var(--glow-m)} .boot pre .g{color:var(--green)}
.boot .skip{position:fixed;bottom:18px;right:22px;font:13px var(--mono);color:var(--dim);letter-spacing:.1em}
.boot.out,.sync.out{animation:fadeout .45s forwards}
@keyframes fadeout{to{opacity:0;visibility:hidden}}
.sync{flex-direction:column;gap:18px;background:rgba(3,0,8,.93)}
.sync .t{font:800 30px var(--disp);letter-spacing:.24em;color:#fff;text-align:center}
.sync .s{font:14px var(--mono);color:var(--cyan);letter-spacing:.14em;text-align:center}
.sync .pb{width:min(420px,80vw);height:8px;background:repeating-linear-gradient(90deg,rgba(124,77,255,.25) 0 8px,transparent 8px 10px)}
.sync .pb i{display:block;height:100%;width:0;background:var(--mag);box-shadow:var(--glow-m);animation:fill 1.1s ease-in-out forwards;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 10px);mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 10px)}
@keyframes fill{to{width:100%}}
.shake{animation:shake .35s steps(3)}
@keyframes shake{0%{transform:translate(0)}33%{transform:translate(-4px,2px);filter:hue-rotate(40deg)}66%{transform:translate(3px,-2px)}100%{transform:none}}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr}
  .top{flex-wrap:wrap;gap:10px;padding:10px 16px}
  .brand{order:0} .btn.next{order:1;margin-left:auto;padding:10px 14px} .date{order:2} .nx-long{display:none}
  .stats{order:3;width:100%;flex-basis:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow:visible}
  .stat{min-width:0}.stat .k{font-size:11px;letter-spacing:.08em}.stat .v{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 10px}
  nav button{width:auto;gap:6px;padding:7px 10px;white-space:nowrap}
  nav button.on::before{left:6px;right:6px;top:auto;bottom:0;width:auto;height:2px}
  nav .sep,nav .sys{display:none}
  main{padding:16px 16px 40px}
  .inbox{grid-template-columns:1fr;height:auto;min-height:0}
  .inbox .reader{display:none}
  .inbox.reading .ilist{display:none}
  .inbox.reading .reader{display:block}
  .back{display:inline-block;margin-bottom:10px}
  .mapwrap{grid-template-columns:1fr}
  .setup .hero{font-size:24px}
  .toast{bottom:120px;right:12px;left:12px;max-width:none}
  .toast div{font-size:13px}
  .ticker .lbl{font-size:12px;padding:0 18px 0 10px;letter-spacing:.1em}
}
/* iPhone: notch en home-balk */
@supports (padding:max(0px)){
  .top{padding-top:max(10px,env(safe-area-inset-top));padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
  .ticker{height:calc(34px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
  .app{height:calc(100% - 34px - env(safe-area-inset-bottom))}
}

.mapscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

svg.globe .dn{font-size:9.5px;letter-spacing:.03em}

.domrow{padding:8px 0;border-bottom:1px solid var(--line)}

.navy{margin-top:14px;padding:12px;background:rgba(6,2,14,.55);box-shadow:inset 0 0 0 1px var(--line2);display:flex;flex-direction:column;gap:8px}
svg.globe .di{font-size:9.5px}

.dombar{display:flex;height:14px;margin:8px 0 6px;background:var(--line);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line2)}

.hero .ver{font:700 14px var(--mono);color:var(--amber);letter-spacing:.1em;vertical-align:super}

/* ---- rivalen ---- */

.comms{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);height:calc(100dvh - 235px);min-height:440px;overflow:hidden}

<script>
/* ===================== scherm ===================== */
const S = {zone:null, rival:null, chat:"gm", chatOpen:false, compose:null, keep:{}, expect:false, newType:null, loaded:false, loadNote:"", sound: !!localGet("sound"), decrypt:false, booted:false, state:null, view: (location.hash || "").slice(1) || localGet("view") || "overzicht", mail:null, mailBody:null, filter:"alles", q:"", dist:null, busy:false, version:0, setup:null};

function localGet(k){ try { return localStorage.getItem("cl_"+k); } catch(e){ return null; } }
function localSet(k,v){ try { localStorage.setItem("cl_"+k, v); } catch(e){} }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const k = n => (Math.round(n*10)/10).toLocaleString("nl-NL") ;
const eur = n => "€" + k(n) + "k";
const MONTHS = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];

function toast(msg, bad){
  const t = document.createElement("div"); if (bad) t.className = "bad"; t.textContent = msg;
  const box = document.getElementById("toast"); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), bad ? 7000 : 4500);
}
async function load(){ if (S.wtab === undefined) S.wtab = localGet("wtab") || "nieuws"; if (S.pfilter === undefined) S.pfilter = localGet("pfilter") || "alle"; render(); }
async function act(path, body, opts={}){
  if (S.busy) return; S.busy = true;
  try {
    const r = await api(path, body);
    if (r.bericht && !opts.silent) toast(r.bericht, !r.ok);
    await load();
    return r;
  } catch(e){ toast("Er ging iets mis: " + (e && (e.message || e.code) || "onbekend"), true); console.error(e); }
  finally { S.busy = false; }
}

/* ---- mini markdown voor mails ---- */
function inline(s){
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>");
}
function md(src){
  const lines = String(src||"").split(/\r?\n/); let out = "", para = [], i = 0;
  const flush = () => { if (para.length){ out += "<p>"+para.map(inline).join("<br>")+"</p>"; para = []; } };
  while (i < lines.length){
    const l = lines[i];
    if (/^\s*\|/.test(l)){
      flush(); const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out += "<table><thead><tr>" + cells(body[0]).map(c=>"<th>"+inline(c)+"</th>").join("") + "</tr></thead><tbody>" +
        body.slice(1).map(r => "<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("") + "</tbody></table>";
      continue;
    }
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if (h){ flush(); out += `<h1>${inline(h[2])}</h1>`; i++; continue; }
    if (/^\s*[-*]\s+/.test(l) && !/^\*\*/.test(l.trim())){
      flush(); out += "<ul>"; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) out += "<li>"+inline(lines[i++].replace(/^\s*[-*]\s+/,""))+"</li>"; out += "</ul>"; continue;
    }
    if (!l.trim()){ flush(); i++; continue; }
    para.push(l); i++;
  }
  flush(); return out;
}

/* ---- layout ---- */
function render(){
  const root = document.getElementById("root");
  if (!S.loaded){ root.innerHTML = `<div class="loading"><div class="t">CHROME<span style="color:var(--mag)">//</span>LEDGER</div><div class="s"><span class="dots"></span> VERBINDEN MET CORPNET · ${VERSION}</div>${S.loadNote?`<div class="muted">${esc(S.loadNote)}</div>`:""}</div>`; return; }
  const _ui = snapUI();
  S.state = vm(); const st = S.state;
  if (!VIEWS[S.view]) S.view = "overzicht";
  if (st.geen_spel || !st.setup_done) { root.innerHTML = setupView(); bindSetup(); document.getElementById("ticker").hidden = true; return; }
  const unread = st.mails.filter(m => !m.gelezen && !m.archief).length;
  const commsOpen = st.contacten.filter(c => c.open).length;
  const nav = [["overzicht","Overzicht", st.besluiten.length ? `<span class="badge amber">${st.besluiten.length}</span>`:""],
    ["inbox","Inbox", unread ? `<span class="badge">${unread}</span>`:""], ["comms","Comms", commsOpen ? `<span class="badge amber">${commsOpen}</span>`:""], ["mensen","Mensen", st.keuzes.length ? `<span class="badge amber">${st.keuzes.length}</span>` : ""], ["crew","Crew", st.crewv.crew.some(m => m.status === "vrij") ? `<span class="badge">${st.crewv.crew.filter(m => m.status === "vrij").length}</span>` : ""], ["wereld","Wereld",""], ["kaart","Kaart",""], ["bedrijf","Bedrijf",""],
    ["financien","Financiën", st.facturen.some(f=>f.overdue) ? '<span class="badge amber">!</span>' : ""], ["rivalen","Rivalen", st.aanbiedingen.length ? `<span class="badge amber">${st.aanbiedingen.length}</span>` : st.macht.oorlogen ? '<span class="badge war">!</span>' : ""], ["onderwereld","Onderwereld", st.onderwereld.dreiging ? '<span class="badge war">!</span>' : ""],
    ["sep"], ["logboek","Logboek",""]];
  const over = st.status !== "actief";
  root.innerHTML = `<div class="app ${S.gmDock && S.view !== "comms" ? "gmopen" : ""}">
    <header class="top">
      <div class="brand"><span class="neon">CHROME</span><b>//</b>LEDGER<small>${esc(st.speler.corp_name)}</small></div>
      <div class="date">${MONTHS[st.datum.month-1].toUpperCase()} ${st.datum.year}</div>
      <div class="stats">
        ${stat("Cash", eur(st.cash), null, st.cash < 30 ? "var(--amber)" : null)}
        ${stat("Heat", k(st.heat), st.heat, null, "heat")}
        ${stat("Reputatie", k(st.reputatie), st.reputatie)}
        ${stat("Morale", k(st.morale), st.morale)}
        ${stat("Schuld", eur(st.schuld), null, st.schuld > st.cash ? "var(--amber)" : null)}
        ${stat("Invloed", `${Math.floor(st.invloed)} <span class="dim" style="font-size:13px">+${st.dominantie.inv}/b</span>`, null, "var(--violet)")}
      </div>
      <button class="btn primary next" data-a="tick" title="Volgende maand (N)" ${over?"disabled":""}>VOLGENDE<span class="nx-long"> MAAND</span> ▸</button>
    </header>
    <nav aria-label="Hoofdmenu">${(() => { let i = 0; return nav.map(n => n[0]==="sep" ? '<div class="sep"></div>' :
      `<button class="${S.view===n[0]?"on":""}" data-view="${n[0]}"><span><span class="ix">${String(++i).padStart(2,"0")}</span>${n[1]}</span>${n[2]}</button>`).join(""); })()}
      <div class="sys">VERSIE <span class="on">${VERSION}</span><br>OPSLAG <span class="on">● ${G.mode==="db"?"ONLINE":"BROWSER"}</span><br>GM <span class="${G.sample&&!G.sampleOff?"on":""}">● ${G.sample&&!G.sampleOff?"LIVE":"VIA CHAT"}</span><br>HULP <button data-a="help">? regels en toetsen</button><br>EFFECTEN <button data-a="effecten">${S.rustig ? "UIT" : "AAN"}</button><br>GELUID <button data-a="sound">${S.sound?"AAN":"UIT"}</button></div></nav>
    <main id="main">${over ? gameOver() : (VIEWS[S.view] || VIEWS.overzicht)()}</main>
  </div>${S.help ? helpOverlay() : ""}${S.view === "comms" ? "" : gmDock(st)}`;
  afterRender();
  restoreUI(_ui);
}
function stat(label, val, pct, color, cls=""){
  return `<div class="stat"><div class="k">${label}</div><div class="v" ${color?`style="color:${color}"`:""}>${val}</div>${pct!=null?`<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`:""}</div>`;
}
function gameOver(){
  const st = S.state;
  return `<div class="over"><div class="big">${esc(st.status)}</div>
    <p class="muted">${esc(st.speler.corp_name)} · ${MONTHS[st.datum.month-1]} ${st.datum.year}</p>
    <p>${st.status.startsWith("OVERWINNING") ? "Gewonnen." : st.status === "EINDE TERMIJN" ? "Je termijn zit erop." : "Het spel is voorbij."} De laatste mails staan nog in je inbox.</p>
    ${eindScherm(st)}
    <div class="row" style="justify-content:center;margin-top:20px">
      <button class="btn" data-view="inbox">Inbox lezen</button>
      ${st.eind && (st.status.startsWith("OVERWINNING") || st.status === "EINDE TERMIJN") ? '<button class="btn" data-a="doorspelen">Verder spelen</button>' : ""}
      <button class="btn primary" data-a="nieuw">Nieuw spel</button></div>
    ${eregalerijCard()}</div>`;
}

/* ---- views ---- */
const VIEWS = {
overzicht(){
  const st = S.state, r = st.rapport;
  const recent = st.mails.filter(m => !m.archief).slice(0,5);
  return `<h1>Overzicht</h1>
  ${nieuwCard()}${eersteStappen()}${adviesCard(st)}
  ${st.besluiten.length || st.aanbiedingen.length || st.keuzes.length ? `<h2>Wacht op uw besluit</h2><div class="grid g2">${st.besluiten.map(decisionCard).join("")}${st.keuzes.map(k => keuzeCard(k)).join("")}${st.aanbiedingen.map(offerCard).join("")}</div>` : ""}
  ${st.macht.oorlogen ? `<div class="card war-banner" style="margin-top:12px"><div class="spread"><span><b>OORLOG</b> met ${esc(st.rivalen.filter(r => r.status === "oorlog").map(r => r.naam).join(", "))}. Elke maand kost dit morale en reputatie.</span><button class="btn sm danger" data-view="rivalen">Naar het front</button></div></div>` : ""}
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="spread"><h3>Laatste maandrapport</h3>${r?`<span class="tag">${esc(r.maand)}</span>`:""}</div>
      ${r ? `<div class="grid g3" style="gap:8px;margin:8px 0">
          <div><div class="kpi">OMZET</div><div class="big">${k(r.omzet)}</div></div>
          <div><div class="kpi">KOSTEN</div><div class="big">${k(r.kosten)}</div></div>
          <div><div class="kpi">NETTO</div><div class="big" style="color:${r.netto>=0?"var(--green)":"var(--red)"}">${r.netto>=0?"+":""}${k(r.netto)}</div></div></div>
        <div class="muted" style="font-size:13px">${(r.gebeurd||[]).length ? esc(r.gebeurd.join(" · ")) : "Niets noemenswaards."}</div>
        <div style="margin-top:10px"><button class="btn sm" data-open="${esc(r.mail)}">Volledig rapport lezen</button></div>`
      : `<p class="muted">Nog geen rapport. Speel je eerste maand.</p>`}
    </div>
    <div class="card"><div class="spread"><h3>Recente mail</h3><button class="btn sm" data-view="inbox">Inbox</button></div>
      ${recent.length ? recent.map(m => `<button class="mail ${m.gelezen?"":"unread"}" data-open="${esc(m.id)}" style="padding:7px 0;border-bottom:1px solid var(--line)">
        <div class="from"><b>${esc(m.van)}</b><span class="tag ${m.prio}">${m.prio}</span></div><div class="subj">${esc(m.onderwerp)}</div></button>`).join("") : '<p class="muted">Leeg.</p>'}
    </div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Wat moet er gebeuren?</h3>
      <p class="muted" style="margin:0 0 8px;font-size:14px">Zeg het tegen de Assistent in je eigen woorden: iemand omkopen, mensen aannemen, een deal met een rivaal. Je krijgt een voorstel met prijs en kans, en jij zegt ja of nee.</p>
      <textarea id="ordertxt" placeholder="Bijv.: Huur een privédetective om Marta Delcourt na te trekken. Max €5k."></textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" data-a="toassist">Naar de Assistent</button><button class="btn sm" data-view="comms">Alle gesprekken</button></div></div>
    <div class="card"><h3>Verloop</h3>${sparkCard(st.geschiedenis)}</div>
    <div class="card"><div class="spread"><h3>Dominantie</h3><button class="btn sm" data-view="kaart">Naar de kaart</button></div>
      <div class="row" style="gap:22px;margin:4px 0 8px"><div><div class="kpi">PER BEURT</div><div class="big" style="color:var(--green)">+€${st.dominantie.geld}k</div></div>
        <div><div class="kpi">INVLOED</div><div class="big" style="color:var(--violet)">${Math.floor(st.invloed)} <span style="font-size:14px">+${st.dominantie.inv}/b</span></div></div>
        <div><div class="kpi">INKOMSTENBRONNEN</div><div class="big">+€${r1(st.streams.reduce((a, x) => a + x.bedrag, 0))}k</div></div></div>
      ${st.regios.map(r => { const sh = r.shares.find(x => x.o === "player"), pct = sh ? sh.pct : 0; return pct ? `<div class="spread" style="font-size:14px"><span>${esc(r.naam)}</span><span class="mono">${pct}%${tierOf(pct) ? " · " + esc(tierOf(pct).naam) : ""}</span></div>${tierBar(pct, "#05d9e8", DOM_TIERS)}` : ""; }).join("") || '<p class="muted" style="font-size:14px;margin:0">Nog geen 25% op een continent. Breid uit naar buurgebieden om invloed en dominantie op te bouwen.</p>'}
    </div>
  </div>
  <div class="grid g2" style="margin-top:14px">${tijdCard(st)}<div class="card"><div class="spread"><h3>Crew</h3><button class="btn sm" data-view="crew">Naar de crew</button></div>${st.crewv.crew.length ? `<ul class="ylist">${st.crewv.crew.map(m => `<li><b>${esc(m.naam)}</b> · ${esc(m.label)} ${m.niveau} · ${esc(m.status)}</li>`).join("")}</ul>` : '<p class="muted" style="margin:0">Nog geen crew.</p>'}<p class="muted" style="font-size:13.5px;margin:8px 0 0">${st.crewv.klussen.length} klussen van fixers open · lonen €${st.crewv.loon}k/mnd</p></div></div>
  <div class="grid g2" style="margin-top:14px">${doelenCard(st)}${gezondheidCard(st)}</div>
  ${newsCard(st)}
  ${st.lopend.length ? `<h2>Lopende effecten</h2><div class="row">${st.lopend.map(x=>`<span class="tag HOOG">${esc(x)}</span>`).join("")}</div>`:""}`;
},
inbox(){
  const st = S.state;
  let list = S.filter==="verzonden" ? st.mails.filter(m => m.uit) : st.mails.filter(m => !m.uit && (S.filter==="archief" ? m.archief : !m.archief));
  if (S.filter==="ongelezen") list = list.filter(m => !m.gelezen);
  if (S.filter==="belangrijk") list = list.filter(m => m.prio==="HOOG" || m.prio==="KRITIEK" || m.voorstel);
  if (S.q) { const q = S.q.toLowerCase(); list = list.filter(m => (m.van+(m.aan||"")+m.onderwerp+m.preview).toLowerCase().includes(q)); }
  const tab = (id,l) => `<button class="${S.filter===id?"on":""}" data-filter="${id}">${l}</button>`;
  const sel = S.mailBody, full = sel && G.mails.find(m => m.id === sel.id), C = S.compose;
  const names = st.contacten.filter(c => c.soort !== "gm").map(c => c.naam);
  let reader = '<div class="empty">Kies een mail, of schrijf er zelf een.</div>';
  if (C) reader = composeView(C, names);
  else if (sel && full) reader = `
      <button class="btn sm back" data-a="closemail">← Terug</button>
      <div class="hdr"><span class="stamp">${full.uit ? "VERZONDEN" : "ONTSLEUTELD"}</span><h2 id="subj">${esc(full.onderwerp)}</h2>
        <div class="meta"><span>Van</span><b>${esc(full.van)}</b><span>Aan</span><span>${esc(full.aan || "CEO")}</span>
          <span>Datum</span><span class="mono">${esc(full.datum)}</span><span>Prioriteit</span><span><span class="tag ${esc(full.prio)}">${esc(full.prio)}</span></span></div>
        <div class="row" style="margin-top:12px">
          <button class="btn sm primary" data-a="reply">${full.uit ? "Nog een mail" : "Beantwoorden"}</button>
          ${full.uit ? "" : `<button class="btn sm" data-a="archive">${full.archief ? "Terug naar inbox" : "Archiveren"}</button><button class="btn sm" data-a="unread">Markeer ongelezen</button>`}</div>
      </div>
      <div class="md">${md(full.body)}</div>
      ${full.uit && full.wacht ? `<div class="gmwait">${live() ? '<span class="dots"></span> Wacht op antwoord…' : "Wacht op antwoord. Vraag Claude in de chat om mails te beantwoorden."}</div>` : ""}
      ${full.voorstel ? propCard(full.voorstel, full.vstatus, `data-src="mail" data-id="${esc(full.id)}"`, {uitkomst: full.uitkomst, worp: full.worp}) : ""}
      ${full.keuze ? keuzeInline(full.keuze) : ""}`;
  return `<div class="spread"><h1>Inbox</h1><div class="row"><span class="dim hm" style="font-size:13px;align-self:center">Oude maandrapporten, afgehandelde keuzes en mail ouder dan zes maanden gaan vanzelf naar het archief.</span>
      <button class="btn sm" data-a="allread">Alles gelezen</button>
      <button class="btn sm primary" data-a="compose">Nieuwe mail</button></div></div>
  ${st.besluiten.length ? `<div class="card decision" style="margin-bottom:12px;padding:10px 14px"><div class="spread"><span><b style="color:var(--amber)">${st.besluiten.length} besluit(en) open.</b> <span class="muted">De verhaallijn staat stil tot je kiest.</span></span><button class="btn sm warn" data-view="overzicht">Beslissen</button></div></div>`:""}
  <div class="inbox ${sel||C?"reading":""}">
    <div class="ilist">
      <div class="itools"><input type="text" id="q" placeholder="Zoeken in mail…" value="${esc(S.q)}">
        <div class="tabs">${tab("alles","Alles")}${tab("ongelezen","Ongelezen")}${tab("belangrijk","Belangrijk")}${tab("verzonden","Verzonden")}${tab("archief","Archief")}</div></div>
      <div class="mails">${list.length ? list.map(m => `<button class="mail ${m.gelezen?"":"unread"} ${sel&&sel.id===m.id?"sel":""}" data-open="${esc(m.id)}" ${sel&&sel.id===m.id?'aria-current="true"':""} aria-label="${m.gelezen?"":"Ongelezen: "}${esc(m.onderwerp)}, van ${esc(m.van)}">
          <div class="from"><b>${esc(m.uit ? "Aan: " + (m.aan || "") : m.van)}</b><span class="mono dim" style="font-size:13px">${esc(m.datum)}</span></div>
          <div class="subj">${m.keuze?'<span class="tag HOOG">keuze</span> ':m.voorstel?'<span class="tag HOOG">voorstel</span> ':m.prio!=="NORMAAL"?`<span class="tag ${m.prio}">${m.prio}</span> `:""}${m.uit&&m.wacht?'<span class="tag cyan">wacht</span> ':""}${esc(m.onderwerp)}</div>
          <div class="prev">${esc(m.preview)}</div></button>`).join("") : '<div class="empty">Geen mail hier.</div>'}</div>
    </div>
    <div class="reader">${reader}</div>
  </div>`;
},
comms(){
  const st = S.state, c = st.contacten.find(x => x.key === S.chat) || st.contacten[0], ch = G.chats[c.key];
  const groups = ["Uitvoering", "Directie", "Rivalen", "Netwerk", "Onderwereld"];
  const list = groups.map(g => { const cs = st.contacten.filter(x => x.groep === g); if (!cs.length) return "";
    return `<div class="cgroup">${g}</div>` + cs.map(x => `<button class="contact ${x.key===c.key?"sel":""}" data-chat="${esc(x.key)}">
      <div class="spread"><b>${esc(x.naam)}</b>${x.open?'<span class="tag HOOG">voorstel</span>':x.bezig?'<span class="dots"></span>':""}</div>
      <div class="crol">${esc(x.rol)}</div>${x.laatste?`<div class="prev">${esc(x.laatste)}</div>`:""}</button>`).join(""); }).join("");
  const msgs = (ch ? ch.berichten : []).map(b => bubble(b, c)).join("") || `<div class="empty" style="text-transform:none;letter-spacing:0">${c.soort==="gm"
    ? "Zeg wat er moet gebeuren. Bijvoorbeeld: <br>“Huur een hacker om de servers van Saito te bekijken, max €20k.”<br>“Zoek een nieuw hoofd R&amp;D.”<br>“Koop een douanier in de haven van Rotterdam om.”"
    : `Begin een gesprek met ${esc(c.naam)}.`}</div>`;
  return `<h1>Comms</h1>
  <div class="comms ${S.chatOpen?"reading":""}">
    <div class="clist">${list}</div>
    <div class="cthread">
      <div class="chead"><button class="btn sm back" data-a="closechat">←</button><div><b>${esc(c.naam)}</b><div class="crol">${esc(c.rol)}</div></div>${live()?'<span class="tag ok">live</span>':'<span class="tag">via Claude-chat</span>'}</div>
      <div class="chatlog" id="chatlog" aria-live="polite">${msgs}</div>
      <div class="cinput"><textarea id="chattxt" rows="2" placeholder="${c.soort==="gm"?"Wat moet er gebeuren?":"Bericht aan "+esc(c.naam)}"></textarea><button class="btn primary" data-a="chatsend">Stuur</button></div>
      <div class="chint">Enter verstuurt, Shift+Enter is een nieuwe regel. Een voorstel accepteer je met de knop of door <b>ja</b> of <b>nee</b> te typen.${live()?"":" Geen live verbinding: berichten wachten tot je Claude in de chat vraagt om te antwoorden."}</div>
    </div>
  </div>`;
},
kaart(){
  const st = S.state, M = st.kaart, D = Object.fromEntries(st.districten.map(d => [d.id, d]));
  const d = S.dist && D[S.dist], z = S.zone && M.zones.find(x => x.id === S.zone);
  let side;
  if (z){
    side = `<div class="card"><div class="spread"><h3>${esc(z.naam)}</h3><span class="tag cyan">${M.kind === "wereld" ? "oceaan" : "zeezone"}</span></div>
      <p class="muted" style="margin:4px 0 10px">Wie hier meer dan de helft van de zeemacht heeft, beheerst ${M.kind === "wereld" ? "deze oceaan" : "de zone"}: +€${z.bonus}k per maand en een route naar elke kust aan dit water${M.kind === "wereld" ? ", ook op andere continenten" : ""}.</p>
      ${z.shares.length ? z.shares.map(sh => `<div class="fac" style="grid-template-columns:1fr 1.3fr 50px"><span style="font-size:14px">${esc(sh.naam)}</span><div class="fbar"><i style="left:0;width:${sh.pct}%;background:${sh.kleur}"></i></div><span class="mono">${sh.pct}%</span></div>`).join("") : '<p class="dim">Niemand heeft hier kustdistricten.</p>'}
      <p class="dim" style="font-size:13px;margin:10px 0 0">Zeemacht = kustgebieden (havens tellen 3×, +10% per niveau Logistiek of Smokkel) + 4 per eskader in deze zone. Meer dan 50% is overwicht.</p>
      <div class="navy">
        <div class="spread"><span class="kpi">JOUW ESKADERS HIER</span><span class="row" style="gap:6px"><button class="btn sm" data-a="deploy" data-z="${z.id}" data-d="-1" ${(st.vloot.inzet[z.id] || 0) ? "" : "disabled"} aria-label="eskader terughalen">−</button><b class="big" style="min-width:34px;text-align:center">${st.vloot.inzet[z.id] || 0}</b><button class="btn sm primary" data-a="deploy" data-z="${z.id}" data-d="1" ${st.vloot.vrij ? "" : "disabled"} aria-label="eskader inzetten">+</button></span></div>
        <div class="muted" style="font-size:13.5px">Vloot: ${st.vloot.schepen}/${st.vloot.max} eskaders, ${st.vloot.vrij} vrij · €1,2k per eskader per maand</div>
        ${st.vloot.schepen < st.vloot.max ? `<button class="btn sm" data-a="fleet">Eskader bouwen · ${eur(st.vloot.kost)}</button>` : ""}
        <p class="dim" style="font-size:13px;margin:0">50% zeemacht is overwicht (+€${z.bonus}k per beurt, en een route naar elke kust aan deze zee). 80% is zeeheerschappij (+€${z.bonus * 2}k en +1 invloed per beurt). In oorlog kost een vijandig overwicht je 30% van de handel van je kustgebieden hier.</p>
      </div></div>`;
  } else if (d){
    const own = d.controle === "player" ? "jij" : d.controle === "neutral" ? "niemand" : d.controle;
    side = `<div class="card"><div class="spread"><h3>[${d.id}] ${esc(d.naam)}</h3>${d.controle==="player"?'<span class="tag cyan">jouw district</span>':d.controle!=="neutral"?'<span class="tag KRITIEK">rivaal</span>':""}</div>
      ${d.lore?`<p class="muted" style="margin:4px 0 10px">${esc(d.lore)}</p>`:""}
      <dl class="kv">${d.continent ? `<dt>Continent</dt><dd>${esc(d.continent)}</dd>` : ""}<dt>Eigenaar</dt><dd>${esc(own)}</dd><dt>Inkomen</dt><dd>${eur(d.inkomen)} / mnd</dd><dt>Onderhoud</dt><dd>${eur(d.onderhoud)} / mnd</dd>
        <dt>Buren</dt><dd>${esc(d.buren.join(" ")) || "-"}</dd><dt>Kust</dt><dd>${d.zee.length ? esc(d.zee.map(id => (M.zones.find(x => x.id === id) || {}).naam).join(", ")) : "nee"}</dd></dl>${yieldBlock(d)}
      ${d.controle==="neutral" ? (d.bereik ? `<div style="margin-top:14px"><button class="btn primary" data-a="district" data-id="${d.id}" ${d.bezig?"disabled":""}>Vestiging openen · ${eur(d.kost)}</button>
          <div class="muted" style="font-size:13px;margin-top:6px">Duurt 3 maanden, +€1k/mnd tijdens de opbouw.${d.opbrengst && d.opbrengst.netto > 0 ? ` Terugverdiend in ±${Math.round(d.kost / Math.max(0.2, d.opbrengst.netto * 0.8))} maanden.` : ""}</div></div>`
        : `<p class="muted" style="margin:14px 0 0">Buiten bereik. Je kunt alleen uitbreiden naar gebied dat aan het jouwe grenst, of naar kusten aan een ${M.kind === "wereld" ? "oceaan" : "zee"} die jij beheerst.</p>`)
      : d.controle!=="player" ? `<div style="margin-top:14px"><p class="muted" style="margin:0 0 8px">In handen van <b style="color:var(--mag)">${esc(d.controle)}</b>${d.hq.includes(d.controle)?" (hun hoofdkantoor)":""}. ${d.bereik ? "Grenst aan jouw gebied: in een oorlog kun je het innemen." : "Grenst niet aan jouw gebied: innemen kan pas als het dat wel doet."}</p><button class="btn primary sm" data-a="dossier" data-n="${esc(d.controle)}">Naar hun dossier</button></div>` : ""}
      <div style="margin-top:14px"><textarea id="disttxt" placeholder="Iets anders hier? Bijv.: Koop de wijkagent om, of bouw een opslagloods."></textarea>
        <button class="btn sm" style="margin-top:6px" data-a="distorder" data-id="${d.id}">Naar de Assistent</button></div></div>`;
  } else side = domPanel(st, M);
  return `<h1>Kaart</h1>
  <div class="card" style="margin-bottom:12px;padding:12px 16px"><div class="spread"><span class="kpi">${M.kind === "wereld" ? "WERELDDOMINANTIE" : "DOMINANTIE OVER " + esc(M.city.toUpperCase())} · GEWOGEN NAAR INKOMEN</span></div>${domBar(M.dom)}</div>
  <div class="mapwrap"><div><div class="row" style="margin-bottom:8px"><span class="kpi">KAART</span>${[["politiek", "Politiek"], ["dominantie", "Dominantie"], ["zee", "Zee"], ["economie", "Economie"], ["onderwereld", "Onderwereld"]].map(([m, l]) => `<button class="chip ${(S.mapmode || "politiek") === m ? "on" : ""}" data-a="mapmode" data-m="${m}">${l}</button>`).join("")}<span class="kpi" style="margin-left:8px">ZOOM</span>${[1, 1.6, 2.4].map(zm => `<button class="chip ${(S.zoom || 1) === zm ? "on" : ""}" data-a="zoom" data-z="${zm}">${zm === 1 ? "Wereld" : zm === 1.6 ? "Regio" : "Dichtbij"}</button>`).join("")}</div>
    <div class="mapscroll" id="mapscroll"><div style="width:${(S.zoom || 1) * 100}%">${mapSvg(M, S.dist, S.zone)}</div></div>
    <div class="legend"><span><i style="background:#05d9e8"></i>jouw gebied</span><span><i style="background:#2c1f4f;border:1px dashed #05d9e8"></i>bereikbaar</span><span><i style="background:var(--mag)"></i>rivalen (eigen kleur)</span><span>⚓ haven · ★ HQ · ⌂ thuis</span></div></div>${side}</div>`;
},
bedrijf(){
  const st = S.state, p = st.personeel, under = p.count < st.nodig;
  const eff = Math.round((p.count >= st.nodig ? 1 : 0.45 + 0.55 * p.count / st.nodig) * 100);
  const eigen = st.soorten.filter(x => x.eigen);
  return `<h1>Bedrijf</h1>
  ${focusCard(st)}${dochtersCard(st)}
  <h2>Divisies</h2><div class="grid g3">${st.divisies.map(d => `<div class="card">
      <div class="spread"><h3>${esc(d.naam)}</h3><span class="tag cyan">L${d.level}</span></div>
      <div class="muted" style="font-size:14px">${esc(d.type)}${d.eigen?' <span class="tag">eigen soort</span>':""} · marktaandeel ${d.aandeel}%</div>
      <div style="margin-top:10px"><button class="btn sm" data-a="upgrade" data-div="${esc(d.naam)}" ${d.bezig?"disabled":""}>${d.bezig?"Uitbreiding loopt":`Uitbreiden · ${eur(d.upgrade_kost)}`}</button>${!d.bezig && d.plan ? `<div class="dim" style="font-size:13px;margin-top:4px">${d.plan.extra > 0 ? `±+€${d.plan.extra}k per maand na belasting · terugverdiend in ±${d.plan.terug} mnd` : "Levert op dit niveau nauwelijks extra op."}</div>` : ""}</div></div>`).join("")}
    <div class="card"><h3>Nieuwe divisie</h3>${divConceptBlok()}
      <details class="handmatig" ${live() ? "" : "open"}><summary>Handmatig: kies een soort</summary>
      <div class="row" style="margin-top:6px"><select id="ndtype" aria-label="soort divisie">${st.divisie_types.map(t=>`<option ${S.newType===t?"selected":""}>${esc(t)}</option>`).join("")}</select>
        <input type="text" id="ndname" placeholder="Naam" style="flex:1;min-width:100px" aria-label="naam divisie"></div>
      <div class="row" style="margin-top:8px"><button class="btn sm primary" data-a="newdiv">Opstarten · ${eur(st.nieuwe_divisie_kost)}</button><span class="muted" style="font-size:13px">3 maanden, +€3k/mnd</span></div></details></div>
  </div>
  ${productSection(st)}
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Eigen bedrijfssoort</h3>
      <p class="muted" style="font-size:14px;margin:0 0 10px">Iets wat er nog niet is: een dronekoeriersdienst, een orgaanbank, een piratenradio. Kies een profiel${live()?", of laat de GM eerlijke cijfers bepalen op basis van je omschrijving":""}.</p>
      <div class="grid" style="gap:8px">
        <input type="text" id="tname" placeholder="Naam, bv. Dronekoeriers" aria-label="naam van de soort">
        <textarea id="tdesc" style="min-height:60px" placeholder="Wat doet het, voor wie, legaal of niet?" aria-label="omschrijving"></textarea>
        <select id="tprof" aria-label="profiel">${Object.entries(PRESETS).map(([k2,v]) => `<option value="${k2}">${v.label}: ${v.uitleg}</option>`).join("")}</select>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-a="mktype">Aanmaken met profiel</button>${live()?'<button class="btn sm primary" data-a="mktypegm">Laat de GM balanceren</button>':""}</div>
      ${eigen.length ? `<table style="margin-top:12px"><thead><tr><th>Eigen soort</th><th class="num">Omzet</th><th class="num">Kosten</th><th class="num">Heat</th></tr></thead><tbody>
        ${eigen.map(x => `<tr><td>${esc(x.naam)}${x.omschrijving?`<div class="dim" style="font-size:13px">${esc(x.omschrijving)}</div>`:""}</td><td class="num">${x.rev}</td><td class="num">${x.cost}</td><td class="num">${x.heat}</td></tr>`).join("")}</tbody></table>
        <p class="dim" style="font-size:13px;margin:6px 0 0">Per niveau per maand, in k€. Nieuwe soorten hebben nog geen concurrenten, maar ook geen markt: de omzet kan maximaal 20% boven de basis uitkomen.</p>` : ""}
    </div>
    <div class="card"><h3>Personeel</h3>
      <div class="row" style="gap:22px;align-items:flex-end">
        <div><div class="kpi">MEDEWERKERS</div><div class="big" style="${under?"color:var(--amber)":""}">${p.count}<span class="dim" style="font-size:15px"> / nodig ${st.nodig}</span></div></div>
        <div><div class="kpi">LOONKOSTEN</div><div class="big">${eur(p.count * p.avg_salary / 120)}<span class="dim" style="font-size:14px"> /mnd</span></div></div></div>
      <div class="bar" style="margin:8px 0 4px"><i style="width:${Math.min(100, p.count / st.nodig * 100)}%"></i></div>
      <p class="muted" style="font-size:14px;margin:6px 0 10px">${under ? `Onderbezet: divisies draaien op ${eff}% en de morale lijdt.` : p.count > st.nodig * 1.25 ? "Ruim bezet: je betaalt mensen die weinig te doen hebben." : "De bezetting is in orde."} Elke divisie vraagt 4 mensen per niveau, elk district 1, plus 6 staf.</p>
      <div class="row"><input type="number" id="nstaff" min="1" max="50" value="5" style="width:80px" aria-label="aantal mensen">
        <button class="btn sm primary" data-a="hire">Aannemen · €0,4k p.p.</button><button class="btn sm danger" data-a="fire">Ontslaan · ${st.cultuur.layoff_policy==="hard"?"€0,4k":"€1k"} p.p.</button></div>
      <div class="row" style="margin-top:12px"><span class="kpi">SALARIS</span>${["laag","marktconform","hoog"].map(l => `<button class="chip ${st.salaris===l?"on":""}" data-a="salary" data-l="${l}">${l} · €${SALARY[l]}k/jr</button>`).join("")}</div>
    </div>
  </div>
  <h2>Inkomstenbronnen</h2>${st.streams.length ? `<div class="card"><table><thead><tr><th>Bron</th><th>Sinds</th><th class="num">Per maand</th></tr></thead><tbody>${st.streams.map(x => `<tr><td>${esc(x.naam)}</td><td class="mono dim">${esc(x.sinds)}</td><td class="num">+${eur(x.bedrag)}</td></tr>`).join("")}
      <tr><td><b>Totaal</b></td><td></td><td class="num"><b>+${eur(st.streams.reduce((a, x) => a + x.bedrag, 0))}</b></td></tr></tbody></table>
      <p class="dim" style="font-size:13px;margin:6px 0 0">Wat je via de Assistent opbouwt (een dienst, abonnement, contract, klantengroep) blijft elke maand geld opleveren. Morale en bezetting bepalen hoeveel er echt binnenkomt.</p></div>`
    : '<p class="muted">Nog geen eigen inkomstenbronnen. Bouw iets op via de Assistent: een dienst, een abonnement, een contract. Lukt het, dan levert het elke maand geld op.</p>'}
  <h2>Projecten</h2>${st.projecten.length ? `<div class="grid g3">${st.projecten.map(pr => `<div class="card"><h3 style="font-size:15px">${esc(pr.name)}</h3>
      <div class="muted" style="font-size:14px">Nog ${pr.eta_months} maand(en)${pr.cost_per_month?` · ${eur(pr.cost_per_month)}/mnd`:""}</div>${pr.gerold ? '<div class="tag HOOG" style="margin-top:4px">vertraagd</div>' : `<div class="dim" style="font-size:13px">Risico bij oplevering: ${st.projectRisico.vertraging}% vertraging, ${st.projectRisico.mislukt}% mislukt</div>`}
      <div class="prog"><i style="width:${Math.max(8, 100 - pr.eta_months*30)}%"></i></div></div>`).join("")}</div>` : '<p class="muted">Geen lopende projecten.</p>'}
  <div class="grid g2" style="margin-top:8px">
    <div class="card"><div class="spread"><h3>Directie</h3><button class="btn sm" data-a="seek">Sleutelpersoon zoeken</button></div>
      <table><tbody>${st.npcs.map(n => `<tr><td>${esc(n.naam)}<div class="dim" style="font-size:13px">${esc(n.rol)}</div></td>
        <td><span class="tag ${n.indruk==="ontevreden"?"KRITIEK":n.indruk==="twijfelt"?"HOOG":"ok"}">${esc(n.indruk)}</span></td>
        <td style="text-align:right"><button class="btn sm" data-a="chatwith" data-key="${esc(n.key)}">Praat</button></td></tr>`).join("") || '<tr><td class="muted">Niemand. Dat is ook een keuze.</td></tr>'}</tbody></table>
      <p class="dim" style="font-size:13px;margin:8px 0 0">Dit is je indruk, niet de waarheid. Wat je zegt, telt: gesprekken veranderen loyaliteit (hooguit 6 punten per persoon per maand).</p></div>
    <div class="card"><h3>Cultuur</h3><dl class="kv">
      <dt>Ontslagbeleid</dt><dd>${st.cultuur.layoff_policy==="hard"?"hard":"normaal"}</dd><dt>Bonussen</dt><dd>${eur(st.cultuur.bonus_cost||0)}/mnd</dd>
      <dt>Ethiek</dt><dd>${esc((st.cultuur.ethics_rules||[]).join("; ")||"-")}</dd>
      <dt>Slogans</dt><dd>${esc((st.cultuur.slogans||[]).join(" · ")||"-")}</dd></dl></div>
  </div>
  <h2>Facties</h2><div class="card">${st.facties.map(f => {
      const v = f.waarde, w = Math.abs(v)/2, left = v<0 ? 50-w : 50;
      return `<div class="fac"><span style="text-transform:capitalize">${esc(f.naam)}</span>
        <div class="fbar" title="${esc(f.noot)}"><i style="left:${left}%;width:${w}%;background:${v<0?"var(--red)":"var(--cyan)"}"></i></div>
        <span class="muted" style="font-size:14px">${esc(f.label)}</span></div>`; }).join("")}</div>`;
},
financien(){
  const st = S.state;
  const accts = ["operationeel","zwart","offshore"];
  return `<h1>Financiën</h1>
  <div class="grid g3">
    <div class="card"><div class="kpi">OPERATIONEEL</div><div class="big">${eur(st.cash)}</div><div class="dim" style="font-size:13px">volgens de CFO</div></div>
    <div class="card"><div class="kpi">ZWART</div><div class="big">${eur(st.zwart)}</div></div>
    <div class="card"><div class="kpi">OFFSHORE</div><div class="big">${eur(st.offshore)}</div></div>
    <div class="card"><div class="kpi">SCHULD</div><div class="big">${eur(st.schuld)}</div><div class="dim" style="font-size:13px">${k(st.rente*100)}% per jaar · ≈${eur(st.schuld*st.rente/12)}/mnd</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Geld verplaatsen</h3><p class="muted" style="font-size:13px;margin:0 0 8px">Fee 5–15%. Kans op controle stijgt met het bedrag, je heat en zwart geld.</p>

function wereldVM(s){
  const bed = (s.bedrijven || []).map(b => ({...b, landNaam: landNaam(s, b.land), continent: (s.districts.find(d => d.id === b.land) || {}).continent || "", trend: b.vorige ? Math.round((b.waarde / b.vorige - 1) * 1000) / 10 : 0, opties: bedrijfOpties(s, b)}));
  const rank = [{soort: "speler", naam: s.player.corp_name, sector: s.player.doctrine, land: landNaam(s, s.player.home_district), waarde: playerValue(s), gebieden: playerDistricts(s).length, kleur: "#05d9e8"},
    ...s.rivals.map(r => ({soort: "rivaal", naam: r.name, ceo: r.ceo, sector: r.sector, land: landNaam(s, r.hq), waarde: rivalValue(s, r), gebieden: rivalDistricts(s, r).length, kleur: ownerColor(s, r.name), status: r.status, relatie: r.relatie,
      dochters: (s.bedrijven || []).filter(b => b.eigenaar === r.name).map(b => b.naam)})),
    ...bed.filter(b => !b.eigenaar).map(b => ({soort: "bedrijf", id: b.id, naam: b.naam, ceo: b.ceo, sector: b.sector, land: b.landNaam, waarde: Math.round(b.waarde), trend: b.trend, aandeel: b.aandeel, contract: b.contract, relatie: b.relatie}))]
    .sort((a, b) => b.waarde - a.waarde).map((x, i) => ({...x, plek: i + 1}));
  const sect = Object.entries(s.sectoren || {}).map(([t, x]) => ({naam: t, idx: Math.round(x.idx), trend: Math.round(x.trend * 1000) / 10, hist: x.hist || [], mijn: s.divisions.some(d => d.type === t), mult: Math.round(sectorMult(s, t) * 100)}));
  const mods = s.districts.filter(d => d.mod).map(d => ({id: d.id, naam: d.name, f: d.mod.f, m: d.mod.m, why: d.mod.why, mijn: d.control === "player"}));
  const vraag = Object.entries(s.vraag || {}).map(([a, x]) => ({aard: a, label: PRODUCT_AARD[a].label, idx: Math.round(x.idx), trend: Math.round(x.trend * 1000) / 10, hist: x.hist || [], reden: x.reden || "", aanbod: aanbod(s, a), factor: vraagFactor(s, a), mijn: (s.producten || []).some(p => p.status === "markt" && (p.aard || aardVan(p.type, p.naam)) === a)})).sort((a, b) => b.mijn - a.mijn || b.idx - a.idx);
  const catalogus = [...(s.producten || []).filter(p => p.status === "markt").map(p => ({naam: p.naam, aard: p.aard || aardVan(p.type, p.naam), kwaliteit: p.kwaliteit, pop: bereik(p), eigenaar: "jij", kleur: "#05d9e8", trait: p.trait ? PRODUCT_TRAITS[p.trait].label : "", prijs: p.prijs || "standaard"})),
    ...s.rivals.flatMap(r => (r.producten || []).map(p => ({naam: p.naam, aard: p.aard, kwaliteit: p.kwaliteit, pop: p.pop, eigenaar: r.name, kleur: ownerColor(s, r.name), trait: "", prijs: ""})))].sort((a, b) => b.pop * b.kwaliteit - a.pop * a.kwaliteit);
  return {catalogus, vraag, nieuws: (s.nieuws || []).slice(0, 40), bedrijven: bed, rang: rank, sectoren: sect, mods, plek: (rank.find(x => x.soort === "speler") || {}).plek, totaal: rank.length};
}
function mensenVM(s){
  const m = ym(s);
  const dir = s.npcs.map(n => { const p = npcPerk(n); return {key: "npc-" + slug(n.name), naam: n.name, rol: n.role, indruk: impression(n), perk: p.tekst, actief: !n.verraad && n.loyalty >= 60, gepeild: n.gepeild && n.gepeild.m === m ? Math.round(n.gepeild.v) : null,
    gesprek: (n.acties || {}).gesprek === m, bonus: (n.acties || {}).bonus === m, natrekken: (n.acties || {}).natrekken === m, promotie: !!n.promotie, ontmaskerd: !!n.ontmaskerd}; });
  const net = NETWERK.filter(([key]) => MENS[key]).map(([key, naam, rol, bio, fac]) => { const P = MENS[key], r = (s.relaties || {})[key] || {v: 0};
    const cool = r.gunst && r.gunst > plusMonths(s, -3);
    return {key, naam: netwerkNaam(s, key, naam), rol: key === "stad" ? rol + ", " + homeLandNaam(s) : rol, bio, fac, v: r.v, gezien: r.actie === m, gunst: P.gunst, passief: P.passief, passiefAan: r.v >= P.passief.min, gunstKlaar: !cool && r.v >= P.gunst.drempel, cool: !!cool, geenCadeau: !!P.geenCadeau,
      drukKans: snapKans(Math.round(clamp(30 + playerPower(s) / 3 + (s.accounts.zwart > 10 ? 10 : 0), 15, 75)))}; });
  return {directie: dir, netwerk: net};
}
function gangVM(s){
  const gangs = (s.gangs || []).map(g => { const lands = gangLanden(s, g);
    return {id: g.id, naam: g.naam, leider: g.leider, soort: g.soort, stijl: g.stijl, kleur: g.kleur, relatie: g.relatie, deal: g.deal, kracht: gangKracht(g), fee: gangFee(s, g), partner: gangPartner(s, g),
      gebied: Object.entries(g.gebied).filter(([, v]) => v >= 5).sort((a, b) => b[1] - a[1]).map(([id, v]) => ({id, naam: landNaam(s, id), v, mijn: (s.districts.find(d => d.id === id) || {}).control === "player", kans: uitrokenKans(s, g, id)})),
      bijJou: lands.length, gezien: g.actie === ym(s), key: "gang-" + g.id}; });
  gangs.sort((a, b) => b.bijJou - a.bijJou || b.kracht - a.kracht);
  return {gangs, dreiging: gangs.some(g => g.deal === "oorlog"), uitrokenKost: r1(4 * (DIFF[s.player.difficulty] || 1))};
}
function districtYield(s, d){
  const out = {netto: r1(incOf(d) - d.upkeep), mod: d.mod ? {f: d.mod.f, m: d.mod.m, why: d.mod.why} : null, perk: (ARCH_SECTOR[d.arch] || []).join(" en "), soort: ARCH_LABEL[d.arch] || "", bonus: START_BONUS[d.arch] || null};
  const rg = regionDominance(s).find(r => r.id === d.continent); out.contPct = rg && rg.totaal ? Math.round(d.income / rg.totaal * 100) : 0;
  const gb = gangOf(s, d.id); out.gang = gb && gb.v >= 10 ? {naam: gb.g.naam, v: gb.v, deal: gb.g.deal} : null;
  out.bedrijven = (s.bedrijven || []).filter(b => b.land === d.id).map(b => ({id: b.id, naam: b.naam, sector: b.sector, eigenaar: b.eigenaar}));
  return out;
}

    <div class="opts">${k.opties.map((o, i) => `<div class="opt"><div><div class="t">${esc(o.label)}</div><div class="u">${esc(o.uitleg || "")}${o.eff && o.eff.kans != null ? ` <span class="mono" style="color:var(--cyan)">· worp 2d6 ≥ ${doelVoor(o.eff.kans)}, ${snapKans(o.eff.kans)}% kans</span>` : ""}${k.gm && keuzeEffTekst(o.eff) ? `<div class="keff">${esc(keuzeEffTekst(o.eff))}</div>` : ""}</div></div>
      <button class="btn sm warn" data-a="keuze" data-id="${esc(k.id)}" data-i="${i}" ${o.kost && (o.bron === "zwart" ? st.zwart : st.cash) < o.kost ? "disabled" : ""}>Kies</button></div>`).join("")}</div></div>`;
}
const KE_NAAM = {heat: "heat", reputation: "reputatie", morale: "morale", invloed: "invloed"};
function keuzeEffTekst(e){
  if (!e || typeof e !== "object") return "";
  if (e.kans != null) return `Lukt: ${keuzeEffTekst(e.succes) || "niets"}. Mislukt: ${keuzeEffTekst(e.falen) || "niets"}.`;
  const d = [], sg = v => (v > 0 ? "+" : "") + v;
  if (e.cash) d.push(`${e.cash > 0 ? "+" : "−"}€${Math.abs(e.cash)}k`);
  if (e.zwart) d.push(`${e.zwart > 0 ? "+" : "−"}€${Math.abs(e.zwart)}k zwart`);
  for (const k of Object.keys(KE_NAAM)) if (e[k]) d.push(`${KE_NAAM[k]} ${sg(e[k])}`);
  for (const [n, v] of Object.entries(e.factions || {})) d.push(`${n} ${sg(v)}`);
  for (const [n, v] of Object.entries(e.loyaliteit || {})) d.push(`loyaliteit ${n} ${sg(v)}`);
  for (const [n, o] of Object.entries(e.rivaal || {})) if (o && o.relatie) d.push(`relatie ${n} ${sg(o.relatie)}`);
  for (const [id, o] of Object.entries(e.product || {})){ const p = ((G.game && G.game.producten) || []).find(x => x.id === id); if (o && o.pop) d.push(`populariteit ${p ? p.naam : "product"} ${sg(o.pop)}`); }
  return d.join(", ");
}
function keuzeInline(id){
  const st = S.state, k = st.keuzes.find(x => x.id === id);
  if (k) return keuzeCard(k, true);
  const done = st.keuzesKlaar.find(x => x.id === id);
  return done ? `<div class="prop uitgevoerd"><span class="kpi">GEKOZEN</span><div class="ptext">${esc(done.gekozen)}</div>${done.uitkomst ? `<div class="muted" style="font-size:14px">${esc(done.uitkomst)}</div>` : ""}</div>` : "";
}
