function keuzeCard(k, inline){
  const st = S.state;
  return `<div class="card decision keuze"><div class="spread"><h3>${esc(k.titel)}</h3><span class="tag HOOG">kies voor ${esc(k.verloopt)}</span></div>${k.boog ? `<div class="kpi" style="color:var(--violet);margin:2px 0 4px">VERHAAL · ${esc(k.boog)}</div>` : ""}
    <p class="muted" style="margin:0 0 4px;font-size:13.5px">Van ${esc(k.van)}</p>${inline ? "" : `<p style="margin:0">${esc(k.tekst)}</p>`}
    <div class="opts">${k.opties.map((o, i) => `<div class="opt"><div><div class="t">${esc(o.label)}</div><div class="u">${esc(o.uitleg || "")}${o.eff && o.eff.kans != null ? ` <span class="mono" style="color:var(--cyan)">· worp 2d6 ≥ ${doelVoor(o.eff.kans)}, ${snapKans(o.eff.kans)}% kans</span>` : ""}${k.gm && keuzeEffTekst(o.eff) ? `<div class="keff">${esc(keuzeEffTekst(o.eff))}</div>` : ""}</div></div>
      <button class="btn sm warn" data-a="keuze" data-id="${esc(k.id)}" data-i="${i}" ${o.kost && (o.bron === "zwart" ? st.zwart : st.cash) < o.kost ? "disabled" : ""}>Kies</button></div>`).join("")}</div></div>`;
}
const KE_NAAM = {heat: "heat", reputation: "reputatie", morale: "morale", invloed: "invloed"};
function keuzeEffTekst(e){
  if (!e || typeof e !== "object") return "";
  if (e.kans != null) return `Lukt: ${keuzeEffTekst(e.succes) || "niets"}. Mislukt: ${keuzeEffTekst(e.falen) || "niets"}.`;
  const d = [], sg = v => (v > 0 ? "+" : "") + v;
  if (e.cash) d.push(`${e.cash > 0 ? "+" : "−"}€${Math.abs(e.cash)}M`);
  if (e.zwart) d.push(`${e.zwart > 0 ? "+" : "−"}€${Math.abs(e.zwart)}M zwart`);
  for (const k of Object.keys(KE_NAAM)) if (e[k]) d.push(`${KE_NAAM[k]} ${sg(e[k])}`);
  for (const [n, v] of Object.entries(e.factions || {})) d.push(`${n} ${sg(v)}`);
  for (const [n, v] of Object.entries(e.loyaliteit || {})) d.push(`loyaliteit ${n} ${sg(v)}`);
  for (const [n, o] of Object.entries(e.rivaal || {})) if (o && o.relatie) d.push(`relatie ${n} ${sg(o.relatie)}`);
  for (const [id, o] of Object.entries(e.product || {})){ const p = ((G.game && G.game.producten) || []).find(x => x.id === id); if (o && o.pop) d.push(`populariteit ${p ? p.naam : "product"} ${sg(o.pop)}`); }
  return d.join(", ");
}
function keuzeInline(id){
  const st = S.state, k = st.keuzes.find(x => x.id === id);
  if (k) return keuzeCard(k, true);
  const done = st.keuzesKlaar.find(x => x.id === id);
  return done ? `<div class="prop uitgevoerd"><span class="kpi">GEKOZEN</span><div class="ptext">${esc(done.gekozen)}</div>${done.uitkomst ? `<div class="muted" style="font-size:14px">${esc(done.uitkomst)}</div>` : ""}</div>` : "";
}
function newsItem(n){
  return `<div class="nws ${n.jij ? "jij" : ""} ${esc(n.soort)}"><div class="spread"><b>${esc(n.kop)}</b><span class="mono dim" style="font-size:13px;white-space:nowrap">${esc(n.m)}${n.regio ? " · " + esc(n.regio) : ""}</span></div>
    <div class="muted" style="font-size:14px">${esc(n.tekst)}</div></div>`;
}
function newsCard(st){
  const W = st.wereld, items = W.nieuws.slice(0, 5);
  return `<div class="card" style="margin-top:14px"><div class="spread"><h3>Wereldnieuws</h3><span class="row" style="gap:8px"><span class="tag cyan">plaats ${W.plek} van ${W.totaal}</span><button class="btn sm" data-view="wereld">Naar de wereld</button></span></div>
    ${items.length ? `<div class="news">${items.map(newsItem).join("")}</div>` : '<p class="muted" style="margin:0">Nog stil. Speel een maand en de wereld begint te praten.</p>'}</div>`;
}
function yieldBlock(d){
  const y = d.opbrengst; if (!y) return "";
  return `<div class="yield"><span class="kpi">WAT HET OPLEVERT</span>
    <div class="row" style="gap:18px;margin:4px 0"><div><div class="kpi">NETTO</div><b class="mono" style="color:${y.netto >= 0 ? "var(--green)" : "var(--red)"}">${y.netto >= 0 ? "+" : ""}${eur(y.netto)}/mnd</b></div>
      <div><div class="kpi">${esc((d.continent || "").toUpperCase())}</div><b class="mono">${y.contPct}% van het continent</b></div></div>
    <ul class="ylist">${y.perk ? `<li>Soort: ${esc(y.soort)}. Bezit telt +4% omzet op ${esc(y.perk)} (max +20%).</li>` : ""}
      ${y.mod ? `<li class="${y.mod.f < 1 ? "bad" : "good"}">${esc(y.mod.why)}: ${y.mod.f < 1 ? "" : "+"}${Math.round((y.mod.f - 1) * 100)}% inkomen, nog ${y.mod.m} mnd.</li>` : ""}
      ${y.gang ? `<li class="${y.gang.deal === "bescherming" || y.gang.deal === "partner" ? "" : "bad"}">${esc(y.gang.naam)} zit hier (aanwezigheid ${y.gang.v})${y.gang.deal ? ", afspraak: " + esc(y.gang.deal) : ". Zonder afspraak volgt vroeg of laat een rekening"}.</li>` : ""}
      ${y.bedrijven.length ? `<li>Bedrijven hier: ${y.bedrijven.map(b => esc(b.naam) + (b.eigenaar ? ` (${esc(b.eigenaar === "player" ? "van jou" : b.eigenaar)})` : "")).join(", ")}.</li>` : ""}
      ${y.bonus && d.controle !== "player" ? "" : ""}</ul>
    ${y.dom ? `<span class="kpi">DOMINANTIE IN DIT DISTRICT</span>${domBar(y.dom.map(x => ({naam: x.naam, pct: x.pct, kleur: x.kleur})))}
      <p class="dim" style="font-size:12.5px;margin:4px 0 6px">Je aandeel groeit met aanwezigheid${y.aanwezig ? ` (nu ${y.aanwezig})` : ""}, patrouilles en je districten ernaast. Telt mee voor je continent en hegemonie.${d.controle !== "player" && !y.hq ? ` Boven ${DOM_FLIP}% en groter dan de ${d.controle === "neutral" ? "staat" : "eigenaar"}, twee maanden lang, wordt het district van jou${y.flipMnd ? ` (al ${y.flipMnd} maand)` : ""}.` : ""}${d.controle !== "player" ? ` Vanaf ${DOM_INKOMEN_MIN}% krijg je een deel van het inkomen.` : ""}</p>
      ${y.aanwezigMag ? `<button class="btn sm" data-a="aanwezig" data-id="${d.id}">Aanwezigheid opbouwen · ${eur(y.aanwezigKost)}</button>` : ""}` : ""}</div>`;
}
function setupBonus(homeD){
  const b = START_BONUS[homeD.arch];
  return b ? `<div class="sbonus"><span class="kpi">STARTVOORDEEL</span><b>${esc(b.naam)}</b><span>${esc(b.uitleg)}</span></div>
    <p class="dim" style="font-size:13px;margin:6px 0 0">Elk soort land geeft een ander voordeel: havens, financiële centra, datavalleien, sloppen. Klik verschillende landen aan om ze te vergelijken.</p>` : "";
}
const VERSIES = [
  ["6.5", "Kleuren die alles kleuren, altijd leesbaar", ["Je hoofd- en accentkleur kleuren nu echt alles: knoppen, chips, randen, gloed, badges, balkjes, grafieken, de menubalk, de kaart (jouw gebied), de krant en je logo. Elk thema kleurt ook de panelen, de kopbalk en de grijze bijschriften.", "Altijd leesbaar: kies je een te donkere kleur, dan maakt het spel hem lichter met dezelfde tint tot tekst genoeg contrast heeft (de toegankelijkheidsnorm 4,5:1, ook op de lichtste panelen). Tekst óp een gekleurde knop wordt vanzelf zwart of wit. In Huisstijl zie je wanneer een kleur is aangepast.", "De grijze bijschrifttekst was op het standaardthema net te zwak (contrast 3,3); die is lichter gemaakt."]],
  ["6.4", "Opruimen", ["Dichtst bij winst noemde soms Corporate zone, alleen omdat de corpospanning vanzelf stijgt. De voortgang telt nu de zwakste van de twee voorwaarden (spanning en jouw aandeel).", "Tests vijf keer parallel na elkaar: geen toevallige fouten meer."]],
  ["6.3", "Corporate zone", ["Een vierde manier om te winnen: wordt je thuiscontinent een corporate zone (corpospanning 90+) terwijl jij er 60% of meer van de dominantie hebt, dan regeert jouw corporatie daar. Je voortgang staat bij de doelen en in Wat nu?.", "Achter de schermen: Wat nu? kan zijn volledige lijst aan tests geven, zodat een test niet meer faalt als er toevallig zes belangrijkere adviezen zijn."]],
  ["6.2", "Rivalen met dezelfde regels", ["Rijke rivalen bouwen nu ook aanwezigheid op in districten naast hun gebied: neutrale districten, en die van jou als ze je niet mogen. Je ziet hun aandeel in de dominantiebalk van elk district (Kaart).", "Is hun aandeel twee maanden 55% of meer en groter dan dat van de eigenaar, dan nemen ze het district over, ook van jou. Je krijgt een waarschuwing zodra ze beginnen en in Wat nu? als het een maand van overname is. Aanwezigheid opbouwen of een patrouille houdt ze tegen.", "Je thuisdistrict en hoofdkantoren vallen nooit op deze manier. Ook getest: twee tests die soms op toeval faalden (CEO, hoofdmenu) zijn vastgezet."]],
  ["6.1", "Een hoofd per divisie", ["Bedrijf → Divisies: neem per divisie een hoofd aan (€4M). Elk hoofd heeft talent 1-5 en een loon per maand.", "Kies de focus: omzet (+2% per talent) of kosten (−3% per talent). Een bonus (€1M) houdt de loyaliteit hoog; onder 25 kan een hoofd overstappen naar een rivaal."]],
  ["6.0", "Balans met alle systemen", ["De testspeler (een bot die duizenden spellen speelt) gebruikt nu ook alles uit 5.x: klanten, onderzoek, patenten, export, voorraad, patrouilles, corpowetten en de CEO. Alles samen maakt het spel ±15 procentpunt makkelijker voor wie het goed gebruikt; geen enkel systeem is op zichzelf te sterk.", "Twee kleine correcties: winst op klantenleveringen en raamcontracten 45% van de omzet (was 55%), en onderzoek wordt duurder naarmate je bedrijf groeit (tot 2×).", "Wil je het zwaarder: Logboek → Eigen moeilijkheid."]],
  ["5.21", "Uitleg en begin", ["Bij een nieuw spel krijg je een korte rondleiding in vijf stappen: Wat nu?, Bedrijf, Volgende maand, de wereld, en het menu. Overslaan kan; opnieuw bekijken bij Logboek.", "Elk scherm heeft rechtsboven een spiekbriefje (? spiekbriefje) met de twee of drie dingen die je daar moet weten."]],
  ["5.20", "Eigen moeilijkheid", ["Bij het oprichten (Koers en cultuur) en later bij Logboek → Eigen moeilijkheid zet je vijf schuiven: gebeurtenissen, chaos, corpospanning, heat (hoe snel de politie oplet) en de winstdrempel. Weinig, normaal of veel.", "Zwaarder telt zwaarder: de score-vermenigvuldiger gaat mee (bv. veel chaos en een hogere winstdrempel). Voor de score telt de laagste stand die je ooit had, dus even makkelijker zetten en terug helpt niet.", "Bestaande spellen staan op normaal en veranderen niet."]],
  ["5.19.1", "Opruimen", ["Wat nu? waarschuwt bij hoge stress (kans op burn-out), lage gezondheid en als je 58+ bent zonder opvolger.", "Gemeten: balans verstandig 50%; mobiel Mensen-scherm zonder horizontale scroll."]],
  ["5.19", "De CEO als persoon", ["Mensen → Jij, de CEO: je leeftijd, gezondheid en stress, en je privéleven (partner, kinderen). Bij een nieuw spel kun je je eigen naam invullen.", "Stress komt van heat, oorlogen, lage morale en geldnood; hoge stress en ouderdom kosten gezondheid. Vakantie (€2M), tijd voor je gezin of een kliniek (€10M, wat heat) helpen. Bij te veel stress dreigt een burn-out.", "Opvolging: wijs een opvolger aan: een kind (dynastie) of iemand uit je directie. Overlijd je of ga je met pensioen zonder opvolger, dan haalt de raad een buitenstaander (morale −12, reputatie −8). Het spel gaat altijd door met de nieuwe CEO.", "Rivaliserende CEO's worden ouder en worden vervangen, met een nieuw karakter. Golfen (€1M) bouwt een persoonlijke band en verbetert de relatie met hun bedrijf."]],
  ["5.18", "Krant van de maand", ["Wereld → Krant: NEON NEWS 24, de maandeditie. Een voorpagina (jouw grootste nieuws of het grootste wereldnieuws), rubrieken Uit de bestuurskamer, Wereld, Rivalen en Markten, de vraag die het hardst beweegt, dure of goedkope grondstoffen, je beurskoers en de corpospanning per continent. Plus een advertentie.", "Op het overzicht staat de kop van de krant met een knop Lees de krant."]],
  ["5.17.3", "Opruimen", ["Op de telefoon was het hoofdmenu niet terug te vinden (het zijmenu is daar verborgen). Nu staat er een ☰-knop links in de kop, op elk scherm.", "Gemeten: balans verstandig 47%, reputatie gemiddeld −8 in twee jaar als je alle beslissingen laat liggen (vooral lastercampagnes van je concurrent; daartegen kun je nu zelf een plan smeden)."]],
  ["5.17.2", "Hoofdmenu", ["Bij het openen van het spel verschijnt een hoofdmenu met je logo: Doorgaan (je huidige bedrijf en datum), Nieuw spel (je huidige spel blijft bewaard) en Laden.", "Laden toont al je bewaarde spellen (save slots) met de datum; één klik en je speelt verder. Hernoemen, verwijderen en exporteren blijft bij Logboek → Spellen.", "Het menu kun je altijd weer openen via MENU links onderaan het zijmenu. Sluiten: Doorgaan, Escape of naast het menu klikken."]],
  ["5.17.1", "Huisstijl bij het oprichten", ["Bij een nieuw spel (Fase 0 · Het bedrijf) kies je meteen je hoofd- en accentkleur, een thema (Neon, Corporate, Terminal, Bloed, Chroom) en je logo: een vorm en symbool, of een eigen afbeelding.", "Je ziet het logo en het thema meteen in het scherm. Later aanpassen kan nog altijd bij Bedrijf → Huisstijl."]],
  ["5.17", "Zelf plannen smeden", ["Rivalen → Zelf een plan smeden: tegen een rivaal een prijsoorlog, mensen wegkopen, een lastercampagne of sabotage; tegen een bende in je gebied: uitroken.", "Een plan heeft drie stappen van twee maanden. Elke stap kost geld en is een worp: je macht tegen de hunne, plus je crew (fixer, speurder, spindokter). Een paranoïde CEO is moeilijker.", "Mislukt een stap, dan is het plan ontdekt: weg, relatie −10, heat +2. Lukt alles, dan volgt de klap (bv. prijsoorlog: hun marktaandeel −20% en jouw producten in die soort +5 populariteit).", "Eén plan tegelijk; afblazen kan altijd. Het lopende plan staat bij Rivalen met de kans op de volgende worp."]],
  ["5.16.1", "Opruimen", ["Spelregels (? rechtsonder in het menu) uitgebreid met De wereld en Handel en groei: een kort overzicht van alles wat er sinds 5.0 bij kwam.", "Winnen: sta je op de beurs, dan telt alleen jouw deel van de bedrijfswaarde (stond nog niet in de regels).", "Alle tests drie keer na elkaar: geen toevallige fouten."]],
  ["5.16", "Dashboard", ["Financiën → Dashboard: een grafiek van de omzet per divisie (divisie en haar producten) over de laatste 36 maanden.", "Per product: omzet over tijd en populariteit naast de sterkste concurrent in dezelfde soort (rode stippel), zodat je ziet wie je inhaalt.", "Jaaroverzicht: omzet, kosten, resultaat, kas aan het eind en je bedrijfswaarde per jaar.", "De kasstroom toont nu Resultaat (omzet min kosten) in plaats van het netto-cijfer uit het CFO-rapport, dat niet altijd klopt met omzet en kosten."]],
  ["5.15", "Financiën en de beurs", ["Financiën → Boekhouding: een balans (wat je bezit, wat je schuldig bent, je eigen vermogen) en de kasstroom van de laatste zes maanden.", "Termijnlening: vaste rente, 12/24/48 maanden, een vaste maandlast (rente en aflossing samen). Goedkoper dan de lopende lening, maar je zit eraan vast.", "Naar de beurs (vanaf €500M bedrijfswaarde en reputatie 25): verkoop 10, 20 of 30% van je aandelen voor geld nu. Daarna telt voor de winst alleen jouw deel. Later kun je aandelen bijgeven (max 49% publiek) of terugkopen.", "Elk jaar in juni een aandeelhoudersvergadering: dividend, herinvesteren of een bonus voor je directie."]],
  ["5.14.1", "Opruimen", ["Sneller: de regioberekening wordt per maand en soort onthouden in plaats van bij elke prijsproef opnieuw gedaan.", "Klanten: als je beste product onder de gevraagde kwaliteit zit, staat dat er nu in het rood bij (−30 kans), zodat je weet waarom de kans zo laag is.", "Tests vijf keer na elkaar: geen toevallige fouten."]],
  ["5.14", "Onderzoek", ["Bedrijf → Onderzoek: per soort product drie niveaus met echte namen (wapens: Slimme munitie → Modulaire chassis → Exo-gevechtspakken; implantaten: Neurale interfaces → Biocompatibel chroom → Synthetische zenuwen; enz.).", "Niveau 1: +5% omzet. Niveau 2: nog +5% en 8% goedkopere onderdelen. Niveau 3: nog +5% en +1 op alle eigenschappen (sneller een patent). Geldt voor al je producten van die soort, ook toekomstige.", "Eén onderzoek tegelijk, betaald per maand (niveau 1: 6 maanden, €15M; niveau 3: 10 maanden, €45M). Stoppen kan; wat betaald is, is weg.", "Rivalen onderzoeken ook (elk jaar een kans): hun nieuwe producten worden beter."]],
  ["5.13", "Patenten en namaak", ["Productblad → Markt → Patent: heeft een product een eigenschap van 7 of meer, dan patenteer je die (€8M). Dat geeft +8% omzet en licentiegeld: €0,2M per maand per rivaal met een product van dezelfde soort.", "Namaak: soms kopieert een rivaal je gepatenteerde product. Aanklagen (€4M, kans op €10-25M schadevergoeding), een licentie geven (twee jaar €0,6M per maand) of negeren (een jaar geen patentvoordeel). Juristen in huis (Koers) en reputatie helpen bij de rechter.", "Rivalen patenteren ook: dan verkoopt die soort drie jaar 5% minder, tenzij je zelf een patent in die soort hebt of het patent aanvecht (€5M, ±50%)."]],
  ["5.12.1", "Opruimen", ["Bedrijf is geordend: bovenaan Huisstijl en Koers, daaronder een blok Handel (Klanten, Export, Toelevering), dan Divisies en Productlijn.", "Kleine tekstfouten in de nieuwe kaarten verbeterd."]],
  ["5.12", "Toelevering en voorraad", ["Je maakt alles zelf, maar grondstoffen koop je in: staal, chips, zeldzame aarden, brandstof, chemicaliën, biogel en lithium. Elk komt uit één continent.", "De prijs volgt de corpospanning daar, oorlogen van rivalen met hun hoofdkantoor daar en wereldgebeurtenissen (chiptekort 2020, energiecrisis 2022). Een dure grondstof maakt het onderdelendeel van je productiekosten duurder.", "Bedrijf → Toelevering: per grondstof die je gebruikt de prijs, trend en het verbruik. Voorraad (3, 6 of 12 maanden, max 24) betaal je nu tegen de prijs van vandaag; zolang die strekt, kost die grondstof je niets extra.", "Wat nu? zegt het als een grondstof duur is, of juist goedkoop genoeg om in te slaan."]],
  ["5.11", "Regionale markten", ["Elk continent heeft een eigen marktgrootte, koopkracht, vraag per soort product en concurrenten (rivalen met hun hoofdkantoor daar). De vraag verschuift langzaam; wapens en beveiliging verkopen beter waar de corpospanning hoger is.", "Productblad → Markt → Regio's: per continent zie je vraag, prijsgevoel en concurrentie, en welk deel van je omzet daar vandaan komt. Klik een continent uit om je te richten op de rest: minder markten geeft focus (+60% × het deel dat je laat vallen).", "Prijs en regio horen bij elkaar: een hoge prijs verkoopt beter in Noord-Amerika en Europa, een lage prijs beter in Afrika en Zuid-Amerika.", "Bestaande spellen: alles blijft eerst gelijk (overal vraag 1,00 en je verkoopt overal); daarna gaat de vraag per regio vanzelf schuiven. Nieuwe spellen beginnen met verschillen per continent."]],
  ["5.10.1", "Opruimen", ["Op mobiel verdween de grijze uitleg in de nieuwe rijen (corpowetten, assistenten, export, corpospanning). Die staat er nu weer.", "Klanten: de rijen stonden in smalle kolommen; nu netjes onder elkaar. Aanvragen vragen meestal een kwaliteit die je haalt (je beste product −2 tot +1), zodat inschrijven zin heeft.", "Export staat ingeklapt op Bedrijf, met een samenvatting (vergunningen, embargo's, omzet). Klik om te openen."]],
  ["5.10", "Export en vergunningen", ["Wapens, beveiliging en implantaten verkopen standaard op je eigen continent. Bedrijf → Export: een exportvergunning per ander continent is blijvend (geen verlopen) en geeft +6% omzet op die producten. Elke volgende vergunning kost wat meer.", "Embargo: op een continent met Sancties of Privélegers (spanning 50-89) telt je vergunning niet. Een smokkelroute houdt de handel gaande, als zwart geld (80%) en met wat heat. In een Corporate zone (90+) is het embargo weer weg.", "Andere producten (medisch, data, logistiek, ...) hebben geen vergunning nodig."]],
  ["5.9", "Klanten komen naar jou", ["Staten, legers, bedrijven uit de wereld en syndicaten sturen aanvragen: een eenmalige levering of een raamcontract van 6 tot 24 maanden, voor een soort product dat jij verkoopt. Je ziet ze bij Bedrijf → Klanten en in Wat nu?.", "Inschrijven met een prijs: Scherp (85%, +15 kans), Normaal of Hoog (120%, −15 kans). Je kans hangt af van de kwaliteit van je beste product, je reputatie (bij syndicaten je relatie met hen), de gevraagde minimumkwaliteit en het aantal rivalen met zo'n product.", "Gewonnen: ±55% van de omzet is winst. Een raamcontract betaalt elke maand, zolang je een product van die soort op de markt houdt; anders volgt een boete en reputatie −5.", "Syndicaten betalen zwart en geven heat; soms ziet een journalist de levering. Een aanvraag vervalt na twee maanden."]],
  ["5.8.1", "Opruimen", ["Rivalen in bestaande spellen tonen nu ook een karakter (Haai, Diplomaat, ...). Alleen het label: hun cijfers blijven zoals ze waren.", "Alle tests acht keer na elkaar gedraaid: geen toevallige fouten. Een maand doorrekenen kost ±15 ms, ook met dominantie per district."]],
  ["5.8", "Assistenten", ["Mensen → Assistenten: geef taken aan je directie. Facturen betalen en Kas bewaken (CFO), Prijzen zetten (Verkoopchef), Personeel werven (HR-manager), Producten voorstellen (Hoofd R&D) en Straat bewaken (Head of Security).", "Ontbreekt iemand, dan neem je die aan voor €5M: een nieuwe naam, talent 2-5 en een loon per maand (€0,5-1M). Talent 4+ doet meer: 5% korting op facturen, middelgrote producten.", "Wat je assistenten deden, staat in het maandrapport. Onder loyaliteit 30 laten ze een taak soms liggen: houd ze tevreden met gesprekken, bonussen of promotie.", "Delegeren of zelf doen kan per taak, op elk moment."]],
  ["5.7", "Elk spel een nieuwe wereld", ["Elk nieuw spel maakt nieuwe rivalen (namen passend bij hun sector), nieuwe CEO's en een nieuwe set bedrijven in de wereld. Ook rivalen die later opduiken krijgen een nieuwe naam.", "Elke rivaal-CEO heeft een karakter: Haai, Diplomaat, Paranoïde, Visionair, Opportunist of Traditioneel. Dat verandert hun agressie, hebzucht, beveiliging of groei (Rivalen).", "Wereldzaad: bij het oprichten kun je een code invullen. Dezelfde code geeft dezelfde wereld, zodat je met een vriend dezelfde start kunt spelen. Je eigen code staat bovenaan Rivalen.", "Bestaande spellen houden hun wereld en rivalen."]],
  ["5.6.1", "Opruimen: waarschuwingen en reputatie", ["Wat nu? waarschuwt als een rivaal die je niet mag een district van je op straat kan innemen, als een corpowet te koop is en als een district je volgende maand toevalt.", "Een lage reputatie herstelt langzaam vanzelf (onder 25: elke maand 4% van het verschil terug). Wie elke beslissing laat liggen, zakte in tests van 30 naar 5; nu blijft het rond 10-15.", "Getest: een hogere winstdrempel (€14.400M) veranderde het winstpercentage niet; de drempel blijft €12.400M."]],
  ["5.6", "Gebied als dominantie", ["Elk district is nu verdeeld in aandelen, net als de zee: de eigenaar, jij, rivalen ernaast, bendes en de staat. Kaart → klik een district → Dominantie in dit district.", "Je aandeel groeit met Aanwezigheid opbouwen (+20, kost een kwart van een vestiging, zakt 5% per maand), patrouilles en je eigen districten ernaast. De staat wordt zwakker naarmate de corpospanning stijgt.", "Ben je twee maanden boven 55% en groter dan de eigenaar of de staat, dan valt het district je toe, zonder oorlog (niet bij een hoofdkantoor). Een rivaal die zo een district verliest, wordt woedend.", "Vanaf 20% in een district dat niet van jou is krijg je een deel van het inkomen. Continenten, dominantie-inkomen en hegemonie tellen nu aandelen in plaats van eigenaars."]],
  ["5.5", "Straatoorlog en corpomacht", ["Wereld → Corpospanning heeft nu een blok Corpomacht. Hoe hoger de spanning, hoe meer je mag.", "Patrouilles: vanaf 70 spanning (of 50 met de Privébeveiligingswet) zet je eigen beveiliging op straat in je districten. €1,5M per district per maand, macht +2, bendes krijgen minder grip en een straataanval van een rivaal wordt veel moeilijker.", "Straatgevechten: vanaf 70 spanning val je een district van een rivaal aan dat aan je gebied grenst, zonder oorlogsverklaring (€12M, kans op basis van macht en patrouilles ernaast). Rivalen die je niet mogen, doen dat dan ook bij jou: hooguit één gevecht per maand.", "Corpowetten kopen met invloed en geld: Privébeveiligingswet, Bedrijfsimmuniteit (heat zakt sneller), Belastingvrije corpozone (−5 procentpunt winstbelasting) en Eigen rechtspraak (razzia half zo vaak). Elke wet vraagt een minimum spanning op je thuiscontinent en zwaardere wetten ook een minimum macht."]],
  ["5.4.1", "Opruimen: keuring en spanning", ["Nieuwe spellen laten nieuwe producten vanzelf officieel keuren (Autopilot → Keuring staat standaard aan; uitzetten kan bij Productlijn).", "Een product op de zwarte markt kan nog steeds een reportage opleveren (reputatie −3), maar hooguit één per maand in plaats van één per product.", "Sancties en Privélegers op je thuiscontinent: heat zakt trager. Corporate zone: heat zakt sneller. Zo wordt het late spel spannender."]],
  ["5.4", "Corpospanning", ["Elk continent heeft een corpospanning van 0 tot 100, zoals de wereldspanning in een strategiespel (Wereld → Corpospanning). Ze stijgt langzaam met de tijd (sneller in latere tijdperken) en extra door oorlogen tussen corporaties op dat continent, bendeoorlogen, jouw machtsgebied en wereldgebeurtenissen (oorlog in Europa 2022, privélegers 2032, corporate steden 2040).", "Vijf fasen: Rustig, Onrust (30), Sancties (50), Privélegers (70) en Corporate zone (90). Een nieuwe fase komt in het nieuws.", "Gevolgen nu: gemiddelde spanning verhoogt de normale vraag naar wapens en beveiliging; in een corporate zone op je thuiscontinent zakt je heat sneller. Straatgevechten en corpowetten volgen in 5.5."]],
  ["5.3", "Echte-wereldtijdlijn", ["De wereld volgt nu een tijdlijn die lijkt op de echte, met een cyberpunkstaart: videoplatforms (2005), de smartphone (2007), de bankencrisis (2008), digitaal geld (2009), surveillance-onthullingen (2013), drones voor iedereen (2014), dronegevechten (2015 en 2020), cryptogekte (2017), de pandemie (2020), oorlog in Europa (2022), chatbots en de AI-golf (2022-2023), commerciële ruimtevaart (2024), robots, neurale interfaces, de AI-wet, privélegers, orbitale fabrieken, chroom-mode en corporate steden (2026-2040).", "Elke gebeurtenis geeft een vraagschok en vaak een blijvende verschuiving van de normale vraag (sommige tijdelijk, zoals de crisis en de pandemie). Ze komen in het nieuws en het maandrapport. Wereld → Markten toont de tijdlijn tot nu toe en de blijvende trends per soort.", "Bestaande saves: wat al voorbij is, wordt bij de volgende maand stil verwerkt."]],
  ["5.2.1", "Automatisch ontwikkelen", ["Per divisie (Productlijn) zet je Automatisch ontwikkelen aan en kies je de schaal (klein, grote lancering of vlaggenschip). Is er een vrije plek, loopt er geen ontwikkeling en heb je de kosten plus €30M buffer in kas, dan start de divisie zelf een nieuw product. Gratis ontwikkelingen worden eerst gebruikt."]],
  ["5.2", "Autopilot", ["Per product een autopilot (Details → Overzicht → Autopilot) met drie schakelaars: Prijs (volgt elke maand de prijs met de meeste winst), Capaciteit (breidt uit als je uitverkocht bent en er €20M buffer is, krimpt in bij veel leegloop) en Keuring (vraagt een keuring aan als die nodig is). Wat de autopilot deed staat in het maandrapport.", "Bovenaan de Productlijn staan drie schakelaars (Prijs, Capaciteit, Keuring) die de autopilot in één klik aan of uit zetten voor al je huidige en nieuwe producten. Per product pas je het daarna nog aan. De autopilot zet de prijs nooit boven 150% (woekerprijzen kosten reputatie)."]],
  ["5.1", "Eigen huisstijl", ["Bovenaan bij Bedrijf staat Huisstijl: kies een hoofdkleur en een accentkleur (die vervangen het neonblauw en roze in het hele scherm), een thema (Neon, Corporate, Terminal, Bloed of Chroom) en een logo.", "Logo: de generator maakt er een uit een vorm (zeshoek, cirkel, ruit, schild), een symbool en de initialen van je bedrijf, in je eigen kleuren. Of upload een eigen PNG, JPG of WebP: die wordt verkleind tot 96×96 en in je save bewaard. Het logo staat linksboven naast je bedrijfsnaam."]],
  ["5.0", "Opruimen", ["De zwarte markt is een echt risico: elke maand ±4% kans per product dat een journalist het spoor volgt (reputatie −3, heat +3).", "Op het overzicht staan nog maar twee besluiten volledig; de rest zit ingeklapt onder Nog N besluiten (en staat ook bij Inbox).", "Het kwaliteitsblok zegt nu basiskwaliteit 2 van 5 in plaats van lage kwaliteit, zodat het niet botst met hoge eigenschappen.", "Winstdrempel omhoog: €12.400M bij 20 jaar (was €11.000M), €7.200M bij 10 jaar, €16.800M eindeloos. Verstandige bot op Realistisch: 52% (was 58%). Verder omhoog maakte weinig verschil: wie verliest, verliest door razzia's.", "Orders hebben een vaste test."]],
  ["4.7.11", "Geen wachtrij meer", ["Producten ontwikkelen nu tegelijk: een nieuw product start altijd meteen, ook als er al iets in ontwikkeling is. Wat nog in de wachtrij stond, start volgende maand allemaal tegelijk (gratis plekken blijven gratis). Varianten kunnen ook starten terwijl er iets loopt. De enige grens is het aantal producten per divisie."]],
  ["4.7.10", "Zelf je wapenlijn bouwen", ["Op verzoek: de teruggezette wapenproducten zijn weg zodat je ze zelf ontwerpt. Weapon manufacturing staat op niveau 6, je kas kreeg €60M erbij en je eerste 5 productontwikkelingen zijn gratis (op elke schaal). Het ontwikkelformulier toont hoeveel gratis er nog over zijn."]],
  ["4.7.9", "Weapon manufacturing terug", ["De wapendivisie die je bij de geschrapte overname verloor staat weer in je save, op niveau 5, met wapens, sniper, armor, drones, tanks, mechs en vliegtuigen: allemaal op de markt, gekeurd en uit je eigen fabriek. Mechs en vliegtuigen verkopen via orders, net als tanks."]],
  ["4.7.8", "Verloren divisie terug uit de back-up", ["4.7.7 zette een divisie die je bij de overname verloor niet terug: het spel had haar producten toen al weggegooid. Nu zoekt het spel bij het laden in je back-ups (de laatste drie maanden) en zet de divisie met al haar producten terug."]],
  ["4.7.7", "Geen vijandig overnamebod meer", ["Het vijandige overnamebod is uit het spel: het startte willekeurig en kostte je een divisie met al haar producten of het hele spel, zonder echte tegenzet. Een divisie die je zo kwijtraakte, komt bij het laden terug met haar producten."]],
  ["4.7.6", "Productie inkrimpen", ["Naast Uitbreiden staat nu Inkrimpen (−15 capaciteit). Draai je een betaalde uitbreiding terug, dan krijg je de investering terug (de eerste: €5M). Capaciteit heeft vaste kosten: elke 15 boven de basis kost €0,3M per maand, elke 15 eronder bespaart €0,3M. Uitbreiden kost dus eenmalig €5M plus maandelijks €0,3M. Minimum 45."]],
  ["4.7.5", "Alles uit de eigen fabriek", ["Nieuwe producten worden standaard volledig in je eigen fabriek gemaakt: geen leveranciers, 15% goedkopere onderdelen. Ook bestaande producten in je save zijn eenmalig (gratis) omgezet naar eigen productie."]],
  ["4.7.4", "Zelf produceren", ["Elk onderdeel kun je nu zelf maken (Details → Onderdelen): eenmalig €4M per onderdeel voor een eigen werkplaats, of Alles zelf maken voor alle onderdelen tegelijk. Daarna komt het onderdeel uit je eigen fabriek: 15% goedkoper per stuk en geen leverancier meer. Goedkoop, standaard of premium kies je nog steeds zelf."]],
  ["4.7.3", "Eerlijkere kosten", ["Gemeten in testspellen: facturen, gebeurtenissen, chaos en bendes kostten samen bijna de helft van wat je verdiende, zonder dat je er iets aan kon doen. Nu ongeveer een derde minder: vaste en onverwachte facturen ±40% lager en minder vaak, gebeurtenissen en chaos kosten 30% minder.", "Een staking, audit of recessie kost niet meer een percentage van je hele kas, maar hoogstens van drie maanden omzet: sparen wordt niet meer gestraft.", "Het maandrapport toont nu Facturen betaald en Netto na facturen, zodat je ziet waar je geld heen gaat.", "Chaos groeit mee met het spel: in het begin zelden en licht (8% kans per maand, halve schade), na tien jaar gemiddeld (25%, volle schade).", "Bestaande saves krijgen eenmalig €100M terug.", "Gevolg: het spel is makkelijker. Verstandige bot op Realistisch wint nu ±58% (was 43-47%)."]],
  ["4.7.2", "Keuring: permanent per editie", ["Een goedkeuring is permanent, maar geldt alleen voor die editie van het product. Een nieuw product, een variant of een nieuwe versie (kwaliteit +1) moet opnieuw gekeurd worden; de mail van R&D zegt het erbij.", "De 2 maanden zijn de duur van de keuring zelf, niet hoe lang een goedkeuring geldt. Dat staat nu op de knop (duurt 2 mnd) en bij de status (goedgekeurd, permanent, deze editie).", "Bestaande saves: bij het laden is alles één keer goedgekeurd (sinds 4.7.1)."]],
  ["4.7", "Miljoenen en echte productlijnen", ["Alle bedragen staan nu in miljoenen (M€) in plaats van duizenden: je startkapitaal, omzet, kosten, waarde en de winstdrempel. De verhoudingen zijn gelijk gebleven, dus de balans ook. Ook kleine dingen (een agent omkopen, een klus) kosten nu miljoenen: op het niveau van een megacorporatie.", "Elk soort product heeft per schaal een eigen productlijn met een echte stukprijs. Wapens: klein = pistolen (€320), grote lancering = aanvalsgeweren (€2.400), vlaggenschip = tanks (€4,2M per stuk). Medisch: doses, behandelingen, ziekenhuissystemen. Orbitaal: ladingplaatsen, satellietlanceringen, satellieten (€40M). Het ontwikkelformulier zegt per schaal wat je maakt.", "Vlaggenschepen (tanks, satellieten, ziekenhuissystemen, staatsleningen...) verkopen via orders: gemiddeld eens per drie maanden komt er een order binnen van een paar stuks voor tientallen miljoenen, de andere maanden niets. Gemiddeld levert het evenveel op, maar met grote pieken. De laatste orders staan op het productblad en in het maandrapport.", "Afzet in echte aantallen: duizenden pistolen of honderdduizenden abonnees per maand. De productiekosten per stuk staan nu ook op de productlijn.", "Bedragen met een Nederlandse komma (€3,3M).", "Balans (verstandige bot, Realistisch, 150 spellen): 43%, binnen de ruis van eerdere metingen (46-47%)."]],
  ["4.6.1", "Marketingkanalen", ["Vier manieren om een product te promoten (Details → Prijs en klanten → Marketing), één campagne per maand: Reclame (€3M, populariteit +12 bij iedereen, zoals de oude campagneknop), Influencers (€3M, +8 en vier maanden 40% meer afzet in het prijsgevoeligste segment), Beurs (€5M, +5 en zes maanden 50% meer afzet bij de koopkrachtigste klanten) en een Fluistercampagne (€2M zwart geld, +8 of +12 voor wapens, smokkelwaar en implantaten, vier maanden 30% meer afzet in het prijsgevoeligste segment, heat +2).", "Bij elke knop staat op welk segment hij zich richt (bij een medisch product: influencers → straatklinieken, beurs → rijke particulieren). Een lopende campagne staat bovenaan met hoeveel maanden ze nog loopt.", "Rijen met knoppen lopen op de telefoon nu door naar een volgende regel in plaats van van het scherm te vallen.", "Geen balanswijziging: de campagneknop op de productlijn is Reclame en werkt precies als vroeger."]],
  ["4.6", "Verkoopkanalen", ["Per product kies je hoe het verkocht wordt (Details → Verkoop en keuring): groothandel (zoals altijd), eigen winkels (+15% opbrengst per stuk, 10% minder afzet, €1,5M vaste kosten per maand), online (+15% afzet voor data, financiële en consumentenproducten, −15% voor de rest, €0,5M per maand) of de zwarte markt.", "De zwarte markt: +25% afzet voor wapens, smokkelwaar en implantaten, −20% voor de rest. Er is geen keuring nodig, maar de helft van de omzet komt als zwart geld binnen (eigen regel in het maandrapport) en het kost heat +0,4 per maand per product. Een ongekeurd medicijn kan dus toch volop verkocht worden, met de risico's die daarbij horen.", "Overstappen kost €1M. Het productblad heeft een vijfde tabblad: Verkoop en keuring.", "Geen balanswijziging: groothandel rekent precies zoals vroeger en de bot blijft daarbij."]],
  ["4.5.2", "Opruimen: Wat nu? zonder herhaling", ["Wat nu? onthoudt welke adviezen er elke maand staan. Een advies dat al drie maanden onveranderd staat en niet dringend is, zakt naar een ingeklapt lijstje Staat al een tijdje. Dringende adviezen (geld, morale, heat, beslissingen) blijven altijd bovenaan.", "Meldingen rechtsonder lagen bij elke actie over Wat nu?. Op een breed scherm staan ze nu rechtsboven, ze zijn korter zichtbaar (3,5 seconde) en een klik haalt ze weg.", "Kleine tekstfout: 1 beslissing wacht op je (in plaats van 1 beslissing(en) wachten).", "Geen balanswijziging."]],
  ["4.5.1", "Keuring", ["Medische producten, implantaten en wapens moeten na de lancering gekeurd worden. Tot dan verkopen ze alleen op de grijze markt: 60% van de afzet. Op de productlijn staat Niet gekeurd, en Wat nu? wijst erop.", "Officiële keuring (Details → Overzicht → Keuring): €4M en twee maanden, met een worp. Het geneesmiddelenbureau, de keuringsdienst voor implantaten of de wapeninspectie kijkt naar defecten (boven 3% en 5% moeilijker) en kwaliteit (4 of hoger makkelijker). Afgekeurd? Opnieuw aanvragen kan.", "Of de keurder omkopen: €2M (zwart geld als je het hebt), meteen, heat +3. Mislukt het, dan heat +6 en reputatie −4.", "Een variant van een goedgekeurd product is meteen goedgekeurd. Producten die al op de markt waren gelden als gekeurd.", "Balans (verstandige bot, Realistisch, 150 spellen): 46%. De bot vraagt altijd netjes een keuring aan; wie dat vergeet, verliest 40% van de afzet op die producten."]],
  ["4.5", "Defecten en garantie", ["Elk product heeft een defectpercentage (Details → Overzicht → Kwaliteit). Het hangt af van de soort (smokkelwaar en implantaten gaan vaker stuk dan financiële producten), de kwaliteit, je onderdelen (goedkoop ×1,5 voor dat deel, premium ×0,7), eigenschappen als storingsgevoelig en een bètatest (−15%).", "Garantie kost elke maand het defectpercentage van de omzet. Het staat bij de productiekosten in het maandrapport en telt mee in de prijs met de meeste winst.", "Boven 5% defecten kan elke maand een terugroepactie nodig zijn (hoogstens eens per jaar per product): terugroepen (populariteit −15, reputatie +1), stil repareren (goedkoper, maar kan uitlekken) of niets doen. Zo hebben goedkope onderdelen een echte prijs.", "Balans (verstandige bot, Realistisch, 150 spellen): 47%, gelijk aan de vorige metingen. Bij standaard onderdelen en gewone kwaliteit zit een product op 1-4% defecten."]],
  ["4.4.3", "Varianten en bètatest", ["Van een product op de markt breng je varianten uit (Details → Overzicht → Varianten): Basis (80% van de prijs, goedkope onderdelen, kwaliteit −1), Pro (125%, premium onderdelen) of Elite (160%, premium, kwaliteit +1). Een variant kost de helft van een klein product en één maand.", "Een variant leent zijn klanten van het origineel: hij start met 60% van de populariteit van het origineel, en het origineel verliest 12%. Zo bedien je met één product meerdere klantsegmenten: Basis voor de prijsbewuste, Elite voor de koopkrachtige top. Een variant neemt wel een plek in je divisie in.", "Bètatest bij het ontwikkelen: 20% duurder en een maand langer, maar +1 op de lanceringsworp (meer kans op een hit, minder op een flop). In de worpen staat erbij dat er getest is.", "Opvolgers bestonden al als Nieuwe versie (+1 kwaliteit); daar is niets aan veranderd.", "Geen balanswijziging: de bot gebruikt geen varianten of bètatests. Nieuwe test tests/varianten.js met vaste dobbelstenen."]],
  ["4.4.2", "Opruimen: productblad in tabbladen", ["Het productblad was op een telefoon ruim 1.600 pixels lang. Nu heeft het vier tabbladen: Overzicht (eigenschappen, economie, productie, omzet), Prijs en klanten, Onderdelen en Markt.", "In het ontwikkelformulier kies je meteen de onderdelen: alles standaard, alles goedkoop (kostprijs −24%, eigenschappen −1) of alles premium (+28%, +1). Per onderdeel aanpassen kan later nog.", "Focus heet in het ontwikkelformulier nu Aanpak, zodat het niet meer lijkt op Nadruk (Aanpak: hoe je ontwikkelt; Nadruk: welke eigenschap het product sterk maakt).", "Nieuw sinds je vorige bezoek toont nog maar de vier nieuwste versies, met hoeveel er nog meer zijn.", "Geen balanswijziging: de bot kiest geen onderdelen."]],
  ["4.4.1", "Onderdelen en leveranciers", ["Elk product heeft een onderdelenlijst (Details → Onderdelen): drie onderdelen die bij de soort horen plus arbeid. Een wapen bestaat uit loop en mechaniek, munitie en een behuizing met demping; een medisch product uit een werkzame stof, zuivering en tests, en een nazorgpakket.", "Per onderdeel kies je goedkoop (30% goedkoper, −1 op de eigenschap waar het voor telt), standaard of premium (35% duurder, +1). Zo stel je zelf je kostprijs en je eigenschappen samen: goedkope demping maakt een wapen minder onopvallend, premium zuivering een medicijn veiliger. Omschakelen van een product dat al op de markt is kost €2M; vóór de lancering is het gratis.", "Elk onderdeel komt van een leverancier uit de bedrijvenwereld, in een passende sector. Gaat die failliet, dan neemt een ander het over en staat dat in je maandrapport.", "Standaard onderdelen kosten precies wat een product vóór deze versie kostte, dus de balans verandert niet als je niets kiest (verstandige bot, Realistisch, 150 spellen: 46%)."]],
  ["4.4", "Ontwerpen voor je klanten", ["Bij een nieuw product kies je een nadruk in het ontwerp: één eigenschap krijgt +2, de volgende −1. Nadruk op Veiligheid bij een medisch product verkoopt meer aan ziekenhuizen en minder aan rijke particulieren (die op herstel letten). Het formulier zegt vooraf wie er meer en minder koopt.", "Klantsegmenten vergelijken je product nu ook met wat rivalen in dezelfde markt verkopen: scoor je beter dan hun gemiddelde op wat een segment belangrijk vindt, dan koopt dat segment meer bij jou; tegen sterke rivalen minder. Bij Details → Klanten staat het gemiddelde van de rivalen naast je eigen score, en bij aanwijzen het sterkste product.", "Balans (verstandige bot, Realistisch, 150 spellen): 47% winst, vorige ronde 45%: binnen de ruis. De bot kiest geen nadruk."]],
  ["4.3.4", "Opruimen: eerlijkere laster, rustiger scherm", ["Lastercampagnes komen alleen nog van je echte concurrent (de rivaal in jouw sector) of van een rivaal waarmee je oorlog voert. Eerder kon elke rivaal je zomaar zwartmaken: in een testrun van twee jaar kostte dat gemiddeld 12 reputatie zonder dat je iets fout deed.", "Het advies bij een zakkende reputatie noemt nu de echte oorzaak. Komt het door laster, dan staat dat er. Verklaart laster maar een deel, dan zegt het dat de rest onduidelijk is. Eerder wees het altijd naar een lek in je directie, ook als er geen was.", "Omdat laster minder vaak voorkomt, werd het spel makkelijker (verstandige bot 43% → 55%). Daarom gaat de winstdrempel licht omhoog: €11.000M bij 20 jaar (was €10.400M), €6.400M bij 10 jaar, €15.200M eindeloos. Gemeten: Realistisch 45% (150 spellen), Casual 78%, Genadeloos 8% (100).", "De uitleg bij Productlijn is ingeklapt onder Hoe werken producten?, in korte punten in plaats van een lap tekst.", "Marktaandeel bij een divisie toonde ~9%, wat er in dit lettertype uitzag als −9%. Nu staat er gewoon 9%.", "Een test die af en toe faalde op een blunderworp (dubbel 1 is altijd mis, ook bij 99% kans) gebruikt nu vaste dobbelstenen."]],
  ["4.3.3", "Klanten en echte aantallen", ["Elk soort product heeft drie klantsegmenten met een eigen deel van de markt, een eigen prijsgevoeligheid en één eigenschap waar ze op letten. Medisch: ziekenhuizen (veiligheid), rijke particulieren (herstel, betalen bijna alles) en straatklinieken (werkzaamheid, letten sterk op de prijs). Wapens: legers, bendes en particulieren. Logistiek: webwinkels, industrie en overheid. Enzovoort.", "Blinkt je product uit in wat een segment wil, dan koopt dat segment meer. De prijs verschuift wie er koopt: duur houdt de koopkrachtige klanten over, goedkoop trekt de prijsbewuste aan. Te zien bij Details → Klanten.", "Producten dragen meer van de omzet (bij de bot 38% van de divisie-omzet, was 32%), maar productie is duurder: 45% van de omzet bij de standaardprijs in plaats van 40%. Netto verdient een product iets meer dan in 4.3.2.", "Realistischer aantallen: een zending kost €9 (was €38), een dosis €20, een licentie €6, een consumentenproduct €12. Een logistiek product verkoopt nu honderden zendingen per maand in plaats van een paar dozijn.", "Balans (verstandige bot, Realistisch, 150 spellen): 43% winst, nulmeting dezelfde avond 41%."]],
  ["4.3.2", "Zelf je prijs bepalen", ["Elk product heeft een prijsschuif (Details → Prijs): van 60% tot 180% van de standaardprijs, met meteen te zien wat dat doet met prijs per stuk, vraag, omzet en wat er na productie overblijft. Pas met Deze prijs instellen verandert er iets.", "Prijsgevoeligheid per markt: consumentenspullen en logistiek verkopen veel minder als ze duurder worden, medische producten, beveiliging en orbitale vracht nauwelijks. Hogere kwaliteit maakt klanten minder gevoelig.", "De kostprijs per stuk ligt vast, dus een hogere prijs geeft meer marge per stuk en een lagere prijs meer afzet. Ben je uitverkocht, dan kost een hogere prijs je niets: die klanten kon je toch niet leveren.", "De knop Meeste winst nu rekent de beste prijs voor deze maand uit. Abonnementen: duurder betekent minder nieuwe abonnees en meer opzeggers, en een verhoging kost meteen abonnees. Boven 150% kost het reputatie (woekerprijzen). Budget, Standaard en Premium blijven als snelknoppen (80%, 100%, 135%).", "Balans (verstandige bot, Realistisch, 150 spellen): 42% winst, voor de wijziging 44%: binnen de ruis. De bot gebruikt de schuif niet; een speler die goed prijst verdient meer."]],
  ["4.3", "Producten verdienen echt, minder ruis", ["Na een playtest: producten leverden te weinig op tegenover sabotage en gebeurtenissen. Elk product levert nu zijn eigen omzet (kwaliteit × populariteit × prijs × vraag, meer bij een grotere divisie), meestal €5-20M per maand, en kost 40% daarvan aan productie (sinds 4.3.3: 45%). In het maandrapport staat het per divisie als eigen regel, in de productlijn per product met omzet en wat er na productie overblijft.", "Minder ruis: wereldgebeurtenissen 40% minder vaak, chaosmails bijna half zo vaak, kleine keuzes (interviews, tips, sponsorverzoeken, cao, klanten) hoogstens één per twee maanden, minder en kleinere aanslagen, en een syndicaat stuurt hoogstens eens per vier maanden een rekening of overvalt je. Gewone meldingen (lanceringen, berichten van rivalen, kleine incidenten) staan onderaan het maandrapport; in je inbox komt alleen wat echt aandacht vraagt.", "Een eigen bedrijfssoort bij de oprichting is je enige startdivisie (geen Logistiek meer ernaast), en Engelse namen zoals weapon of security worden herkend."]],
  ["4.2", "Levende bedrijvenwereld", ["De bedrijven in de wereld leven nu elke maand: nieuwe bedrijven worden opgericht (met namen die bij hun sector passen), zwakke bedrijven gaan na drie slechte maanden failliet, bedrijven fuseren, krijgen een nieuwe naam of CEO, gaan naar de beurs of belanden in een schandaal. Alles verschijnt in het wereldnieuws.", "Elk bedrijf heeft een eigen koers (groeit hard, groeit, krimpt, krimpt hard) en een geschiedenis op zijn kaart. Bij Wereld → Bedrijven zie je hoeveel er dit jaar bijkwamen en omvielen.", "Heb je een belang of contract, dan merk je het: bij een fusie wordt je belang uitgekocht en loopt je contract door bij het nieuwe bedrijf, bij een nieuwe naam verhuist je contract mee, bij een faillissement ben je het kwijt."]],
  ["4.1.2", "Eerlijkere lanceringen", ["Een lancering heeft nu vijf uitkomsten: hit, gewoon, matig, flop en terugroepactie. Een hit valt vanaf je doel + 3 (populariteit 72-82) en altijd bij twee zessen (85 en een kwaliteitspunt extra), een matige start (populariteit 38-50, geen kwaliteitsverlies) net onder je doel, en een flop pas als je ruim mist.", "Omdat er nu veel minder flops zijn, is de winstdrempel hoger: €10.400M bij 20 jaar (€6.000M bij 10 jaar, €14.400M eindeloos). Daardoor is de flopkans nooit meer dan 50%, ook niet bij het moeilijkste ontwerp. Een gewoon klein product: hit ±42%, geen flop (alleen 3% kans op een terugroepactie). Het moeilijkste ontwerp: hit 3%, matig 42%, flop 39%."]],
  ["4.1.1", "Wat is er nieuw", ["Een kaart in het overzicht toont wat er nieuw is sinds je vorige bezoek, met per versie de belangrijkste verandering. Klik Gelezen om hem weg te halen."]],
  ["4.1", "Balans na de nieuwe onderdelen", ["Koersen, aanloop en uitbreidbare capaciteit maakten het spel makkelijker: de testbot won op Realistisch 46%. De winstdrempel is 10% hoger (€8.800M bij 20 jaar, €5.200M bij 10 jaar, €12.800M eindeloos) en de eerste strategiedag komt na een jaar. Gemeten: Realistisch 34%, Casual 86%, Genadeloos 11%.", "Productiecapaciteit is bij de start krapper: een goede lancering kan nu al uitverkopen, en uitbreiden is een echte keuze."]],
  ["4.0", "Echte producten", ["Elk product heeft een productblad (knop Details): drie eigenschappen die bij de soort horen (een wapen heeft vuurkracht, betrouwbaarheid en onopvallendheid; een medisch product werkzaamheid, veiligheid en herstel), prijs per stuk, kostprijs en marge, afzet per maand, levensfase en de omzet van de laatste twaalf maanden.", "Marktaandeel in je eigen segment, met de grootste concurrenten van rivalen erbij.", "Productiecapaciteit is een echte grens: is de vraag groter dan wat je kunt maken, dan ben je uitverkocht en mis je die omzet. Uitbreiden kost geld en groeit mee met je divisie.", "Eerlijk: prijs, kostprijs en afzet zijn in 4.0 een uitsplitsing van de bestaande productomzet. Echte afzet maal prijs, met een vrij instelbare prijs, komt in 4.2."]],
  ["3.10", "Koers en aanloop", ["Bedrijfsfocus: eens per jaar (de eerste keer na een jaar, sinds 4.1) een strategiedag. Je kiest uit drie koersen er één die blijft: Lean, Juristen in huis, Merkbouwer, Talentmagneet, Snelle R&D, Abonnementshuis of Huisbankier. Je koers staat bovenaan bij Bedrijf.", "Aanloop: in je eerste half jaar vertrekt niemand uit je directie, en in je eerste jaar wordt niemand verrader. In een testrun begon iemand al in maand 4 te lekken, voor je je mensen kende."]],
  ["3.9.2", "Na een speelronde van twee jaar", ["Wat nu? waarschuwt als je reputatie maanden achter elkaar zakt terwijl journalisten interne stukken citeren: misschien lekt iemand uit je directie, en een speurder kan dat uitzoeken. In een testrun zakte de reputatie ongemerkt van 30 naar 10.", "Is je cash negatief, dan zegt Wat nu? hoeveel maanden je nog hebt tot het faillissement en waar je snel geld vandaan haalt.", "Mail ouder dan zes maanden zonder open keuze gaat vanzelf naar het archief."]],
  ["3.9.1", "Online getest, late druk", ["De online opslag (zoals in claude.ai) heeft nu een eigen test met een nagebootste database: compacte saves, geen eindeloze save-lus, herladen, back-ups, inbox opruimen, spellen wisselen en chats. Alles slaagde.", "Lonen stijgen 6% per tijdperk, zodat ook een groot bedrijf in de late game moet blijven opletten."]],
  ["3.9", "Abonnementen en dochters", ["Abonnementen: een loyaliteitsprogramma (vaste kosten per maand, minder opzeggers), een prijsverhoging kost meteen 8% van je abonnees, en soms lokt een concurrent je abonnees weg: tegenbod, gratis maand of laten gaan.", "Je dochters: overgenomen bedrijven die als dochter draaien staan nu bovenaan bij Bedrijf. Je kunt ze later alsnog opnemen in je bedrijf of verkopen voor 90% van hun waarde."]],
  ["3.8.1", "Opruimen", ["Oude maandrapporten (alles behalve de laatste drie) en keuzemails die al beslist zijn, gaan vanzelf naar het archief. De inbox blijft over wat nog aandacht vraagt.", "Op een breed scherm schuift de inhoud opzij als het GM-venster open is, zodat het niet over de kaart of het zijpaneel valt.", "Casual: divisies trekken 10% minder heat, zodat een razzia op het makkelijkste niveau zeldzamer is."]],
  ["3.8", "Plannen tegen jou", ["Rivalen en syndicaten bouwen nu over maanden iets tegen je op: een prijsoorlog, je mensen wegkopen, een lastercampagne, je leveringscontract afpakken of (syndicaten) een aanslag op je depots. Elk plan heeft drie stappen, twee maanden per stap.", "Met een speurder of fixer in je crew, of een goede band met je fixer, ontdek je een plan vaker op tijd. Dan kies je: verstoren (kost geld, met een kans), voorbereiden (de klap is half zo groot) of laten gebeuren. Bekende plannen staan bovenaan bij Rivalen, met elke stap.", "Is de GM live, dan schrijft hij titel, stappen en motief op maat, met wat de rivaal over je onthoudt. De effecten liggen vast in de engine."]],
  ["3.7.1", "De GM antwoordt altijd", ["Snelknoppen in het GM-venster: Wat nu?, Vat mijn maand samen, Hoe sta ik ervoor? en Wat kost het om… Is de GM niet live, dan antwoordt het spel zelf uit de cijfers, zodat de knoppen altijd iets opleveren.", "Kaart: namen die elkaar raken worden weggelaten (je eigen gebieden en de geselecteerde eerst); inzoomen maakt de letters kleiner zodat er meer namen passen. Gebieden zijn met Tab en Enter te bedienen.", "Wat nu? herhaalt niet meer wat Eerste stappen al zegt."]],
  ["3.7", "Rust en eerste stappen", ["Een kaart Eerste stappen in het overzicht: vijf concrete dingen voor je eerste maanden (eerste product, crew aan het werk, een contract, de GM iets vragen, je eerste maand), met een knop naar de juiste plek. Ze verdwijnt als alles af is, of met Verbergen.", "Kleine meldingen (stroomstoringen, marktgeruchten, konvooien, kleine incidenten) komen niet meer als losse mail maar onderaan het maandrapport onder Ook deze maand.", "Telefoon: de statusbalk is een raster van drie kolommen in plaats van een rij die afkapt, en tekst op een geselecteerde chip blijft leesbaar."]],
  ["3.6", "Opslag die niet stil faalt", ["Saves zijn ongeveer 75% kleiner: de wereldkaart wordt bij het laden opnieuw opgebouwd in plaats van elke maand mee bewaard. Daardoor passen er veel meer spellen en back-ups in je browser.", "Een mislukte back-up meldt zich nu luid (melding en opslagkaart) in plaats van stil te falen.", "Maximaal 6 spellen in de browser, met een duidelijke melding. Kan je huidige spel niet apart bewaard worden, dan start er geen nieuw spel, zodat je nooit iets kwijtraakt.", "Foutlog onder Logboek → Opslag: vangnetten die vroeger fouten stil inslikten, schrijven ze nu op."]],
  ["3.5", "Druk uit de wereld", ["Heat komt vooral uit riskante en illegale divisies: legale divisies (Biotech, Logistiek, Media & Data, Financieel) trekken boven niveau 6 geen extra aandacht meer. Een groot legaal bedrijf werd vroeger vroeg of laat onvermijdelijk opgepakt.", "Stilstand kost klanten: verkoopt een divisie een jaar lang niets, dan zakt haar omzet elke maand verder, tot −20%, en krijg je daar een mail over. Niets doen is daardoor ook op Casual niet meer veilig.", "Meldingen verschijnen boven de GM-knop in plaats van eroverheen."]],
  ["3.4", "Eerlijk einde", ["De winst hangt af van je speellengte: €4.800M bij 10 jaar, €8.000M bij 20 jaar, €12.000M eindeloos.", "Hegemonie is nu 60% op drie continenten en de Marktmeester schakelt 3 van de 5 oorspronkelijke rivalen uit: in de tests was de economische overwinning de enige die ooit viel.", "Score: bedrijfswaarde telt met de wortel, zodat dominantie, reputatie, jaren en rivalen echt meewegen. Snel winnen geeft tempopunten. Wie verliest, verliest ook de waarde van zijn bedrijf en krijgt ×0,75: een verlies scoort nooit meer dan overleven."]],
  ["3.3.1", "Na de playtest", ["Abonnementen draaien op abonnees in plaats van populariteit: aantrekkingskracht bepaalt hoeveel klanten er bijkomen, kwaliteit en prijs hoeveel er opzeggen. Ze groeien trager maar blijven. Ook bij Handmatig kun je nu een abonnement kiezen.", "Overnames: vooraf zie je wat je krijgt, en na een geslaagd bod kies je zelf hoe je het koppelt: samenvoegen met je divisie, een eigen divisie, als dochter laten draaien of opknippen en verkopen. Een overgenomen bedrijf brengt zijn bestseller mee.", "Een lege divisie legt uit hoe ze geld maakt en geeft twee startideeën met één klik: snel een veilig product, of een abonnement opbouwen.", "De GM zit op elk scherm: de knop GM rechtsonder (of toets G) opent het gesprek zonder dat je je scherm verlaat."]],
  ["3.3", "De GM ontwerpt en vertelt", ["Een nieuwe divisie of eigen bedrijfstak beschrijf je in je eigen woorden. De GM kiest een bestaande soort of verzint een nieuwe met eigen cijfers, ontwerpt het eerste product of de eerste dienst (start vanzelf bij de opening) en schrijft een openingsverhaal met keuzes.", "Verhaalbogen: om de paar maanden schrijft de GM een volgend hoofdstuk rond jouw bedrijf, met je echte producten, mensen, crew, rivalen en syndicaten. Je keuze bepaalt het volgende hoofdstuk; na 3 of 4 hoofdstukken sluit de boog af en begint er later een nieuwe.", "De engine bewaakt alle grenzen en gooit de dobbelstenen. Zonder live GM blijven de vaste gebeurtenissen en de keuzelijst onder Handmatig gewoon werken."]],
  ["3.2.1", "Eerlijker begin", ["Een startend bedrijf werd door facturen, gebeurtenissen, chaos, aanslagen, prijsoorlogen en beschermgeld net zo hard geraakt als een megacorporatie: gemiddeld €9,7M per maand buiten het maandresultaat om, terwijl een starter €5-8M netto verdient. Die posten schalen nu mee met je omzet (×0,35 tot ×2).", "Gevolg in de balanstest (40 spellen, Realistisch): de verstandige bot gaat niet meer binnen 2 jaar failliet en wint vaker (±43%), na gemiddeld ruim tien jaar."]],
  ["3.2", "Jij beschrijft, de GM ontwerpt", ["Iets nieuws maken begint nu met jouw eigen woorden: een product, een dienst, een abonnement of een netwerk. De GM ontwerpt het: naam, vorm, doelgroep, markt, kosten, duur, moeilijkheid, wat het per maand met de wereld doet, en 2 of 3 eigen verhaallijnen die later met juist dat ding gebeuren.", "De engine bewaakt de grenzen en gooit de dobbelstenen: kwaliteit kan niet hoger dan het geld toelaat, en de kans die je ziet is de echte.", "Abonnementen verouderen nauwelijks. De keuzemenu's van vroeger staan nog onder Handmatig, voor als de GM niet live is."]],
  ["3.1", "Spellen naast elkaar", ["Saveslots: bij Logboek → Spellen staan al je spellen. Wissel, hernoem of verwijder ze; elk spel heeft zijn eigen mail, chats en back-ups. Een nieuw spel beginnen gooit het oude niet meer weg uit beeld."]],
  ["3.0", "Af, levend en met een einde", ["Vraag en aanbod per soort product: oorlogen, bendeoorlogen, coups, virussen, sancties, de AI-wet en tijdperken schuiven de vraag; jouw aanbod en dat van rivalen drukken de prijs. Te zien bij Wereld → Markten en bij elk product.", "Producten krijgen bij de lancering een eigenschap (verslavend, cultstatus, duurzaam, slim, gepatenteerd, militaire specificatie, of slecht: goedkoop gemaakt, storingsgevoelig) en een eigen geschiedenis.", "Producten werken op de wereld: wapens maken syndicaten overal sterker, beveiliging drukt ze terug in je eigen gebied.", "Rivalen hebben een eigen productlijn: ze lanceren in markten met veel vraag, hun producten tellen mee in het aanbod en zijn te zien in hun dossier.", "Productcatalogus van de hele wereld (Wereld → Producten) en filteren op soort, ook in je eigen productlijn.", "Duidelijker: een Wat nu?-kaart met concrete volgende stappen, terugverdientijd bij uitbreidingen en vestigingen, de worp en echte kans bij elke keuze, en spelregels in het hulpvenster (?).", "Productkansen rechtgezet: vlaggenschepen waren met doel 9 bijna een loterij. Nu doel 6/7/8 en een geflopt groot product houdt meer populariteit over.", "Beter ontwikkelen: kies de soort en een focus (kwaliteit, snel, goedkoop, innovatief, veilig) en zie vooraf de kans op hit, gewoon, flop en terugroepactie, met de markt en het aantal concurrenten.", "Winnen kan: €8.000M bedrijfswaarde, 80% op drie continenten, of alle oorspronkelijke rivalen uitgeschakeld. Anders telt na 10 of 20 jaar je score (of speel eindeloos).", "Score en eindrapport bij elk einde, ook bij verlies, en een eregalerij. Na een overwinning kun je verder spelen.", "Gezondheid: per maand zie je waarom morale en heat bewegen, met een waarschuwing ruim voor de afgrond. Een coup of razzia vraagt nu twee slechte maanden op rij.", "Opslag: automatische back-up voor elke maand (laatste drie terug te zetten), exporteren en importeren, een melding als opslaan mislukt, en een waarschuwing bij twee tabbladen.", "Moeilijkheid raakt nu ook rivalen: rijker en agressiever op Genadeloos, rustiger op Casual.", "Rust in beeld: niets knippert meer, grotere kleine tekst, zichtbare focus, een schakelaar voor effecten en het intro alleen de eerste keer.", "Economie: hogere niveaus leveren iets minder extra op, uitbreidingen worden duurder, vestigingen ook naarmate je groter bent, progressieve winstbelasting (minder met geld offshore), en heat zakt sneller naarmate hij hoger is.", "Je start zonder producten. Per divisie een productiewachtrij van 3, en de Assistent kan productlijnen starten.", "Levende producten: elk product heeft een aard met eigen gevolgen (macht, heat, reputatie, invloed, zwart geld, facties), een prijsstrategie, een recensie en eigen gebeurtenissen: misbruik, bijwerkingen, datalekken, namaak, kopieën door rivalen, viraal gaan.", "Een fout gerepareerd waardoor de speeltijd na 48 maanden bleef staan: tijdperken, termijn en score werken nu over het hele spel.", "Meer concurrentie: vijf rivalen die allemaal groter beginnen dan jij, één in jouw sector en één op jouw continent, en ze breiden eerder uit. Genadeloos: kosten +15% in plaats van +30%, maar rivalen rijker en agressiever."]],
  ["2.1", "Producten en doelwit", ["Productlijn per divisie: je lineup met kwaliteit, populariteit en omzet. Nieuwe producten ontwikkelen in drie schalen, campagnes, nieuwe versies, uit de markt halen.", "Lanceringen kunnen een hit, een flop of een terugroepactie worden (2d6). Producten verouderen; rivalen lanceren ook.", "Projecten kunnen vertragen of mislukken: hogere kosten, langer wachten, of het geld kwijt.", "Je kunt doelwit worden: rivalen en syndicaten huren fixers en huurlingen in voor sabotage, datadiefstal, ontvoering, omkoping van je crew, inbraak bij R&D of laster. Met een speurder of fixer hoor je het vaak vooraf.", "Oprichting: zoom tot op landniveau en alle landen van het continent als knoppen, met hun startvoordeel."]],
  ["2.0", "Crew, tijd en dobbelstenen", ["De d100 is weg: elke worp is 2d6 + bonus tegen een doel. Twee zessen lukt altijd, twee enen nooit, en de getoonde kans is altijd de echte.", "Crew: specialisten op de loonlijst (netrunner, fixer, huurling, dealmaker, spindokter, speurder). Opdrachten kosten verder niets; wie slaagt, groeit in niveau.", "Klussen van fixers over de hele wereld: jouw crew doet het werk, jij krijgt het geld. Huurlegers voor een oorlog.", "Bijzondere wereldgebeurtenissen: beurskrach, blackout, AI-verdrag, poolroute, corporatieoorlog, cyberpsychose, de eerste orbitale fabriek.", "De wereld verandert: tijdperken, status van je bedrijf, opvolgers in je netwerk, nieuwe CEO's bij rivalen, startups en faillissementen.", "Veel acties goedkoper; een gesprek, gunst of crewopdracht kost niets."]],
  ["1.4", "Comfort en oprichting", ["De oprichting is fase 0 in het spel zelf: vier stappen in het spelscherm, met de kaart, kaartmodi en een samenvatting van waar je mee begint.", "Sneltoetsen: 1-9, 0 en − voor de tabs, N voor de volgende maand, A voor de Assistent, J/K door je mail, / zoeken, ? voor het overzicht.", "Esc sluit mail, chat en selecties. In de oprichting: Enter gaat verder, pijltjes wisselen van land.", "Syndicaten houden hun eigen thuisgebied in plaats van overal even sterk te worden."]],
  ["1.3", "Onderwereld", ["Elf syndicaten op de echte kaart, elk met een eigen gebied, leider en stijl.", "Bescherming afkopen, partner worden, geschenken sturen of ze uit je gebied verdrijven (d100).", "Afpersing komt als keuzemail met vier opties, bendeoorlogen raken de economie van een land.", "Kaartmodus Onderwereld en de bendeleiders als chatcontact."]],
  ["1.2", "Mensen", ["Nieuwe tab Mensen: relaties met je netwerk en je directie, met acties zonder Assistent (diner, cadeau, gunst, onder druk zetten).", "Elke relatie levert iets op: vanaf een drempel een gunst, en daarboven een vast voordeel.", "Directieleden geven bij hoge loyaliteit een bonus; laat ze natrekken om verraders te vinden.", "Keuzemails: opslag, interviews, cao's, klanten, klokkenluiders. Knoppen in de mail, de engine rekent het uit.", "Het koffie-mailtje van rivalen is nu een echte keuze met tegenbod."]],
  ["1.1", "Wereld", ["Nieuwe tab Wereld: wereldnieuws, een ranglijst van alle bedrijven met waarde en markten per sector.", "25 bedrijven verspreid over de wereld: zakendiner, leveringscontract, aandelen met dividend of een overname.", "Gebeurtenissen per land en continent (stormen, staatsgrepen, handelsakkoorden) veranderen tijdelijk wat gebieden opleveren.", "Startvoordeel per soort land, een eigen stad voor je hoofdkantoor, en per gebied op de kaart: wat het oplevert.", "Geruchten en marktberichten staan in het nieuws in plaats van in je inbox."]],
  ["1.0", "Echte wereld", ["Echte wereldkaart, dominantie per continent en zee, eskaders, rivalen met oorlog en handel, blijvende inkomstenbronnen."]],
];
const PLANNING = [["6.4", "Opruimen en een echte speelronde verwerken: jouw feedback gaat voor."]];
function versieCard(){
  const vrs = ([v, t, l]) => `<div style="margin:8px 0"><b class="mono" style="color:var(--cyan)">${v}</b> <b>${esc(t)}</b><ul class="ylist">${l.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  return `<div class="card" style="margin-top:16px"><h3>Versies</h3>${VERSIES.slice(0, 2).map(vrs).join("")}<details><summary class="muted" style="cursor:pointer;margin:6px 0">Oudere versies (${VERSIES.length - 2})</summary>${VERSIES.slice(2).map(vrs).join("")}</details>
    <h3 style="margin-top:12px">Gepland</h3><ul class="ylist">${PLANNING.map(([v, t]) => `<li><b class="mono">${v}</b> ${esc(t)}</li>`).join("")}</ul></div>`;
}
function spark(h){ if (!h || h.length < 2) return ""; const mx = Math.max(...h), mn = Math.min(...h), w = 80, ht = 22;
  return `<svg width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}" aria-hidden="true"><polyline fill="none" stroke="var(--cyan)" stroke-width="1.5" points="${h.map((v, i) => `${Math.round(i / (h.length - 1) * w)},${Math.round(ht - 2 - (v - mn) / Math.max(1, mx - mn) * (ht - 4))}`).join(" ")}"/></svg>`; }

/* ---- views ---- */
Object.assign(VIEWS, {
mensen(){
  const st = S.state, M = st.mensen;
  const lvl = v => v >= 50 ? "bondgenoot" : v >= 25 ? "warm" : v > -15 ? "neutraal" : v > -50 ? "koel" : "vijandig";
  return `<h1>Mensen</h1>
  <p class="muted" style="margin:-4px 0 14px">Relaties leveren iets op. Een diner of cadeau bouwt op, een gunst kost relatie maar levert direct iets, en vanaf een drempel krijg je een vast voordeel. Eén actie per persoon per maand. Voor alles wat hier niet staat: chat met ze.</p>
  ${st.keuzes.length ? `<h2>Wacht op uw keuze</h2><div class="grid g2">${st.keuzes.map(k => keuzeCard(k)).join("")}</div>` : ""}
  ${ceoCard()}
  ${assistentCard()}

function crewVM(s){
  const m0 = ym(s);
  const crew = (s.crew || []).map(m => ({...m, label: CREW_ROLLEN[m.rol].label, status: crewStatus(s, m), traitNaam: traitOf(m.trait).naam, traitTekst: traitOf(m.trait).tekst, xpNodig: 3 + m.niveau * 3,
    missies: MISSIES.filter(ms => ms.rol === m.rol && (ms.doelwit !== "oorlog" || atWar(s).length)).map(ms => { const opts = ms.doelwit ? missieDoelwitten(s, ms) : null;
      const t0 = opts && opts.length ? missieTarget(s, ms, opts[0].id) : true, b = ms.doel ? missieBonus(s, m, ms, t0) : 0;
      return {id: ms.id, label: ms.label, uitleg: ms.uitleg, doel: ms.doel, bonus: b, kans: ms.doel ? kans2d6(b, ms.doel, m.trait === "slordig") : 100, opts, gevaar: !!ms.gevaar}; })}));
  const klussen = (s.klussen || []).map(k => ({...k, label: CREW_ROLLEN[k.rol].label, wie: crew.filter(m => m.rol === k.rol).map(m => ({id: m.id, naam: m.naam, vrij: m.status === "vrij", kans: kans2d6(crewBonus(s, m, k.gevaar), k.doel, m.trait === "slordig")}))}));
  return {crew, klussen, markt: (s.huurmarkt || []).map(k => ({...k, label: CREW_ROLLEN[k.rol].label, traitNaam: traitOf(k.trait).naam, traitTekst: traitOf(k.trait).tekst})), max: crewMax(s),
    loon: r1((s.crew || []).reduce((a, m) => a + m.loon, 0)), legers: HUURLEGERS.map(h => ({...h, loon: legerLoon(s, h)})), leger: s.huurleger, m: m0};
}
function tijdVM(s){
  const i = s.tijdperk || 0, T = TIJDPERKEN[i], N = TIJDPERKEN[i + 1], st = s.statusNiveau || 0, v = playerValue(s), nx = STATUS_LADDER[st + 1];
  return {tijdperk: T.naam, tekst: T.tekst, volgende: N ? {naam: N.naam, over: Math.max(0, N.vanaf - maandenGespeeld(s))} : null, status: STATUS_LADDER[st][1], waarde: v,
    volgendeStatus: nx ? {naam: nx[1], min: nx[0], pct: Math.round(clamp((v - STATUS_LADDER[st][0]) / (nx[0] - STATUS_LADDER[st][0]) * 100, 0, 100))} : null,
    special: Math.max(0, (s.flags.volgende_special ?? 7) - maandenGespeeld(s))};
}

  const T = st.tijd;

function tekstModal(titel, uitleg, tekst, knop){
  return new Promise(res => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="${esc(titel)}" style="max-width:640px;width:100%"><h2>${esc(titel)}</h2><p class="muted" style="margin:0 0 10px">${esc(uitleg)}</p>
      <textarea id="tm_txt" style="min-height:220px;width:100%;font:13px var(--mono)" ${tekst != null ? "readonly" : 'placeholder="Plak hier de tekst van je export"'}>${tekst != null ? esc(tekst) : ""}</textarea>
      <div class="row" style="justify-content:flex-end;margin-top:10px">${tekst != null ? '<button class="btn" data-x="kopie">Kopiëren</button><button class="btn" data-x="dl">Downloaden</button>' : ""}<button class="btn" data-x="0">Sluiten</button>${knop ? `<button class="btn primary" data-x="1">${esc(knop)}</button>` : ""}</div></div>`;
    const done = v => { m.remove(); res(v); };
    m.addEventListener("click", async e => { const b = e.target.closest("[data-x]"); if (!b) return; const ta = m.querySelector("#tm_txt");
      if (b.dataset.x === "kopie"){ ta.select(); try { await navigator.clipboard.writeText(ta.value); toast("Gekopieerd."); } catch(_){ try { document.execCommand("copy"); toast("Gekopieerd."); } catch(__){ toast("Kopiëren lukt hier niet: selecteer de tekst en kopieer zelf.", true); } } return; }
      if (b.dataset.x === "dl"){ let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(_){}
        if (!dl) return toast("Downloaden kan hier niet: gebruik Kopiëren.", true);
        try { await dl.save({filename: `chrome-ledger-${(G.game && G.game.player.corp_name || "spel").replace(/[^a-z0-9]+/gi, "-")}.json`, data: ta.value}); toast("Opgeslagen."); }
        catch(err){ if (!err || err.code !== "declined") toast(err && err.code === "rate_limited" ? "Er staat al een download klaar. Probeer het zo opnieuw." : "Downloaden lukte niet: gebruik Kopiëren.", true); } return; }
      done(b.dataset.x === "1" ? ta.value : null); });
    document.body.appendChild(m); m.querySelector("#tm_txt").focus();
  });
}

  const seas = M.zones.map(z => { const me = z.shares.find(x => x.o === "player"), pct = me ? me.pct : 0, sterk = (st.zeeSterkte || {})[z.id] || 0, t = sterk >= SEA_MIN ? tierOf(pct, SEA_TIERS) : null; return {z, pct, t, sterk}; }).filter(x => x.pct > 0 || x.z.dominant);
  return `<div class="card"><h3>Dominantie</h3>
    <div class="row" style="gap:22px;margin:4px 0 6px"><div><div class="kpi">PER BEURT</div><div class="big" style="color:var(--green)">+€${D.geld}M</div></div>

    <h2 style="margin-top:14px">Invloed besteden</h2>
    ${Object.entries(st.invloedActies).map(([key, a]) => `<div class="opt"><div><div class="t">${esc(a.label)} · ${a.kost}</div><div class="u">${esc(a.uitleg)}${key === "vergunning" && st.vergunning ? " (klaar voor gebruik)" : ""}</div></div>
      <div class="row" style="flex-wrap:nowrap">${key === "lobby" ? `<select id="infl-fac" aria-label="factie">${st.factieNamen.map(f => `<option>${esc(f)}</option>`).join("")}</select>` : key === "diplomatie" ? `<select id="infl-riv" aria-label="rivaal">${st.rivaalNamen.map(f => `<option>${esc(f)}</option>`).join("")}</select>` : ""}
      <button class="btn sm" data-a="infl" data-k="${key}" ${st.invloed >= a.kost ? "" : "disabled"}>Inzetten</button></div></div>`).join("")}
  </div>`;
}

function domBar(dom){
  return `<div class="dombar" role="img" aria-label="Wie de stad beheerst">${dom.map(o => `<i style="width:${o.pct}%;background:${o.kleur}" title="${esc(o.naam)} ${o.pct}%"></i>`).join("")}</div>

}

const NAVKEYS = ["overzicht", "inbox", "comms", "mensen", "crew", "wereld", "kaart", "bedrijf", "financien", "rivalen", "onderwereld", "logboek"];
const HOTKEYS = [["1 – 9, 0, −, =", "Naar tab 1 tot 12 (de nummers staan in het menu)"], ["N", "Volgende maand"], ["A", "Assistent openen"], ["G", "De GM openen of sluiten, op elk scherm"], ["/", "Zoeken in de inbox"],

  ["Esc", "Sluiten: mail, chat, selectie of dit venster"], ["?", "Dit overzicht"]];
function helpOverlay(){
  return `<div class="helpov" data-a="help"><div class="box" role="dialog" aria-modal="true" aria-label="Sneltoetsen"><div class="spread"><h2 style="margin:0">Sneltoetsen</h2><button class="btn sm" data-a="help">Esc</button></div>
    <dl class="kv" style="margin-top:12px">${HOTKEYS.map(([k2, t]) => `<dt><kbd>${esc(k2)}</kbd></dt><dd style="font-family:var(--sans)">${esc(t)}</dd>`).join("")}</dl>
    <h2 style="margin:16px 0 6px">Spelregels in het kort</h2><dl class="kv regels">${SPELREGELS.map(([k3, t3]) => `<dt>${esc(k3)}</dt><dd style="font-family:var(--sans)">${esc(t3)}</dd>`).join("")}</dl>
    <p class="dim" style="font-size:13px;margin:12px 0 0">Sneltoetsen werken niet terwijl je typt. In de oprichting: 1-4 kiest een stap, Enter gaat verder, pijltjes wisselen van land.</p></div></div>`;
}
function goView(v){ S.view = v; localSet("view", v); S.mailBody = v === "inbox" ? S.mailBody : null; render(); document.getElementById("main")?.scrollTo(0, 0); }
document.addEventListener("keydown", e => { if (S.menuOpen){ if (e.key === "Escape") sluitMenu(); return; }
  const tg = e.target, typing = tg && (/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName) || tg.isContentEditable);
  if (document.querySelector(".modal")) return;
  if (e.key === "Escape"){
    if (S.help){ S.help = false; render(); return; }
    if (typing){ tg.blur(); return; }
    if (S.compose || S.mailBody){ S.compose = null; S.mailBody = null; render(); return; }
    if (S.gmDock){ S.gmDock = false; render(); return; }
    if (S.chatOpen){ S.chatOpen = false; render(); return; }
    if (S.dist || S.zone || S.bedrijf){ S.dist = S.zone = S.bedrijf = null; render(); }
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || S.busy) return;
  const st = S.state; if (!st) return;
  if (!st.setup_done){
    if (/^[1-4]$/.test(e.key)){ S.sstep = +e.key - 1; render(); }
    else if (e.key === "Enter"){ e.preventDefault(); document.querySelector('header [data-a="snext"],header [data-a="setup"]')?.click(); }

    return;
  }
  const k2 = e.key.length === 1 ? e.key.toLowerCase() : e.key;

  if (k2 === "="){ goView("logboek"); return; }

  if (k2 === "/"){ e.preventDefault(); if (S.view !== "inbox") goView("inbox"); document.getElementById("q")?.focus(); return; }
  if (k2 === "c"){ e.preventDefault(); document.querySelector('[data-a="compose"]') ? document.querySelector('[data-a="compose"]').click() : (goView("inbox"), document.querySelector('[data-a="compose"]')?.click()); return; }
  if (S.view === "inbox" && (k2 === "j" || k2 === "k")){
    const els = [...document.querySelectorAll(".mails .mail")]; if (!els.length) return;
    let i = els.findIndex(x => x.classList.contains("sel")); i = i < 0 ? 0 : clamp(i + (k2 === "j" ? 1 : -1), 0, els.length - 1);
    openMail(els[i].dataset.open); return; }

  if (S.view === "inbox" && S.mailBody && k2 === "e"){ document.querySelector('[data-a="archive"]')?.click(); return; }
  if (S.view === "kaart" && k2 === "m"){ const modes = ["politiek", "dominantie", "zee", "economie", "onderwereld"]; S.mapmode = modes[(modes.indexOf(S.mapmode || "politiek") + 1) % modes.length]; render(); return; }
});

    case "archive": { const m = S.state.mails.find(m=>m.id===S.mailBody.id); await act("/api/mail/flag", {ids:[S.mailBody.id], soort:"archief", waarde:!m.archief}, {silent:true}); S.mailBody = null; render(); return; }

    case "district": if (!await ask("Vestiging openen?", "Het geld gaat er nu af. Het duurt 3 maanden.", "Openen")) return; return act("/api/project", {soort:"district", id:t.dataset.id});

      S.view = "comms"; S.chat = "gm"; S.chatOpen = true; render(); chatSend("gm", `[District ${d.id} ${d.naam}] ${txt}`); return; }
    case "upgrade": if (!await ask("Divisie uitbreiden?", "Het geld gaat er nu af. Het duurt 2 maanden.", "Uitbreiden")) return; return act("/api/project", {soort:"upgrade", divisie:t.dataset.div});
    case "newdiv": return act("/api/project", {soort:"divisie", type: val("ndtype"), naam: val("ndname")});
    case "transfer": return act("/api/geld", {soort:"transfer", van:val("tvan"), naar:val("tnaar"), bedrag:val("tbedrag")});
    case "lening": return act("/api/geld", {soort:"lening", bedrag:val("lbedrag")});
    case "aflossen": return act("/api/geld", {soort:"aflossen", bedrag:val("lbedrag") || S.state.schuld});
    case "autopay": return act("/api/factuur", {alles: !S.state.auto_pay});
    case "pay": return act("/api/factuur", {id:t.dataset.id, actie:"betaal"});
    case "hold": return act("/api/factuur", {id:t.dataset.id, actie:"toggle"});
    case "rivalorder": { S.view = "comms"; S.chat = "gm"; S.chatOpen = true; render(); const ta = document.getElementById("chattxt"); if (ta){ ta.value = `${t.dataset.naam}: `; ta.focus(); } return; }
    case "nieuw": if (!await ask("Nieuw spel beginnen?", "Je huidige bedrijf blijft bewaard: je vindt het terug bij Logboek → Spellen en kunt er altijd naar terugwisselen.", "Nieuw spel")) return; S.setup = null; S.sstep = 0; return act("/api/nieuw", {zeker:true});
    case "setup": {
      if (!S.setup.corp_name.trim()){ S.sstep = 1; render(); document.querySelector("[data-f=corp_name]")?.focus(); return toast("Geef je bedrijf een naam.", true); }
      const d0 = {...S.setup, eigen: S.setup.eigen_naam.trim() ? {naam: S.setup.eigen_naam, omschrijving: S.setup.eigen_omschrijving, profiel: S.setup.eigen_profiel} : null};
      const r = await act("/api/setup", d0); if (r && r.ok){ localSet("setup", ""); S.sstep = 0; S.view = "inbox"; localSet("view","inbox"); render(); setTimeout(() => { if (tourNodig()) toonTour(0); }, 400); }

});

  if (t && t.dataset && t.dataset.shsfile && t.files && t.files[0]){ const f = t.files[0], rd = new FileReader(); rd.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement("canvas"); c.width = c.height = 96; const g = c.getContext("2d"), k = Math.min(96 / img.width, 96 / img.height), w = img.width * k, hh = img.height * k; g.drawImage(img, (96 - w) / 2, (96 - hh) / 2, w, hh); setupHs().logo = {soort: "png", data: c.toDataURL("image/png")}; bewaarSetup(); render(); }; img.src = rd.result; }; rd.readAsDataURL(f); return; }

  if (t && t.dataset && t.dataset.hsfile && t.files && t.files[0]){ S.hsOpen = true; const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement("canvas"); c.width = c.height = 96; const g = c.getContext("2d"), sc = Math.min(96 / img.width, 96 / img.height), w = img.width * sc, hh = img.height * sc; g.drawImage(img, (96 - w) / 2, (96 - hh) / 2, w, hh); act("/api/huisstijl", {logo: {soort: "png", data: c.toDataURL("image/png")}}); }; img.onerror = () => toast("Dat bestand kon niet als afbeelding gelezen worden.", true); img.src = fr.result; }; fr.readAsDataURL(t.files[0]); return; }
  if (t && t.dataset && t.dataset.dev){ (S.devSel ??= {})[t.dataset.dev] = {...((S.devSel || {})[t.dataset.dev] || {}), [t.dataset.k]: t.value}; render(); } });
document.addEventListener("keydown", e => {
