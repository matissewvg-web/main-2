  ["4.4", "Ontwerpen voor je klanten", ["Bij een nieuw product kies je een nadruk in het ontwerp: één eigenschap krijgt +2, de volgende −1. Nadruk op Veiligheid bij een medisch product verkoopt meer aan ziekenhuizen en minder aan rijke particulieren (die op herstel letten). Het formulier zegt vooraf wie er meer en minder koopt.", "Klantsegmenten vergelijken je product nu ook met wat rivalen in dezelfde markt verkopen: scoor je beter dan hun gemiddelde op wat een segment belangrijk vindt, dan koopt dat segment meer bij jou; tegen sterke rivalen minder. Bij Details → Klanten staat het gemiddelde van de rivalen naast je eigen score, en bij aanwijzen het sterkste product.", "Balans (verstandige bot, Realistisch, 150 spellen): 47% winst, vorige ronde 45%: binnen de ruis. De bot kiest geen nadruk."]],
  ["4.3.4", "Opruimen: eerlijkere laster, rustiger scherm", ["Lastercampagnes komen alleen nog van je echte concurrent (de rivaal in jouw sector) of van een rivaal waarmee je oorlog voert. Eerder kon elke rivaal je zomaar zwartmaken: in een testrun van twee jaar kostte dat gemiddeld 12 reputatie zonder dat je iets fout deed.", "Het advies bij een zakkende reputatie noemt nu de echte oorzaak. Komt het door laster, dan staat dat er. Verklaart laster maar een deel, dan zegt het dat de rest onduidelijk is. Eerder wees het altijd naar een lek in je directie, ook als er geen was.", "Omdat laster minder vaak voorkomt, werd het spel makkelijker (verstandige bot 43% → 55%). Daarom gaat de winstdrempel licht omhoog: €11.000k bij 20 jaar (was €10.400k), €6.400k bij 10 jaar, €15.200k eindeloos. Gemeten: Realistisch 45% (150 spellen), Casual 78%, Genadeloos 8% (100).", "De uitleg bij Productlijn is ingeklapt onder Hoe werken producten?, in korte punten in plaats van een lap tekst.", "Marktaandeel bij een divisie toonde ~9%, wat er in dit lettertype uitzag als −9%. Nu staat er gewoon 9%.", "Een test die af en toe faalde op een blunderworp (dubbel 1 is altijd mis, ook bij 99% kans) gebruikt nu vaste dobbelstenen."]],
  ["4.3.3", "Klanten en echte aantallen", ["Elk soort product heeft drie klantsegmenten met een eigen deel van de markt, een eigen prijsgevoeligheid en één eigenschap waar ze op letten. Medisch: ziekenhuizen (veiligheid), rijke particulieren (herstel, betalen bijna alles) en straatklinieken (werkzaamheid, letten sterk op de prijs). Wapens: legers, bendes en particulieren. Logistiek: webwinkels, industrie en overheid. Enzovoort.", "Blinkt je product uit in wat een segment wil, dan koopt dat segment meer. De prijs verschuift wie er koopt: duur houdt de koopkrachtige klanten over, goedkoop trekt de prijsbewuste aan. Te zien bij Details → Klanten.", "Producten dragen meer van de omzet (bij de bot 38% van de divisie-omzet, was 32%), maar productie is duurder: 45% van de omzet bij de standaardprijs in plaats van 40%. Netto verdient een product iets meer dan in 4.3.2.", "Realistischer aantallen: een zending kost €9 (was €38), een dosis €20, een licentie €6, een consumentenproduct €12. Een logistiek product verkoopt nu honderden zendingen per maand in plaats van een paar dozijn.", "Balans (verstandige bot, Realistisch, 150 spellen): 43% winst, nulmeting dezelfde avond 41%."]],
  ["4.3.2", "Zelf je prijs bepalen", ["Elk product heeft een prijsschuif (Details → Prijs): van 60% tot 180% van de standaardprijs, met meteen te zien wat dat doet met prijs per stuk, vraag, omzet en wat er na productie overblijft. Pas met Deze prijs instellen verandert er iets.", "Prijsgevoeligheid per markt: consumentenspullen en logistiek verkopen veel minder als ze duurder worden, medische producten, beveiliging en orbitale vracht nauwelijks. Hogere kwaliteit maakt klanten minder gevoelig.", "De kostprijs per stuk ligt vast, dus een hogere prijs geeft meer marge per stuk en een lagere prijs meer afzet. Ben je uitverkocht, dan kost een hogere prijs je niets: die klanten kon je toch niet leveren.", "De knop Meeste winst nu rekent de beste prijs voor deze maand uit. Abonnementen: duurder betekent minder nieuwe abonnees en meer opzeggers, en een verhoging kost meteen abonnees. Boven 150% kost het reputatie (woekerprijzen). Budget, Standaard en Premium blijven als snelknoppen (80%, 100%, 135%).", "Balans (verstandige bot, Realistisch, 150 spellen): 42% winst, voor de wijziging 44%: binnen de ruis. De bot gebruikt de schuif niet; een speler die goed prijst verdient meer."]],
  ["4.3", "Producten verdienen echt, minder ruis", ["Na een playtest: producten leverden te weinig op tegenover sabotage en gebeurtenissen. Elk product levert nu zijn eigen omzet (kwaliteit × populariteit × prijs × vraag, meer bij een grotere divisie), meestal €5-20k per maand, en kost 40% daarvan aan productie (sinds 4.3.3: 45%). In het maandrapport staat het per divisie als eigen regel, in de productlijn per product met omzet en wat er na productie overblijft.", "Minder ruis: wereldgebeurtenissen 40% minder vaak, chaosmails bijna half zo vaak, kleine keuzes (interviews, tips, sponsorverzoeken, cao, klanten) hoogstens één per twee maanden, minder en kleinere aanslagen, en een syndicaat stuurt hoogstens eens per vier maanden een rekening of overvalt je. Gewone meldingen (lanceringen, berichten van rivalen, kleine incidenten) staan onderaan het maandrapport; in je inbox komt alleen wat echt aandacht vraagt.", "Een eigen bedrijfssoort bij de oprichting is je enige startdivisie (geen Logistiek meer ernaast), en Engelse namen zoals weapon of security worden herkend."]],
  ["4.2", "Levende bedrijvenwereld", ["De bedrijven in de wereld leven nu elke maand: nieuwe bedrijven worden opgericht (met namen die bij hun sector passen), zwakke bedrijven gaan na drie slechte maanden failliet, bedrijven fuseren, krijgen een nieuwe naam of CEO, gaan naar de beurs of belanden in een schandaal. Alles verschijnt in het wereldnieuws.", "Elk bedrijf heeft een eigen koers (groeit hard, groeit, krimpt, krimpt hard) en een geschiedenis op zijn kaart. Bij Wereld → Bedrijven zie je hoeveel er dit jaar bijkwamen en omvielen.", "Heb je een belang of contract, dan merk je het: bij een fusie wordt je belang uitgekocht en loopt je contract door bij het nieuwe bedrijf, bij een nieuwe naam verhuist je contract mee, bij een faillissement ben je het kwijt."]],
  ["4.1.2", "Eerlijkere lanceringen", ["Een lancering heeft nu vijf uitkomsten: hit, gewoon, matig, flop en terugroepactie. Een hit valt vanaf je doel + 3 (populariteit 72-82) en altijd bij twee zessen (85 en een kwaliteitspunt extra), een matige start (populariteit 38-50, geen kwaliteitsverlies) net onder je doel, en een flop pas als je ruim mist.", "Omdat er nu veel minder flops zijn, is de winstdrempel hoger: €10.400k bij 20 jaar (€6.000k bij 10 jaar, €14.400k eindeloos). Daardoor is de flopkans nooit meer dan 50%, ook niet bij het moeilijkste ontwerp. Een gewoon klein product: hit ±42%, geen flop (alleen 3% kans op een terugroepactie). Het moeilijkste ontwerp: hit 3%, matig 42%, flop 39%."]],
  ["4.1.1", "Wat is er nieuw", ["Een kaart in het overzicht toont wat er nieuw is sinds je vorige bezoek, met per versie de belangrijkste verandering. Klik Gelezen om hem weg te halen."]],
  ["4.1", "Balans na de nieuwe onderdelen", ["Koersen, aanloop en uitbreidbare capaciteit maakten het spel makkelijker: de testbot won op Realistisch 46%. De winstdrempel is 10% hoger (€8.800k bij 20 jaar, €5.200k bij 10 jaar, €12.800k eindeloos) en de eerste strategiedag komt na een jaar. Gemeten: Realistisch 34%, Casual 86%, Genadeloos 11%.", "Productiecapaciteit is bij de start krapper: een goede lancering kan nu al uitverkopen, en uitbreiden is een echte keuze."]],
  ["4.0", "Echte producten", ["Elk product heeft een productblad (knop Details): drie eigenschappen die bij de soort horen (een wapen heeft vuurkracht, betrouwbaarheid en onopvallendheid; een medisch product werkzaamheid, veiligheid en herstel), prijs per stuk, kostprijs en marge, afzet per maand, levensfase en de omzet van de laatste twaalf maanden.", "Marktaandeel in je eigen segment, met de grootste concurrenten van rivalen erbij.", "Productiecapaciteit is een echte grens: is de vraag groter dan wat je kunt maken, dan ben je uitverkocht en mis je die omzet. Uitbreiden kost geld en groeit mee met je divisie.", "Eerlijk: prijs, kostprijs en afzet zijn in 4.0 een uitsplitsing van de bestaande productomzet. Echte afzet maal prijs, met een vrij instelbare prijs, komt in 4.2."]],
  ["3.10", "Koers en aanloop", ["Bedrijfsfocus: eens per jaar (de eerste keer na een jaar, sinds 4.1) een strategiedag. Je kiest uit drie koersen er één die blijft: Lean, Juristen in huis, Merkbouwer, Talentmagneet, Snelle R&D, Abonnementshuis of Huisbankier. Je koers staat bovenaan bij Bedrijf.", "Aanloop: in je eerste half jaar vertrekt niemand uit je directie, en in je eerste jaar wordt niemand verrader. In een testrun begon iemand al in maand 4 te lekken, voor je je mensen kende."]],
  ["3.9.2", "Na een speelronde van twee jaar", ["Wat nu? waarschuwt als je reputatie maanden achter elkaar zakt terwijl journalisten interne stukken citeren: misschien lekt iemand uit je directie, en een speurder kan dat uitzoeken. In een testrun zakte de reputatie ongemerkt van 30 naar 10.", "Is je cash negatief, dan zegt Wat nu? hoeveel maanden je nog hebt tot het faillissement en waar je snel geld vandaan haalt.", "Mail ouder dan zes maanden zonder open keuze gaat vanzelf naar het archief."]],
  ["3.9.1", "Online getest, late druk", ["De online opslag (zoals in claude.ai) heeft nu een eigen test met een nagebootste database: compacte saves, geen eindeloze save-lus, herladen, back-ups, inbox opruimen, spellen wisselen en chats. Alles slaagde.", "Lonen stijgen 6% per tijdperk, zodat ook een groot bedrijf in de late game moet blijven opletten."]],
  ["3.9", "Abonnementen en dochters", ["Abonnementen: een loyaliteitsprogramma (vaste kosten per maand, minder opzeggers), een prijsverhoging kost meteen 8% van je abonnees, en soms lokt een concurrent je abonnees weg: tegenbod, gratis maand of laten gaan.", "Je dochters: overgenomen bedrijven die als dochter draaien staan nu bovenaan bij Bedrijf. Je kunt ze later alsnog opnemen in je bedrijf of verkopen voor 90% van hun waarde."]],
  ["3.8.1", "Opruimen", ["Oude maandrapporten (alles behalve de laatste drie) en keuzemails die al beslist zijn, gaan vanzelf naar het archief. De inbox blijft over wat nog aandacht vraagt.", "Op een breed scherm schuift de inhoud opzij als het GM-venster open is, zodat het niet over de kaart of het zijpaneel valt.", "Casual: divisies trekken 10% minder heat, zodat een razzia op het makkelijkste niveau zeldzamer is."]],
  ["3.8", "Plannen tegen jou", ["Rivalen en syndicaten bouwen nu over maanden iets tegen je op: een prijsoorlog, je mensen wegkopen, een lastercampagne, je leveringscontract afpakken of (syndicaten) een aanslag op je depots. Elk plan heeft drie stappen, twee maanden per stap.", "Met een speurder of fixer in je crew, of een goede band met je fixer, ontdek je een plan vaker op tijd. Dan kies je: verstoren (kost geld, met een kans), voorbereiden (de klap is half zo groot) of laten gebeuren. Bekende plannen staan bovenaan bij Rivalen, met elke stap.", "Is de GM live, dan schrijft hij titel, stappen en motief op maat, met wat de rivaal over je onthoudt. De effecten liggen vast in de engine."]],
  ["3.7.1", "De GM antwoordt altijd", ["Snelknoppen in het GM-venster: Wat nu?, Vat mijn maand samen, Hoe sta ik ervoor? en Wat kost het om… Is de GM niet live, dan antwoordt het spel zelf uit de cijfers, zodat de knoppen altijd iets opleveren.", "Kaart: namen die elkaar raken worden weggelaten (je eigen gebieden en de geselecteerde eerst); inzoomen maakt de letters kleiner zodat er meer namen passen. Gebieden zijn met Tab en Enter te bedienen.", "Wat nu? herhaalt niet meer wat Eerste stappen al zegt."]],
  ["3.7", "Rust en eerste stappen", ["Een kaart Eerste stappen in het overzicht: vijf concrete dingen voor je eerste maanden (eerste product, crew aan het werk, een contract, de GM iets vragen, je eerste maand), met een knop naar de juiste plek. Ze verdwijnt als alles af is, of met Verbergen.", "Kleine meldingen (stroomstoringen, marktgeruchten, konvooien, kleine incidenten) komen niet meer als losse mail maar onderaan het maandrapport onder Ook deze maand.", "Telefoon: de statusbalk is een raster van drie kolommen in plaats van een rij die afkapt, en tekst op een geselecteerde chip blijft leesbaar."]],
  ["3.6", "Opslag die niet stil faalt", ["Saves zijn ongeveer 75% kleiner: de wereldkaart wordt bij het laden opnieuw opgebouwd in plaats van elke maand mee bewaard. Daardoor passen er veel meer spellen en back-ups in je browser.", "Een mislukte back-up meldt zich nu luid (melding en opslagkaart) in plaats van stil te falen.", "Maximaal 6 spellen in de browser, met een duidelijke melding. Kan je huidige spel niet apart bewaard worden, dan start er geen nieuw spel, zodat je nooit iets kwijtraakt.", "Foutlog onder Logboek → Opslag: vangnetten die vroeger fouten stil inslikten, schrijven ze nu op."]],
  ["3.5", "Druk uit de wereld", ["Heat komt vooral uit riskante en illegale divisies: legale divisies (Biotech, Logistiek, Media & Data, Financieel) trekken boven niveau 6 geen extra aandacht meer. Een groot legaal bedrijf werd vroeger vroeg of laat onvermijdelijk opgepakt.", "Stilstand kost klanten: verkoopt een divisie een jaar lang niets, dan zakt haar omzet elke maand verder, tot −20%, en krijg je daar een mail over. Niets doen is daardoor ook op Casual niet meer veilig.", "Meldingen verschijnen boven de GM-knop in plaats van eroverheen."]],
  ["3.4", "Eerlijk einde", ["De winst hangt af van je speellengte: €4.800k bij 10 jaar, €8.000k bij 20 jaar, €12.000k eindeloos.", "Hegemonie is nu 60% op drie continenten en de Marktmeester schakelt 3 van de 5 oorspronkelijke rivalen uit: in de tests was de economische overwinning de enige die ooit viel.", "Score: bedrijfswaarde telt met de wortel, zodat dominantie, reputatie, jaren en rivalen echt meewegen. Snel winnen geeft tempopunten. Wie verliest, verliest ook de waarde van zijn bedrijf en krijgt ×0,75: een verlies scoort nooit meer dan overleven."]],
  ["3.3.1", "Na de playtest", ["Abonnementen draaien op abonnees in plaats van populariteit: aantrekkingskracht bepaalt hoeveel klanten er bijkomen, kwaliteit en prijs hoeveel er opzeggen. Ze groeien trager maar blijven. Ook bij Handmatig kun je nu een abonnement kiezen.", "Overnames: vooraf zie je wat je krijgt, en na een geslaagd bod kies je zelf hoe je het koppelt: samenvoegen met je divisie, een eigen divisie, als dochter laten draaien of opknippen en verkopen. Een overgenomen bedrijf brengt zijn bestseller mee.", "Een lege divisie legt uit hoe ze geld maakt en geeft twee startideeën met één klik: snel een veilig product, of een abonnement opbouwen.", "De GM zit op elk scherm: de knop GM rechtsonder (of toets G) opent het gesprek zonder dat je je scherm verlaat."]],
  ["3.3", "De GM ontwerpt en vertelt", ["Een nieuwe divisie of eigen bedrijfstak beschrijf je in je eigen woorden. De GM kiest een bestaande soort of verzint een nieuwe met eigen cijfers, ontwerpt het eerste product of de eerste dienst (start vanzelf bij de opening) en schrijft een openingsverhaal met keuzes.", "Verhaalbogen: om de paar maanden schrijft de GM een volgend hoofdstuk rond jouw bedrijf, met je echte producten, mensen, crew, rivalen en syndicaten. Je keuze bepaalt het volgende hoofdstuk; na 3 of 4 hoofdstukken sluit de boog af en begint er later een nieuwe.", "De engine bewaakt alle grenzen en gooit de dobbelstenen. Zonder live GM blijven de vaste gebeurtenissen en de keuzelijst onder Handmatig gewoon werken."]],
  ["3.2.1", "Eerlijker begin", ["Een startend bedrijf werd door facturen, gebeurtenissen, chaos, aanslagen, prijsoorlogen en beschermgeld net zo hard geraakt als een megacorporatie: gemiddeld €9,7k per maand buiten het maandresultaat om, terwijl een starter €5-8k netto verdient. Die posten schalen nu mee met je omzet (×0,35 tot ×2).", "Gevolg in de balanstest (40 spellen, Realistisch): de verstandige bot gaat niet meer binnen 2 jaar failliet en wint vaker (±43%), na gemiddeld ruim tien jaar."]],
  ["3.2", "Jij beschrijft, de GM ontwerpt", ["Iets nieuws maken begint nu met jouw eigen woorden: een product, een dienst, een abonnement of een netwerk. De GM ontwerpt het: naam, vorm, doelgroep, markt, kosten, duur, moeilijkheid, wat het per maand met de wereld doet, en 2 of 3 eigen verhaallijnen die later met juist dat ding gebeuren.", "De engine bewaakt de grenzen en gooit de dobbelstenen: kwaliteit kan niet hoger dan het geld toelaat, en de kans die je ziet is de echte.", "Abonnementen verouderen nauwelijks. De keuzemenu's van vroeger staan nog onder Handmatig, voor als de GM niet live is."]],
  ["3.1", "Spellen naast elkaar", ["Saveslots: bij Logboek → Spellen staan al je spellen. Wissel, hernoem of verwijder ze; elk spel heeft zijn eigen mail, chats en back-ups. Een nieuw spel beginnen gooit het oude niet meer weg uit beeld."]],
  ["3.0", "Af, levend en met een einde", ["Vraag en aanbod per soort product: oorlogen, bendeoorlogen, coups, virussen, sancties, de AI-wet en tijdperken schuiven de vraag; jouw aanbod en dat van rivalen drukken de prijs. Te zien bij Wereld → Markten en bij elk product.", "Producten krijgen bij de lancering een eigenschap (verslavend, cultstatus, duurzaam, slim, gepatenteerd, militaire specificatie, of slecht: goedkoop gemaakt, storingsgevoelig) en een eigen geschiedenis.", "Producten werken op de wereld: wapens maken syndicaten overal sterker, beveiliging drukt ze terug in je eigen gebied.", "Rivalen hebben een eigen productlijn: ze lanceren in markten met veel vraag, hun producten tellen mee in het aanbod en zijn te zien in hun dossier.", "Productcatalogus van de hele wereld (Wereld → Producten) en filteren op soort, ook in je eigen productlijn.", "Duidelijker: een Wat nu?-kaart met concrete volgende stappen, terugverdientijd bij uitbreidingen en vestigingen, de worp en echte kans bij elke keuze, en spelregels in het hulpvenster (?).", "Productkansen rechtgezet: vlaggenschepen waren met doel 9 bijna een loterij. Nu doel 6/7/8 en een geflopt groot product houdt meer populariteit over.", "Beter ontwikkelen: kies de soort en een focus (kwaliteit, snel, goedkoop, innovatief, veilig) en zie vooraf de kans op hit, gewoon, flop en terugroepactie, met de markt en het aantal concurrenten.", "Winnen kan: €8.000k bedrijfswaarde, 80% op drie continenten, of alle oorspronkelijke rivalen uitgeschakeld. Anders telt na 10 of 20 jaar je score (of speel eindeloos).", "Score en eindrapport bij elk einde, ook bij verlies, en een eregalerij. Na een overwinning kun je verder spelen.", "Gezondheid: per maand zie je waarom morale en heat bewegen, met een waarschuwing ruim voor de afgrond. Een coup of razzia vraagt nu twee slechte maanden op rij.", "Opslag: automatische back-up voor elke maand (laatste drie terug te zetten), exporteren en importeren, een melding als opslaan mislukt, en een waarschuwing bij twee tabbladen.", "Moeilijkheid raakt nu ook rivalen: rijker en agressiever op Genadeloos, rustiger op Casual.", "Rust in beeld: niets knippert meer, grotere kleine tekst, zichtbare focus, een schakelaar voor effecten en het intro alleen de eerste keer.", "Economie: hogere niveaus leveren iets minder extra op, uitbreidingen worden duurder, vestigingen ook naarmate je groter bent, progressieve winstbelasting (minder met geld offshore), en heat zakt sneller naarmate hij hoger is.", "Je start zonder producten. Per divisie een productiewachtrij van 3, en de Assistent kan productlijnen starten.", "Levende producten: elk product heeft een aard met eigen gevolgen (macht, heat, reputatie, invloed, zwart geld, facties), een prijsstrategie, een recensie en eigen gebeurtenissen: misbruik, bijwerkingen, datalekken, namaak, kopieën door rivalen, viraal gaan.", "Een fout gerepareerd waardoor de speeltijd na 48 maanden bleef staan: tijdperken, termijn en score werken nu over het hele spel.", "Meer concurrentie: vijf rivalen die allemaal groter beginnen dan jij, één in jouw sector en één op jouw continent, en ze breiden eerder uit. Genadeloos: kosten +15% in plaats van +30%, maar rivalen rijker en agressiever."]],
  ["2.1", "Producten en doelwit", ["Productlijn per divisie: je lineup met kwaliteit, populariteit en omzet. Nieuwe producten ontwikkelen in drie schalen, campagnes, nieuwe versies, uit de markt halen.", "Lanceringen kunnen een hit, een flop of een terugroepactie worden (2d6). Producten verouderen; rivalen lanceren ook.", "Projecten kunnen vertragen of mislukken: hogere kosten, langer wachten, of het geld kwijt.", "Je kunt doelwit worden: rivalen en syndicaten huren fixers en huurlingen in voor sabotage, datadiefstal, ontvoering, omkoping van je crew, inbraak bij R&D of laster. Met een speurder of fixer hoor je het vaak vooraf.", "Oprichting: zoom tot op landniveau en alle landen van het continent als knoppen, met hun startvoordeel."]],
  ["2.0", "Crew, tijd en dobbelstenen", ["De d100 is weg: elke worp is 2d6 + bonus tegen een doel. Twee zessen lukt altijd, twee enen nooit, en de getoonde kans is altijd de echte.", "Crew: specialisten op de loonlijst (netrunner, fixer, huurling, dealmaker, spindokter, speurder). Opdrachten kosten verder niets; wie slaagt, groeit in niveau.", "Klussen van fixers over de hele wereld: jouw crew doet het werk, jij krijgt het geld. Huurlegers voor een oorlog.", "Bijzondere wereldgebeurtenissen: beurskrach, blackout, AI-verdrag, poolroute, corporatieoorlog, cyberpsychose, de eerste orbitale fabriek.", "De wereld verandert: tijdperken, status van je bedrijf, opvolgers in je netwerk, nieuwe CEO's bij rivalen, startups en faillissementen.", "Veel acties goedkoper; een gesprek, gunst of crewopdracht kost niets."]],
  ["1.4", "Comfort en oprichting", ["De oprichting is fase 0 in het spel zelf: vier stappen in het spelscherm, met de kaart, kaartmodi en een samenvatting van waar je mee begint.", "Sneltoetsen: 1-9, 0 en − voor de tabs, N voor de volgende maand, A voor de Assistent, J/K door je mail, / zoeken, ? voor het overzicht.", "Esc sluit mail, chat en selecties. In de oprichting: Enter gaat verder, pijltjes wisselen van land.", "Syndicaten houden hun eigen thuisgebied in plaats van overal even sterk te worden."]],
  ["1.3", "Onderwereld", ["Elf syndicaten op de echte kaart, elk met een eigen gebied, leider en stijl.", "Bescherming afkopen, partner worden, geschenken sturen of ze uit je gebied verdrijven (d100).", "Afpersing komt als keuzemail met vier opties, bendeoorlogen raken de economie van een land.", "Kaartmodus Onderwereld en de bendeleiders als chatcontact."]],
  ["1.2", "Mensen", ["Nieuwe tab Mensen: relaties met je netwerk en je directie, met acties zonder Assistent (diner, cadeau, gunst, onder druk zetten).", "Elke relatie levert iets op: vanaf een drempel een gunst, en daarboven een vast voordeel.", "Directieleden geven bij hoge loyaliteit een bonus; laat ze natrekken om verraders te vinden.", "Keuzemails: opslag, interviews, cao's, klanten, klokkenluiders. Knoppen in de mail, de engine rekent het uit.", "Het koffie-mailtje van rivalen is nu een echte keuze met tegenbod."]],

function versieCard(){

function spark(h){ if (!h || h.length < 2) return ""; const mx = Math.max(...h), mn = Math.min(...h), w = 80, ht = 22;
  return `<svg width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}" aria-hidden="true"><polyline fill="none" stroke="var(--cyan)" stroke-width="1.5" points="${h.map((v, i) => `${Math.round(i / (h.length - 1) * w)},${Math.round(ht - 2 - (v - mn) / Math.max(1, mx - mn) * (ht - 4))}`).join(" ")}"/></svg>`; }

function tekstModal(titel, uitleg, tekst, knop){

        if (!dl) return toast("Downloaden kan hier niet: gebruik Kopiëren.", true);
        try { await dl.save({filename: `chrome-ledger-${(G.game && G.game.player.corp_name || "spel").replace(/[^a-z0-9]+/gi, "-")}.json`, data: ta.value}); toast("Opgeslagen."); }

function mapView(s){

  const zones = M.zones.map(z => { const sc = sea.find(x => x.id === z.id) || {}, tot = sc.totaal || 0;
    const shares = Object.entries(sc.sterkte || {}).map(([o, v]) => ({o, naam: o === "player" ? "jij" : o, pct: tot ? Math.round(v / tot * 100) : 0, kleur: ownerColor(s, o)})).sort((a, b) => b.pct - a.pct);
    return {...z, dominant: sc.dominant || null, kleur: sc.dominant ? ownerColor(s, sc.dominant) : null, shares, vloten: sc.vloten || {}}; });
  const w = {}; let tot = 0; for (const d of s.districts){ w[d.control] = (w[d.control] || 0) + d.income; tot += d.income; }
  const dom = Object.entries(w).map(([o, v]) => ({o, naam: o === "player" ? s.player.corp_name : o === "neutral" ? "Niemand" : o, pct: Math.round(v / (tot || 1) * 100), kleur: ownerColor(s, o)}))
    .sort((a, b) => a.o === "player" ? -1 : b.o === "player" ? 1 : a.o === "neutral" ? 1 : b.o === "neutral" ? -1 : b.pct - a.pct);
  const regs = regionDominance(s);
  for (const c of cells){ const d = s.districts.find(x => x.id === c.id), rg = regs.find(r => r.id === d.continent); c.inc = d.income; c.cont = d.continent;
    if (rg && rg.shares[0]){ c.contKleur = ownerColor(s, rg.shares[0].o); c.contPct = rg.shares[0].pct; }
    const gb = gangOf(s, d.id); if (gb && gb.v >= 10) c.gang = {naam: gb.g.naam, kleur: gb.g.kleur, v: gb.v}; c.inc = incOf(d); }
  const contLbl = regs.map(r => { const cs = cells.filter(c => c.cont === r.id); return {naam: r.naam, x: Math.round(cs.reduce((a, c) => a + c.cx, 0) / cs.length), y: Math.round(cs.reduce((a, c) => a + c.cy, 0) / cs.length),

  return {kind: M.kind, w: M.w, h: M.h, city: M.city, land: M.land, frame: M.frame, continents: M.continents, cells, zones, dom, mode: S.mapmode || "politiek", contLbl};
}

/* ---------- sneltoetsen ---------- */
const NAVKEYS = ["overzicht", "inbox", "comms", "mensen", "crew", "wereld", "kaart", "bedrijf", "financien", "rivalen", "onderwereld", "logboek"];
const HOTKEYS = [["1 – 9, 0, −, =", "Naar tab 1 tot 12 (de nummers staan in het menu)"], ["N", "Volgende maand"], ["A", "Assistent openen"], ["G", "De GM openen of sluiten, op elk scherm"], ["/", "Zoeken in de inbox"],
  ["J / K", "Volgende / vorige mail"], ["R", "Mail beantwoorden"], ["E", "Mail archiveren"], ["C", "Nieuwe mail"], ["M", "Kaartmodus wisselen (op de kaart)"],
  ["Esc", "Sluiten: mail, chat, selectie of dit venster"], ["?", "Dit overzicht"]];
function helpOverlay(){
  return `<div class="helpov" data-a="help"><div class="box" role="dialog" aria-modal="true" aria-label="Sneltoetsen"><div class="spread"><h2 style="margin:0">Sneltoetsen</h2><button class="btn sm" data-a="help">Esc</button></div>
    <dl class="kv" style="margin-top:12px">${HOTKEYS.map(([k2, t]) => `<dt><kbd>${esc(k2)}</kbd></dt><dd style="font-family:var(--sans)">${esc(t)}</dd>`).join("")}</dl>
    <h2 style="margin:16px 0 6px">Spelregels in het kort</h2><dl class="kv regels">${SPELREGELS.map(([k3, t3]) => `<dt>${esc(k3)}</dt><dd style="font-family:var(--sans)">${esc(t3)}</dd>`).join("")}</dl>
    <p class="dim" style="font-size:13px;margin:12px 0 0">Sneltoetsen werken niet terwijl je typt. In de oprichting: 1-4 kiest een stap, Enter gaat verder, pijltjes wisselen van land.</p></div></div>`;
}
function goView(v){ S.view = v; localSet("view", v); S.mailBody = v === "inbox" ? S.mailBody : null; render(); document.getElementById("main")?.scrollTo(0, 0); }
document.addEventListener("keydown", e => {
  const tg = e.target, typing = tg && (/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName) || tg.isContentEditable);
  if (document.querySelector(".modal")) return;
  if (e.key === "Escape"){
    if (S.help){ S.help = false; render(); return; }
    if (typing){ tg.blur(); return; }
    if (S.compose || S.mailBody){ S.compose = null; S.mailBody = null; render(); return; }
    if (S.gmDock){ S.gmDock = false; render(); return; }
    if (S.chatOpen){ S.chatOpen = false; render(); return; }
    if (S.dist || S.zone || S.bedrijf){ S.dist = S.zone = S.bedrijf = null; render(); }
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || S.busy) return;
  const st = S.state; if (!st) return;
  if (!st.setup_done){
    if (/^[1-4]$/.test(e.key)){ S.sstep = +e.key - 1; render(); }
    else if (e.key === "Enter"){ e.preventDefault(); document.querySelector('header [data-a="snext"],header [data-a="setup"]')?.click(); }
    else if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && !(S.sstep > 0)){
      const W = genWorld(), cur = W.districts.find(x => x.id === S.setup.home) || W.districts[0], same = W.districts.filter(x => x.continent === cur.continent);
      const i = same.indexOf(cur), n = same[(i + (e.key === "ArrowRight" ? 1 : same.length - 1)) % same.length];
      S.setup.home = n.id; localSet("setup", JSON.stringify(S.setup)); render(); }
    return;
  }
  const k2 = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (/^[0-9]$/.test(k2)){ goView(NAVKEYS[k2 === "0" ? 9 : +k2 - 1]); return; }
  if (k2 === "-"){ goView("onderwereld"); return; }
  if (k2 === "="){ goView("logboek"); return; }
  if (k2 === "?"){ S.help = !S.help; render(); return; }
  if (k2 === "n"){ e.preventDefault(); if (st.status === "actief") doTick(false); return; }
  if (k2 === "a"){ S.view = "comms"; S.chat = "gm"; S.chatOpen = true; render(); document.getElementById("chattxt")?.focus({preventScroll: true}); e.preventDefault(); return; }
  if (k2 === "g"){ e.preventDefault(); S.gmDock = !S.gmDock; render(); if (S.gmDock) document.getElementById("gmtxt")?.focus({preventScroll: true}); return; }
  if (k2 === "/"){ e.preventDefault(); if (S.view !== "inbox") goView("inbox"); document.getElementById("q")?.focus(); return; }
  if (k2 === "c"){ e.preventDefault(); document.querySelector('[data-a="compose"]') ? document.querySelector('[data-a="compose"]').click() : (goView("inbox"), document.querySelector('[data-a="compose"]')?.click()); return; }
  if (S.view === "inbox" && (k2 === "j" || k2 === "k")){
    const els = [...document.querySelectorAll(".mails .mail")]; if (!els.length) return;
    let i = els.findIndex(x => x.classList.contains("sel")); i = i < 0 ? 0 : clamp(i + (k2 === "j" ? 1 : -1), 0, els.length - 1);
    openMail(els[i].dataset.open); return; }
  if (S.view === "inbox" && S.mailBody && k2 === "r"){ e.preventDefault(); document.querySelector('[data-a="reply"]')?.click(); return; }
  if (S.view === "inbox" && S.mailBody && k2 === "e"){ document.querySelector('[data-a="archive"]')?.click(); return; }
  if (S.view === "kaart" && k2 === "m"){ const modes = ["politiek", "dominantie", "zee", "economie", "onderwereld"]; S.mapmode = modes[(modes.indexOf(S.mapmode || "politiek") + 1) % modes.length]; render(); return; }
});

function bindSetup(){
  const sc = document.querySelector(".setupapp .mapscroll"), W = genWorld(), cell = W.map.cells[(S.setup || {}).home];
  if (sc && cell && sc.scrollWidth > sc.clientWidth + 4) sc.scrollLeft = cell.cx / W.map.w * sc.scrollWidth - sc.clientWidth / 2;
  if (sc && cell && S.setupFocus !== (S.setup || {}).home){ S.setupFocus = S.setup.home; }
  document.querySelectorAll("[data-f]").forEach(el => el.addEventListener("input", () => { S.setup[el.dataset.f] = el.value; localSet("setup", JSON.stringify(S.setup)); }));
}

/* ---- events ---- */
document.addEventListener("click", async e => {
  if (S.sound && e.target.closest("button,.dist")) blip(e.target.closest(".next") ? 220 : 660, .045);
  const t = e.target.closest("[data-view],[data-a],[data-open],[data-filter],[data-dist],[data-zone],[data-chip],[data-chat]");
  if (!t) return;
  if (t.dataset.view){ S.view = t.dataset.view; localSet("view", S.view); try { history.replaceState(null, "", "#" + S.view); } catch(_){} if (S.view!=="inbox") S.mailBody = null; render(); document.getElementById("main")?.scrollTo(0,0); return; }
  if (t.dataset.filter){ S.filter = t.dataset.filter; S.mailBody = null; S.compose = null; render(); return; }
  if (t.dataset.chat){ S.chat = t.dataset.chat; S.chatOpen = true; render(); document.getElementById("chattxt")?.focus({preventScroll: true}); return; }

    case "chatwith": S.view = "comms"; S.chat = t.dataset.key; S.chatOpen = true; localSet("view","comms"); render(); document.getElementById("chattxt")?.focus({preventScroll: true}); return;
    case "closechat": S.chatOpen = false; render(); return;
    case "gmsnel": return gmSnel(t.dataset.k);
    case "gmprefill": { const el = document.getElementById("gmtxt"); if (el){ el.value = "Wat kost het om "; el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
    case "dochter": { if (t.dataset.x === "verkoop" && !await ask("Dochter verkopen?", "Je krijgt 90% van de waarde in één keer, en het vaste maandbedrag stopt.", "Verkopen", true)) return; return act("/api/dochter", {id: t.dataset.id, actie: t.dataset.x}); }
    case "prodsheet": S.prodSheet = S.prodSheet === t.dataset.id ? null : t.dataset.id; render(); return;
    case "prodtab": (S.prodTab ??= {})[t.dataset.id] = t.dataset.t; render(); return;
    case "nieuwgelezen": localSet("gezien_versie", VERSIES[0][0]); render(); return;
    case "stappenweg": if (G.game){ G.game.flags.stappen_weg = true; await Store.saveGame(); } render(); return;
    case "gmdock": S.gmDock = !S.gmDock; render(); if (S.gmDock) document.getElementById("gmtxt")?.focus({preventScroll: true}); return;
    case "gmsend": { const el = document.getElementById("gmtxt"), txt = el && el.value; if (!txt || !txt.trim()) return; el.value = ""; delete S.keep.gmtxt; chatSend("gm", txt); return; }
    case "starter": return act("/api/product", {soort: "ontwikkel", divisie: t.dataset.div, schaal: "klein", focus: t.dataset.f, vorm: t.dataset.v});
    case "chatsend": { const el = document.getElementById("chattxt"), txt = el && el.value; if (!txt || !txt.trim()) return;

      if (t.dataset.src === "chat"){ if (S.busy) return; S.busy = true; try { await decideChat(t.dataset.key, t.dataset.id, yes); } finally { S.busy = false; } render(); return; }

      for (const id of ["mto","msubj","mbody"]) delete S.keep[id]; render(); document.getElementById("mbody")?.focus({preventScroll: true}); return; }
    case "sendmail": { const C = S.compose || {};
      const r = await act("/api/mail/stuur", {aan: val("mto"), onderwerp: val("msubj"), tekst: val("mbody"), re: C.re});
      if (r && r.ok){ S.compose = null; for (const id of ["mto","msubj","mbody"]) delete S.keep[id]; render(); } return; }
    case "closecompose": S.compose = null; for (const id of ["mto","msubj","mbody"]) delete S.keep[id]; render(); return;
    case "dossier": S.rival = (S.rival === t.dataset.n && S.view === "rivalen") ? null : t.dataset.n; S.view = "rivalen"; localSet("view","rivalen"); render(); return;
    case "mapmode": S.mapmode = t.dataset.m; render(); return;
    case "infl": { const k3 = t.dataset.k, doel = k3 === "lobby" ? val("infl-fac") : k3 === "diplomatie" ? val("infl-riv") : null; return act("/api/invloed", {soort: k3, doel}); }
    case "zoom": { const sc = document.getElementById("mapscroll"), old = S.zoom || 1, nz = +t.dataset.z; const fx = sc ? (sc.scrollLeft + sc.clientWidth / 2) / sc.scrollWidth : .5; S.zoom = nz; render();

    case "effecten": S.rustig = !S.rustig; localSet("rustig", S.rustig ? "1" : "0"); document.documentElement.classList.toggle("rustig", S.rustig); render(); return;

    case "snext": S.sstep = Math.min(3, (S.sstep || 0) + 1); render(); document.getElementById("main")?.scrollTo(0, 0); return;
    case "setupmode": S.setupmode = t.dataset.m; render(); return;
    case "mens": { const s2 = t.dataset.s;

      if (s2 === "druk" && !await ask("Onder druk zetten?", "Kans op dezelfde gunst zonder relatie, maar het kost veel relatie en heat. Mislukt het, dan vertellen ze het rond.", "Doorzetten", true)) return;
      return act("/api/mens", {key: t.dataset.key, soort: s2}); }
    case "selbedrijf": S.bedrijf = S.bedrijf === t.dataset.id ? null : t.dataset.id; render(); if (S.bedrijf && innerWidth < 861) document.querySelector(".mapwrap > div:last-child")?.scrollIntoView({behavior: "smooth"}); return;
    case "wtab": S.wtab = t.dataset.t; localSet("wtab", S.wtab); render(); return;
    case "bedrijf": { const b = S.state.wereld.bedrijven.find(x => x.id === t.dataset.id), s2 = t.dataset.s;
      if (b && s2 === "overname" && !await ask(`${b.naam} overnemen?`, `Bod: ${eur(b.opties.overname.kost)}. Kans ${b.opties.overname.kans}%. Mislukt het, dan ben je 15% van het bod kwijt.`, "Bod doen")) return;

      return act("/api/bedrijf", {id: t.dataset.id, soort: s2}); }
    case "gang": { const s2 = t.dataset.s, land = s2 === "uitroken" ? val("gl_" + t.dataset.id) : null;
      if (s2 === "uitroken" && !await ask("Verdrijven?", "De engine gooit 2d6. Lukt het: −30 aanwezigheid en reputatie +2. Mislukt het: schade, morale en heat. Hoe dan ook worden ze vijandiger.", "Aanvallen", true)) return;
      if (s2 === "partner" && !await ask("Partner worden?", "Zwart geld elke maand, maar heat stijgt en het toezicht wordt koeler.", "Partner worden")) return;
      return act("/api/gang", {id: t.dataset.id, soort: s2, land}); }
    case "offer": return act("/api/aanbod", {id: t.dataset.id, ja: !!t.dataset.yes});
    case "hire": return act("/api/personeel", {soort: "huren", aantal: val("nstaff")});
    case "fire": if (!await ask("Mensen ontslaan?", `${val("nstaff")} mensen ontslaan kost vergoedingen, morale en goodwill bij de vakbond.`, "Ontslaan", true)) return; return act("/api/personeel", {soort: "ontslaan", aantal: val("nstaff")});
    case "salary": if (!await ask("Salarisniveau aanpassen?", t.dataset.l === "laag" ? "Lagere lonen: morale -6 en de vakbond wordt kwaad. Daarna drukt het elke maand op de morale." : "Andere lonen veranderen je loonkosten en elke maand de morale.", "Aanpassen")) return; return act("/api/personeel", {soort: t.dataset.l});
    case "mktype": case "mktypegm": { const naam = val("tname"); if (!naam || !naam.trim()) return toast("Geef de soort een naam.", true);
      if (a === "mktypegm") toast("De GM rekent de cijfers uit…");
      const r = await act("/api/soort", {naam, omschrijving: val("tdesc"), profiel: val("tprof"), gm: a === "mktypegm"});
      if (r && r.ok){ for (const id of ["tname","tdesc"]) delete S.keep[id]; render(); } return; }
    case "seek": { S.view = "comms"; S.chat = "gm"; S.chatOpen = true; render(); const ta = document.getElementById("chattxt"); if (ta){ ta.value = "Zoek een kandidaat voor de functie van "; ta.focus(); } return; }
    case "archive": { const m = S.state.mails.find(m=>m.id===S.mailBody.id); await act("/api/mail/flag", {ids:[S.mailBody.id], soort:"archief", waarde:!m.archief}, {silent:true}); S.mailBody = null; render(); return; }
    case "unread": await act("/api/mail/flag", {ids:[S.mailBody.id], soort:"gelezen", waarde:false}, {silent:true}); S.mailBody = null; render(); return;
    case "allread": return act("/api/mail/flag", {ids: S.state.mails.map(m=>m.id), soort:"gelezen", waarde:true}, {silent:true});
    case "closemail": S.mailBody = null; render(); return;
    case "decide": {
      const bud = document.getElementById(`bud_${t.dataset.arc}_${t.dataset.keuze}`);
      if (!await ask("Besluit nemen?", "Dit besluit is definitief.", "Kiezen")) return;
      return act("/api/besluit", {arc:t.dataset.arc, keuze:t.dataset.keuze, budget: bud ? Number(bud.value) : 0});
    }
    case "district": if (!await ask("Vestiging openen?", "Het geld gaat er nu af. Het duurt 3 maanden.", "Openen")) return; return act("/api/project", {soort:"district", id:t.dataset.id});
    case "distorder": { const txt = val("disttxt"); if (!txt || !txt.trim()) return; delete S.keep.disttxt; const d = S.state.districten.find(x=>x.id===t.dataset.id);
      S.view = "comms"; S.chat = "gm"; S.chatOpen = true; render(); chatSend("gm", `[District ${d.id} ${d.naam}] ${txt}`); return; }
    case "upgrade": if (!await ask("Divisie uitbreiden?", "Het geld gaat er nu af. Het duurt 2 maanden.", "Uitbreiden")) return; return act("/api/project", {soort:"upgrade", divisie:t.dataset.div});
    case "newdiv": return act("/api/project", {soort:"divisie", type: val("ndtype"), naam: val("ndname")});
    case "transfer": return act("/api/geld", {soort:"transfer", van:val("tvan"), naar:val("tnaar"), bedrag:val("tbedrag")});
    case "lening": return act("/api/geld", {soort:"lening", bedrag:val("lbedrag")});
    case "aflossen": return act("/api/geld", {soort:"aflossen", bedrag:val("lbedrag") || S.state.schuld});
    case "autopay": return act("/api/factuur", {alles: !S.state.auto_pay});
    case "pay": return act("/api/factuur", {id:t.dataset.id, actie:"betaal"});
    case "hold": return act("/api/factuur", {id:t.dataset.id, actie:"toggle"});
    case "rivalorder": { S.view = "comms"; S.chat = "gm"; S.chatOpen = true; render(); const ta = document.getElementById("chattxt"); if (ta){ ta.value = `${t.dataset.naam}: `; ta.focus(); } return; }
    case "nieuw": if (!await ask("Nieuw spel beginnen?", "Je huidige bedrijf blijft bewaard: je vindt het terug bij Logboek → Spellen en kunt er altijd naar terugwisselen.", "Nieuw spel")) return; S.setup = null; S.sstep = 0; return act("/api/nieuw", {zeker:true});
    case "setup": {
      if (!S.setup.corp_name.trim()){ S.sstep = 1; render(); document.querySelector("[data-f=corp_name]")?.focus(); return toast("Geef je bedrijf een naam.", true); }
      const d0 = {...S.setup, eigen: S.setup.eigen_naam.trim() ? {naam: S.setup.eigen_naam, omschrijving: S.setup.eigen_omschrijving, profiel: S.setup.eigen_profiel} : null};
      const r = await act("/api/setup", d0); if (r && r.ok){ localSet("setup", ""); S.sstep = 0; S.view = "inbox"; localSet("view","inbox"); render(); }
      return;
    }
  }
});
document.addEventListener("change", e => { const t = e.target; if (t && t.dataset && t.dataset.dev){ (S.devSel ??= {})[t.dataset.dev] = {...((S.devSel || {})[t.dataset.dev] || {}), [t.dataset.k]: t.value}; render(); } });
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target && e.target.matches && e.target.matches("g[data-dist][tabindex]")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", {bubbles: true})); return; }
  if (e.target && (e.target.id === "chattxt" || e.target.id === "gmtxt") && e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); document.querySelector(e.target.id === "gmtxt" ? '[data-a="gmsend"]' : '[data-a="chatsend"]')?.click(); }
});
document.addEventListener("input", e => { const ps = e.target.dataset && e.target.dataset.prijs; if (ps && G.game){ const p = (G.game.producten || []).find(x => x.id === ps); if (!p) return; const f = +e.target.value / 100, x = prijsProef(G.game, p, f), out = document.getElementById("pp_" + ps), bt = document.getElementById("pps_" + ps);
    if (out) out.textContent = `${Math.round(f * 100)}%: ${prijsRegel(p, x)}`; if (bt){ bt.dataset.f = f; bt.disabled = Math.abs(f - prijsF(p)) < 0.005; } return; }
  if (e.target.id === "q"){ S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos,pos); } });

async function openMail(id){
  const m = G.mails.find(x => x.id === id);
  if (!m) return toast("Mail niet gevonden.", true);
  S.mailBody = {id, meta: {Onderwerp: m.onderwerp, Van: m.van, Aan: m.aan || "CEO", Datum: m.datum, Prioriteit: m.prio}, body: m.body};
  S.view = "inbox"; localSet("view","inbox"); S.decrypt = true; S.compose = null;
  render();
  if (!m.gelezen) Store.patchMail(id, {gelezen: true}).then(render).catch(() => {});
}
async function doTick(force){
  if (S.busy) return;
  const d = S.state.datum, nm = d.month === 12 ? [1, d.year+1] : [d.month+1, d.year];
  const ov = showSync(MONTHS[d.month-1].toUpperCase() + " " + d.year + "  →  " + MONTHS[nm[0]-1].toUpperCase() + " " + nm[1]);
  if (S.sound) sweep();
  const [r] = await Promise.all([act("/api/tick", {force}, {silent:true}), sleep(1150)]);
  hideSync(ov);
  if (!r) return;
  document.getElementById("main")?.classList.add("shake");
  if (r.vraag){ if (await ask("Opdrachten staan nog open", r.bericht, "Toch doorgaan")) return doTick(true); return; }
  if (!r.ok) return toast(r.bericht, true);
  if (r.status && r.status !== "actief") { toast("Het is voorbij: " + r.status, true); return; }
  toast(`Nieuwe maand. ${S.state.mails.filter(m=>!m.gelezen).length} ongelezen mail(s).`);
  if (r.rapport_mail) openMail(r.rapport_mail);
}

/* ---- cyberpunk-laag: glitch, ticker, ontsleutelen, opstart, sync, geluid ---- */
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function afterRender(){
  document.querySelectorAll("main h1").forEach(h => { h.classList.add("glitch"); h.dataset.text = h.textContent; });
  updateTicker();
  if (S.decrypt){ S.decrypt = false; scramble(document.getElementById("subj")); }
  const gl = document.getElementById("gmlog"); if (gl) gl.scrollTop = gl.scrollHeight;
}
let tickerKey = "";
function updateTicker(){
  const st = S.state, el = document.getElementById("ticker");
  if (!st || !st.setup_done){ el.hidden = true; return; }
  el.hidden = false;
  const items = st.mails.filter(m => !/^Maandrapport/.test(m.onderwerp)).slice(0, 12).map(m => [m.van.toUpperCase(), m.onderwerp]);
  st.rivalen.slice(0, 4).forEach(r => items.push(["MARKT", `${r.naam} houdt ~${r.aandeel}% van ${r.sector}`]));
  items.push(["STAD", `Heat-index ${esc(st.speler.corp_name)}: ${Math.round(st.heat)}`]);
  const key = JSON.stringify(items);
  if (key === tickerKey) return;
  tickerKey = key;
  const run = document.getElementById("tickrun");
  run.innerHTML = items.map(([a,b]) => `<span class="it"><b>${esc(a)}</b>${esc(b)}</span>`).join("");
  run.style.setProperty("--dur", Math.max(35, items.reduce((n,[a,b]) => n + a.length + b.length, 0) / 5) + "s");
}
function scramble(el){
  if (!el || REDUCED) return;
  const final = el.textContent, chars = "▓▒░#$%&@*+=?/\\<>01ABCDEFX";
  let f = 0; const total = 16;
  const iv = setInterval(() => {
    f++;
    const n = Math.floor(final.length * f / total);
    el.textContent = final.slice(0, n) + Array.from(final.slice(n)).map(c => c === " " ? " " : chars[Math.random()*chars.length|0]).join("");
    if (f >= total){ clearInterval(iv); el.textContent = final; }
  }, 28);
}
function showSync(sub){
  const o = document.createElement("div"); o.className = "sync";
  o.innerHTML = `<div class="t glitch" data-text="SYNCHRONISEREN">SYNCHRONISEREN</div><div class="pb"><i></i></div><div class="s">${esc(sub)}</div>`;
  document.body.appendChild(o); return o;
}
function hideSync(o){ o.classList.add("out"); setTimeout(() => o.remove(), 500); }
S.rustig = (localGet("rustig") ?? (REDUCED ? "1" : "0")) === "1"; if (S.rustig) document.documentElement.classList.add("rustig");
async function boot(){
  let seen = false; try { seen = localStorage.getItem("cl_boot_ooit") === "1"; localStorage.setItem("cl_boot_ooit", "1"); } catch(e){}
  if (seen || REDUCED || S.rustig) return;
  const st = S.state || {}, corp = st.setup_done ? st.speler.corp_name : "ONBEKEND";
  if (!S.loaded) await sleep(50);
  const lines = [
    `<span class="m">${G.game && G.game.map && G.game.map.kind !== "wereld" ? esc(((G.game && G.game.city) || "Meridian Bay").toUpperCase()) + " CITYNET" : "GLOBAL CORPNET"}</span>  //  CHROME LEDGER ${VERSION}  //  node ${(Math.random()*9000+1000|0)}`,
    "> handshake ............... <span class=\"g\">OK</span>",
    "> versleuteling ........... ICE-7 / 2048",
    `> identiteit .............. CEO // ${esc(corp).toUpperCase()}`,
    "> marktfeed ............... <span class=\"g\">LIVE</span>",
    st.setup_done ? `> heat-scanner ............ ${Math.round(st.heat)}` : "> registratie ............. <span class=\"m\">VEREIST</span>",
    "", `<span class="m">█</span> TOEGANG VERLEEND`];
  const o = document.createElement("div"); o.className = "boot";
  o.innerHTML = '<pre></pre><div class="skip">KLIK OM OVER TE SLAAN</div>';
  document.body.appendChild(o);
  const pre = o.querySelector("pre"); let skip = false;
  const end = () => { skip = true; o.classList.add("out"); setTimeout(() => o.remove(), 500); };
  o.addEventListener("click", end); window.addEventListener("keydown", end, {once:true});
  for (const l of lines){ if (skip) return; pre.innerHTML += l + "\n"; if (S.sound) blip(1200, .02); await sleep(170); }
  await sleep(450); if (!skip) end();
}
let AC = null;
function audio(){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} return AC; }
function blip(freq, dur){
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "square"; o.frequency.value = freq; g.gain.value = .035;
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
}
function sweep(){
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sawtooth"; o.frequency.setValueAtTime(90, ac.currentTime); o.frequency.exponentialRampToValueAtTime(700, ac.currentTime + 1.0);
  g.gain.setValueAtTime(.03, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + 1.1);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 1.15);
}

window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v && v !== S.view && VIEWS[v]){ S.view = v; render(); } });
render();
(async () => {
  const sp = (async () => { try { G.sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch(e){ G.sample = null; } })();
  await Store.init(); await sp; render(); boot();
})();
