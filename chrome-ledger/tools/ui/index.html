<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrome Ledger</title>
<style>
:root{
  --bg:#08090c; --panel:#10141a; --panel2:#151a22; --line:#232b36; --line2:#2e3846;
  --text:#d7dee7; --muted:#8a96a5; --dim:#5d6876;
  --cyan:#38e1cf; --cyan-d:#0f3f3b; --amber:#ffb22e; --amber-d:#3d2c0c; --red:#ff4d6d; --red-d:#3d1420;
  --violet:#a98bff; --green:#6be38a;
  --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,"SF Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-rows:auto 1fr;height:100vh}
/* topbar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0e1218,#0a0c10)}
.brand{font-family:var(--mono);letter-spacing:.18em;font-weight:700;color:var(--cyan);font-size:13px;white-space:nowrap}
.brand small{display:block;color:var(--muted);letter-spacing:.05em;font-weight:400;font-size:12px;margin-top:2px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.date{font-family:var(--mono);font-size:13px;padding:4px 10px;border:1px solid var(--line2);border-radius:var(--r);white-space:nowrap}
.stats{display:flex;gap:16px;flex:1;min-width:0;overflow-x:auto}
.stat{min-width:92px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat .v{font-family:var(--mono);font-size:15px;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan)}
.bar.heat i{background:linear-gradient(90deg,var(--amber),var(--red))}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);padding:7px 12px;cursor:pointer;transition:border-color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--cyan)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--cyan);color:#041512;border-color:var(--cyan);font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}
.btn.warn{border-color:var(--amber);color:var(--amber)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.next{font-family:var(--mono);letter-spacing:.06em;padding:9px 16px}
/* nav */
nav{border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:var(--r);padding:9px 12px;cursor:pointer;color:var(--muted)}
nav button:hover{background:var(--panel);color:var(--text)}
nav button.on{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--cyan)}
.badge{font-family:var(--mono);font-size:11px;background:var(--cyan);color:#041512;border-radius:9px;padding:0 7px;font-weight:700}
.badge.amber{background:var(--amber)}
nav .sep{height:1px;background:var(--line);margin:10px 6px}
main{overflow-y:auto;padding:20px 24px 60px;min-width:0}
h1{font-family:var(--mono);font-size:17px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 16px;color:#fff}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:22px 0 10px;font-weight:600}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h3{margin:0 0 6px;font-size:15px}
.card.decision{border-color:var(--amber);background:linear-gradient(180deg,var(--amber-d),var(--panel) 70%)}
.card.decision h3{color:var(--amber)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line2);border-radius:var(--r);padding:8px 10px;background:var(--panel)}
.opt .t{font-weight:600}
.opt .u{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
input[type=text],input[type=number],select,textarea{background:#0b0e13;border:1px solid var(--line2);border-radius:var(--r);padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan)}
textarea{width:100%;resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td.num,th.num{text-align:right;font-family:var(--mono)}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:0 6px;color:var(--muted)}
.tag.KRITIEK{border-color:var(--red);color:var(--red)}
.tag.HOOG{border-color:var(--amber);color:var(--amber)}
.tag.LAAG{color:var(--dim)}
.tag.ok{border-color:var(--green);color:var(--green)}
.tag.cyan{border-color:var(--cyan);color:var(--cyan)}
/* inbox */
.inbox{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);height:calc(100vh - 150px);min-height:420px;overflow:hidden}
.ilist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.itools{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid transparent;border-radius:var(--r);padding:3px 9px;cursor:pointer;color:var(--muted);font-size:13px}
.tabs button.on{border-color:var(--line2);color:var(--text);background:var(--panel2)}
.mails{overflow-y:auto;flex:1}
.mail{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer;color:var(--text)}
.mail:hover{background:var(--panel2)}
.mail.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--cyan)}
.mail .from{font-size:13px;display:flex;justify-content:space-between;gap:8px}
.mail .subj{font-size:14px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail .prev{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail.unread .subj,.mail.unread .from b{font-weight:700;color:#fff}
.mail.unread .from b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan);margin-right:6px;vertical-align:1px}
.reader{overflow-y:auto;padding:18px 22px;min-height:0}
.reader .hdr{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.reader .hdr h2{margin:0 0 6px;font-size:18px;color:#fff;text-transform:none;letter-spacing:0}
.reader .meta{font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.md p{margin:0 0 10px}
.md h1{font-size:15px;margin:4px 0 12px}
.md table{margin:6px 0 14px;max-width:640px;display:block;overflow-x:auto}
.md code{font-family:var(--mono);background:var(--panel2);padding:0 4px;border-radius:3px}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
.back{display:none}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr);gap:16px;align-items:start}
svg.map{width:100%;height:auto;background:#06080b;border:1px solid var(--line);border-radius:var(--r)}
.dist{cursor:pointer}
.dist rect{fill:#0f141a;stroke:#2a3442;stroke-width:1.5;transition:fill .15s}
.dist:hover rect{fill:#151c25}
.dist.player rect{fill:#0c2a28;stroke:var(--cyan)}
.dist.sel rect{stroke:#fff;stroke-width:2.5}
.dist text{fill:var(--text);font-family:var(--mono)}
.dist .id{fill:var(--muted);font-size:13px}
.dist.player .id{fill:var(--cyan)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* misc */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono)}
.big{font-family:var(--mono);font-size:22px;font-weight:700}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--violet)}
.fac{display:grid;grid-template-columns:90px 1fr 84px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.fbar{position:relative;height:6px;background:var(--line);border-radius:3px}
.fbar::after{content:"";position:absolute;left:50%;top:-2px;width:1px;height:10px;background:var(--line2)}
.fbar i{position:absolute;top:0;height:100%;border-radius:3px}
.toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(420px,calc(100vw - 32px))}
.toast div{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--cyan);border-radius:var(--r);padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:pre-wrap;font-size:13.5px}
.toast div.bad{border-left-color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(3,4,6,.78);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);max-width:720px;width:100%;max-height:calc(100vh - 32px);overflow-y:auto;padding:20px 22px}
.modal .box h2{margin-top:0}
.setup{max-width:860px;margin:0 auto}
.setup .card{margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:16px;padding:5px 12px;cursor:pointer;background:var(--panel2);font-size:13.5px}
.chip.on{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-d)}
.over{text-align:center;padding:60px 20px}
.over .big{font-size:34px;color:var(--red);letter-spacing:.1em}
pre.rolls{font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--muted);margin:0}
.navtoggle{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr}
  .date{order:2}
  .nx-long{display:none}
  .top{flex-wrap:wrap;gap:10px;padding:10px 16px}
  .stats{order:3;width:100%;flex-basis:100%}
  .btn.next{order:1}
  .brand{order:0}
  nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 10px}
  nav button{width:auto;gap:6px;padding:7px 10px}
  nav .sep{display:none}
  main{padding:16px 16px 60px}
  .inbox{grid-template-columns:1fr;height:auto;min-height:0}
  .inbox .reader{display:none}
  .inbox.reading .ilist{display:none}
  .inbox.reading .reader{display:block}
  .back{display:inline-block;margin-bottom:10px}
  .mapwrap{grid-template-columns:1fr}
  .btn.next{margin-left:auto}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const S = {state:null, view: localGet("view") || "overzicht", mail:null, mailBody:null, filter:"alles", q:"", dist:null, busy:false, version:0, setup:null};

function localGet(k){ try { return localStorage.getItem("cl_"+k); } catch(e){ return null; } }
function localSet(k,v){ try { localStorage.setItem("cl_"+k, v); } catch(e){} }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const k = n => (Math.round(n*10)/10).toLocaleString("nl-NL") ;
const eur = n => "€" + k(n) + "k";
const MONTHS = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];

async function api(path, body){
  const opt = body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)};
  const r = await fetch(path, opt);
  return r.json();
}
function toast(msg, bad){
  const t = document.createElement("div"); if (bad) t.className = "bad"; t.textContent = msg;
  const box = document.getElementById("toast"); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), bad ? 7000 : 4500);
}
async function load(){
  const st = await api("/api/state");
  S.state = st; S.version = st.versie || 0; render();
}
async function act(path, body, opts={}){
  if (S.busy) return; S.busy = true;
  try {
    const r = await api(path, body);
    if (r.bericht && !opts.silent) toast(r.bericht, !r.ok);
    await load();
    return r;
  } catch(e){ toast("Verbinding met de engine verbroken. Draait tools/ui.py nog?", true); }
  finally { S.busy = false; }
}

/* ---- mini markdown voor mails ---- */
function inline(s){
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>");
}
function md(src){
  const lines = String(src||"").split(/\r?\n/); let out = "", para = [], i = 0;
  const flush = () => { if (para.length){ out += "<p>"+para.map(inline).join("<br>")+"</p>"; para = []; } };
  while (i < lines.length){
    const l = lines[i];
    if (/^\s*\|/.test(l)){
      flush(); const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out += "<table><thead><tr>" + cells(body[0]).map(c=>"<th>"+inline(c)+"</th>").join("") + "</tr></thead><tbody>" +
        body.slice(1).map(r => "<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("") + "</tbody></table>";
      continue;
    }
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if (h){ flush(); out += `<h1>${inline(h[2])}</h1>`; i++; continue; }
    if (/^\s*[-*]\s+/.test(l) && !/^\*\*/.test(l.trim())){
      flush(); out += "<ul>"; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) out += "<li>"+inline(lines[i++].replace(/^\s*[-*]\s+/,""))+"</li>"; out += "</ul>"; continue;
    }
    if (!l.trim()){ flush(); i++; continue; }
    para.push(l); i++;
  }
  flush(); return out;
}

/* ---- layout ---- */
function render(){
  const st = S.state, root = document.getElementById("root");
  if (!st) { root.innerHTML = '<div class="empty">Laden…</div>'; return; }
  if (st.geen_spel || !st.setup_done) { root.innerHTML = setupView(); bindSetup(); return; }
  const unread = st.mails.filter(m => !m.gelezen && !m.archief).length;
  const openOrders = st.opdrachten.filter(o => o.status === "open").length;
  const nav = [["overzicht","Overzicht", st.besluiten.length ? `<span class="badge amber">${st.besluiten.length}</span>`:""],
    ["inbox","Inbox", unread ? `<span class="badge">${unread}</span>`:""], ["kaart","Kaart",""], ["bedrijf","Bedrijf",""],
    ["financien","Financiën", st.facturen.some(f=>f.overdue) ? '<span class="badge amber">!</span>' : ""], ["rivalen","Rivalen",""],
    ["sep"], ["opdrachten","Opdrachten aan GM", openOrders ? `<span class="badge">${openOrders}</span>`:""], ["logboek","Logboek",""]];
  const over = st.status !== "actief";
  root.innerHTML = `<div class="app">
    <header class="top">
      <div class="brand">CHROME LEDGER<small>${esc(st.speler.corp_name)}</small></div>
      <div class="date">${MONTHS[st.datum.month-1].toUpperCase()} ${st.datum.year}</div>
      <div class="stats">
        ${stat("Cash", eur(st.cash), null, st.cash < 30 ? "var(--amber)" : null)}
        ${stat("Heat", k(st.heat), st.heat, null, "heat")}
        ${stat("Reputatie", k(st.reputatie), st.reputatie)}
        ${stat("Morale", k(st.morale), st.morale)}
        ${stat("Schuld", eur(st.schuld), null, st.schuld > st.cash ? "var(--amber)" : null)}
      </div>
      <button class="btn primary next" data-a="tick" ${over?"disabled":""}>VOLGENDE<span class="nx-long"> MAAND</span> ▸</button>
    </header>
    <nav>${nav.map(n => n[0]==="sep" ? '<div class="sep"></div>' :
      `<button class="${S.view===n[0]?"on":""}" data-view="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join("")}</nav>
    <main id="main">${over ? gameOver() : (VIEWS[S.view] || VIEWS.overzicht)()}</main>
  </div>`;
}
function stat(label, val, pct, color, cls=""){
  return `<div class="stat"><div class="k">${label}</div><div class="v" ${color?`style="color:${color}"`:""}>${val}</div>${pct!=null?`<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`:""}</div>`;
}
function gameOver(){
  const st = S.state;
  return `<div class="over"><div class="big">${esc(st.status)}</div>
    <p class="muted">${esc(st.speler.corp_name)} · ${MONTHS[st.datum.month-1]} ${st.datum.year}</p>
    <p>Het spel is voorbij. De laatste mails staan nog in je inbox.</p>
    <div class="row" style="justify-content:center;margin-top:20px">
      <button class="btn" data-view="inbox">Inbox lezen</button>
      <button class="btn primary" data-a="nieuw">Nieuw spel</button></div></div>`;
}

/* ---- views ---- */
const VIEWS = {
overzicht(){
  const st = S.state, r = st.rapport;
  const recent = st.mails.filter(m => !m.archief).slice(0,5);
  return `<h1>Overzicht</h1>
  ${st.besluiten.length ? `<h2>Wacht op uw besluit</h2><div class="grid g2">${st.besluiten.map(decisionCard).join("")}</div>` : ""}
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="spread"><h3>Laatste maandrapport</h3>${r?`<span class="tag">${esc(r.maand)}</span>`:""}</div>
      ${r ? `<div class="grid g3" style="gap:8px;margin:8px 0">
          <div><div class="muted" style="font-size:12px">OMZET</div><div class="big">${k(r.omzet)}</div></div>
          <div><div class="muted" style="font-size:12px">KOSTEN</div><div class="big">${k(r.kosten)}</div></div>
          <div><div class="muted" style="font-size:12px">NETTO</div><div class="big" style="color:${r.netto>=0?"var(--green)":"var(--red)"}">${r.netto>=0?"+":""}${k(r.netto)}</div></div></div>
        <div class="muted" style="font-size:13px">${(r.gebeurd||[]).length ? esc(r.gebeurd.join(" · ")) : "Niets noemenswaards."}</div>
        <div style="margin-top:10px"><button class="btn sm" data-open="${esc(r.mail)}">Volledig rapport lezen</button></div>`
      : `<p class="muted">Nog geen rapport. Speel je eerste maand.</p>`}
    </div>
    <div class="card"><div class="spread"><h3>Recente mail</h3><button class="btn sm" data-view="inbox">Inbox</button></div>
      ${recent.length ? recent.map(m => `<button class="mail ${m.gelezen?"":"unread"}" data-open="${esc(m.id)}" style="padding:7px 0;border-bottom:1px solid var(--line)">
        <div class="from"><b>${esc(m.van)}</b><span class="tag ${m.prio}">${m.prio}</span></div><div class="subj">${esc(m.onderwerp)}</div></button>`).join("") : '<p class="muted">Leeg.</p>'}
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <h3>Wat wil je deze maand doen?</h3>
    <p class="muted" style="margin:0 0 8px;font-size:13px">Schrijf het in je eigen woorden: iemand omkopen, een journalist bellen, personeel ontslaan, een deal met een rivaal. De GM (Claude) zegt wat het kost en voert het uit; het antwoord komt als mail.</p>
    <textarea id="ordertxt" placeholder="Bijv.: Huur een privédetective om Marta Delcourt na te trekken. Max €5k."></textarea>
    <div class="row" style="margin-top:8px"><button class="btn primary" data-a="order">Naar de GM sturen</button>
      <span class="muted" style="font-size:13px">${st.opdrachten.filter(o=>o.status==="open").length} open opdracht(en)</span></div>
  </div>
  ${st.lopend.length ? `<h2>Lopende effecten</h2><div class="row">${st.lopend.map(x=>`<span class="tag HOOG">${esc(x)}</span>`).join("")}</div>`:""}`;
},
inbox(){
  const st = S.state;
  let list = st.mails.filter(m => S.filter==="archief" ? m.archief : !m.archief);
  if (S.filter==="ongelezen") list = list.filter(m => !m.gelezen);
  if (S.filter==="belangrijk") list = list.filter(m => m.prio==="HOOG" || m.prio==="KRITIEK");
  if (S.q) { const q = S.q.toLowerCase(); list = list.filter(m => (m.van+m.onderwerp+m.preview).toLowerCase().includes(q)); }
  const tab = (id,l) => `<button class="${S.filter===id?"on":""}" data-filter="${id}">${l}</button>`;
  const sel = S.mailBody;
  return `<div class="spread"><h1>Inbox</h1><div class="row">
      <button class="btn sm" data-a="allread">Alles gelezen</button>
      <button class="btn sm" data-a="compose">Nieuwe opdracht</button></div></div>
  ${st.besluiten.length ? `<div class="card decision" style="margin-bottom:12px;padding:10px 14px"><div class="spread"><span><b style="color:var(--amber)">${st.besluiten.length} besluit(en) open.</b> <span class="muted">De verhaallijn staat stil tot je kiest.</span></span><button class="btn sm warn" data-view="overzicht">Beslissen</button></div></div>`:""}
  <div class="inbox ${sel?"reading":""}">
    <div class="ilist">
      <div class="itools"><input type="text" id="q" placeholder="Zoeken in mail…" value="${esc(S.q)}">
        <div class="tabs">${tab("alles","Alles")}${tab("ongelezen","Ongelezen")}${tab("belangrijk","Belangrijk")}${tab("archief","Archief")}</div></div>
      <div class="mails">${list.length ? list.map(m => `<button class="mail ${m.gelezen?"":"unread"} ${sel&&sel.id===m.id?"sel":""}" data-open="${esc(m.id)}">
          <div class="from"><b>${esc(m.van)}</b><span class="mono dim" style="font-size:12px">${esc(m.datum)}</span></div>
          <div class="subj">${m.prio!=="NORMAAL"?`<span class="tag ${m.prio}">${m.prio}</span> `:""}${esc(m.onderwerp)}</div>
          <div class="prev">${esc(m.preview)}</div></button>`).join("") : '<div class="empty">Geen mail hier.</div>'}</div>
    </div>
    <div class="reader">${sel ? `
      <button class="btn sm back" data-a="closemail">← Terug</button>
      <div class="hdr"><h2>${esc(sel.meta.Onderwerp)}</h2>
        <div class="meta"><span>Van</span><b>${esc(sel.meta.Van)}</b><span>Aan</span><span>${esc(sel.meta.Aan)}</span>
          <span>Datum</span><span class="mono">${esc(sel.meta.Datum)}</span><span>Prioriteit</span><span><span class="tag ${esc(sel.meta.Prioriteit)}">${esc(sel.meta.Prioriteit)}</span></span></div>
        <div class="row" style="margin-top:12px">
          <button class="btn sm primary" data-a="reply">Reageren</button>
          <button class="btn sm" data-a="archive">${(st.mails.find(m=>m.id===sel.id)||{}).archief?"Terug naar inbox":"Archiveren"}</button>
          <button class="btn sm" data-a="unread">Markeer ongelezen</button></div>
        <div id="replybox" style="display:none;margin-top:12px">
          <textarea id="replytxt" placeholder="Wat doe je hiermee? Bijv.: Betaal de bron €2k en laat Jorik het natrekken."></textarea>
          <div class="row" style="margin-top:6px"><button class="btn primary sm" data-a="sendreply">Naar de GM sturen</button><span class="muted" style="font-size:12.5px">De GM verwerkt dit en antwoordt met een mail.</span></div></div>
      </div>
      <div class="md">${md(sel.body)}</div>` : '<div class="empty">Kies een mail.</div>'}
    </div>
  </div>`;
},
kaart(){
  const st = S.state, D = Object.fromEntries(st.districten.map(d => [d.id, d]));
  const pos = {A:[0,0],B:[1,0],C:[2,0],D:[0,1],E:[1,1],F:[2,1],G:[0,2],H:[2,2]};
  const W=200,H=130,P=14;
  const cells = Object.entries(pos).filter(([id]) => D[id]).map(([id,[x,y]]) => {
    const d = D[id], X = P + x*(W+P), Y = 46 + y*(H+P);
    const player = d.controle === "player";
    const hq = d.hq.length ? `<g transform="translate(${X+W-26},${Y+12})"><rect width="16" height="16" rx="2" fill="#3d1420" stroke="#ff4d6d"/><text x="8" y="12.5" text-anchor="middle" font-size="11" fill="#ff4d6d">${d.hq.length}</text></g>` : "";
    const flag = d.bezig ? `<text x="${X+12}" y="${Y+H-12}" font-size="11" fill="#a98bff">◷ vestiging in opbouw</text>` : "";
    return `<g class="dist ${player?"player":""} ${S.dist===id?"sel":""}" data-dist="${id}">
      <rect x="${X}" y="${Y}" width="${W}" height="${H}" rx="5"/>
      <text class="id" x="${X+12}" y="${Y+22}">[${id}]${d.thuis?" ⌂":""}</text>
      <text x="${X+12}" y="${Y+48}" font-size="16" font-weight="700">${esc(d.naam.toUpperCase().slice(0,16))}</text>
      <text x="${X+12}" y="${Y+70}" font-size="12" fill="#8a96a5">${player?"★ jouw district":d.controle==="neutral"?"neutraal":esc(d.controle)}</text>
      <text x="${X+12}" y="${Y+90}" font-size="12" fill="#5d6876">+${d.inkomen} / -${d.onderhoud} per mnd</text>
      ${hq}${flag}</g>`;
  }).join("");
  const rx = P + (W+P), ry = 46 + 2*(H+P);
  const svg = `<svg class="map" viewBox="0 0 ${3*W+4*P} ${46+3*(H+P)+8}" role="img" aria-label="Kaart van Meridian Bay">
    <rect x="0" y="0" width="100%" height="36" fill="#0a1a26"/>
    <text x="50%" y="23" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#3f7fa3" letter-spacing="4">~ ~ ~ NOORDZEE-HAVEN ~ ~ ~</text>
    ${cells}
    <g><rect x="${rx}" y="${ry}" width="${W}" height="${H}" rx="60" fill="none" stroke="#2e3846" stroke-dasharray="6 5" stroke-width="2"/>
      <text x="${rx+W/2}" y="${ry+H/2-4}" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#5d6876">RINGWEG</text>
      <text x="${rx+W/2}" y="${ry+H/2+14}" text-anchor="middle" font-size="11" fill="#5d6876">${st.contract===true?"nomadenpact actief":"nomadengebied"}</text></g>
  </svg>`;
  const d = S.dist && D[S.dist];
  const side = d ? `<div class="card"><div class="spread"><h3>[${d.id}] ${esc(d.naam)}</h3>${d.controle==="player"?'<span class="tag cyan">jouw district</span>':""}</div>
      ${d.lore?`<p class="muted" style="margin:4px 0 10px">${esc(d.lore)}</p>`:""}
      <dl class="kv"><dt>Inkomen</dt><dd>${eur(d.inkomen)} / mnd</dd><dt>Onderhoud</dt><dd>${eur(d.onderhoud)} / mnd</dd>
        <dt>Controle</dt><dd>${d.controle==="neutral"?"neutraal":esc(d.controle)}</dd><dt>Rivalen-HQ</dt><dd>${d.hq.length?esc(d.hq.join(", ")):"-"}</dd></dl>
      ${d.controle!=="player" ? `<div style="margin-top:14px"><button class="btn primary" data-a="district" data-id="${d.id}" ${d.bezig?"disabled":""}>Vestiging openen · ${eur(d.kost)}</button>
        <div class="muted" style="font-size:12.5px;margin-top:6px">Duurt 3 maanden, +€1k/mnd tijdens de opbouw.${d.hq.length?" Een rivaal heeft hier zijn HQ: dubbele prijs en die rivaal onthoudt het.":""}</div></div>`:""}
      <div style="margin-top:14px"><textarea id="disttxt" placeholder="Iets anders hier? Bijv.: Koop de wijkagent om, of bouw een opslagloods."></textarea>
        <button class="btn sm" style="margin-top:6px" data-a="distorder" data-id="${d.id}">Opdracht aan GM</button></div></div>`
    : `<div class="card"><h3>Meridian Bay</h3><p class="muted">Klik op een district.</p></div>`;
  return `<h1>Kaart</h1><div class="mapwrap"><div>${svg}
    <div class="legend"><span><i style="background:var(--cyan-d);border:1px solid var(--cyan)"></i>jouw district</span><span><i style="background:#3d1420;border:1px solid var(--red)"></i>rivalen-HQ (aantal)</span><span>⌂ thuisbasis</span></div></div>${side}</div>`;
},
bedrijf(){
  const st = S.state;
  return `<h1>Bedrijf</h1>
  <h2>Divisies</h2><div class="grid g3">${st.divisies.map(d => `<div class="card">
      <div class="spread"><h3>${esc(d.naam)}</h3><span class="tag cyan">L${d.level}</span></div>
      <div class="muted" style="font-size:13px">${esc(d.type)} · marktaandeel ~${d.aandeel}%</div>
      <div style="margin-top:10px"><button class="btn sm" data-a="upgrade" data-div="${esc(d.naam)}" ${d.bezig?"disabled":""}>${d.bezig?"Uitbreiding loopt":`Uitbreiden · ${eur(d.upgrade_kost)}`}</button></div></div>`).join("")}
    <div class="card"><h3>Nieuwe divisie</h3>
      <div class="row" style="margin-top:6px"><select id="ndtype">${st.divisie_types.map(t=>`<option>${esc(t)}</option>`).join("")}</select>
        <input type="text" id="ndname" placeholder="Naam" style="flex:1;min-width:100px"></div>
      <div class="row" style="margin-top:8px"><button class="btn sm primary" data-a="newdiv">Opstarten · ${eur(st.nieuwe_divisie_kost)}</button><span class="muted" style="font-size:12.5px">3 maanden, +€3k/mnd</span></div></div>
  </div>
  <h2>Projecten</h2>${st.projecten.length ? `<div class="grid g3">${st.projecten.map(p => `<div class="card"><h3 style="font-size:14px">${esc(p.name)}</h3>
      <div class="muted" style="font-size:13px">Nog ${p.eta_months} maand(en)${p.cost_per_month?` · ${eur(p.cost_per_month)}/mnd`:""}</div>
      <div class="prog"><i style="width:${Math.max(8, 100 - p.eta_months*30)}%"></i></div></div>`).join("")}</div>` : '<p class="muted">Geen lopende projecten.</p>'}
  <div class="grid g2" style="margin-top:8px">
    <div class="card"><h3>Directie</h3><table><tbody>${st.npcs.map(n => `<tr><td>${esc(n.naam)}</td><td class="muted">${esc(n.rol)}</td>
        <td><span class="tag ${n.indruk==="ontevreden"?"KRITIEK":n.indruk==="twijfelt"?"HOOG":"ok"}">${esc(n.indruk)}</span></td></tr>`).join("") || '<tr><td class="muted">Niemand. Dat is ook een keuze.</td></tr>'}</tbody></table>
      <p class="dim" style="font-size:12px;margin:8px 0 0">Dit is je indruk, niet de waarheid.</p></div>
    <div class="card"><h3>Personeel & cultuur</h3><dl class="kv">
      <dt>Medewerkers</dt><dd>${st.personeel.count}</dd><dt>Gem. salaris</dt><dd>${eur(st.personeel.avg_salary)}/jaar</dd>
      <dt>Ontslagbeleid</dt><dd>${st.cultuur.layoff_policy==="hard"?"hard":"normaal"}</dd><dt>Bonussen</dt><dd>${eur(st.cultuur.bonus_cost||0)}/mnd</dd>
      <dt>Ethiek</dt><dd>${esc((st.cultuur.ethics_rules||[]).join("; ")||"-")}</dd>
      <dt>Slogans</dt><dd>${esc((st.cultuur.slogans||[]).join(" · ")||"-")}</dd></dl></div>
  </div>
  <h2>Facties</h2><div class="card">${st.facties.map(f => {
      const v = f.waarde, w = Math.abs(v)/2, left = v<0 ? 50-w : 50;
      return `<div class="fac"><span style="text-transform:capitalize">${esc(f.naam)}</span>
        <div class="fbar" title="${esc(f.noot)}"><i style="left:${left}%;width:${w}%;background:${v<0?"var(--red)":"var(--cyan)"}"></i></div>
        <span class="muted" style="font-size:13px">${esc(f.label)}</span></div>`; }).join("")}</div>`;
},
financien(){
  const st = S.state;
  const accts = ["operationeel","zwart","offshore"];
  return `<h1>Financiën</h1>
  <div class="grid g3">
    <div class="card"><div class="muted" style="font-size:12px">OPERATIONEEL</div><div class="big">${eur(st.cash)}</div><div class="dim" style="font-size:12px">volgens de CFO</div></div>
    <div class="card"><div class="muted" style="font-size:12px">ZWART</div><div class="big">${eur(st.zwart)}</div></div>
    <div class="card"><div class="muted" style="font-size:12px">OFFSHORE</div><div class="big">${eur(st.offshore)}</div></div>
    <div class="card"><div class="muted" style="font-size:12px">SCHULD</div><div class="big">${eur(st.schuld)}</div><div class="dim" style="font-size:12px">${k(st.rente*100)}% per jaar · ≈${eur(st.schuld*st.rente/12)}/mnd</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Geld verplaatsen</h3><p class="muted" style="font-size:13px;margin:0 0 8px">Fee 5–15%. Kans op controle stijgt met het bedrag, je heat en zwart geld.</p>
      <div class="row"><select id="tvan">${accts.map(a=>`<option>${a}</option>`).join("")}</select> → <select id="tnaar">${accts.map((a,i)=>`<option ${i===2?"selected":""}>${a}</option>`).join("")}</select>
        <input type="number" id="tbedrag" min="1" step="1" placeholder="k€" style="width:90px"><button class="btn" data-a="transfer">Verplaatsen</button></div></div>
    <div class="card"><h3>Bank van de Oude Stad</h3><p class="muted" style="font-size:13px;margin:0 0 8px">Leenruimte nu: <b class="mono">${eur(st.leenruimte)}</b>. Rente hangt af van reputatie, schuld en heat, en geldt voor de hele schuld.</p>
      <div class="row"><input type="number" id="lbedrag" min="1" step="1" placeholder="k€" style="width:90px"><button class="btn" data-a="lening">Lenen</button>
        <button class="btn" data-a="aflossen" ${st.schuld?"":"disabled"}>Aflossen</button></div></div>
  </div>
  <h2>Facturen</h2>
  <div class="card"><div class="spread" style="margin-bottom:8px"><span class="muted" style="font-size:13px">Automatisch betalen op vervaldatum (als er cash is)</span>
      <button class="btn sm ${st.auto_pay?"":"warn"}" data-a="autopay">${st.auto_pay?"Aan":"Uit"}</button></div>
    ${st.facturen.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Van</th><th>Omschrijving</th><th class="num">Bedrag</th><th>Vervalt</th><th></th></tr></thead><tbody>
      ${st.facturen.map(f => `<tr><td>${esc(f.payee)}</td><td class="muted">${esc(f.note)}</td><td class="num">${eur(f.amount)}</td>
        <td>${f.overdue?`<span class="tag KRITIEK">${f.overdue} mnd te laat</span>`:f.due_in<=1?'<span class="tag HOOG">deze maand</span>':`over ${f.due_in} mnd`}</td>
        <td><div class="row" style="justify-content:flex-end;flex-wrap:nowrap"><button class="btn sm" data-a="pay" data-id="${f.id}">Betalen</button>
          <button class="btn sm ${f.auto_pay?"":"warn"}" data-a="hold" data-id="${f.id}" title="Bewust laten liggen of weer automatisch betalen">${f.auto_pay?"Laten liggen":"Vastgehouden"}</button></div></td></tr>`).join("")}
      </tbody></table></div>` : '<p class="muted">Geen openstaande facturen. Geniet ervan.</p>'}
  </div>`;
},
rivalen(){
  const st = S.state;
  return `<h1>Rivalen</h1><div class="grid g2">${st.rivalen.map(r => `<div class="card">
      <div class="spread"><h3>${esc(r.naam)}</h3><span class="tag ${r.agressie==="hoog"?"KRITIEK":r.agressie==="gemiddeld"?"HOOG":""}">agressie ${r.agressie}</span></div>
      <dl class="kv"><dt>CEO</dt><dd>${esc(r.ceo)}</dd><dt>Sector</dt><dd>${esc(r.sector)} (~${r.aandeel}%)</dd><dt>HQ</dt><dd>district ${esc(r.hq)}</dd>

},
opdrachten(){

  return `<h1>Opdrachten aan de GM</h1>
  <div class="card"><p class="muted" style="margin:0 0 8px;font-size:13px">Alles wat de knoppen niet kunnen. Open Claude Code in de map <code>chrome-ledger</code> en zeg <b>"verwerk opdrachten"</b>. De GM zegt eerlijk wat het kost, gooit de dobbelstenen en antwoordt met een mail.</p>

      ${x.status==="open"?`<button class="btn sm" data-a="cancel" data-id="${x.id}">Intrekken</button>`:""}</div>`).join("") : '<p class="muted">Nog niets verstuurd.</p>'}`;

logboek(){
  const st = S.state;
  return `<h1>Logboek</h1><div class="grid g2"><div class="card md">${md(st.log)}</div>
    <div class="card"><h3>Dobbelstenen</h3><p class="muted" style="font-size:13px;margin:0 0 8px">Elke worp van de GM, met tijd en reden. Zo zie je of er eerlijk gespeeld wordt.</p>
      <pre class="rolls">${esc(st.worpen.slice().reverse().join("\n")) || "Nog geen worpen."}</pre></div></div>

},
};

function decisionCard(b){
  return `<div class="card decision"><h3>${esc(b.titel)}</h3><p class="muted" style="margin:0">${esc(b.tekst)}</p>

/* ---- setup ---- */
function setupView(){
  const st = S.state;
  const T = S.setup ||= {corp_name:"", motto:"", background:"Ex-havenarbeider", doctrine:["Logistiek"], difficulty:"Realistisch", year:2004,
    kapitaal:"normaal", home:"A", ontslag:"normaal", bonus:"geen", ethiek:"normaal", slogan:"", divisie_naam:"", namen:{}};
  const types = (st.divisie_types||["Biotech","Cyberware","Logistiek","Media & Data","Private Security","Financieel","Smokkel"]);
  const chips = (key, opts, multi) => `<div class="chips">${opts.map(([v,l]) => `<button class="chip ${(multi?T[key].includes(v):T[key]===v)?"on":""}" data-chip="${key}" data-v="${esc(v)}" data-multi="${multi?1:""}">${esc(l)}</button>`).join("")}</div>`;
  const dists = [["A","Haven"],["B","Staal"],["C","Glas"],["D","Oude Stad"],["E","De Kruising"],["F","Neon Mile"],["G","Roest"],["H","Campus"]];
  return `<div style="padding:28px 16px 60px"><div class="setup">
    <div class="brand" style="font-size:18px;margin-bottom:4px">CHROME LEDGER</div>
    <p class="muted" style="margin:0 0 20px">Meridian Bay, een stad die alles verkoopt. Richt je bedrijf op. Alles is later aan te passen via de GM.</p>
    <div class="card"><h3>Het bedrijf</h3><div class="grid g2">
      <label class="f">Naam<input type="text" data-f="corp_name" value="${esc(T.corp_name)}" placeholder="Bijv. Kraanvogel Logistiek NV"></label>
      <label class="f">Motto<input type="text" data-f="motto" value="${esc(T.motto)}" placeholder="Bijv. Wij vragen niet wat er in de container zit."></label>
      <label class="f">Achtergrond oprichter<input type="text" data-f="background" value="${esc(T.background)}" list="bgs"></label>
      <label class="f">Naam eerste divisie (optioneel)<input type="text" data-f="divisie_naam" value="${esc(T.divisie_naam)}" placeholder="Bijv. Havenlijn"></label></div>
      <datalist id="bgs"><option>Ex-militair</option><option>Hacker</option><option>Erfgenaam</option><option>Ex-vakbondsman</option><option>Ex-havenarbeider</option><option>Gevallen bankier</option></datalist></div>
    <div class="card"><h3>Doctrine <span class="muted" style="font-weight:400;font-size:13px">kies 1 (sterk, niveau 2) of 2 (breed, elk niveau 1)</span></h3>${chips("doctrine", types.map(t=>[t,t]), true)}</div>
    <div class="grid g2">
      <div class="card"><h3>Moeilijkheid</h3>${chips("difficulty", [["Casual","Casual"],["Realistisch","Realistisch"],["Genadeloos","Genadeloos"]])}
        <h3 style="margin-top:14px">Startkapitaal</h3>${chips("kapitaal", [["krap","Krap · €80k"],["normaal","Normaal · €100k"],["ruim","Ruim · €150k, €60k schuld"]])}
        <label class="f" style="margin-top:14px;max-width:140px">Startjaar<input type="number" data-f="year" value="${esc(T.year)}"></label></div>
      <div class="card"><h3>Thuisdistrict</h3>${chips("home", dists.map(([id,n])=>[id, id+" · "+(T.namen[id]||n)]))}
        <p class="muted" style="font-size:13px;margin:10px 0 0">Haven: goedkope logistiek, vakbonden. Glas: prestige, duur. Roest: zwarte markt, goedkope arbeid. Campus: onderzoek.</p></div>
    </div>
    <div class="card"><h3>Cultuur</h3><div class="grid g2">
      <div><div class="muted" style="font-size:13px;margin-bottom:4px">Ontslag</div>${chips("ontslag", [["normaal","Normaal"],["hard","Hard (morale -2/mnd, vakbond boos)"]])}</div>
      <div><div class="muted" style="font-size:13px;margin-bottom:4px">Bonussen</div>${chips("bonus", [["geen","Geen"],["redelijk","Redelijk · €2k/mnd"],["royaal","Royaal · €5k/mnd"]])}</div>
      <div><div class="muted" style="font-size:13px;margin-bottom:4px">Ethiek</div>${chips("ethiek", [["streng","Streng (heat zakt sneller)"],["normaal","Normaal"],["geen_vragen","Geen vragen (heat blijft hangen)"]])}</div>
      <label class="f">Slogan(s), één per regel<textarea data-f="slogan" style="min-height:60px">${esc(T.slogan)}</textarea></label></div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary next" data-a="setup">BEDRIJF OPRICHTEN ▸</button></div>
  </div></div>`;
}
function bindSetup(){
  document.querySelectorAll("[data-f]").forEach(el => el.addEventListener("input", () => { S.setup[el.dataset.f] = el.value; }));
}

/* ---- events ---- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-view],[data-a],[data-open],[data-filter],[data-dist],[data-chip]");
  if (!t) return;
  if (t.dataset.view){ S.view = t.dataset.view; localSet("view", S.view); if (S.view!=="inbox") S.mailBody = null; render(); document.getElementById("main")?.scrollTo(0,0); return; }
  if (t.dataset.filter){ S.filter = t.dataset.filter; render(); return; }
  if (t.dataset.dist){ S.dist = t.dataset.dist; render(); return; }
  if (t.dataset.chip){
    const key = t.dataset.chip, v = t.dataset.v;
    if (t.dataset.multi){ const a = S.setup[key]; const i = a.indexOf(v); if (i>=0) { if (a.length>1) a.splice(i,1); } else { a.push(v); if (a.length>2) a.shift(); } }
    else S.setup[key] = v;
    render(); return;
  }
  if (t.dataset.open){ await openMail(t.dataset.open); return; }
  const a = t.dataset.a, val = id => (document.getElementById(id)||{}).value;
  switch (a){
    case "tick": return doTick(false);
    case "order": {
      const txt = val("ordertxt"); if (!txt || !txt.trim()) return toast("Schrijf eerst wat je wilt doen.", true);
      return act("/api/opdracht", {tekst: txt});
    }
    case "compose": S.view = "opdrachten"; render(); return;
    case "reply": { const b = document.getElementById("replybox"); b.style.display = b.style.display==="none"?"block":"none"; document.getElementById("replytxt").focus(); return; }
    case "sendreply": {
      const txt = val("replytxt"); if (!txt || !txt.trim()) return;
      return act("/api/opdracht", {tekst: txt, context: "Re: " + S.mailBody.meta.Onderwerp + " (" + S.mailBody.meta.Van + ")"});
    }
    case "archive": { const m = S.state.mails.find(m=>m.id===S.mailBody.id); await act("/api/mail/flag", {ids:[S.mailBody.id], soort:"archief", waarde:!m.archief}, {silent:true}); S.mailBody = null; render(); return; }
    case "unread": await act("/api/mail/flag", {ids:[S.mailBody.id], soort:"gelezen", waarde:false}, {silent:true}); S.mailBody = null; render(); return;
    case "allread": return act("/api/mail/flag", {ids: S.state.mails.map(m=>m.id), soort:"gelezen", waarde:true}, {silent:true});
    case "closemail": S.mailBody = null; render(); return;
    case "decide": {
      const bud = document.getElementById(`bud_${t.dataset.arc}_${t.dataset.keuze}`);
      if (!confirm("Zeker? Dit besluit is definitief.")) return;
      return act("/api/besluit", {arc:t.dataset.arc, keuze:t.dataset.keuze, budget: bud ? Number(bud.value) : 0});
    }
    case "district": if (!confirm("Vestiging openen? Het geld gaat er nu af.")) return; return act("/api/project", {soort:"district", id:t.dataset.id});
    case "distorder": { const txt = val("disttxt"); if (!txt || !txt.trim()) return; const d = S.state.districten.find(x=>x.id===t.dataset.id); return act("/api/opdracht", {tekst: txt, context: `District ${d.id} ${d.naam}`}); }
    case "upgrade": if (!confirm("Uitbreiden? Het geld gaat er nu af.")) return; return act("/api/project", {soort:"upgrade", divisie:t.dataset.div});
    case "newdiv": return act("/api/project", {soort:"divisie", type: val("ndtype"), naam: val("ndname")});
    case "transfer": return act("/api/geld", {soort:"transfer", van:val("tvan"), naar:val("tnaar"), bedrag:val("tbedrag")});
    case "lening": return act("/api/geld", {soort:"lening", bedrag:val("lbedrag")});
    case "aflossen": return act("/api/geld", {soort:"aflossen", bedrag:val("lbedrag") || S.state.schuld});
    case "autopay": return act("/api/factuur", {alles: !S.state.auto_pay});
    case "pay": return act("/api/factuur", {id:t.dataset.id, actie:"betaal"});
    case "hold": return act("/api/factuur", {id:t.dataset.id, actie:"toggle"});
    case "rivalorder": { S.view = "opdrachten"; render(); const ta = document.getElementById("ordertxt"); ta.value = `${t.dataset.naam}: `; ta.focus(); return; }
    case "cancel": return act("/api/opdracht/intrekken", {id:t.dataset.id}, {silent:true});
    case "save": return act("/api/save", {});
    case "nieuw": if (!confirm("Nieuw spel beginnen? De huidige stand wordt eerst als save bewaard.")) return; S.setup = null; return act("/api/nieuw", {zeker:true});
    case "setup": {
      if (!S.setup.corp_name.trim()) return toast("Geef je bedrijf een naam.", true);
      const r = await act("/api/setup", S.setup); if (r && r.ok){ S.view = "inbox"; localSet("view","inbox"); render(); }
      return;
    }
  }
});
document.addEventListener("input", e => { if (e.target.id === "q"){ S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos,pos); } });

async function openMail(id){
  const r = await api("/api/mail?id=" + encodeURIComponent(id));
  if (!r.ok) return toast(r.bericht, true);
  S.mailBody = r; S.view = "inbox"; localSet("view","inbox");
  await load();
}
async function doTick(force){
  if (S.busy) return;
  const r = await act("/api/tick", {force}, {silent:true});
  if (!r) return;
  if (r.vraag){ if (confirm(r.bericht + "\n\nToch doorgaan?")) return doTick(true); return; }
  if (!r.ok) return toast(r.bericht, true);
  if (r.status && r.status !== "actief") { toast("Het is voorbij: " + r.status, true); return; }
  toast(`Nieuwe maand. ${S.state.mails.filter(m=>!m.gelezen).length} ongelezen mail(s).`);
  if (r.rapport_mail) openMail(r.rapport_mail);
}

/* ---- live: de GM werkt in dezelfde map ---- */
setInterval(async () => {
  if (S.busy || document.hidden) return;
  const ae = document.activeElement;
  if (ae && (ae.tagName === "TEXTAREA" || (ae.tagName === "INPUT" && ae.id !== "q"))) return;
  try {
    const v = (await api("/api/versie")).versie;
    if (v && v !== S.version){
      const before = S.state && S.state.mails ? S.state.mails.length : 0;
      await load();
      const after = S.state.mails ? S.state.mails.length : 0;
      if (after > before) toast(`${after-before} nieuwe mail(s).`);
    }
  } catch(e){}
}, 3000);

load();
</script>
</body>
</html>
