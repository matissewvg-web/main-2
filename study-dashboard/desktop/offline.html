<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Study Dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05040a; color: #f5f4fa; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #8f8aa3; margin: 0 0 20px; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 16px; background: #2ee6c5; color: #00201b; font: 700 15px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Study Dashboard keeps your tests and sessions in your claude.ai account, so it needs an internet connection. Check your Wi-Fi and try again.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () {
    var to = new URLSearchParams(location.search).get('to');
    if (to) location.href = to;
  });
</script>
</body>
</html>
