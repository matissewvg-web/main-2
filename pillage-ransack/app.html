<title>Pillage Ransack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Grenze+Gotisch:wght@500;700&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: a war table at night. The parchment map and the season chronicle on the left,
   the campaign ledger (territory, raid, log, campaign) on the right; stacks on phones.
   One deliberate dark look: the table is dark wood, the map is always parchment. */
:root {
  color-scheme: dark;
  --table: #1b1713;
  --table-glow: #2a2119;
  --table-2: #241e18;
  --table-3: #30281f;
  --line: #4a3d2f;
  --fg: #efe4cc;
  --fg-muted: #b5a78c;
  --fg-faint: #8a7c63;
  --brass: #d4ac52;
  --brass-hover: #e3be6a;
  --brass-ink: #1b1713;
  --seal: #b23a2b;
  --seal-text: #f0a08a;
  --parchment: #ead9b4;
  --sea: #a9bfba;
  --map-ink: #3a2817;
  --good: #0ca30c;
  --good-text: #5fcf5f;
  --warning: #fab219;
  --critical: #d03b3b;
  --critical-text: #f08080;
  --focus: #f2d27e;
  --font-display: "Grenze Gotisch", "Iowan Old Style", Georgia, serif;
  --font-map: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --radius: 6px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: radial-gradient(ellipse 90% 60% at 40% 0%, var(--table-glow), var(--table) 70%) fixed, var(--table);
  color: var(--fg);
  font: 400 var(--step-0)/1.45 var(--font-ui);
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
.eyebrow { display: block; font: 400 var(--step--1)/1.2 var(--font-map); letter-spacing: 0.08em; color: var(--fg-muted); }
.muted { color: var(--fg-muted); }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 1680px; margin: 0 auto; padding-block: 12px 32px; padding-inline: 16px; display: grid; gap: 14px; }

/* header */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand h1 { font: 700 var(--step-3)/1 var(--font-display); color: var(--fg); letter-spacing: 0.01em; }
.brand h1 span { color: var(--seal-text); }
.brand .sub { margin: 2px 0 0; color: var(--fg-muted); font-size: var(--step--1); overflow-wrap: anywhere; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; }
.stats div { min-width: 0; }
.stats dt { font: 400 var(--step--1)/1.2 var(--font-map); letter-spacing: 0.08em; color: var(--fg-muted); }
.stats dd { margin: 2px 0 0; font-weight: 700; font-size: var(--step-1); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stats dd small { font-weight: 400; color: var(--fg-muted); font-size: var(--step--1); }
.morale { display: inline-block; width: 54px; height: 6px; border-radius: 3px; background: var(--table-3); vertical-align: middle; margin-left: 6px; overflow: hidden; }
.morale i { display: block; height: 100%; background: var(--brass); }
.season-ctl { display: flex; align-items: center; gap: 8px; }
.season-now strong { display: block; font: 700 var(--step-1)/1.1 var(--font-display); white-space: nowrap; }

/* buttons & fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--table-3); color: var(--fg); cursor: pointer; font-weight: 500; text-align: center; }
.btn:hover { border-color: var(--fg-faint); }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); font-weight: 700; }
.btn.primary:hover { background: var(--brass-hover); }
.btn.danger { border-color: var(--critical); color: var(--critical-text); background: transparent; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 30px; padding: 3px 10px; font-size: var(--step--1); }
.btn.icon { width: 36px; padding: 0; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .field > .label { font-size: var(--step--1); color: var(--fg-muted); }
.field input, .field select, .field textarea { width: 100%; min-height: 36px; padding: 6px 10px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--table); }
.field input:disabled { opacity: 0.5; }
.field textarea { min-height: 64px; resize: vertical; }
.hint { margin: 0; font-size: var(--step--1); color: var(--fg-faint); }
.row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.row > * { flex: 1 1 120px; min-width: 0; }
.row > .btn { flex: 0 0 auto; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; flex-wrap: wrap; }
.seg button, .seg label { border: 0; background: transparent; padding: 6px 12px; min-height: 34px; cursor: pointer; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"], .seg input:checked + span { color: var(--brass-ink); }
.seg button[aria-pressed="true"] { background: var(--brass); font-weight: 700; }
.seg label { position: relative; }
.seg label input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--brass); color: var(--brass-ink); font-weight: 700; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: -2px; }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 14px; border: 1px dashed var(--brass); border-radius: var(--radius); background: var(--table-2); }
.banner p { margin: 0; flex: 1 1 280px; min-width: 0; }

/* main layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 390px; grid-template-areas: "map panel" "chron panel"; gap: 14px 16px; align-items: start; }
.map-col { grid-area: map; display: grid; gap: 10px; min-width: 0; }
.map-toolbar .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.map-toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.toggles { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--step--1); color: var(--fg-muted); }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; min-height: 30px; }
.toggles input { accent-color: var(--brass); width: 16px; height: 16px; }

.map-shell { position: relative; width: min(100%, calc(64vh * 1000 / 700)); margin-inline: auto; }
.map-frame { position: relative; width: 100%; aspect-ratio: 1000 / 700; border-radius: 4px; overflow: hidden; background: var(--sea); box-shadow: 0 0 0 1px #00000066, 0 14px 40px #00000080; }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
.map-controls { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.map-controls .btn { min-height: 32px; background: #241e18e6; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 26px; padding: 8px 2px 0; font-size: var(--step--1); line-height: 1.3; color: var(--fg); }
.legend .group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; min-width: 0; }
.legend h4 { margin: 0; font: 400 var(--step--1)/1.2 var(--font-map); letter-spacing: 0.08em; color: var(--fg-muted); }
.legend ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend li { display: flex; align-items: center; gap: 6px; min-width: 0; }
.legend li span:last-child { min-width: 0; }
.sw { flex: 0 0 auto; width: 18px; height: 12px; border-radius: 2px; border: 1px solid #00000055; }
.sw.stripes { background: repeating-linear-gradient(45deg, var(--seal) 0 3px, #cdb99a 3px 6px); }
.sw.line { height: 4px; border: 0; border-radius: 2px; }
.sw.river { height: 4px; border: 0; background: #3f7186; }
.sw.lane { height: 0; border: 0; border-top: 2px dashed #6f9aa6; border-radius: 0; }
.preview { display: block; width: 100%; aspect-ratio: 1000 / 700; border-radius: 4px; border: 1px solid var(--line); background: var(--sea); }
.preview svg { display: block; width: 100%; height: 100%; }
.sw.claimed { background: linear-gradient(90deg, #b7a891, #b0705d); }
.tooltip { position: absolute; z-index: 3; pointer-events: none; padding: 6px 9px; border-radius: var(--radius); background: #1b1713f2; border: 1px solid var(--line); font-size: var(--step--1); line-height: 1.35; max-width: 220px; }
.tooltip strong { font-family: var(--font-map); font-weight: 400; font-size: var(--step-0); letter-spacing: 0.04em; }

/* SVG map */
.cell { stroke: none; cursor: pointer; }
.cell:hover { filter: brightness(1.06); }
.halo { fill: none; stroke-linejoin: round; }
.border, .coastline, .raid-glow, .raid-line, .select-ring, .target-ring, .frontier, .route-line, .plan-line, .owned-ring { vector-effect: non-scaling-stroke; }
.border { fill: none; stroke: var(--map-ink); stroke-width: 0.8; stroke-opacity: 0.6; stroke-linejoin: round; }
.coastline { fill: none; stroke: var(--map-ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.glyph { fill: var(--glyph-fill, #9fb27a); stroke: var(--map-ink); stroke-width: 0.9; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.glyph.g-mountains { fill: var(--mtn-fill, #a89f91); }
.glyph.g-hills { fill: var(--hill-fill, #c4b07a); }
.glyph.g-coast { fill: var(--boat-fill, #d9c7a0); }
.label { font-family: var(--font-map); fill: var(--map-ink); text-anchor: middle; paint-order: stroke; stroke: #f1e5c6; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; letter-spacing: 0.04em; }
.label.sub { font-family: var(--font-ui); font-weight: 700; letter-spacing: 0; }
.select-ring { fill: none; stroke: #1b1209; stroke-width: 3.2; stroke-linejoin: round; pointer-events: none; }
.select-ring.inner { stroke: #fff4d6; stroke-width: 1.2; }
.target-ring { fill: none; stroke: #1b1209; stroke-width: 2.4; stroke-dasharray: 7 5; pointer-events: none; animation: march 1.2s linear infinite; }
.frontier { fill: none; stroke: #7a5418; stroke-width: 1.6; stroke-dasharray: 1.5 4; stroke-linecap: round; pointer-events: none; }
.river { fill: none; stroke: #3f7186; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.river-halo { fill: none; stroke: #f1e7cb; stroke-opacity: 0.7; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.lake { stroke: #2f4f5a; stroke-width: 0.9; vector-effect: non-scaling-stroke; pointer-events: none; }
.sea-lane { fill: none; stroke: #2f4f5a; stroke-width: 1.5; stroke-dasharray: 7 6; stroke-linecap: round; stroke-opacity: 0.8; vector-effect: non-scaling-stroke; pointer-events: none; }
.islet { stroke: var(--map-ink); stroke-width: 1.1; vector-effect: non-scaling-stroke; pointer-events: none; }
.route-line { fill: none; stroke: #5d4630; stroke-width: 1.1; stroke-dasharray: 2 5; stroke-linecap: round; opacity: 0.8; }
.raid-glow { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.raid-line { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.raid-line.ongoing { stroke-dasharray: 8 6; animation: march 0.9s linear infinite; }
.raid.dim { opacity: 0.18; }
.raid.hot .raid-glow { stroke-width: 11; }
.plan-line { fill: none; stroke: #1b1209; stroke-width: 2.4; stroke-dasharray: 10 7; stroke-linecap: round; animation: march 1s linear infinite; pointer-events: none; }
.plan-label { font: 700 13px var(--font-ui); fill: #1b1209; paint-order: stroke; stroke: #f1e5c6; stroke-width: 3.5px; text-anchor: middle; pointer-events: none; }
.flash { animation: flash 1.1s ease-out 2; }
@keyframes march { to { stroke-dashoffset: -24; } }
@keyframes flash { 0% { filter: brightness(1.6) saturate(1.4); } 100% { filter: none; } }

/* chronicle */
.chronicle { grid-area: chron; display: grid; gap: 10px; padding: 12px 14px; border-radius: var(--radius); background: var(--table-2); border: 1px solid var(--line); min-width: 0; }
.progress-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 18px; align-items: center; }
.progress-label { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.progress-label strong { font: 700 var(--step-2)/1 var(--font-display); }
.progress { position: relative; height: 14px; border-radius: 7px; background: var(--table); border: 1px solid var(--line); }
.progress .fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 7px 0 0 7px; }
.progress .fill.conquered { background: var(--seal); z-index: 2; }
.progress .fill.claimed { background: repeating-linear-gradient(45deg, #b23a2b99 0 4px, #b23a2b44 4px 8px); z-index: 1; }
.progress .goal { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--brass); z-index: 3; }
.progress .goal span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: var(--brass); }
.progress-text { grid-column: 1 / -1; margin: 0; font-size: var(--step--1); color: var(--fg-muted); }
.seasons-scroll { overflow-x: auto; padding-bottom: 4px; scrollbar-color: var(--line) transparent; }
.seasons { list-style: none; margin: 0; padding: 0; display: flex; gap: 3px; min-width: max-content; }
.season { width: 92px; flex: 0 0 auto; display: grid; grid-template-rows: auto auto 1fr; gap: 5px; padding: 6px 6px 8px; border-radius: 4px; background: var(--table); border: 1px solid transparent; }
.season.now { border-color: var(--brass); }
.season.future { opacity: 0.45; border-style: dashed; border-color: var(--line); }
.season header { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; font-size: 11px; color: var(--fg-muted); }
.season header b { font: 400 12px var(--font-map); letter-spacing: 0.06em; color: var(--fg); }
.season .tint { height: 4px; border-radius: 2px; }
.dots { display: flex; flex-wrap: wrap; gap: 3px; min-height: 16px; align-content: flex-start; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #00000080; padding: 0; cursor: pointer; display: inline-grid; place-items: center; font: 700 10px/1 var(--font-ui); color: #1b1713; }
.dot.success { background: var(--good); color: #fff; }
.dot.failure { background: var(--critical); color: #fff; }
.dot.ongoing { background: var(--warning); }
.flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.flags li { display: flex; gap: 4px; font-size: 11px; line-height: 1.25; color: var(--fg); min-width: 0; }
.flags li span:last-child { overflow-wrap: anywhere; min-width: 0; }
.flags .fk { flex: 0 0 auto; width: 8px; height: 10px; margin-top: 2px; clip-path: polygon(0 0, 100% 25%, 0 50%); background: var(--fg-muted); }
.flags .victory .fk { background: var(--good-text); }
.flags .defeat .fk { background: var(--critical-text); }
.flags .empire .fk { background: var(--brass); }
.flags .custom .fk { background: var(--fg); }

/* ledger panel */
.panel { grid-area: panel; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); display: flex; flex-direction: column; border-radius: var(--radius); background: var(--table-2); border: 1px solid var(--line); min-width: 0; }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 10px 4px; min-height: 44px; cursor: pointer; color: var(--fg-muted); font: 400 var(--step--1)/1.1 var(--font-map); letter-spacing: 0.06em; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brass); }
.tab-body { padding: 14px; overflow-y: auto; display: grid; gap: 14px; align-content: start; min-height: 0; }
.tab-body h2 { font: 700 var(--step-2)/1.1 var(--font-display); overflow-wrap: anywhere; }
.tab-body h3 { font: 400 var(--step-0)/1.2 var(--font-map); letter-spacing: 0.06em; color: var(--fg-muted); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.terr-head { display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pill, .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: var(--step--1); border: 1px solid var(--line); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.unclaimed { color: #c9c1b2; }
.pill.claimed { color: #e9a58f; }
.pill.contested { color: var(--warning); }
.pill.conquered { color: var(--seal-text); border-color: var(--seal); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 0; }
.facts dt { font-size: var(--step--1); color: var(--fg-muted); }
.facts dd { margin: 1px 0 0; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.facts dd small { font-weight: 400; color: var(--fg-muted); }
.bar-mini { display: block; height: 5px; margin-top: 4px; border-radius: 3px; background: var(--table); overflow: hidden; }
.bar-mini i { display: block; height: 100%; background: var(--seal); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.empty { display: grid; gap: 10px; padding: 6px 0; color: var(--fg-muted); }
.empty p { margin: 0; }
.picklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.picklist button { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 10px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--table); cursor: pointer; text-align: left; }
.picklist button:hover { border-color: var(--fg-faint); }
.picklist .nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.picklist .mt { font-size: var(--step--1); color: var(--fg-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.log li { display: grid; gap: 6px; padding: 9px 10px; border-radius: var(--radius); background: var(--table); border: 1px solid var(--line); border-left-width: 4px; min-width: 0; }
.log li.success { border-left-color: var(--good); }
.log li.failure { border-left-color: var(--critical); }
.log li.ongoing { border-left-color: var(--warning); }
.log .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.log .who { font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
.log .when { font-size: var(--step--1); color: var(--fg-muted); white-space: nowrap; }
.log .what { font-size: var(--step--1); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.log .what b { color: var(--fg); font-weight: 500; }
.log .note { font-size: var(--step--1); font-style: italic; color: var(--fg-muted); overflow-wrap: anywhere; }
.outcome { font-weight: 700; }
.outcome.success { color: var(--good-text); }
.outcome.failure { color: var(--critical-text); }
.outcome.ongoing { color: var(--warning); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: var(--step--1); }
.callout { padding: 8px 10px; border-radius: var(--radius); background: var(--table); border: 1px solid var(--line); font-size: var(--step--1); color: var(--fg-muted); }
.callout b { color: var(--fg); }
.callout.warn { border-color: #fab21966; }
details { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
details summary { cursor: pointer; color: var(--fg); }
details[open] summary { margin-bottom: 8px; }
.rules { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: var(--step--1); color: var(--fg-muted); }
.store-status { display: flex; gap: 8px; align-items: center; font-size: var(--step--1); color: var(--fg-muted); }
.store-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-faint); flex: 0 0 auto; }
.store-status.cloud i { background: var(--good); }
.store-status.error i { background: var(--critical); }
.json-box { width: 100%; min-height: 140px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%) translateY(20px); opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 10; max-width: min(520px, calc(100vw - 32px)); padding: 10px 16px; border-radius: var(--radius); background: var(--parchment); color: var(--map-ink); font-weight: 500; box-shadow: 0 8px 30px #000a; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 1180px) {
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "map" "panel" "chron"; }
  .panel { position: static; max-height: none; }
  .map-shell { width: 100%; }
}
@media (max-width: 700px) {
  .brand h1 { font-size: var(--step-2); }
  .stats { gap: 6px 16px; width: 100%; }

  /* ---------- small helpers ---------- */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }
  function fmt(n) {
    return Math.round(n).toLocaleString('en-GB');
  }
  function signed(n) {
    return (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
  }
  function hexToRgb(h) {
    const n = parseInt(h.slice(1), 16);

  }
  function mix(a, b, t) {
    const A = hexToRgb(a);

  }
  function csTransform(n, f) {
    const k = (n.classList.contains('csg') ? f.glyph : f.label) * (Number(n.dataset.s) || 1);
    return 'translate(' + n.dataset.x + ' ' + n.dataset.y + ') scale(' + (n.dataset.flip ? -k : k).toFixed(3) + ' ' + k.toFixed(3) + ')';
  }
  function csNode(n, x, y, glyph, scale, flip) {
    n.classList.add('cs');
    if (glyph) n.classList.add('csg');
    n.dataset.x = x.toFixed(1);
    n.dataset.y = y.toFixed(1);
    if (scale) n.dataset.s = scale.toFixed(2);
    if (flip) n.dataset.flip = '1';
    n.setAttribute('transform', csTransform(n, S.csf || { label: 1, glyph: 1 }));
    return n;
  }
  function counterScale() {
    const f = (S.csf = csFactors());
    for (const n of viewport.querySelectorAll('.cs')) n.setAttribute('transform', csTransform(n, f));
  }
  function terr(id) {
    return S.campaign.territories.find((t) => t.id === id);
  }
  function terrName(id) {
    if (id === 'base') return 'Home (' + terr(S.campaign.baseTerritory).name + ')';
    const t = terr(id);
    return t ? t.name : 'Unknown';
  }
  function seasonText(year, season) {
    return E.seasonLabel(year, season);
  }
  function resolveSource(src) {
    return src === 'base' || !terr(src) ? S.campaign.baseTerritory : src;
  }
  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }
  function safeGet(key) {
    try {
      return localStorage.getItem(key);
    } catch (e) {
      return null;
    }
  }
  function safeSet(key, value) {
    try {
      localStorage.setItem(key, value);
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ---------- storage: claude.ai account when available, this browser otherwise ---------- */

  const store = { mode: 'local', db: null, col: null, timers: new Map(), chains: new Map(), error: null, unsub: null };

  function prefs() {
    try {
      return JSON.parse(safeGet(PREFS_KEY) || '{}') || {};
    } catch (e) {
      return {};
    }
  }
  function savePrefs(patch) {
    safeSet(PREFS_KEY, JSON.stringify(Object.assign(prefs(), patch)));
  }

  function loadLocal() {
    const raw = safeGet(LS_KEY);
    if (!raw) return [];
    try {
      const data = JSON.parse(raw);
      const out = [];
      for (const [key, c] of Object.entries((data && data.campaigns) || {})) {
        try {
          out.push(E.normalizeCampaign(c, key).campaign);
        } catch (e) {
          /* skip a damaged entry rather than lose the rest */
        }
      }
      return out;
    } catch (e) {
      return [];
    }
  }

  function saveLocal() {
    const campaigns = {};
    for (const c of S.campaigns.values()) if (c.saved) campaigns[c.id] = stripRuntime(c);
    safeSet(LS_KEY, JSON.stringify({ version: 1, campaigns }));
  }

  function stripRuntime(c) {
    const copy = Object.assign({}, c);
    delete copy.saved;
    delete copy.fresh;
    return copy;
  }

  function persist(c) {
    c.saved = true;
    delete c.fresh;
    saveLocal();
    if (store.mode !== 'cloud') return;
    clearTimeout(store.timers.get(c.id));
    store.timers.set(c.id, setTimeout(() => writeCloud(c.id), 500));
  }

  function writeCloud(id) {
    const prev = store.chains.get(id) || Promise.resolve();
    const next = prev.then(async () => {
      const c = S.campaigns.get(id);
      if (!c || store.mode !== 'cloud') return;
      const body = JSON.parse(JSON.stringify(stripRuntime(c)));
      const size = JSON.stringify(body).length;
      if (size > 250000) {
        setStoreError('This campaign is too large to sync (' + Math.round(size / 1024) + ' KB of 250 KB). It is still saved in this browser; export it as a backup.');
        return;
      }
      try {
        await store.col.doc(id).set(body);
        if (store.error) setStoreError(null);
      } catch (e) {
        if (e && e.code === 'unavailable') {
          await new Promise((r) => setTimeout(r, 800 + Math.random() * 800));
          try {
            await store.col.doc(id).set(body);
            return;
          } catch (e2) {
            e = e2;
          }
        }
        setStoreError("Couldn't save to your claude.ai account (" + ((e && e.code) || 'error') + '). Changes stay in this browser.');
      }
    });
    store.chains.set(id, next.catch(() => {}));
  }

  function removeCloud(id) {
    if (store.mode !== 'cloud') return;
    const prev = store.chains.get(id) || Promise.resolve();
    store.chains.set(id, prev.then(() => store.col.doc(id).delete()).catch(() => {}));
  }

  function setStoreError(msg) {
    store.error = msg;
    if (S.tab === 'campaign') renderPanel();
  }

  async function connectCloud() {
    if (!inViewer) return;
    let db;
    let user;
    try {
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    } catch (e) {
      return;
    }
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const col = db.collection('data/users/' + uid);
    let snap;
    try {
      snap = await col.get();
    } catch (e) {
      return;
    }
    store.db = db;
    store.col = col;
    store.mode = 'cloud';
    const remote = new Map();
    for (const d of snap.docs) {
      try {
        const c = E.normalizeCampaign(d.data(), d.id).campaign;
        c.id = d.id;
        c.saved = true;
        remote.set(d.id, c);
      } catch (e) {
        /* ignore unreadable documents */
      }
    }
    // Upload campaigns saved in this browser that the account doesn't have yet (or has older).
    for (const c of S.campaigns.values()) {
      const r = remote.get(c.id);
      if (c.saved && (!r || (c.updatedAt || 0) > (r.updatedAt || 0))) {
        remote.set(c.id, c);
        writeCloud(c.id);
      }
    }
    if (remote.size) {
      const activeId = S.campaign && remote.has(S.campaign.id) ? S.campaign.id : prefs().active;
      S.campaigns = remote;
      const pick = remote.get(activeId) || [...remote.values()].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
      if (pick !== S.campaign || (S.campaign && pick.updatedAt !== S.campaign.updatedAt)) setCampaign(pick, true);
      else saveLocal();
    }
    saveLocal();
    store.unsub = col.onSnapshot(onRemoteSnapshot, () => {
      /* subscription ended; writes still work and the next load resyncs */
    });
    renderHeader();
    if (S.tab === 'campaign') renderPanel();
  }

  function onRemoteSnapshot(snap) {
    let activeChanged = false;
    let listChanged = false;
    for (const ch of snap.docChanges()) {
      const id = ch.doc.id;
      if (ch.type === 'removed') {
        if (S.campaigns.has(id)) {
          S.campaigns.delete(id);
          listChanged = true;
          if (S.campaign && S.campaign.id === id) activeChanged = true;
        }
        continue;
      }
      const data = ch.doc.data();
      const mine = S.campaigns.get(id);
      if (mine && (mine.updatedAt || 0) >= (data.updatedAt || 0)) continue;
      try {
        const c = E.normalizeCampaign(data, id).campaign;
        c.id = id;
        c.saved = true;
        S.campaigns.set(id, c);
        listChanged = true;
        if (S.campaign && S.campaign.id === id) activeChanged = true;
      } catch (e) {
        /* ignore */
      }
    }
    if (!listChanged) return;
    saveLocal();
    if (activeChanged) {
      const next = S.campaigns.get(S.campaign.id) || [...S.campaigns.values()][0];
      if (next) setCampaign(next, true);
      else setCampaign(makeExample(), true);
      toast('Updated from another device');
    } else if (S.tab === 'campaign') renderPanel();
  }

  // Another tab in this browser saved (offline file or signed-out use).
  window.addEventListener('storage', (e) => {
    if (e.key !== LS_KEY || store.mode === 'cloud') return;
    const list = loadLocal();
    if (!list.length) return;
    const keepExample = S.campaign && !S.campaign.saved ? S.campaign : null;
    S.campaigns = new Map(list.map((c) => [c.id, Object.assign(c, { saved: true })]));
    if (keepExample) S.campaigns.set(keepExample.id, keepExample);
    const cur = S.campaign && S.campaigns.get(S.campaign.id);
    if (cur && cur !== S.campaign) {
      setCampaign(cur, true);
      toast('Updated from another tab');
    } else if (!cur) setCampaign(list[0], true);
  });

  /* ---------- campaign lifecycle ---------- */

  function makeExample() {
    const c = E.exampleCampaign(Date.now());
    c.saved = false;
    return c;
  }

  function setCampaign(c, keepUi) {
    S.campaigns.set(c.id, c);
    S.campaign = c;
    S.geo = E.buildGeometry(c);
    S.glyphs = null;
    savePrefs({ active: c.id });
    if (!keepUi || (S.selected && !terr(S.selected))) S.selected = null;
    if (!keepUi) S.view = { k: 1, x: 0, y: 0 };
    S.plan.target = S.plan.target && terr(S.plan.target) && S.plan.target !== c.baseTerritory ? S.plan.target : null;
    if (S.plan.source !== 'base' && !terr(S.plan.source)) S.plan.source = 'base';
    S.confirm = null;
    S.resolving = null;
    recompute();
    buildStatic();
    renderAll();
  }

  function recompute() {
    S.result = E.replay(S.campaign);
    E.snapshot(S.campaign, S.result);
  }

  function commit(message) {
    S.campaign.updatedAt = Date.now();
    recompute();
    persist(S.campaign);
    renderAll();
    if (message) toast(message);
  }

  /* ---------- static map layers (rebuilt when the geometry changes) ---------- */

  function buildStatic() {
    const geo = S.geo;
    const halo = $('layerHalo');
    const cells = $('layerCells');
    const borders = $('layerBorders');
    halo.textContent = '';
    cells.textContent = '';
    borders.textContent = '';
    const landD = geo.shapes.map((s) => E.pathData(s.points, true)).join('');
    [[22, 0.18], [12, 0.3], [5, 0.5]].forEach(([w, o]) => halo.appendChild(el('path', { class: 'halo', d: landD, stroke: '#e6e0c6', 'stroke-width': w, 'stroke-opacity': o })));
    geo.shapes.forEach((s) => {
      const p = el('path', { class: 'cell', d: E.pathData(s.points, true), 'data-id': s.id });
      cells.appendChild(p);
    });
    borders.appendChild(el('path', { class: 'border', d: geo.borders.map((b) => E.pathData(b.points, false)).join('') }));
    borders.appendChild(el('path', { class: 'coastline', d: geo.coast.map((c) => E.pathData(c, false)).join('') }));
    S.sea = seaFeatures();
    S.lakes = placeLakes();
    placeGlyphs();
    drawSea();
    drawDecor();
    if (!$('paper').getAttribute('href')) $('paper').setAttribute('href', paperTexture());
    applyView();
  }

  // Aged-parchment mottling, drawn once to a canvas and laid over the map with multiply.
  function paperTexture() {
    try {
      const cw = 800;
      const ch = 560;
      const cv = document.createElement('canvas');
      cv.width = cw;
      cv.height = ch;
      const ctx = cv.getContext('2d');
      const img = ctx.createImageData(cw, ch);
      const n1 = E.valueNoise(11);
      const n2 = E.valueNoise(23);
      const rnd = E.mulberry32(7);
      for (let y = 0; y < ch; y++) {
        for (let x = 0; x < cw; x++) {
          const ex = (x / cw - 0.5) * 2;
          const ey = (y / ch - 0.5) * 2;
          const vign = Math.max(0, Math.sqrt(ex * ex * 0.8 + ey * ey * 0.9) - 0.55) * 0.55;
          let v = 0.12 + 0.1 * n1(x / 70, y / 70) + 0.06 * n2(x / 18, y / 18) + 0.05 * (rnd() - 0.5) + vign;
          v = Math.max(0, Math.min(0.6, v));
          const i = (y * cw + x) * 4;
          img.data[i] = 255 - v * 70;
          img.data[i + 1] = 255 - v * 95;
          img.data[i + 2] = 255 - v * 140;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      return cv.toDataURL('image/jpeg', 0.82);
    } catch (e) {
      return '';
    }
  }

  function labelSize(shape) {
    return Math.max(10.5, Math.min(15, Math.sqrt(shape.area) / 9.5));
  }

  function placeGlyphs() {
    const out = [];
    const want = { mountains: 4, forest: 5, hills: 3, marsh: 3, grassland: 2, coast: 1 };
    S.geo.shapes.forEach((sh, i) => {
      const t = S.campaign.territories[i];
      const rng = E.mulberry32(E.hashString('glyph:' + t.id + ':' + S.campaign.seed));
      const pts = sh.points;
      let minx = Infinity;
      let miny = Infinity;
      let maxx = -Infinity;
      let maxy = -Infinity;
      for (const p of pts) {
        if (p[0] < minx) minx = p[0];
        if (p[0] > maxx) maxx = p[0];
        if (p[1] < miny) miny = p[1];
        if (p[1] > maxy) maxy = p[1];
      }
      const c = sh.centroid;
      const fs = labelSize(sh);
      const halfW = t.name.length * fs * 0.34 + 8;
      const count = Math.max(1, Math.min(9, Math.round((want[t.terrain] * sh.area) / 8000)));
      const inside = (x, y) => x > 8 && x < W - 8 && y > 8 && y < H - 8 && E.clearOfDecor(x, y, 8) && E.pointInPolygon([x, y], pts);
      const lakes = S.lakes.concat(S.geo.lakes);
      const conifers = 0.25 + rng() * 0.6;
      const placed = [];
      for (let tries = 0; tries < 200 && placed.length < count; tries++) {
        const x = minx + rng() * (maxx - minx);
        const y = miny + rng() * (maxy - miny);
        if (!inside(x, y) || !inside(x + 11, y) || !inside(x - 11, y) || !inside(x, y + 10) || !inside(x, y - 10)) continue;
        if (Math.abs(x - c[0]) < halfW && y > c[1] - fs - 24 && y < c[1] + 26) continue;
        if (placed.some((q) => Math.hypot(q[0] - x, q[1] - y) < 17)) continue;
        if (lakes.some((l) => Math.hypot(l.x - x, l.y - y) < l.r + 11)) continue;
        let kind = t.terrain;
        let scale = 1;
        if (kind === 'forest' && rng() < conifers) kind = 'forest2';
        if (kind === 'mountains') scale = 0.85 + rng() * 0.55;
        else if (kind === 'hills') scale = 0.9 + rng() * 0.3;
        else if (kind.startsWith('forest')) scale = 0.85 + rng() * 0.3;
        placed.push([x, y, kind, scale]);
      }
      out.push({ id: t.id, terrain: t.terrain, pts: placed });
    });
    S.glyphs = out;
    const g = $('layerGlyphs');
    g.textContent = '';
    for (const set of out) {
      // Top to bottom, so nearer glyphs overlap the ones behind them.
      for (const p of set.pts.slice().sort((a, b) => a[1] - b[1])) {
        g.appendChild(csNode(el('use', { href: '#g-' + p[2], class: 'glyph g-' + set.terrain }), p[0], p[1], true, p[3]));
      }
    }
  }

  // Ponds in marshes (and the odd one elsewhere), added to the lakes rivers end in.
  function placeLakes() {
    const out = [];
    const rng = E.mulberry32(E.hashString('lakes:' + S.campaign.seed));
    S.geo.shapes.forEach((sh, i) => {
      const t = S.campaign.territories[i];
      const chance = t.terrain === 'marsh' ? 0.85 : t.terrain === 'grassland' || t.terrain === 'forest' ? 0.12 : 0;
      if (out.length >= 4 || rng() >= chance) return;
      const fs = labelSize(sh);
      const c = sh.centroid;
      for (let tries = 0; tries < 60; tries++) {
        const a = rng() * Math.PI * 2;
        const d = 20 + rng() * Math.sqrt(sh.area) * 0.3;
        const x = c[0] + Math.cos(a) * d;
        const y = c[1] + Math.sin(a) * d;
        const r = 7 + rng() * 5;
        const ok = [[0, 0], [r + 8, 0], [-r - 8, 0], [0, r + 8], [0, -r - 8]].every(([dx, dy]) => E.pointInPolygon([x + dx, y + dy], sh.points));
        if (!ok || x < 15 || x > W - 15 || y < 15 || y > H - 15 || !E.clearOfDecor(x, y, r + 6)) continue;
        if (Math.abs(x - c[0]) < t.name.length * fs * 0.34 + r + 6 && y > c[1] - fs - 24 - r && y < c[1] + 12 + r) continue;
        out.push({ x, y, r });
        break;
      }
    });
    return out;
  }

  function blobPath(x, y, r, seed, n) {
    const noise = E.valueNoise(seed);
    const pts = [];
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2;
      const rr = r * (0.78 + 0.32 * noise(Math.cos(a) * 1.6 + 10, Math.sin(a) * 1.6 + 10));
      pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
    }
    return E.pathData(pts, true);
  }

  // Islets, longships and a sea serpent, in open water away from the map furniture.
  function seaFeatures() {
    const geo = S.geo;
    const rng = E.mulberry32(E.hashString('sea:' + S.campaign.seed));
    const coastPts = [];
    for (const seg of geo.coast) for (let k = 0; k < seg.length; k += 2) coastPts.push(seg[k]);
    const zones = E.DECOR_ZONES.concat([[820, 630, 1000, 700]]);
    const free = (x, y, r) => zones.every(([x0, y0, x1, y1]) => Math.hypot(Math.max(x0 - x, 0, x - x1), Math.max(y0 - y, 0, y - y1)) > r);
    const onLand = (x, y) => geo.shapes.some((sh) => E.pointInPolygon([x, y], sh.points));
    const coastDist = (x, y) => coastPts.reduce((m, p) => Math.min(m, Math.hypot(p[0] - x, p[1] - y)), Infinity);
    const taken = [];
    const find = (minCoast, r, tries) => {
      for (let t = 0; t < tries; t++) {
        const x = 20 + r + rng() * (W - 40 - 2 * r);
        const y = 20 + r + rng() * (H - 40 - 2 * r);
        if (!free(x, y, r + 4) || taken.some((q) => Math.hypot(q[0] - x, q[1] - y) < q[2] + r + 26)) continue;
        if (coastDist(x, y) < minCoast + r || onLand(x, y)) continue;
        taken.push([x, y, r]);
        return [x, y];
      }
      return null;
    };
    const islets = [];
    const nIslets = 3 + Math.floor(rng() * 4);
    for (let k = 0; k < nIslets; k++) {
      const r = 6 + rng() * 9;
      const p = find(30, r, 120);
      if (p) islets.push({ x: p[0], y: p[1], r, seed: k + 1 });
    }
    const ships = [];
    const nShips = 1 + Math.floor(rng() * 2);
    for (let k = 0; k < nShips; k++) {
      const p = find(48, 22, 160);
      if (p) ships.push({ x: p[0], y: p[1], flip: rng() < 0.5, s: 0.8 + rng() * 0.25 });
    }
    let serpent = null;
    if (rng() < 0.65) {
      const p = find(55, 32, 160);
      if (p) serpent = { x: p[0], y: p[1], flip: rng() < 0.5 };
    }
    return { islets, ships, serpent };
  }

  function drawSea() {
    const sea = S.sea;
    const halo = $('layerHalo');
    const islets = $('layerIslets');
    const deco = $('layerSeaDecor');
    const lakes = $('layerLakes');
    islets.textContent = '';
    deco.textContent = '';
    lakes.textContent = '';
    const isletD = sea.islets.map((i) => blobPath(i.x, i.y, i.r, i.seed * 31 + 5, 14)).join('');
    if (isletD) {
      [[12, 0.25], [5, 0.5]].forEach(([w, o]) => halo.appendChild(el('path', { class: 'halo', d: isletD, stroke: '#e6e0c6', 'stroke-width': w, 'stroke-opacity': o })));
      islets.appendChild(el('path', { id: 'isletPath', class: 'islet', d: isletD }));
    }
    for (const sh of sea.ships) deco.appendChild(csNode(el('use', { href: '#g-ship', 'pointer-events': 'none' }), sh.x, sh.y, false, sh.s, sh.flip));
    if (sea.serpent) deco.appendChild(csNode(el('use', { href: '#g-serpent', 'pointer-events': 'none' }), sea.serpent.x, sea.serpent.y, false, 1, sea.serpent.flip));
    for (const l of S.lakes.concat(S.geo.lakes)) {
      lakes.appendChild(el('path', { class: 'lake lake-fill', d: blobPath(l.x, l.y, l.r, Math.round(l.x * 7 + l.y), 12) }));
      lakes.appendChild(el('path', { d: 'M' + (l.x - l.r * 0.45).toFixed(1) + ' ' + (l.y + 1).toFixed(1) + 'h' + (l.r * 0.5).toFixed(1), stroke: '#2f4f5a', 'stroke-width': 0.7, 'stroke-opacity': 0.6, 'pointer-events': 'none' }));
    }
    const rivers = $('layerRivers');
    rivers.textContent = '';
    for (const r of S.geo.rivers) {
      const pts = r.points;
      const n = pts.length;
      rivers.appendChild(el('path', { class: 'river-halo', d: E.pathData(pts, false), 'stroke-width': 4.6 }));
      // Wider downstream: three runs of increasing width.
      [[0, 0.4, 1.3], [0.4, 0.75, 1.9], [0.75, 1, 2.6]].forEach(([a, b, w]) => {
        const i0 = Math.floor(a * (n - 1));
        const seg = pts.slice(i0, Math.max(Math.floor(b * (n - 1)) + 1, i0 + 2));
        if (seg.length > 1) rivers.appendChild(el('path', { class: 'river', d: E.pathData(seg, false), 'stroke-width': w }));
      });
    }
    const lanes = $('layerLanes');
    lanes.textContent = '';
    for (const ln of S.geo.seaLanes) {
      const a = S.geo.shapes[ln.a].centroid;
      const b = S.geo.shapes[ln.b].centroid;
      const at = (t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      const nx = -(b[1] - a[1]) / len;
      const ny = (b[0] - a[0]) / len;
      const s0 = at(0.2);
      const s1 = at(0.8);
      const m = at(0.5);
      const ctrl = [m[0] + nx * len * 0.08, m[1] + ny * len * 0.08];
      lanes.appendChild(el('path', { class: 'sea-lane', d: 'M' + s0[0].toFixed(1) + ' ' + s0[1].toFixed(1) + 'Q' + ctrl[0].toFixed(1) + ' ' + ctrl[1].toFixed(1) + ' ' + s1[0].toFixed(1) + ' ' + s1[1].toFixed(1) }));

  /* ---------- dynamic map layers ---------- */

  function fillFor(t, d, pal) {
    const base = pal[t.terrain] || pal.grassland;
    if (S.mode === 'terrain') return base;
    if (S.mode === 'wealth') return WEALTH[bin(t.goldValue, S.wealthRange)];
    if (S.mode === 'resistance') return RESIST[bin(d.garrison, S.resistRange)];
    const muted = mix(base, NEUTRAL, 0.55);
    if (d.status === 'conquered' || d.isBase) return PLAYER;
    if (d.control > 0) return mix(muted, PLAYER, 0.12 + 0.43 * (d.control / 100));
    return muted;
  }

  function bin(v, range) {
    const [lo, hi] = range;
    if (hi <= lo) return 0;
    return Math.max(0, Math.min(4, Math.floor(((v - lo) / (hi - lo)) * 5 - 1e-9)));
  }

  function renderMap() {
    const c = S.campaign;
    const res = S.result;
    const pal = SEASON_PALETTE[c.season];
    svg.style.setProperty('--glyph-fill', pal.glyph);
    svg.style.setProperty('--mtn-fill', pal.rock);
    svg.style.setProperty('--hill-fill', mix(pal.hills, '#3a2817', 0.12));
    svg.style.setProperty('--boat-fill', '#d9c7a0');
    svg.style.setProperty('--cap', pal.cap);
    $('seaRect').setAttribute('fill', pal.sea);
    const isl = $('isletPath');
    if (isl) isl.setAttribute('fill', mix(pal.coast, NEUTRAL, 0.35));
    document.querySelectorAll('.lake-fill').forEach((l) => l.setAttribute('fill', c.season === 'winter' ? '#dfe8ec' : mix(pal.sea, '#ffffff', 0.18)));
    $('mapFrame').style.background = pal.sea;
    const golds = c.territories.map((t) => t.goldValue);
    S.wealthRange = [Math.min(...golds), Math.max(...golds)];
    S.resistRange = [0, Math.max(1, ...c.territories.map((t) => res.territories.get(t.id).garrison))];

    const cellEls = $('layerCells').children;
    c.territories.forEach((t, i) => {
      const d = res.territories.get(t.id);
      const p = cellEls[i];
      p.setAttribute('fill', fillFor(t, d, pal));
      p.setAttribute('aria-label', t.name + ', ' + STATUS_LABEL[d.status]);

    $('cartoucheName').textContent = c.name.length > 24 ? c.name.slice(0, 23) + '…' : c.name;
    $('cartoucheSeason').textContent = seasonText(c.year, c.season);

    renderOverlay();
    renderFrontier();
    renderRoutes();
    renderRaids();
    renderPlanPath();
    renderIcons();
    renderLabels();
    renderSelection();
    renderLegend();
    startTokens();
  }

          grp.appendChild(el('ellipse', { cx: x.toFixed(1), cy: y.toFixed(1), rx: (r0 * (0.6 + rng() * 0.7)).toFixed(1), ry: (r0 * (0.4 + rng() * 0.5)).toFixed(1), fill: 'url(#scorch)', transform: 'rotate(' + Math.round(rng() * 180) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')' }));
          if (rng() < 0.6) grp.appendChild(el('circle', { cx: (x + (rng() - 0.5) * 8).toFixed(1), cy: (y + (rng() - 0.5) * 8).toFixed(1), r: 1.3, fill: '#e2661f', 'fill-opacity': 0.85 }));

  // Smooth curve through route centroids, shifted sideways so raids on the same road stay visible.
  function raidCurve(srcId, dstId, offset) {
    const geo = S.geo;
    const a = geo.index.get(resolveSource(srcId));
    const b = geo.index.get(dstId);
    const route = E.findRoute(geo, a, b);
    let pts = route.map((i) => geo.shapes[i].centroid.slice());
    if (pts.length === 2) {
      const [p, q] = pts;
      const mx = (p[0] + q[0]) / 2;
      const my = (p[1] + q[1]) / 2;
      const len = Math.hypot(q[0] - p[0], q[1] - p[1]) || 1;
      pts = [p, [mx - ((q[1] - p[1]) / len) * len * 0.18, my + ((q[0] - p[0]) / len) * len * 0.18], q];
    }
    if (offset) {
      pts = pts.map((p, i) => {
        const prev = pts[Math.max(0, i - 1)];
        const next = pts[Math.min(pts.length - 1, i + 1)];
        const dx = next[0] - prev[0];
        const dy = next[1] - prev[1];
        const l = Math.hypot(dx, dy) || 1;
        const k = i === 0 || i === pts.length - 1 ? 0.35 : 1;
        return [p[0] - (dy / l) * offset * k, p[1] + (dx / l) * offset * k];
      });
    }
    let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[Math.min(pts.length - 1, i + 2)];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += 'C' + c1[0].toFixed(1) + ' ' + c1[1].toFixed(1) + ' ' + c2[0].toFixed(1) + ' ' + c2[1].toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    return { d, route, end: pts[pts.length - 1], start: pts[0], mid: pts[Math.floor(pts.length / 2)] };
  }

  function recentRaids() {
    return S.campaign.raids.slice().sort((a, b) => b.timestamp - a.timestamp).slice(0, 10);
  }

  function renderRaids() {
    const g = $('layerRaids');
    g.textContent = '';
    S.raidPaths = new Map();
    if (!S.showRaids) return;
    const list = recentRaids().reverse(); // oldest first so the newest draws on top
    list.forEach((r, k) => {
      const o = OUTCOME[r.outcome];
      const offset = (k - (list.length - 1) / 2) * 3.2;
      const curve = raidCurve(r.sourceTerritory, r.targetTerritory, offset);
      const age = list.length - 1 - k;
      const grp = el('g', { class: 'raid' + (S.hotRaid && S.hotRaid !== r.id ? ' dim' : '') + (S.hotRaid === r.id ? ' hot' : ''), opacity: (1 - age * 0.06).toFixed(2), 'data-raid': r.id });
      grp.appendChild(el('path', { class: 'raid-glow', d: curve.d, stroke: o.glow, 'stroke-width': 7, 'stroke-opacity': 0.38 }));
      const line = el('path', { class: 'raid-line ' + r.outcome, d: curve.d, stroke: o.ink, 'stroke-width': 2 });
      grp.appendChild(line);
      const [ex, ey] = curve.end;
      if (r.outcome === 'success') {
        const f = el('g');
        f.appendChild(el('path', { d: 'M0 2 V-14', stroke: '#2a1b0e', 'stroke-width': 1.3 }));
        f.appendChild(el('path', { d: 'M0.6 -14 L10 -10.5 L0.6 -7 Z', fill: o.glow, stroke: '#2a1b0e', 'stroke-width': 0.7 }));
        grp.appendChild(csNode(f, ex, ey));
      } else if (r.outcome === 'failure') {
        const x = el('g');
        x.appendChild(el('path', { d: 'M-5 -5l10 10m0 -10l-10 10', stroke: '#f6ecd2', 'stroke-width': 4.5, 'stroke-linecap': 'round' }));
        x.appendChild(el('path', { d: 'M-5 -5l10 10m0 -10l-10 10', stroke: o.ink, 'stroke-width': 2.2, 'stroke-linecap': 'round' }));
        grp.appendChild(csNode(x, ex, ey));
      }
      g.appendChild(grp);
      S.raidPaths.set(r.id, line);
    });
  }

  function renderLegend() {
    const lg = $('legend');
    const pal = SEASON_PALETTE[S.campaign.season];
    let html = '<div class="group">';
    const item = (sw, text) => '<li>' + sw + '<span>' + text + '</span></li>';
    if (S.mode === 'political') {
      html += '<h4>Territory</h4><ul>';
      html += item('<span class="sw" style="background:' + mix(pal.grassland, NEUTRAL, 0.55) + '"></span>', 'Unclaimed');
      html += item('<span class="sw claimed"></span>', 'Claimed (darker = more control)');
      html += item('<span class="sw stripes"></span>', 'Contested');
      html += item('<span class="sw" style="background:' + PLAYER + '"></span>', 'Conquered');
      html += item('<span class="sw" style="background:#2a1b0e;opacity:.75;border-radius:50%"></span>', 'Scorched by a failed raid');
      html += '</ul>';

      html += '<h4>Gold value</h4><ul>' + rampItems(WEALTH, S.wealthRange, ' gold') + '</ul>';
    } else if (S.mode === 'resistance') {
      html += '<h4>Garrison now (shield size)</h4><ul>' + rampItems(RESIST, S.resistRange, ' men') + '</ul>';
    } else {
      html += '<h4>Terrain in ' + S.campaign.season + '</h4><ul>';
      for (const k of E.TERRAINS) html += item('<span class="sw" style="background:' + pal[k] + '"></span>', E.TERRAIN_STATS[k].label);

      for (const k of ['success', 'failure', 'ongoing']) html += item('<span class="sw line" style="background:' + OUTCOME[k].glow + '"></span>', OUTCOME[k].sym + ' ' + OUTCOME[k].label);
      html += '</ul></div>';
    }
    lg.innerHTML = html;
  }

  function rampItems(ramp, range, unit) {
    const [lo, hi] = range;
    const step = (hi - lo) / 5;
    let out = '';
    for (let i = 4; i >= 0; i--) {
      const a = Math.round(lo + step * i);
      const b = Math.round(lo + step * (i + 1));
      out += '<li><span class="sw" style="background:' + ramp[i] + '"></span><span class="num">' + fmt(a) + '–' + fmt(b) + unit + '</span></li>';
    }
    return out;
  }

  /* ---------- raiding-party tokens ---------- */

  let tokenFrame = 0;
  function startTokens() {
    cancelAnimationFrame(tokenFrame);
    const g = $('layerTokens');
    g.textContent = '';
    if (!S.showRaids || !S.raidPaths) return;
    const tokens = [];
    for (const r of recentRaids()) {
      const line = S.raidPaths.get(r.id);
      if (!line) continue;
      const oneShot = S.lastLogged && S.lastLogged.id === r.id && Date.now() - S.lastLogged.at < 2500;
      if (r.outcome !== 'ongoing' && !oneShot) continue;
      const tok = el('g', { 'pointer-events': 'none' });
      tok.appendChild(el('circle', { r: 6.5, fill: '#efe1bf', stroke: '#2a1b0e', 'stroke-width': 1.4 }));
      tok.appendChild(el('path', { d: 'M-2.5 3 V-4 L3 -2 L-2.5 0', fill: PLAYER, stroke: '#2a1b0e', 'stroke-width': 0.8 }));
      g.appendChild(tok);
      tokens.push({ r, line, tok, len: line.getTotalLength(), oneShot, t0: oneShot ? S.lastLogged.at : 0 });
    }
    if (!tokens.length) return;
    const place = (tk, f) => {
      const pt = tk.line.getPointAtLength(tk.len * f);
      tk.tok.setAttribute('transform', 'translate(' + pt.x.toFixed(1) + ' ' + pt.y.toFixed(1) + ') scale(' + ((S.csf && S.csf.label) || 1).toFixed(3) + ')');
    };
    if (reduceMotion) {
      tokens.forEach((tk) => place(tk, tk.oneShot && tk.r.outcome !== 'ongoing' ? 1 : 0.6));
      return;
    }
    const loop = (now) => {
      let alive = false;
      for (const tk of tokens) {
        if (tk.oneShot) {
          const f = Math.min(1, (Date.now() - tk.t0) / 1600);
          const eased = 1 - Math.pow(1 - f, 2);
          if (f >= 1 && tk.r.outcome !== 'ongoing') {
            if (tk.tok.parentNode) {
              tk.tok.remove();
              flashCell(tk.r.targetTerritory);
            }
            continue;
          }
          if (f >= 1) tk.oneShot = false;
          place(tk, eased);
          alive = true;
        } else {
          place(tk, ((now / 4200) % 1) * 0.94 + 0.03);
          alive = true;
        }
      }
      if (alive && !document.hidden) tokenFrame = requestAnimationFrame(loop);
    };
    tokenFrame = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && S.campaign) startTokens();

  function flashCell(id) {
    const idx = S.geo.index.get(id);
    const p = $('layerCells').children[idx];
    if (!p || reduceMotion) return;

  /* ---------- zoom & pan ---------- */

  function applyView() {
    const v = S.view;
    viewport.setAttribute('transform', 'translate(' + v.x.toFixed(2) + ' ' + v.y.toFixed(2) + ') scale(' + v.k.toFixed(4) + ')');
    counterScale();
  }
  if (window.ResizeObserver) new ResizeObserver(() => S.campaign && counterScale()).observe($('mapFrame'));
  function clampView() {
    const v = S.view;
    v.k = Math.max(1, Math.min(6, v.k));
    v.x = Math.max(W - W * v.k, Math.min(0, v.x));
    v.y = Math.max(H - H * v.k, Math.min(0, v.y));
  }
  function zoomAt(px, py, factor) {
    const v = S.view;
    const k2 = Math.max(1, Math.min(6, v.k * factor));
    const f = k2 / v.k;
    v.x = px - (px - v.x) * f;
    v.y = py - (py - v.y) * f;
    v.k = k2;
    clampView();
    applyView();
  }
  function toViewBox(clientX, clientY) {
    const r = svg.getBoundingClientRect();
    const s = Math.min(r.width / W, r.height / H) || 1;
    const ox = (r.width - W * s) / 2;
    const oy = (r.height - H * s) / 2;
    return [(clientX - r.left - ox) / s, (clientY - r.top - oy) / s, s];
  }
  function toWorld(vbx, vby) {
    return [(vbx - S.view.x) / S.view.k, (vby - S.view.y) / S.view.k];
  }

  const pointers = new Map();
  let gesture = null;
  svg.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    svg.setPointerCapture(e.pointerId);
    const cell = e.target.closest && e.target.closest('.cell');
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      gesture = { type: 'pan', sx: e.clientX, sy: e.clientY, vx: S.view.x, vy: S.view.y, moved: false, cell: cell ? cell.getAttribute('data-id') : null };
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const mid = toViewBox((a.x + b.x) / 2, (a.y + b.y) / 2);
      gesture = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, k0: S.view.k, x0: S.view.x, y0: S.view.y, mid0: mid, moved: true };
    }
    hideTooltip();
  });
  svg.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) {
      if (e.pointerType === 'mouse') hoverTooltip(e);
      return;
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!gesture) return;
    if (gesture.type === 'pan' && pointers.size === 1) {
      const dx = e.clientX - gesture.sx;
      const dy = e.clientY - gesture.sy;
      if (!gesture.moved && Math.hypot(dx, dy) < 6) return;
      gesture.moved = true;
      svg.classList.add('dragging');
      const s = toViewBox(0, 0)[2];
      S.view.x = gesture.vx + dx / s;
      S.view.y = gesture.vy + dy / s;
      clampView();
      applyView();
    } else if (gesture.type === 'pinch' && pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const mid = toViewBox((a.x + b.x) / 2, (a.y + b.y) / 2);
      const k2 = Math.max(1, Math.min(6, gesture.k0 * (d / gesture.d0)));
      const f = k2 / gesture.k0;
      S.view.k = k2;
      S.view.x = mid[0] - (gesture.mid0[0] - gesture.x0) * f;
      S.view.y = mid[1] - (gesture.mid0[1] - gesture.y0) * f;
      clampView();
      applyView();
    }
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    svg.classList.remove('dragging');
    if (gesture && gesture.type === 'pan' && !gesture.moved && e.type === 'pointerup') {
      onMapTap(gesture.cell);
      if (gesture.cell && e.pointerType !== 'mouse') showTip(gesture.cell, e.clientX, e.clientY, 2600);
    }
    if (pointers.size === 1 && gesture && gesture.type === 'pinch') {
      const [p] = [...pointers.values()];
      gesture = { type: 'pan', sx: p.x, sy: p.y, vx: S.view.x, vy: S.view.y, moved: true, cell: null };
    } else if (!pointers.size) gesture = null;
  }
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);
  svg.addEventListener('pointerleave', (e) => {
    if (e.pointerType === 'mouse') hideTooltip();
  });
  svg.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault();
      const [x, y] = toViewBox(e.clientX, e.clientY);
      zoomAt(x, y, Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0018)));
    },
    { passive: false }
  );
  $('zoomIn').addEventListener('click', () => zoomAt(W / 2, H / 2, 1.4));
  $('zoomOut').addEventListener('click', () => zoomAt(W / 2, H / 2, 1 / 1.4));
  $('zoomFit').addEventListener('click', () => {
    S.view = { k: 1, x: 0, y: 0 };
    applyView();
  });

  function hoverTooltip(e) {
    const cell = e.target.closest && e.target.closest('.cell');
    if (!cell) return hideTooltip();
    showTip(cell.getAttribute('data-id'), e.clientX, e.clientY);
  }
  let tipTimer = 0;
  function showTip(id, clientX, clientY, hideAfter) {
    const tip = $('tooltip');
    clearTimeout(tipTimer);
    const t = terr(id);
    const d = S.result.territories.get(id);
    const feat = E.FEATURES[E.territoryFeature(S.campaign, t, S.geo.shapes[S.geo.index.get(id)].coastLength)];
    tip.innerHTML = '<strong>' + esc(t.name) + '</strong>' + (feat ? ' <span class="muted">' + feat.label.toLowerCase() + '</span>' : '') + '<br>' + (d.isBase ? 'Home base' : STATUS_LABEL[d.status] + (d.control > 0 && d.control < 100 ? ' · ' + d.control + '% control' : '')) + '<br><span class="num">' + t.goldValue + ' gold · garrison ' + d.garrison + '</span>';
    tip.hidden = false;
    const fr = $('mapFrame').getBoundingClientRect();
    let x = clientX - fr.left + 14;
    let y = clientY - fr.top + 14;
    if (x + tip.offsetWidth > fr.width - 6) x = clientX - fr.left - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > fr.height - 6) y = clientY - fr.top - tip.offsetHeight - 14;
    tip.style.left = Math.max(4, x) + 'px';
    tip.style.top = Math.max(4, y) + 'px';
    if (hideAfter) tipTimer = setTimeout(hideTooltip, hideAfter);
  }
  function hideTooltip() {
    $('tooltip').hidden = true;
  }

  function renderChronicle() {
    const c = S.campaign;
    const r = S.result;
    const pct = r.progressPct;
    const claimedPct = ((r.claimed + r.contested) / r.totalTargets) * 100;
    $('progressPct').textContent = Math.round(pct) + '%';
    const bar = $('progressBar');
    bar.querySelector('.conquered').style.width = pct + '%';
    bar.querySelector('.claimed').style.width = Math.min(100, pct + claimedPct) + '%';
    const goal = bar.querySelector('.goal');
    goal.style.left = 'calc(' + c.goalPct + '% - 1px)';
    goal.querySelector('span').textContent = 'Goal ' + c.goalPct + '%';
    bar.setAttribute('aria-label', Math.round(pct) + '% conquered; goal ' + c.goalPct + '%');
    $('progressText').textContent = r.conquered + ' of ' + r.totalTargets + ' territories conquered (home not counted) · ' + r.claimed + ' claimed · ' + r.contested + ' contested' + (pct >= c.goalPct ? ' · goal reached' : ' · ' + Math.max(0, Math.ceil((c.goalPct / 100) * r.totalTargets) - r.conquered) + ' more to reach the goal');

    const byIdx = new Map();
    const push = (i, key, v) => {
      if (!byIdx.has(i)) byIdx.set(i, { raids: [], flags: [] });
      byIdx.get(i)[key].push(v);
    };
    for (const raid of c.raids.slice().sort((a, b) => a.timestamp - b.timestamp)) push(Math.min(r.nowIdx, E.seasonIndex(raid.year, raid.season)), 'raids', raid);
    for (const m of r.milestones) push(Math.min(r.nowIdx, m.idx), 'flags', m);
    let html = '';
    for (let i = 0; i <= r.nowIdx + 1; i++) {
      const s = E.seasonFromIndex(i);
      const entry = byIdx.get(i) || { raids: [], flags: [] };
      const future = i > r.nowIdx;
      html += '<li class="season' + (i === r.nowIdx ? ' now' : '') + (future ? ' future' : '') + '">';
      html += '<header><b>' + SEASON_SHORT[s.season] + '</b><span>' + (s.season === 'spring' || i === 0 ? 'Year ' + s.year : '') + (future ? 'next' : '') + '</span></header>';
      html += '<div class="tint" style="background:' + SEASON_PALETTE[s.season].tint + '"></div><div>';
      html += '<div class="dots">' + entry.raids.map((x) => '<button type="button" class="dot ' + x.outcome + '" data-action="focus-raid" data-raid="' + esc(x.id) + '" title="' + esc(OUTCOME[x.outcome].label + ' at ' + terrName(x.targetTerritory)) + '" aria-label="' + esc(OUTCOME[x.outcome].label + ' at ' + terrName(x.targetTerritory)) + '">' + OUTCOME[x.outcome].sym + '</button>').join('') + '</div>';
      if (entry.flags.length) html += '<ul class="flags">' + entry.flags.map((m) => '<li class="' + m.kind + '"><span class="fk" aria-hidden="true"></span><span>' + esc(m.label) + '</span></li>').join('') + '</ul>';
      html += '</div></li>';
    }
    $('seasons').innerHTML = html;
    const sc = $('seasonsScroll');
    sc.scrollLeft = sc.scrollWidth;
  }

    html += '<div class="field"><label for="planTarget">Target</label><select id="planTarget" required><option value="">Choose a target…</option>' + territoryOptions(p.target, (t) => t.id !== c.baseTerritory) + '</select></div>';

    for (const id of sources) html += '<option value="' + esc(id) + '"' + (p.source === id ? ' selected' : '') + '>' + esc(terr(id).name) + ' (' + STATUS_LABEL[r.territories.get(id).status].toLowerCase() + ')</option>';
    html += '</select></div>';
    html += '<div class="callout" id="routeInfo"></div>';
    html += '<div class="grid2"><div class="field"><label for="planWarband">Raiders sent</label><input id="planWarband" type="number" min="0" step="1" inputmode="numeric" value="' + p.warband + '"></div><div class="field"><span class="label">Odds (rough guide)</span><div id="oddsInfo" class="callout" style="padding:6px 10px"></div></div></div>';
    html += '<div class="field"><span class="label" id="outcomeLabel">Result</span><div class="seg" role="radiogroup" aria-labelledby="outcomeLabel">';

    html += '</div></div>';
    html += '<div class="grid2"><div class="field"><label for="planLosses">Men lost</label><input id="planLosses" type="number" min="0" step="1" inputmode="numeric" value="' + p.losses + '"></div><div class="field"><label for="planLoot">Gold taken</label><input id="planLoot" type="number" min="0" step="1" inputmode="numeric" value="' + p.loot + '"></div></div>';
    html += '<p class="hint" id="lootHint"></p>';
    html += '<div class="field"><label for="planNotes">Notes</label><textarea id="planNotes" maxlength="500" placeholder="Burned the mill, took the abbot’s silver…">' + esc(p.notes) + '</textarea></div>';

    html += '<button class="btn primary" type="submit" id="planSubmit">Log raid</button>';

  function readPlan() {
    const f = document.querySelector('[data-form="plan"]');
    if (!f) return;
    const p = S.plan;
    p.target = $('planTarget').value || null;
    p.source = $('planSource').value || 'base';
    p.warband = Math.max(0, Math.round(Number($('planWarband').value) || 0));
    const o = f.querySelector('input[name="outcome"]:checked');
    p.outcome = o ? o.value : 'ongoing';
    p.losses = Math.max(0, Math.round(Number($('planLosses').value) || 0));
    p.loot = Math.max(0, Math.round(Number($('planLoot').value) || 0));
    p.notes = $('planNotes').value;
  }

  function updatePlanDerived() {
    const p = S.plan;
    const c = S.campaign;
    const r = S.result;
    const ongoing = p.outcome === 'ongoing';
    $('planLosses').disabled = ongoing;
    $('planLoot').disabled = ongoing;
    $('planSubmit').disabled = !p.target;
    const info = $('routeInfo');
    const odds = $('oddsInfo');
    const warn = [];
    if (!p.target || !terr(p.target)) {
      info.innerHTML = 'No target yet.';
      odds.textContent = '—';
      $('lootHint').textContent = '';
    } else {
      const t = terr(p.target);
      const d = r.territories.get(t.id);
      const route = E.findRoute(S.geo, S.geo.index.get(resolveSource(p.source)), S.geo.index.get(t.id));
      const through = route.slice(1, -1).map((i) => c.territories[i].name);
      info.innerHTML = '<b>' + esc(t.name) + '</b>: ' + t.goldValue + ' gold, garrison <b>' + d.garrison + '</b>, ' + E.TERRAIN_STATS[t.terrain].label.toLowerCase() + '.<br>Route: ' + E.routeLeagues(S.geo, route) + ' leagues' + (through.length ? ' through ' + esc(through.join(', ')) : ', a direct border crossing') + '.';
      const od = E.raidOdds(p.warband, d.garrison, t.terrain);
      odds.innerHTML = '<b>' + od.label + '</b>' + (Number.isFinite(od.ratio) ? ' <span class="num">(' + od.ratio.toFixed(2) + ' to 1)</span>' : '');
      $('lootHint').textContent = ongoing ? 'Men lost and gold taken are recorded when the raid comes back (Raid log → Record the result).' : 'A good haul here is around ' + Math.round(t.goldValue * 0.3) + '–' + Math.round(t.goldValue * 0.6) + ' gold.';
      if (d.status === 'conquered') warn.push(t.name + ' is already yours. A failed raid here would cost you control.');
    }
    const home = r.army - r.inField;
    if (p.warband > home) warn.push('You are sending ' + p.warband + ' but only ' + home + ' men are at home.');
    if (!ongoing && p.losses > p.warband && p.warband > 0) warn.push('More men lost than were sent.');
    $('planWarn').innerHTML = warn.map((w) => '<div class="callout warn">' + esc(w) + '</div>').join('');
  }

  function logTab() {
    const raids = S.campaign.raids.slice().sort((a, b) => b.timestamp - a.timestamp);
    if (!raids.length) return '<div class="empty"><p>No raids logged yet. Pick a target on the map, then log it from <b>Plan raid</b>.</p><button class="btn primary" type="button" data-tab-go="raid">Plan a raid</button></div>';
    const won = raids.filter((x) => x.outcome === 'success').length;
    const lost = raids.filter((x) => x.outcome === 'failure').length;
    const loot = raids.reduce((s, x) => s + (x.outcome === 'ongoing' ? 0 : x.lootGained), 0);
    const fallen = raids.reduce((s, x) => s + (x.outcome === 'ongoing' ? 0 : x.losses), 0);
    return '<div class="callout"><b>' + raids.length + '</b> raids: <b>' + won + '</b> won, <b>' + lost + '</b> lost, <b>' + (raids.length - won - lost) + '</b> under way. <b>' + fmt(loot) + '</b> gold taken, <b>' + fmt(fallen) + '</b> men lost. The last 10 are drawn on the map.</div><ol class="log">' + raids.map((x) => raidLine(x, { controls: true })).join('') + '</ol>';
  }

  /* ---------- new-map preview ---------- */

  let previewTimer = 0;
  function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(renderPreview, 120);

  // The map the New campaign form would create, drawn small with its terrain, rivers and sea lanes.
  function renderPreview() {
    const box = $('newPreview');
    if (!box) return;
    const shape = $('newShape').value;
    const count = Number($('newCount').value);
    const c = E.newCampaign({ seed: $('newSeed').value.trim() || 'x', count, shape: shape === 'random' ? undefined : shape, now: 1 });
    const g = E.buildGeometry(c);
    const pal = SEASON_PALETTE.summer;
    let out = '<svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"><rect width="1000" height="700" fill="' + pal.sea + '"/>';
    const land = g.shapes.map((sh) => E.pathData(sh.points, true)).join('');
    out += '<path d="' + land + '" fill="none" stroke="#e6e0c6" stroke-opacity="0.45" stroke-width="16" stroke-linejoin="round"/>';
    g.shapes.forEach((sh, i) => (out += '<path d="' + E.pathData(sh.points, true) + '" fill="' + pal[c.territories[i].terrain] + '"/>'));
    out += '<path d="' + g.borders.map((b) => E.pathData(b.points, false)).join('') + '" fill="none" stroke="#3a2817" stroke-opacity="0.5" stroke-width="1.5"/>';
    out += '<path d="' + g.rivers.map((r) => E.pathData(r.points, false)).join('') + '" fill="none" stroke="#3f7186" stroke-width="4" stroke-linecap="round"/>';
    for (const ln of g.seaLanes) {
      const a = g.shapes[ln.a].centroid;
      const b = g.shapes[ln.b].centroid;
      out += '<path d="M' + a[0].toFixed(0) + ' ' + a[1].toFixed(0) + 'L' + b[0].toFixed(0) + ' ' + b[1].toFixed(0) + '" stroke="#2f4f5a" stroke-width="3" stroke-dasharray="14 10"/>';
    }
    out += '<path d="' + g.coast.map((sg) => E.pathData(sg, false)).join('') + '" fill="none" stroke="#3a2817" stroke-width="3" stroke-linecap="round"/>';
    const home = g.shapes[g.index.get(c.baseTerritory)].centroid;
    out += '<circle cx="' + home[0].toFixed(0) + '" cy="' + home[1].toFixed(0) + '" r="14" fill="' + PLAYER + '" stroke="#efe1bf" stroke-width="4"/></svg>';
    box.innerHTML = out;
    $('newPreviewCap').textContent = E.SHAPE_LABEL[c.map.shape] + (g.landCount > 1 ? ' of ' + g.landCount + ' islands' : '') + ' · ' + count + ' territories · ' + g.rivers.length + ' river' + (g.rivers.length === 1 ? '' : 's') + ' · red dot is home. Suggested name: ' + c.name;
    $('newName').placeholder = c.name;
  }
