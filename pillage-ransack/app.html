  function setTab(tab) {
    S.tab = tab;
    S.confirm = null;
    S.resolving = null;
    if (tab !== 'campaign') S.jsonBox = null;
    renderTabs();
    renderPanel();
    renderFrontier();
    renderPlanPath();
    renderSelection();
  }

  function logRaid() {
    readPlan();
    const p = S.plan;
    const c = S.campaign;
    if (!p.target || !terr(p.target)) return toast('Choose a target first.');
    const ongoing = p.outcome === 'ongoing';
    const raid = {
      id: E.nextRaidId(c),
      sourceTerritory: p.source,
      targetTerritory: p.target,
      outcome: p.outcome,
      timestamp: Date.now(),
      losses: ongoing ? 0 : p.losses,
      lootGained: ongoing ? 0 : p.loot,
      warband: p.warband,
      year: c.year,
      season: c.season,
      notes: p.notes.trim().slice(0, 500),
    };
    c.raids.push(raid);
    S.lastLogged = { id: raid.id, at: Date.now() };
    S.selected = p.target;
    const name = terr(p.target).name;
    p.notes = '';
    p.losses = 0;
    p.loot = 0;
    const msg = ongoing ? 'Raiders set out for ' + name + '.' : OUTCOME[raid.outcome].label + ' at ' + name + (raid.lootGained ? ': ' + signed(raid.lootGained) + ' gold' : '') + (raid.losses ? ', ' + raid.losses + ' men lost' : '') + '.';
    commit(msg);
  }

  function resolveRaid(id, outcome, form) {
    const r = S.campaign.raids.find((x) => x.id === id);
    if (!r) return;
    r.outcome = outcome;
    r.losses = Math.max(0, Math.round(Number(form.querySelector('#resLosses').value) || 0));
    r.lootGained = Math.max(0, Math.round(Number(form.querySelector('#resLoot').value) || 0));
    r.resolvedAt = Date.now();
    S.resolving = null;
    S.lastLogged = null;
    commit(OUTCOME[outcome].label + ' at ' + terrName(r.targetTerritory) + '.');
    flashCell(r.targetTerritory);
  }

  function focusRaid(id) {
    const r = S.campaign.raids.find((x) => x.id === id);
    if (!r) return;
    S.selected = r.targetTerritory;
    S.hotRaid = recentRaids().some((x) => x.id === id) ? id : null;
    if (!S.showRaids) {
      S.showRaids = true;
      $('optRaids').checked = true;
    }
    renderRaids();
    renderSelection();
    startTokens();
    if (S.tab === 'territory') renderPanel();
    clearTimeout(focusRaid.t);
    focusRaid.t = setTimeout(() => {
      S.hotRaid = null;
      renderRaids();
      startTokens();
    }, 2600);
    if (!S.hotRaid) toast('That raid is older than the last 10, so it isn’t drawn. Its territory is outlined.');
  }

  function advanceSeason(dir) {
    const c = S.campaign;
    const idx = E.seasonIndex(c.year, c.season) + dir;
    if (idx < 0) return;
    const before = S.result.treasury;
    const s = E.seasonFromIndex(idx);
    c.year = s.year;
    c.season = s.season;
    S.campaign.updatedAt = Date.now();
    recompute();
    persist(c);
    renderAll();
    if (dir > 0) {
      const gain = S.result.treasury - before;
      toast(seasonText(c.year, c.season) + ' begins. Tribute ' + signed(gain) + ' gold; garrisons recover.');
    } else toast('Back to ' + seasonText(c.year, c.season) + '.');
  }

  async function exportCampaigns(list, label) {
    const json = E.exportJSON(list.map(stripRuntime));
    const safe = label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'campaign';
    const filename = 'pillage-ransack-' + safe + '.json';
    if (inViewer) {
      let dl = null;
      try {
        dl = await window.claude.use('downloads');
      } catch (e) {
        dl = null;
      }
      if (dl) {
        try {
          await dl.save({ filename, data: json });
          toast('Saved ' + filename);
        } catch (e) {
          if (e && e.code === 'declined') return;
          showJson(json, 'Saving files isn’t available here. Copy this JSON instead:');
        }
        return;
      }
      showJson(json, 'Saving files isn’t available here. Copy this JSON instead:');
      return;
    }
    try {
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('Saved ' + filename);
    } catch (e) {
      showJson(json, 'Copy this JSON:');
    }
  }

  function showJson(text, label) {
    S.jsonBox = { text, label };
    renderPanel();
    const box = $('jsonOut');
    if (box) {
      box.focus();
      box.select();
    }
  }

  async function copyJson() {
    const json = E.exportJSON([stripRuntime(S.campaign)]);
    try {
      await navigator.clipboard.writeText(json);
      toast('Campaign JSON copied.');
    } catch (e) {
      showJson(json, 'Copying was blocked. Select all and copy:');
    }
  }

  const SAFE_ID = /^[A-Za-z0-9_\-~:@+]{1,120}$/;
  function importText(text) {
    let res;
    try {
      res = E.parseImport(text);
    } catch (e) {
      toast(e.message);
      return;
    }
    let first = null;
    for (const c of res.campaigns) {
      if (!SAFE_ID.test(c.id) || S.campaigns.has(c.id)) {
        c.id = E.newId('c');
        if ([...S.campaigns.values()].some((x) => x.name === c.name)) c.name = c.name + ' (imported)';
      }
      c.updatedAt = Date.now();
      S.campaigns.set(c.id, c);
      persist(c);
      first = first || c;
    }
    setCampaign(first);
    S.tab = 'campaign';
    renderTabs();
    renderPanel();
    toast('Imported ' + res.campaigns.length + ' campaign' + (res.campaigns.length === 1 ? '' : 's') + (res.warnings.length ? '. ' + res.warnings[0] + (res.warnings.length > 1 ? ' (+' + (res.warnings.length - 1) + ' more notes)' : '') : '.'));
  }

  // A new campaign on a random seed, shape and size. Rolling again replaces a
  // fresh map you haven't kept, so rerolling doesn't pile up campaigns.
  function randomMap() {
    const prev = S.campaign;
    const nc = E.newCampaign({ seed: E.randomSeed(), count: E.MIN_TERRITORIES + Math.floor(Math.random() * (E.MAX_TERRITORIES - E.MIN_TERRITORIES + 1)), shape: E.SHAPES[Math.floor(Math.random() * E.SHAPES.length)] });
    nc.saved = false;
    nc.fresh = true;
    if (prev && prev.fresh && !prev.saved) S.campaigns.delete(prev.id);
    setCampaign(nc);
    toast('Rolled \u201c' + nc.name + '\u201d: ' + E.SHAPE_LABEL[nc.map.shape].toLowerCase() + ', ' + nc.territories.length + ' territories.');
  }

  function deleteCampaign() {
    const c = S.campaign;
    S.campaigns.delete(c.id);
    removeCloud(c.id);
    saveLocal();
    const next = [...S.campaigns.values()].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
    setCampaign(next || makeExample());
    toast('Deleted “' + c.name + '”.');
  }

  document.addEventListener('click', (e) => {
    const tabBtn = e.target.closest('.tabs button');
    if (tabBtn) return setTab(tabBtn.dataset.tab);
    const go = e.target.closest('[data-tab-go]');
    if (go) return setTab(go.dataset.tabGo);
    const mode = e.target.closest('#viewModes button');
    if (mode) {
      S.mode = mode.dataset.mode;
      document.querySelectorAll('#viewModes button').forEach((b) => b.setAttribute('aria-pressed', String(b === mode)));
      renderMap();
      return;
    }
    const a = e.target.closest('[data-action]');
    if (!a) return;
    const c = S.campaign;
    const act = a.dataset.action;
    const rid = a.dataset.raid;
    switch (act) {
      case 'select':
        onMapTap(a.dataset.id);
        break;
      case 'random-map':
        randomMap();
        break;
      case 'keep-fresh':
        commit('Map kept as \u201c' + c.name + '\u201d.');
        break;
      case 'plan-here':
        S.plan.target = S.selected;
        setTab('raid');
        break;
      case 'raid-from':
        S.plan.source = S.selected;
        if (S.plan.target === S.selected) S.plan.target = null;
        setTab('raid');
        toast('Raids now set out from ' + terr(S.selected).name + '. Pick a target.');
        break;
      case 'make-base':
        c.baseTerritory = S.selected;
        c.territories.forEach((t) => {
          if (t.id === S.selected) t.override = null;
        });
        commit(terr(S.selected).name + ' is now your home base.');
        break;
      case 'resolve':
        S.resolving = rid;
        S.confirm = null;
        renderPanel();
        break;
      case 'cancel-resolve':
        S.resolving = null;
        renderPanel();
        break;
      case 'ask-delete-raid':
        S.confirm = 'raid:' + rid;
        S.resolving = null;
        renderPanel();
        break;
      case 'delete-raid':
        c.raids = c.raids.filter((x) => x.id !== rid);
        S.confirm = null;
        commit('Raid deleted; the map has been recalculated.');
        break;
      case 'cancel-confirm':
        S.confirm = null;
        renderPanel();
        break;
      case 'focus-raid':
        focusRaid(rid);
        break;
      case 'start-own':
        setTab('campaign');
        setTimeout(() => {
          const n = $('newName');
          if (n) {
            n.focus();
            n.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
          }
        }, 0);
        break;
      case 'keep-example':
        c.example = false;
        commit('It’s your campaign now.');
        break;
      case 'reroll':
        $('newSeed').value = E.randomSeed();
        renderPreview();
        break;
      case 'ask-delete-adj':
        S.confirm = 'adj:' + a.dataset.id;
        renderPanel();
        break;
      case 'delete-adj':
        c.adjustments = c.adjustments.filter((x) => x.id !== a.dataset.id);
        S.confirm = null;
        commit('Entry removed.');
        break;
      case 'delete-ms':
        c.milestones = c.milestones.filter((x) => x.id !== a.dataset.id);
        commit('Milestone removed.');
        break;
      case 'export-one':
        exportCampaigns([c], c.name);
        break;
      case 'export-all':
        exportCampaigns([...S.campaigns.values()], 'all-campaigns');
        break;
      case 'copy-json':
        copyJson();
        break;
      case 'import-text': {
        const txt = $('importText').value.trim();
        if (!txt) return toast('Paste campaign JSON first.');
        importText(txt);
        break;
      }
      case 'ask-delete-campaign':
        S.confirm = 'campaign';
        renderPanel();
        break;
      case 'delete-campaign':
        deleteCampaign();
        break;
    }
  });

  document.addEventListener('submit', (e) => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    const c = S.campaign;
    const kind = f.dataset.form;
    if (kind === 'plan') logRaid();
    else if (kind === 'resolve') {
      const outcome = e.submitter && e.submitter.value === 'failure' ? 'failure' : 'success';
      resolveRaid(f.dataset.raid, outcome, f);
    } else if (kind === 'rename') {
      const v = $('terrRename').value.trim().slice(0, 60);
      if (!v) return toast('A territory needs a name.');
      terr(S.selected).name = v;
      buildStatic();
      commit('Renamed to ' + v + '.');
    } else if (kind === 'new') {
      const shape = $('newShape').value;
      const nc = E.newCampaign({ name: $('newName').value.trim().slice(0, 80) || undefined, seed: $('newSeed').value.trim() || E.randomSeed(), count: Number($('newCount').value), shape: shape === 'random' ? undefined : shape });
      nc.saved = false;
      setCampaign(nc);
      persist(nc);
      S.tab = 'territory';
      renderTabs();
      renderPanel();
      toast('“' + nc.name + '” created. Your home base has the keep on it.');
    } else if (kind === 'settings') {
      c.name = $('setName').value.trim().slice(0, 80) || c.name;
      c.goalPct = Math.max(5, Math.min(100, Math.round(Number($('setGoal').value) || 60)));
      c.start = {
        treasury: Math.round(Number($('setGold').value) || 0),
        army: Math.max(0, Math.round(Number($('setArmy').value) || 0)),
        morale: Math.max(0, Math.min(100, Math.round(Number($('setMorale').value) || 0))),
      };
      commit('Settings saved.');
    } else if (kind === 'adjust') {
      const a = { army: Math.round(Number($('adjArmy').value) || 0), treasury: Math.round(Number($('adjGold').value) || 0), morale: Math.round(Number($('adjMorale').value) || 0) };
      if (!a.army && !a.treasury && !a.morale) return toast('Enter a change to men, gold or morale.');
      c.adjustments.push(Object.assign({ id: E.newId('a'), year: c.year, season: c.season, timestamp: Date.now(), note: $('adjNote').value.trim().slice(0, 200) }, a));
      commit('Recorded.');
    } else if (kind === 'milestone') {
      const label = $('msLabel').value.trim().slice(0, 80);
      if (!label) return;
      c.milestones.push({ id: E.newId('m'), year: c.year, season: c.season, timestamp: Date.now(), kind: $('msKind').value, label });
      commit('Milestone added.');
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.closest('form[data-form="plan"]')) {
      readPlan();
      updatePlanDerived();
      if (t.id === 'planTarget' || t.id === 'planSource') {
        if (t.id === 'planTarget') S.selected = S.plan.target;
        renderPlanPath();
        renderSelection();
      }
    } else if (t.id === 'newCount') {
      $('newCountOut').textContent = t.value;
      schedulePreview();
    } else if (t.id === 'newSeed') schedulePreview();
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'terrPick') {
      S.selected = t.value || null;
      if (S.selected && S.selected !== S.campaign.baseTerritory && S.result.territories.get(S.selected).status !== 'conquered') S.plan.target = S.selected;
      renderPanel();
      renderSelection();
    } else if (t.id === 'terrOverride') {
      terr(S.selected).override = t.value || null;
      commit(t.value ? 'Status set by hand.' : 'Status follows the raid log again.');
    } else if (t.id === 'campPick') {
      const next = S.campaigns.get(t.value);
      if (next) setCampaign(next);
    } else if (t.id === 'importFile' && t.files && t.files[0]) {
      const file = t.files[0];
      if (file.size > 5e6) return toast('That file is over 5 MB; a campaign export is far smaller.');
      const reader = new FileReader();
      reader.onload = () => importText(String(reader.result));
      reader.onerror = () => toast('Couldn’t read that file.');
      reader.readAsText(file);
    } else if (t.id === 'optRaids') {
      S.showRaids = t.checked;
      renderMap();
    } else if (t.id === 'optRoutes') {
      S.showRoutes = t.checked;
      renderRoutes();
    } else if (t.id === 'optLabels') {
      S.showLabels = t.checked;
      renderLabels();
      renderIcons();
    } else if (t.id === 'newShape') {
      renderPreview();
    }
  });

  document.addEventListener('mouseover', (e) => {
    const li = e.target.closest('.log li[data-raid]');
    const id = li ? li.dataset.raid : null;
    if (id === S.hotRaid || (!id && !S.hotRaidHover)) return;
    S.hotRaidHover = !!id;
    S.hotRaid = id && recentRaids().some((x) => x.id === id) ? id : null;
    document.querySelectorAll('#layerRaids .raid').forEach((g) => {
      const me = g.dataset.raid;
      g.classList.toggle('dim', !!S.hotRaid && me !== S.hotRaid);
      g.classList.toggle('hot', me === S.hotRaid);
    });
  });

  $('seasonNext').addEventListener('click', () => advanceSeason(1));
  $('seasonBack').addEventListener('click', () => advanceSeason(-1));

  function renderAll() {
    renderHeader();
    renderMap();
    renderChronicle();
    renderTabs();
    renderPanel();
  }

  /* ---------- boot ---------- */

  function boot(hot) {
    const local = loadLocal();
    for (const c of local) {
      c.saved = true;
      S.campaigns.set(c.id, c);
    }
    const want = (hot && hot.active) || prefs().active;
    const first = S.campaigns.get(want) || local.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0] || makeExample();
    if (hot) {
      S.tab = hot.tab || S.tab;
      S.mode = hot.mode || S.mode;
      document.querySelectorAll('#viewModes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
    }
    setCampaign(first);
    if (hot && hot.selected && terr(hot.selected)) {
      S.selected = hot.selected;
      renderPanel();
      renderSelection();
    }
    connectCloud();
  }

  window.PillageRansack = {
    // For a tracker running in the same page or console: log a raid without the form.
    logRaid(r) {
      const c = S.campaign;
      if (!r || !terr(r.targetTerritory) || r.targetTerritory === c.baseTerritory || !E.OUTCOMES.includes(r.outcome)) throw new Error('logRaid needs a targetTerritory id (not home) and an outcome of success, failure or ongoing.');
      const raid = { id: E.nextRaidId(c), sourceTerritory: r.sourceTerritory && terr(r.sourceTerritory) ? r.sourceTerritory : 'base', targetTerritory: r.targetTerritory, outcome: r.outcome, timestamp: Date.now(), losses: Math.max(0, r.losses | 0), lootGained: Math.max(0, r.lootGained | 0), warband: Math.max(0, r.warband | 0), year: c.year, season: c.season, notes: String(r.notes || '').slice(0, 500) };
      c.raids.push(raid);
      S.lastLogged = { id: raid.id, at: Date.now() };
      commit();
      return raid.id;
    },
    campaign: () => JSON.parse(JSON.stringify(stripRuntime(S.campaign))),
    selectTerritory: (id) => onMapTap(id),
  };

  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') {
    hot.snapshot(() => ({ tab: S.tab, mode: S.mode, selected: S.selected, active: S.campaign && S.campaign.id }));
  }
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot((hot && hot.data) || null);
})();
</script>
