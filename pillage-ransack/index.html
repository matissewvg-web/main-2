<style>
/* Layout: a war table at night. The parchment map and the season chronicle on the left,
   the campaign ledger (territory, raid, log, campaign) on the right; stacks on phones.
   One deliberate dark look: the table is dark wood, the map is always parchment. */
:root {
  color-scheme: dark;
  --table: #1b1713;
  --table-glow: #2a2119;
  --table-2: #241e18;
  --table-3: #30281f;
  --line: #4a3d2f;
  --fg: #efe4cc;
  --fg-muted: #b5a78c;
  --fg-faint: #8a7c63;
  --brass: #d4ac52;
  --brass-hover: #e3be6a;
  --brass-ink: #1b1713;
  --seal: #b23a2b;
  --seal-text: #f0a08a;
  --parchment: #ead9b4;
  --sea: #a9bfba;
  --map-ink: #3a2817;
  --good: #0ca30c;
  --good-text: #5fcf5f;
  --warning: #fab219;
  --critical: #d03b3b;
  --critical-text: #f08080;
  --focus: #f2d27e;
  --font-display: "Grenze Gotisch", "Iowan Old Style", Georgia, serif;
  --font-map: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --radius: 6px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: radial-gradient(ellipse 90% 60% at 40% 0%, var(--table-glow), var(--table) 70%) fixed, var(--table);
  color: var(--fg);
  font: 400 var(--step-0)/1.45 var(--font-ui);
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
.eyebrow { display: block; font: 400 var(--step--1)/1.2 var(--font-map); letter-spacing: 0.08em; color: var(--fg-muted); }
.muted { color: var(--fg-muted); }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 1680px; margin: 0 auto; padding-block: 12px 32px; padding-inline: 16px; display: grid; gap: 14px; }

/* header */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand h1 { font: 700 var(--step-3)/1 var(--font-display); color: var(--fg); letter-spacing: 0.01em; }
.brand h1 span { color: var(--seal-text); }
.brand .sub { margin: 2px 0 0; color: var(--fg-muted); font-size: var(--step--1); overflow-wrap: anywhere; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; }
.stats div { min-width: 0; }
.stats dt { font: 400 var(--step--1)/1.2 var(--font-map); letter-spacing: 0.08em; color: var(--fg-muted); }
.stats dd { margin: 2px 0 0; font-weight: 700; font-size: var(--step-1); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stats dd small { font-weight: 400; color: var(--fg-muted); font-size: var(--step--1); }
.morale { display: inline-block; width: 54px; height: 6px; border-radius: 3px; background: var(--table-3); vertical-align: middle; margin-left: 6px; overflow: hidden; }
.morale i { display: block; height: 100%; background: var(--brass); }
.season-ctl { display: flex; align-items: center; gap: 8px; }
.season-now strong { display: block; font: 700 var(--step-1)/1.1 var(--font-display); white-space: nowrap; }

/* buttons & fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--table-3); color: var(--fg); cursor: pointer; font-weight: 500; text-align: center; }
.btn:hover { border-color: var(--fg-faint); }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); font-weight: 700; }
.btn.primary:hover { background: var(--brass-hover); }
.btn.danger { border-color: var(--critical); color: var(--critical-text); background: transparent; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 30px; padding: 3px 10px; font-size: var(--step--1); }
.btn.icon { width: 36px; padding: 0; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .field > .label { font-size: var(--step--1); color: var(--fg-muted); }
.field input, .field select, .field textarea { width: 100%; min-height: 36px; padding: 6px 10px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--table); }
.field input:disabled { opacity: 0.5; }
.field textarea { min-height: 64px; resize: vertical; }
.hint { margin: 0; font-size: var(--step--1); color: var(--fg-faint); }
.row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.row > * { flex: 1 1 120px; min-width: 0; }
.row > .btn { flex: 0 0 auto; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; flex-wrap: wrap; }
.seg button, .seg label { border: 0; background: transparent; padding: 6px 12px; min-height: 34px; cursor: pointer; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"], .seg input:checked + span { color: var(--brass-ink); }
.seg button[aria-pressed="true"] { background: var(--brass); font-weight: 700; }
.seg label { position: relative; }
.seg label input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--brass); color: var(--brass-ink); font-weight: 700; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: -2px; }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 14px; border: 1px dashed var(--brass); border-radius: var(--radius); background: var(--table-2); }
.banner p { margin: 0; flex: 1 1 280px; min-width: 0; }

/* main layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 390px; grid-template-areas: "map panel" "chron panel"; gap: 14px 16px; align-items: start; }
.map-col { grid-area: map; display: grid; gap: 10px; min-width: 0; }
.map-toolbar .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.map-toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.toggles { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--step--1); color: var(--fg-muted); }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; min-height: 30px; }
.toggles input { accent-color: var(--brass); width: 16px; height: 16px; }

.map-shell { position: relative; width: min(100%, calc(64vh * 1000 / 700)); margin-inline: auto; }
.map-frame { position: relative; width: 100%; aspect-ratio: 1000 / 700; border-radius: 4px; overflow: hidden; background: var(--sea); box-shadow: 0 0 0 1px #00000066, 0 14px 40px #00000080; }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
.map-controls { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.map-controls .btn { min-height: 32px; background: #241e18e6; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 26px; padding: 8px 2px 0; font-size: var(--step--1); line-height: 1.3; color: var(--fg); }
.legend .group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; min-width: 0; }
.legend h4 { margin: 0; font: 400 var(--step--1)/1.2 var(--font-map); letter-spacing: 0.08em; color: var(--fg-muted); }
.legend ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend li { display: flex; align-items: center; gap: 6px; min-width: 0; }
.legend li span:last-child { min-width: 0; }
.sw { flex: 0 0 auto; width: 18px; height: 12px; border-radius: 2px; border: 1px solid #00000055; }
.sw.stripes { background: repeating-linear-gradient(45deg, var(--seal) 0 3px, #cdb99a 3px 6px); }
.sw.line { height: 4px; border: 0; border-radius: 2px; }
.sw.river { height: 4px; border: 0; background: #3f7186; }
.sw.lane { height: 0; border: 0; border-top: 2px dashed #6f9aa6; border-radius: 0; }
.preview { display: block; width: 100%; aspect-ratio: 1000 / 700; border-radius: 4px; border: 1px solid var(--line); background: var(--sea); }
.preview svg { display: block; width: 100%; height: 100%; }
.sw.claimed { background: linear-gradient(90deg, #b7a891, #8e8478); }
.tooltip { position: absolute; z-index: 3; pointer-events: none; padding: 6px 9px; border-radius: var(--radius); background: #1b1713f2; border: 1px solid var(--line); font-size: var(--step--1); line-height: 1.35; max-width: 220px; }
.tooltip strong { font-family: var(--font-map); font-weight: 400; font-size: var(--step-0); letter-spacing: 0.04em; }

/* SVG map */
.cell { stroke: none; cursor: pointer; }
.cell:hover { filter: brightness(1.06); }
.halo { fill: none; stroke-linejoin: round; }
.border, .coastline, .raid-glow, .raid-line, .select-ring, .target-ring, .frontier, .route-line, .plan-line, .owned-ring { vector-effect: non-scaling-stroke; }
.border { fill: none; stroke: var(--map-ink); stroke-width: 0.8; stroke-opacity: 0.6; stroke-linejoin: round; }
.coastline { fill: none; stroke: var(--map-ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.glyph { fill: var(--glyph-fill, #9fb27a); stroke: var(--map-ink); stroke-width: 0.9; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.glyph.g-mountains { fill: var(--mtn-fill, #a89f91); }
.glyph.g-hills { fill: var(--hill-fill, #c4b07a); }
.glyph.g-coast { fill: var(--boat-fill, #d9c7a0); }
.label { font-family: var(--font-map); fill: var(--map-ink); text-anchor: middle; paint-order: stroke; stroke: #f1e5c6; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; letter-spacing: 0.04em; }
.label.sub { font-family: var(--font-ui); font-weight: 700; letter-spacing: 0; }
.select-ring { fill: none; stroke: #1b1209; stroke-width: 3.2; stroke-linejoin: round; pointer-events: none; }
.select-ring.inner { stroke: #fff4d6; stroke-width: 1.2; }
.target-ring { fill: none; stroke: #1b1209; stroke-width: 2.4; stroke-dasharray: 7 5; pointer-events: none; animation: march 1.2s linear infinite; }
.frontier { fill: none; stroke: #7a5418; stroke-width: 1.6; stroke-dasharray: 1.5 4; stroke-linecap: round; pointer-events: none; }
.river { fill: none; stroke: #3f7186; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.river-halo { fill: none; stroke: #f1e7cb; stroke-opacity: 0.7; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.lake { stroke: #2f4f5a; stroke-width: 0.9; vector-effect: non-scaling-stroke; pointer-events: none; }
.sea-lane { fill: none; stroke: #2f4f5a; stroke-width: 1.5; stroke-dasharray: 7 6; stroke-linecap: round; stroke-opacity: 0.8; vector-effect: non-scaling-stroke; pointer-events: none; }
.islet { stroke: var(--map-ink); stroke-width: 1.1; vector-effect: non-scaling-stroke; pointer-events: none; }
.route-line { fill: none; stroke: #5d4630; stroke-width: 1.1; stroke-dasharray: 2 5; stroke-linecap: round; opacity: 0.8; }
.raid-glow { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.raid-line { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.raid-line.ongoing { stroke-dasharray: 8 6; animation: march 0.9s linear infinite; }
.raid.dim { opacity: 0.18; }
.raid.hot .raid-glow { stroke-width: 11; }
.plan-line { fill: none; stroke: #1b1209; stroke-width: 2.4; stroke-dasharray: 10 7; stroke-linecap: round; animation: march 1s linear infinite; pointer-events: none; }
.plan-label { font: 700 13px var(--font-ui); fill: #1b1209; paint-order: stroke; stroke: #f1e5c6; stroke-width: 3.5px; text-anchor: middle; pointer-events: none; }
.flash { animation: flash 1.1s ease-out 2; }
@keyframes march { to { stroke-dashoffset: -24; } }
.reveal .cell { animation: rise 0.7s ease-out both; }
@keyframes rise { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
.road { fill: none; stroke: #5d4630; stroke-width: 1.3; stroke-dasharray: 5 3; stroke-linecap: round; vector-effect: non-scaling-stroke; pointer-events: none; opacity: 0.75; }
@keyframes flash { 0% { filter: brightness(1.6) saturate(1.4); } 100% { filter: none; } }

/* chronicle */
.chronicle { grid-area: chron; display: grid; gap: 10px; padding: 12px 14px; border-radius: var(--radius); background: var(--table-2); border: 1px solid var(--line); min-width: 0; }
.progress-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 18px; align-items: center; }
.progress-label { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.progress-label strong { font: 700 var(--step-2)/1 var(--font-display); }
.progress { position: relative; height: 14px; border-radius: 7px; background: var(--table); border: 1px solid var(--line); }
.progress .fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 7px 0 0 7px; }
.progress .fill.conquered { background: var(--seal); z-index: 2; }
.progress .fill.claimed { background: repeating-linear-gradient(45deg, #b23a2b99 0 4px, #b23a2b44 4px 8px); z-index: 1; }
.progress .goal { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--brass); z-index: 3; }
.progress .goal span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: var(--brass); }
.progress-text { grid-column: 1 / -1; margin: 0; font-size: var(--step--1); color: var(--fg-muted); }
.seasons-scroll { overflow-x: auto; padding-bottom: 4px; scrollbar-color: var(--line) transparent; }
.seasons { list-style: none; margin: 0; padding: 0; display: flex; gap: 3px; min-width: max-content; }
.season { width: 92px; flex: 0 0 auto; display: grid; grid-template-rows: auto auto 1fr; gap: 5px; padding: 6px 6px 8px; border-radius: 4px; background: var(--table); border: 1px solid transparent; }
.season.now { border-color: var(--brass); }
.season.future { opacity: 0.45; border-style: dashed; border-color: var(--line); }
.season header { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; font-size: 11px; color: var(--fg-muted); }
.season header b { font: 400 12px var(--font-map); letter-spacing: 0.06em; color: var(--fg); }
.season .tint { height: 4px; border-radius: 2px; }
.dots { display: flex; flex-wrap: wrap; gap: 3px; min-height: 16px; align-content: flex-start; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #00000080; padding: 0; cursor: pointer; display: inline-grid; place-items: center; font: 700 10px/1 var(--font-ui); color: #1b1713; }
.dot.success { background: var(--good); color: #fff; }
.dot.failure { background: var(--critical); color: #fff; }
.dot.ongoing { background: var(--warning); }
.dot { box-shadow: 0 0 0 2px var(--kc, transparent); }
.flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.flags li { display: flex; gap: 4px; font-size: 11px; line-height: 1.25; color: var(--fg); min-width: 0; }
.flags li span:last-child { overflow-wrap: anywhere; min-width: 0; }
.flags .fk { flex: 0 0 auto; width: 8px; height: 10px; margin-top: 2px; clip-path: polygon(0 0, 100% 25%, 0 50%); background: var(--fg-muted); }
.flags .victory .fk { background: var(--good-text); }
.flags .defeat .fk { background: var(--critical-text); }
.flags .empire .fk { background: var(--brass); }
.flags .custom .fk { background: var(--fg); }

/* ledger panel */
.panel { grid-area: panel; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); display: flex; flex-direction: column; border-radius: var(--radius); background: var(--table-2); border: 1px solid var(--line); min-width: 0; }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 10px 4px; min-height: 44px; cursor: pointer; color: var(--fg-muted); font: 400 var(--step--1)/1.1 var(--font-map); letter-spacing: 0.06em; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brass); }
.tab-body { padding: 14px; overflow-y: auto; display: grid; gap: 14px; align-content: start; min-height: 0; }
.tab-body h2 { font: 700 var(--step-2)/1.1 var(--font-display); overflow-wrap: anywhere; }
.tab-body h3 { font: 400 var(--step-0)/1.2 var(--font-map); letter-spacing: 0.06em; color: var(--fg-muted); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.terr-head { display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pill, .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: var(--step--1); border: 1px solid var(--line); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.unclaimed { color: #c9c1b2; }
.pill.claimed { color: #e9a58f; }
.pill.contested { color: var(--warning); }
.pill.conquered { color: var(--seal-text); border-color: var(--seal); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 0; }
.facts dt { font-size: var(--step--1); color: var(--fg-muted); }
.facts dd { margin: 1px 0 0; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.facts dd small { font-weight: 400; color: var(--fg-muted); }
.bar-mini { display: block; height: 5px; margin-top: 4px; border-radius: 3px; background: var(--table); overflow: hidden; }
.bar-mini i { display: block; height: 100%; background: var(--seal); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.empty { display: grid; gap: 10px; padding: 6px 0; color: var(--fg-muted); }
.empty p { margin: 0; }
.kbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-width: 0; }
.ktoggle { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1 1 420px; padding-bottom: 2px; scrollbar-width: thin; }
.ktab { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; min-height: 48px; padding: 6px 12px 6px 8px; border-radius: var(--radius); border: 1px solid var(--line); border-bottom: 3px solid var(--kc); background: var(--table-2); color: var(--fg-muted); cursor: pointer; text-align: left; }
.ktab:hover { border-color: var(--fg-faint); border-bottom-color: var(--kc); }
.ktab[aria-selected="true"] { background: var(--table-3); color: var(--fg); box-shadow: 0 0 0 1px var(--kc) inset; }
.ktab:disabled { opacity: 0.55; cursor: not-allowed; }
.ktab .ktxt { display: grid; line-height: 1.15; min-width: 0; }
.ktab b { font: 700 var(--step-0)/1.15 var(--font-display); white-space: nowrap; }
.ktab small { font-size: 12px; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
.ktab kbd { font: 11px var(--font-ui); color: var(--fg-faint); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: 2px; }
@media (hover: none) { .ktab kbd { display: none; } }
.kbar-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.kbar-tools label { font-size: var(--step--1); color: var(--fg-muted); }
.kbar-tools select { min-height: 36px; padding: 4px 8px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--table); max-width: 180px; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px; border-radius: 999px; background: var(--table-3); border: 1px solid var(--line); font-size: var(--step--1); }
.pchip button { border: 0; background: transparent; color: var(--fg-muted); cursor: pointer; width: 22px; height: 22px; border-radius: 50%; }
.pchip button:hover { color: var(--fg); background: var(--table-2); }
.pchip.me { border-color: var(--brass); }
.nudge { animation: nudge 1.2s ease-in-out 3; }
@keyframes nudge { 50% { box-shadow: 0 0 0 4px #d4ac5288; } }
.kingdoms { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.kcard { display: grid; gap: 8px; padding: 10px 12px; border-radius: var(--radius); background: var(--table); border: 1px solid var(--line); border-left: 5px solid var(--kc, var(--line)); min-width: 0; }
.kcard.active { box-shadow: 0 0 0 1px var(--brass) inset; }
.khead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; }
.khead h3 { border: 0; padding: 0; font: 700 var(--step-1)/1.1 var(--font-display); color: var(--fg); letter-spacing: 0; overflow-wrap: anywhere; }
.khead p { margin: 2px 0 0; font-size: var(--step--1); color: var(--fg-muted); overflow-wrap: anywhere; }
.kstats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--step--1); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.kstats b { color: var(--fg); font-weight: 700; }
.shield { display: inline-block; vertical-align: middle; flex: 0 0 auto; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatches label { position: relative; cursor: pointer; }
.swatches input { position: absolute; opacity: 0; pointer-events: none; }
.swatches span { display: block; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); }
.swatches input:checked + span { border-color: var(--focus); box-shadow: 0 0 0 2px var(--table) inset; }
.swatches input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.swatches input:disabled + span { opacity: 0.25; cursor: not-allowed; }
.editor { display: grid; gap: 10px; padding-top: 6px; border-top: 1px dashed var(--line); }
.arms-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.playing { display: flex; align-items: center; gap: 8px; min-width: 0; }
.playing select { min-height: 36px; padding: 4px 8px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--table); max-width: 220px; }
.ibar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--table); margin-top: 4px; }
.ibar i { display: block; height: 100%; }
.kchip { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.kchip .dotk { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; border: 1px solid #0006; }
.progress .fill.k { position: absolute; top: 0; bottom: 0; border-radius: 0; }
.scores { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; font-size: var(--step--1); color: var(--fg-muted); grid-column: 1 / -1; }
.scores b { color: var(--fg); }
.gen-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
.picklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.picklist button { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 10px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--table); cursor: pointer; text-align: left; }
.picklist button:hover { border-color: var(--fg-faint); }
.picklist .nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.picklist .mt { font-size: var(--step--1); color: var(--fg-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.log li { display: grid; gap: 6px; padding: 9px 10px; border-radius: var(--radius); background: var(--table); border: 1px solid var(--line); border-left-width: 4px; min-width: 0; }
.log li.success { border-left-color: var(--good); }
.log li.failure { border-left-color: var(--critical); }
.log li.ongoing { border-left-color: var(--warning); }
.log .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.log .who { font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
.log .when { font-size: var(--step--1); color: var(--fg-muted); white-space: nowrap; }
.log .what { font-size: var(--step--1); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.log .what b { color: var(--fg); font-weight: 500; }
.log .note { font-size: var(--step--1); font-style: italic; color: var(--fg-muted); overflow-wrap: anywhere; }
.outcome { font-weight: 700; }
.outcome.success { color: var(--good-text); }
.outcome.failure { color: var(--critical-text); }
.outcome.ongoing { color: var(--warning); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: var(--step--1); }
.callout { padding: 8px 10px; border-radius: var(--radius); background: var(--table); border: 1px solid var(--line); font-size: var(--step--1); color: var(--fg-muted); }
.callout b { color: var(--fg); }
.callout.warn { border-color: #fab21966; }
details { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
details summary { cursor: pointer; color: var(--fg); }
details[open] summary { margin-bottom: 8px; }
.rules { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: var(--step--1); color: var(--fg-muted); }
.store-status { display: flex; gap: 8px; align-items: center; font-size: var(--step--1); color: var(--fg-muted); }
.store-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-faint); flex: 0 0 auto; }
.store-status.cloud i { background: var(--good); }
.store-status.error i { background: var(--critical); }
.json-box { width: 100%; min-height: 140px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%) translateY(20px); opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 10; max-width: min(520px, calc(100vw - 32px)); padding: 10px 16px; border-radius: var(--radius); background: var(--parchment); color: var(--map-ink); font-weight: 500; box-shadow: 0 8px 30px #000a; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 1180px) {
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "map" "panel" "chron"; }
  .panel { position: static; max-height: none; }
  .map-shell { width: 100%; }
}
@media (max-width: 700px) {
  .brand h1 { font-size: var(--step-2); }
  .stats { gap: 6px 16px; width: 100%; }
  .stats dd { font-size: var(--step-0); }
  .season-ctl { width: 100%; }
  .season-ctl .season-now { flex: 1 1 auto; }
  .legend { gap: 6px 18px; }
  .map-controls .btn { min-height: 28px; }
  .map-controls .btn.icon { width: 30px; }
  .progress-row { grid-template-columns: minmax(0, 1fr); }
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tabs button { font-size: 11px; letter-spacing: 0.02em; }
  .gen-grid { grid-template-columns: minmax(0, 1fr); }
  .playing { width: 100%; }
  .ktoggle { flex-basis: 100%; }
  .ktab small { max-width: 120px; }
}
@media (prefers-reduced-motion: reduce) {
  .target-ring, .raid-line.ongoing, .plan-line, .reveal .cell, .nudge { animation: none; }
  .flash { animation: none; }
  .toast { transition: none; }
}
</style>
</head>

              <image id="paper" x="0" y="0" width="1000" height="700" preserveAspectRatio="none" style="mix-blend-mode:multiply;pointer-events:none"/>
              <g id="layerFrontier"></g>
              <g id="layerRoutes"></g>

            <button class="btn icon" type="button" id="zoomIn" aria-label="Zoom in">+</button>
            <button class="btn icon" type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>
            <button class="btn small" type="button" id="zoomFit">Fit</button>

      </div>

    </section>

    <aside class="panel" aria-label="Campaign ledger">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-territory" aria-selected="true" aria-controls="tabBody" data-tab="territory">Territory</button>
        <button type="button" role="tab" id="tab-raid" aria-selected="false" aria-controls="tabBody" data-tab="raid">Raid</button>
        <button type="button" role="tab" id="tab-log" aria-selected="false" aria-controls="tabBody" data-tab="log">Log</button>
        <button type="button" role="tab" id="tab-kingdoms" aria-selected="false" aria-controls="tabBody" data-tab="kingdoms">Kingdoms</button>
        <button type="button" role="tab" id="tab-campaign" aria-selected="false" aria-controls="tabBody" data-tab="campaign">Campaign</button>
      </div>

    <section class="chronicle" aria-label="Campaign timeline">
      <div class="progress-row">
        <div class="progress-label"><span class="eyebrow">Conquest</span><strong id="progressPct">0%</strong></div>
        <div class="progress" id="progressBar" role="img"><div class="fill claimed"></div><div class="fill conquered"></div><div class="goal"><span></span></div></div>
        <p class="progress-text" id="progressText"></p>

      <div class="seasons-scroll" id="seasonsScroll"><ol class="seasons" id="seasons"></ol></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
/*
 * Pillage Ransack engine: map generation, campaign rules and the save format.
 * No DOM access, so the same file runs in the page and under `node --test`.
 *
 * The campaign is event-sourced: territories hold only their fixed traits
 * (position, gold value, base garrison, terrain) and the raids, adjustments and
 * the current season are the history. replay() derives everything else
 * (control, current garrison, burn damage, status, treasury, army, morale,
 * milestones), so deleting or resolving a raid can never leave the map out of
 * sync with the log.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.PREngine = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const MAP_W = 1000;
  const MAP_H = 700;
  const SEASONS = ['spring', 'summer', 'autumn', 'winter'];
  const TERRAINS = ['grassland', 'forest', 'hills', 'mountains', 'marsh', 'coast'];
  const STATUSES = ['unclaimed', 'claimed', 'contested', 'conquered'];
  const OUTCOMES = ['success', 'failure', 'ongoing'];
  const MIN_TERRITORIES = 15;
  const MAX_TERRITORIES = 25;
  // Shared Voronoi edges shorter than this don't count as a land border.
  const MIN_SHARED_EDGE = 6;
  // 100 map units on the scale bar.
  const LEAGUES_PER_100 = 10;

  // Placeholder rules. Pillage Ransack had none written down, so these are
  // invented; change them here and every derived number follows.
  const RULES = {
    successControl: 40,        // control gained per successful raid (100 = conquered)
    failureControl: -25,       // control lost per failed raid
    successGarrisonMult: 0.6,  // defenders left after a successful raid
    failureGarrisonMult: 1.1,  // defenders grow after repelling a raid...
    garrisonCapMult: 1.5,      // ...up to 1.5x their base strength
    regenPerSeason: 0.15,      // share of base garrison restored each season
    tributeRate: 0.2,          // share of gold value a conquered territory pays per season
    claimedTributeFactor: 0.5, // claimed land pays this x control% of full tribute
    moraleSuccess: 5,
    moraleFailure: -10,
    moraleConquest: 10,
    damagePerFailure: 1,
    damageMax: 3,
    damageHealPerSeason: 0.5,
    heavyDefeatShare: 0.25,    // a failure costing this share of the army is a milestone
    heavyDefeatMin: 10,
  };

  const TERRAIN_STATS = {
    grassland: { gold: 1.25, garrison: 0.9, defense: 1.0, label: 'Grassland' },
    forest: { gold: 0.9, garrison: 1.0, defense: 1.15, label: 'Forest' },
    hills: { gold: 1.0, garrison: 1.2, defense: 1.25, label: 'Hills' },
    mountains: { gold: 0.85, garrison: 1.4, defense: 1.5, label: 'Mountains' },
    marsh: { gold: 0.6, garrison: 0.7, defense: 1.2, label: 'Marsh' },
    coast: { gold: 1.3, garrison: 1.0, defense: 1.0, label: 'Coast' },
  };

  const DEFAULT_START = { treasury: 100, army: 60, morale: 60 };

  /* ---------- randomness ---------- */

  function hashString(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Smooth 2D value noise in [-1, 1].
  function valueNoise(seed) {
    const s = seed | 0;
    function lattice(x, y) {
      let n = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1442695041);
      n = Math.imul(n ^ (n >>> 13), 1274126177);
      n ^= n >>> 16;
      return ((n >>> 0) / 4294967295) * 2 - 1;
    }
    return function (x, y) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const xf = x - xi;
      const yf = y - yi;
      const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
      const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
      const a = lattice(xi, yi);
      const b = lattice(xi + 1, yi);
      const c = lattice(xi, yi + 1);
      const d = lattice(xi + 1, yi + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }

  const SEED_WORDS = [
    'ember', 'wolf', 'raven', 'salt', 'iron', 'thorn', 'ash', 'frost', 'mire', 'crown',
    'stag', 'brine', 'oak', 'hollow', 'gale', 'rook', 'flint', 'barrow', 'tide', 'cinder',
  ];

  function randomSeed() {
    const r = Math.random;
    const a = SEED_WORDS[Math.floor(r() * SEED_WORDS.length)];
    const b = SEED_WORDS[Math.floor(r() * SEED_WORDS.length)];
    return a + '-' + b + '-' + Math.floor(r() * 900 + 100);
  }

  /* ---------- geometry ---------- */

  // Engine 1 (the first release) drew these three; engine 2 draws them all.
  const SHAPES1 = ['island', 'archipelago', 'mainland'];
  const SHAPES = ['island', 'archipelago', 'mainland', 'inland', 'strait', 'fjords', 'peninsula'];
  const SHAPE_LABEL = { island: 'Island', archipelago: 'Archipelago', mainland: 'Mainland coast', inland: 'Inland sea', strait: 'Twin lands', fjords: 'Fjord coast', peninsula: 'Peninsula' };
  // Map furniture the coastline should stay clear of: cartouche, compass rose, scale bar.
  const DECOR_ZONES = [
    [14, 12, 258, 72],
    [880, 30, 985, 135],
    [100, 650, 300, 690],
    [826, 628, 1000, 700], // zoom buttons
  ];

  function dist(a, b) {
    return Math.hypot(a[0] - b[0], a[1] - b[1]);
  }

  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }

  function smoothstep(e0, e1, x) {
    const t = clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  function ellipsePolygon(cx, cy, rx, ry, n) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
    }
    return pts;
  }

  // Keep the part of `poly` where nx*x + ny*y <= c. labels[k] names what
  // produced edge poly[k] -> poly[k+1]: a neighbour index, -1 for coast, -2 for
  // the map edge (land that carries on off the map).
  function clipHalfPlane(poly, labels, nx, ny, c, label) {
    const f = (p) => p[0] * nx + p[1] * ny - c;
    const out = [];
    const outLabels = [];
    const n = poly.length;
    for (let k = 0; k < n; k++) {
      const a = poly[k];
      const b = poly[(k + 1) % n];
      const fa = f(a);
      const fb = f(b);
      if (fa <= 0) {
        out.push(a);
        outLabels.push(labels[k]);
        if (fb > 0) {
          const t = fa / (fa - fb);
          out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
          outLabels.push(label);
        }
      } else if (fb <= 0) {
        const t = fa / (fa - fb);
        out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
        outLabels.push(labels[k]);
      }
    }
    return [out, outLabels];
  }

  // Keep the part of `poly` closer to `site` than to `other`.
  function clipCell(poly, labels, site, other, otherIdx) {
    const nx = other[0] - site[0];
    const ny = other[1] - site[1];
    const c = ((site[0] + other[0]) / 2) * nx + ((site[1] + other[1]) / 2) * ny;
    return clipHalfPlane(poly, labels, nx, ny, c, otherIdx);
  }

  // Voronoi cells by half-plane clipping. O(n^2), which is nothing for 25 sites
  // and keeps the page free of a geometry library.
  function voronoiCells(sites, boundary, boundaryLabels) {
    const bl = boundaryLabels || boundary.map(() => -1);
    return sites.map((s, i) => {
      let poly = boundary.slice();
      let labels = bl.slice();
      for (let j = 0; j < sites.length && poly.length; j++) {
        if (j !== i) [poly, labels] = clipCell(poly, labels, s, sites[j], j);
      }
      return { poly, labels };
    });
  }

  function polygonArea(pts) {
    let a = 0;
    for (let i = 0, n = pts.length; i < n; i++) {
      const p = pts[i];
      const q = pts[(i + 1) % n];
      a += p[0] * q[1] - q[0] * p[1];
    }
    return a / 2;
  }

  function polygonCentroid(pts) {
    let a = 0;
    let cx = 0;
    let cy = 0;
    for (let i = 0, n = pts.length; i < n; i++) {
      const p = pts[i];
      const q = pts[(i + 1) % n];
      const cross = p[0] * q[1] - q[0] * p[1];
      a += cross;
      cx += (p[0] + q[0]) * cross;
      cy += (p[1] + q[1]) * cross;
    }
    if (Math.abs(a) < 1e-9) return pts[0] ? pts[0].slice() : [0, 0];
    return [cx / (3 * a), cy / (3 * a)];
  }

  function pointInPolygon(p, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const a = pts[i];
      const b = pts[j];
      if (a[1] > p[1] !== b[1] > p[1] && p[0] < ((b[0] - a[0]) * (p[1] - a[1])) / (b[1] - a[1]) + a[0]) {
        inside = !inside;
      }
    }
    return inside;
  }

  // The part of a polygon inside the visible map, for label anchors and sizes.
  function clipToFrame(poly, map, inset) {
    const m = inset || 0;
    const L = poly.map(() => 0);
    let p = poly;
    let l = L;
    [p, l] = clipHalfPlane(p, l, -1, 0, -m, 0);
    [p, l] = clipHalfPlane(p, l, 1, 0, map.width - m, 0);
    [p, l] = clipHalfPlane(p, l, 0, -1, -m, 0);
    [p, l] = clipHalfPlane(p, l, 0, 1, map.height - m, 0);
    return p;
  }

  function mapShape1(map) {
    return SHAPES1.includes(map.shape) ? map.shape : 'island';
  }

  function mapShape(map) {
    return SHAPES.includes(map.shape) ? map.shape : 'island';
  }

  function mapIslands(map) {
    if (mapShape1(map) !== 'mainland' && Array.isArray(map.islands) && map.islands.length) return map.islands;
    return [{ cx: map.width / 2, cy: map.height / 2, rx: map.rx, ry: map.ry }];
  }

  function rhoOf(isl, x, y) {
    const ex = (x - isl.cx) / isl.rx;
    const ey = (y - isl.cy) / isl.ry;
    return Math.sqrt(ex * ex + ey * ey);
  }

  function nearestIsland(islands, x, y) {
    let best = 0;
    let bestR = Infinity;
    islands.forEach((isl, i) => {
      const r = rhoOf(isl, x, y);
      if (r < bestR) {
        bestR = r;
        best = i;
      }
    });
    return [best, bestR];
  }

  // Mainland coast: land is where nx*x + ny*y <= c (n points out to sea).
  function coastFrame(map) {
    return { nx: Math.cos(map.coast.angle), ny: Math.sin(map.coast.angle), c: map.coast.c };
  }

  // How far inland a point is, 0 at the coast to 1 deep inland.
  function inlandness(map, x, y) {
    if (mapShape1(map) === 'mainland') {
      const cf = coastFrame(map);
      return clamp((cf.c - (x * cf.nx + y * cf.ny)) / 420, 0, 1);
    }
    return clamp(1 - nearestIsland(mapIslands(map), x, y)[1], 0, 1);
  }

  // Each landmass: a convex outline its territories are cut from.
  function landmasses(map) {
    if (mapShape1(map) === 'mainland') {
      const m = 60;
      const cf = coastFrame(map);
      const [boundary, labels] = clipHalfPlane(
        [[-m, -m], [map.width + m, -m], [map.width + m, map.height + m], [-m, map.height + m]],
        [-2, -2, -2, -2],
        cf.nx,
        cf.ny,
        cf.c,
        -1
      );
      return [{ boundary, labels }];
    }
    return mapIslands(map).map((isl) => {
      const boundary = ellipsePolygon(isl.cx, isl.cy, isl.rx, isl.ry, 96);
      return { boundary, labels: boundary.map(() => -1) };
    });
  }

  function landmassOf(map, x, y) {
    return mapShape1(map) === 'mainland' ? 0 : nearestIsland(mapIslands(map), x, y)[0];
  }

  // Voronoi within each landmass; territories on different islands never share a border.
  function landCells(sites, map) {
    const lands = landmasses(map);
    const groups = lands.map(() => []);
    sites.forEach((s, i) => groups[landmassOf(map, s[0], s[1])].push(i));
    const cells = new Array(sites.length);
    lands.forEach((land, li) => {
      for (const i of groups[li]) {
        let poly = land.boundary.slice();
        let labels = land.labels.slice();
        for (const j of groups[li]) {
          if (j !== i && poly.length) [poly, labels] = clipCell(poly, labels, sites[i], sites[j], j);
        }
        cells[i] = { poly, labels, land: li };
      }
    });
    return { cells, groups };
  }

  /*
   * Turns the convex Voronoi layout into a coastline and borders. Near the coast
   * points are pushed in or out (bays and headlands): radially around each island,
   * or along the coastline's normal on a mainland. Everywhere, fractal value noise
   * adds wobble. Both are pure functions of position, so an edge shared by two
   * territories bends identically for both of them.
   */
  function makeWarp(map) {
    const octaves = [
      [24, 1 / 200],
      [6, 1 / 55],
      [1.8, 1 / 16],
    ].map(([amp, freq], i) => ({
      amp,
      freq,
      nx: valueNoise(map.seed + 101 * i + 1),
      ny: valueNoise(map.seed + 101 * i + 2),
    }));
    let shapeWarp;
    if (mapShape1(map) === 'mainland') {
      const cf = coastFrame(map);
      const tx = -cf.ny;
      const ty = cf.nx;
      const rng = mulberry32((map.seed ^ 0x51ed270b) >>> 0);
      const waves = [520, 300, 170].map((lam, k) => ({ f: (Math.PI * 2) / lam, a: [1, 0.6, 0.35][k] * (0.6 + rng() * 0.8), phi: rng() * Math.PI * 2 }));
      const sumA = waves.reduce((s, w) => s + w.a, 0);
      const A = 55;
      shapeWarp = function (x, y) {
        const d = x * cf.nx + y * cf.ny - cf.c;
        const w = 1 - smoothstep(0, 160, Math.abs(d));
        if (w <= 0) return [x, y];
        const u = x * tx + y * ty;
        let s = 0;
        for (const wv of waves) s += wv.a * Math.sin(wv.f * u + wv.phi);
        const delta = A * (s / sumA) * w;
        return [x + cf.nx * delta, y + cf.ny * delta];
      };
    } else {
      const islands = mapIslands(map).map((isl, i) => {
        const rng = mulberry32((map.seed ^ (0x9e3779b9 + i * 7919)) >>> 0);
        const harmonics = [2, 3, 4, 6].map((k) => ({ k, a: 0.3 + rng() * 0.7, phi: rng() * Math.PI * 2 }));
        return { isl, harmonics, sumA: harmonics.reduce((s, h) => s + h.a, 0) };
      });
      const B = 0.2;
      shapeWarp = function (x, y) {
        let best = islands[0];
        let rho = Infinity;
        for (const it of islands) {
          const r = rhoOf(it.isl, x, y);
          if (r < rho) {
            rho = r;
            best = it;
          }
        }
        const w = smoothstep(0.55, 1, rho);
        if (w <= 0) return [x, y];
        const { isl } = best;
        const th = Math.atan2((y - isl.cy) / isl.ry, (x - isl.cx) / isl.rx);
        let s = 0;
        for (const h of best.harmonics) s += h.a * Math.sin(h.k * th + h.phi);
        const scale = 1 + B * (s / best.sumA) * w;
        return [isl.cx + (x - isl.cx) * scale, isl.cy + (y - isl.cy) * scale];
      };
    }
    return function (x, y) {
      const p = shapeWarp(x, y);
      let X = p[0];
      let Y = p[1];
      for (const o of octaves) {
        X += o.amp * o.nx(x * o.freq, y * o.freq);
        Y += o.amp * o.ny(x * o.freq, y * o.freq);
      }
      return [X, Y];
    };
  }

  function warpedEdge(a, b, warp, step) {
    const n = Math.max(1, Math.ceil(dist(a, b) / step));
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      out.push(warp(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t));
    }
    return out;
  }

  const ELEVATION = { mountains: 1, hills: 0.78, forest: 0.5, grassland: 0.42, marsh: 0.18, coast: 0.25 };

  /*
   * Rivers run along territory borders (as rivers often are borders), starting
   * high in mountains or hills and always flowing downhill. They reach the sea,
   * join another river, or pool in a lake where the land gives them nowhere lower.
   */
  function computeRivers(campaign, cells, warp) {
    const verts = [];
    function vid(p) {
      for (let k = 0; k < verts.length; k++) {
        const q = verts[k].p;
        if (Math.abs(q[0] - p[0]) < 0.05 && Math.abs(q[1] - p[1]) < 0.05) return k;
      }
      verts.push({ p, cells: new Set(), coast: false, edge: false, nbrs: new Set() });
      return verts.length - 1;
    }
    cells.forEach((cell, i) => {
      const n = cell.poly.length;
      const ids = cell.poly.map(vid);
      for (let k = 0; k < n; k++) {
        const a = ids[k];
        const b = ids[(k + 1) % n];
        verts[a].cells.add(i);
        const L = cell.labels[k];
        if (L === -1) verts[a].coast = verts[b].coast = true;
        else if (L === -2) verts[a].edge = verts[b].edge = true;
        else if (a !== b && dist(verts[a].p, verts[b].p) > 2) {
          verts[a].nbrs.add(b);
          verts[b].nbrs.add(a);
        }
      }
    });
    const rng = mulberry32(hashString('rivers:' + campaign.seed));
    const elev = verts.map((v) => {
      if (v.coast) return 0;
      let s = 0;
      for (const c of v.cells) s += ELEVATION[campaign.territories[c].terrain] || 0.4;
      return s / Math.max(1, v.cells.size) + (v.edge ? 0.6 : 0) + rng() * 0.04;
    });
    const highland = (v) => [...v.cells].some((c) => ['mountains', 'hills'].includes(campaign.territories[c].terrain));
    const candidates = verts
      .map((v, k) => k)
      .filter((k) => !verts[k].coast && !verts[k].edge && highland(verts[k]) && verts[k].nbrs.size >= 2)
      .sort((a, b) => elev[b] - elev[a]);
    const want = clamp(Math.round(campaign.territories.length / 7), 2, 4);
    const used = new Set();
    const sources = [];
    const rivers = [];
    const lakes = [];
    for (const start of candidates) {
      if (rivers.length >= want) break;
      if (used.has(start) || sources.some((s) => dist(verts[s].p, verts[start].p) < 110)) continue;
      const path = [start];
      const seen = new Set(path);
      let cur = start;
      let end = 'lake';
      for (let step = 0; step < 80; step++) {
        if (verts[cur].coast) {
          end = 'sea';
          break;
        }
        let best = -1;
        for (const nb of verts[cur].nbrs) if (!seen.has(nb) && (best === -1 || elev[nb] < elev[best])) best = nb;
        if (best === -1 || elev[best] > elev[cur] + 0.02) break;
        path.push(best);
        seen.add(best);
        if (used.has(best)) {
          end = 'join';
          break;
        }
        cur = best;
      }
      if (path.length < 2) continue;
      const points = [];
      for (let i = 1; i < path.length; i++) {
        const seg = warpedEdge(verts[path[i - 1]].p, verts[path[i]].p, warp, 5);
        if (i > 1) seg.shift();
        for (const p of seg) points.push(p);
      }
      if (points.length < 12) continue; // under ~60px is a stub, not a river
      rivers.push({ points, end });
      if (end === 'lake') {
        const p = points[points.length - 1];
        lakes.push({ x: p[0], y: p[1], r: 9 + rng() * 5 });
      }
      path.forEach((v) => used.add(v));
      sources.push(start);
    }
    return { rivers, lakes };
  }

  /*
   * Everything the renderer needs, rebuilt from stored data (positions + map
   * parameters + terrain), so imported campaigns redraw the same map.
   */
  function buildGeometry(campaign) {
    return campaign.map && campaign.map.engine === 2 ? buildGeometry2(campaign) : buildGeometry1(campaign);
  }

  function buildGeometry1(campaign) {
    const map = campaign.map;
    const sites = campaign.territories.map((t) => [t.position.x, t.position.y]);
    const { cells, groups } = landCells(sites, map);
    const warp = makeWarp(map);
    const step = 5;
    const borders = [];
    const coast = [];
    const adjacency = sites.map(() => new Set());
    const shapes = cells.map((cell, i) => {
      const { poly, labels } = cell;
      const points = [];
      let coastLength = 0;
      for (let k = 0; k < poly.length; k++) {
        const a = poly[k];
        const b = poly[(k + 1) % poly.length];
        const seg = warpedEdge(a, b, warp, step);
        const label = labels[k];
        const len = dist(a, b);
        if (label === -1) {
          coast.push(seg.slice());
          coastLength += len;
        } else if (label >= 0) {
          if (label > i && len > 0.5) borders.push({ a: i, b: label, points: seg.slice() });
          if (len >= MIN_SHARED_EDGE) {
            adjacency[i].add(label);
            adjacency[label].add(i);
          }
        }
        seg.pop();
        for (const p of seg) points.push(p);
      }
      const visible = clipToFrame(poly, map, 12);
      const c = polygonCentroid(visible.length >= 3 ? visible : poly);
      return {
        index: i,
        id: campaign.territories[i].id,
        land: cell.land,
        points,
        centroid: warp(c[0], c[1]),
        area: Math.abs(polygonArea(visible.length >= 3 ? visible : poly)),
        coastLength,
        rings: [points],
        d: pathData(points, true),
      };
    });

    // Sea lanes join the islands of an archipelago: the shortest crossing between
    // each pair of islands, kept as a minimum spanning tree plus one extra loop.
    const seaLanes = [];
    const laneSet = new Set();
    const lands = groups.map((g, li) => ({ li, coastal: g.filter((i) => shapes[i].coastLength > 10) })).filter((l) => l.coastal.length);
    if (lands.length > 1) {
      const pairs = [];
      for (let x = 0; x < lands.length; x++) {
        for (let y = x + 1; y < lands.length; y++) {
          let best = null;
          for (const i of lands[x].coastal) {
            for (const j of lands[y].coastal) {
              const d = dist(sites[i], sites[j]);
              if (!best || d < best.d) best = { x, y, i, j, d };
            }
          }
          pairs.push(best);
        }
      }
      pairs.sort((p, q) => p.d - q.d);
      const parent = lands.map((_, k) => k);
      const find = (k) => (parent[k] === k ? k : (parent[k] = find(parent[k])));
      const spare = [];
      for (const p of pairs) {
        const rx = find(p.x);
        const ry = find(p.y);
        if (rx !== ry) {
          parent[rx] = ry;
          seaLanes.push(p);
        } else spare.push(p);
      }
      if (lands.length >= 3 && spare.length) seaLanes.push(spare[0]);
      for (const p of seaLanes) {
        adjacency[p.i].add(p.j);
        adjacency[p.j].add(p.i);
        laneSet.add(Math.min(p.i, p.j) + '|' + Math.max(p.i, p.j));
      }
    }

    const { rivers, lakes } = computeRivers(campaign, cells, warp);
    const index = new Map(campaign.territories.map((t, i) => [t.id, i]));
    return {
      engine: 1,
      islets: [],
      shapes,
      borders,
      coast,
      adjacency,
      index,
      sites,
      warp,
      seaLanes: seaLanes.map((p) => ({ a: p.i, b: p.j })),
      laneSet,
      rivers,
      lakes,
      landCount: groups.filter((g) => g.length).length,
    };
  }

  function pathData(points, close) {
    if (!points.length) return '';
    let d = 'M' + points[0][0].toFixed(1) + ' ' + points[0][1].toFixed(1);
    for (let i = 1; i < points.length; i++) d += 'L' + points[i][0].toFixed(1) + ' ' + points[i][1].toFixed(1);
    return close ? d + 'Z' : d;
  }

  // Shortest route between two territories over borders and sea lanes (a crossing costs a quarter more, unless opts.seaCost says otherwise).

  // Even-odd test against every ring, so holes (lakes inside a territory) count as outside.
  function pointInShape(p, shape) {
    let inside = false;
    for (const r of shape.rings || [shape.points]) if (pointInPolygon(p, r)) inside = !inside;
    return inside;
  }

  function findRoute(geo, fromIdx, toIdx, opts) {
    const seaCost = (opts && opts.seaCost) || 1.25;
    const n = geo.sites.length;
    if (fromIdx === toIdx) return [fromIdx];
    const distTo = new Array(n).fill(Infinity);
    const prev = new Array(n).fill(-1);
    const done = new Array(n).fill(false);
    distTo[fromIdx] = 0;
    for (let iter = 0; iter < n; iter++) {
      let u = -1;
      for (let i = 0; i < n; i++) if (!done[i] && (u === -1 || distTo[i] < distTo[u])) u = i;
      if (u === -1 || distTo[u] === Infinity) break;
      if (u === toIdx) break;
      done[u] = true;
      for (const v of geo.adjacency[u]) {
        const sea = geo.laneSet && geo.laneSet.has(Math.min(u, v) + '|' + Math.max(u, v));
        const d = distTo[u] + dist(geo.sites[u], geo.sites[v]) * (sea ? seaCost : 1);
        if (d < distTo[v]) {
          distTo[v] = d;
          prev[v] = u;
        }
      }
    }
    if (prev[toIdx] === -1) return [fromIdx, toIdx];
    const route = [toIdx];
    while (route[0] !== fromIdx) route.unshift(prev[route[0]]);
    return route;
  }

  function routeLeagues(geo, route) {
    let d = 0;
    for (let i = 1; i < route.length; i++) d += dist(geo.sites[route[i - 1]], geo.sites[route[i]]);
    return Math.round((d / 100) * LEAGUES_PER_100);
  }

  /* ---------- engine 2: a land mask on a fine grid ----------
   *
   * The map is a jittered grid of ~3,800 small Voronoi cells. A shape field plus
   * noise decides which cells are land, so any coastline works: fjords, inland
   * seas, straits, peninsulas, lakes and islets. Territories are grown outward
   * from their seats over land cells (never across water), which gives organic,
   * non-convex borders, and rivers run downhill over the cell corners.
   */

  const FINE = 15;
  const FRAME_PAD = 45;
  const GEN_DEFAULTS = { rough: 1, mountains: 1, forests: 1, wetlands: 1, wealth: 1, defences: 1, rivers: 1, borders: 1 };
  const GEN_LEVEL = [0, 1, 2];

  function normGen(g) {
    const out = {};
    for (const k in GEN_DEFAULTS) {
      const v = g && Math.round(Number(g[k]));
      out[k] = GEN_LEVEL.includes(v) ? v : GEN_DEFAULTS[k];
    }
    return out;
  }

  function harmonicsFrom(rng, ks) {
    return ks.map((k) => [k, Math.round((0.3 + rng() * 0.7) * 1000) / 1000, Math.round(rng() * Math.PI * 2 * 1000) / 1000]);
  }

  function harmonic(h, th) {
    let s = 0;
    let sa = 0;
    for (const [k, a, phi] of h) {
      s += a * Math.sin(k * th + phi);
      sa += a;
    }
    return sa ? s / sa : 0;
  }

  // Positive inside a wobbly ellipse; roughly the distance to its edge in hundreds of map units.
  function blobField(b, x, y) {
    const dx = (x - b.cx) / b.rx;
    const dy = (y - b.cy) / b.ry;
    const rho = Math.sqrt(dx * dx + dy * dy);
    const r = 1 + b.amp * harmonic(b.harm, Math.atan2(dy, dx));
    return ((1 - rho / r) * Math.min(b.rx, b.ry)) / 100;
  }

  // A wavy coastline: positive on the land side.
  function lineField(L, x, y) {
    const nx = Math.cos(L.angle);
    const ny = Math.sin(L.angle);
    const u = -x * ny + y * nx;
    return (L.c + L.A * harmonicU(L.waves, u) - (x * nx + y * ny)) / 100;
  }

  function harmonicU(waves, u) {
    let s = 0;
    let sa = 0;
    for (const [f, a, phi] of waves) {
      s += a * Math.sin(f * u + phi);
      sa += a;
    }
    return sa ? s / sa : 0;
  }

  // Distance from a point to a curve given as sample points, with the curve
  // parameter at the nearest point.
  function curveDistance(pts, x, y) {
    let best = Infinity;
    let bt = 0;
    for (let i = 1; i < pts.length; i++) {
      const [ax, ay] = pts[i - 1];
      const [bx, by] = pts[i];
      const dx = bx - ax;
      const dy = by - ay;
      const l2 = dx * dx + dy * dy || 1;
      const t = clamp(((x - ax) * dx + (y - ay) * dy) / l2, 0, 1);
      const d = Math.hypot(x - (ax + dx * t), y - (ay + dy * t));
      if (d < best) {
        best = d;
        bt = (i - 1 + t) / (pts.length - 1);
      }
    }
    return [best, bt];
  }

  function bentCurve(x0, y0, angle, len, bend, from, n) {
    const dx = Math.cos(angle);
    const dy = Math.sin(angle);
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = from + ((1 - from) * i) / n;
      const off = bend * len * t * t;
      pts.push([x0 + dx * len * t - dy * off, y0 + dy * len * t + dx * off]);
    }
    return pts;
  }

  function lineParams(rng, share) {
    const angle = rng() * Math.PI * 2;
    const nx = Math.cos(angle);
    const ny = Math.sin(angle);
    const landShare = (c) => {
      let land = 0;
      let total = 0;
      for (let x = 12; x < MAP_W; x += 25) {
        for (let y = 12; y < MAP_H; y += 25) {
          total++;
          if (x * nx + y * ny <= c) land++;
        }
      }
      return land / total;
    };
    let lo = -1500;
    let hi = 1500;
    for (let i = 0; i < 40; i++) {
      const mid = (lo + hi) / 2;
      if (landShare(mid) < share) lo = mid;
      else hi = mid;
    }
    const waves = [520, 300, 170].map((lam, k) => [Math.round(((Math.PI * 2) / lam) * 1e5) / 1e5, Math.round([1, 0.6, 0.35][k] * (0.6 + rng() * 0.8) * 1000) / 1000, Math.round(rng() * 6283) / 1000]);
    return { angle: Math.round(angle * 1000) / 1000, c: Math.round((lo + hi) / 2), A: 55, waves };
  }

  function placeBlobs(rng, n, totalArea, aspectSpread) {
    let scale = 1;
    for (let attempt = 0; attempt < 600; attempt++) {
      if (attempt && attempt % 40 === 0) scale *= 0.95;
      const weights = Array.from({ length: n }, () => 0.5 + rng());
      const wsum = weights.reduce((s, w) => s + w, 0);
      const blobs = [];
      let ok = true;
      for (let i = 0; i < n && ok; i++) {
        const area = ((totalArea * weights[i]) / wsum) * scale * scale;
        const aspect = 1 + rng() * aspectSpread;
        const rx = Math.sqrt((area * aspect) / Math.PI);
        const ry = rx / aspect;
        let placed = false;
        for (let t = 0; t < 120 && !placed; t++) {
          const cx = rx * 1.05 + 20 + rng() * (MAP_W - 2 * rx * 1.05 - 40);
          const cy = ry * 1.05 + 20 + rng() * (MAP_H - 2 * ry * 1.05 - 40);
          if (MAP_W - 2 * rx * 1.05 - 40 < 0 || MAP_H - 2 * ry * 1.05 - 40 < 0) break;
          if (!clearOfDecor(cx, cy, Math.max(rx, ry) * 0.9)) continue;
          if (blobs.some((b) => Math.hypot(b.cx - cx, b.cy - cy) < Math.max(b.rx, b.ry) * 1.05 + Math.max(rx, ry) * 1.05 + 24)) continue;
          blobs.push({ cx: Math.round(cx), cy: Math.round(cy), rx: Math.round(rx), ry: Math.round(ry), amp: 0.24, harm: harmonicsFrom(rng, [2, 3, 5]) });
          placed = true;
        }
        if (!placed) ok = false;
      }
      if (ok) return blobs;
    }
    return [{ cx: 500, cy: 350, rx: 300, ry: 200, amp: 0.2, harm: harmonicsFrom(rng, [2, 3, 5]) }];
  }

  // Shape parameters, stored on the map so the same coastline redraws after an import.
  function maskParams(rng, shape) {
    const W = MAP_W;
    const H = MAP_H;
    switch (shape) {
      case 'archipelago':
        return { blobs: placeBlobs(rng, 3 + Math.floor(rng() * 3), W * H * 0.3, 0.6) };
      case 'mainland':
        return { line: lineParams(rng, 0.58 + rng() * 0.1) };
      case 'inland': {
        const lake = { cx: Math.round(W / 2 + (rng() - 0.5) * 120), cy: Math.round(H / 2 + (rng() - 0.5) * 80), rx: Math.round(250 + rng() * 80), ry: Math.round(150 + rng() * 60), amp: 0.28, harm: harmonicsFrom(rng, [2, 3, 4, 6]) };
        const isles = [];
        if (rng() < 0.6) isles.push({ cx: Math.round(lake.cx + (rng() - 0.5) * lake.rx * 0.6), cy: Math.round(lake.cy + (rng() - 0.5) * lake.ry * 0.5), rx: Math.round(70 + rng() * 40), ry: Math.round(45 + rng() * 25), amp: 0.25, harm: harmonicsFrom(rng, [2, 3]) });
        return { lake, isles };
      }
      case 'strait': {
        const angle = (rng() < 0.5 ? 0 : Math.PI / 2) + (rng() - 0.5) * 0.9;
        const nx = Math.cos(angle);
        const ny = Math.sin(angle);
        return { angle: Math.round(angle * 1000) / 1000, c: Math.round((W / 2) * nx + (H / 2) * ny + (rng() - 0.5) * 80), amp: Math.round(40 + rng() * 50), lam: Math.round(420 + rng() * 300), phi: Math.round(rng() * 6283) / 1000, phi2: Math.round(rng() * 6283) / 1000, width: Math.round(70 + rng() * 35) };
      }
      case 'fjords': {
        const line = lineParams(rng, 0.62);
        const nx = Math.cos(line.angle);
        const ny = Math.sin(line.angle);
        // Where the coastline crosses the map, measured along it.
        const us = [];
        for (let x = 0; x <= W; x += 10) {
          for (let y = 0; y <= H; y += 10) {
            if (Math.abs(x * nx + y * ny - line.c) < 8) us.push(-x * ny + y * nx);
          }
        }
        const umin = Math.min(...us) + 70;
        const umax = Math.max(...us) - 70;
        const inlets = [];
        const n = 3 + Math.floor(rng() * 3);
        for (let tries = 0; tries < 60 && inlets.length < n && umax > umin; tries++) {
          const u = umin + rng() * (umax - umin);
          if (inlets.some((f) => Math.abs(f.u - u) < 105)) continue;
          inlets.push({ u: Math.round(u), len: Math.round(150 + rng() * 150), width: Math.round(34 + rng() * 22), bend: Math.round((rng() - 0.5) * 800) / 1000, tilt: Math.round((rng() - 0.5) * 500) / 1000 });
        }
        return { line, inlets };
      }
      case 'peninsula': {
        const side = Math.floor(rng() * 4);
        const along = 0.3 + rng() * 0.4;
        const base = [[W * along, -40, Math.PI / 2], [W + 40, H * along, Math.PI], [W * along, H + 40, -Math.PI / 2], [-40, H * along, 0]][side];
        const span = side % 2 === 0 ? H : W;
        return { x0: Math.round(base[0]), y0: Math.round(base[1]), angle: Math.round((base[2] + (rng() - 0.5) * 0.7) * 1000) / 1000, len: Math.round(span * (0.75 + rng() * 0.2)), width: Math.round(150 + rng() * 45), bend: Math.round((rng() - 0.5) * 600) / 1000 };
      }
      default:
        return { blobs: [{ cx: Math.round(W / 2 + (rng() - 0.5) * 40), cy: Math.round(H / 2 + (rng() - 0.5) * 30), rx: Math.round(355 + rng() * 30), ry: Math.round(232 + rng() * 22), amp: 0.22, harm: harmonicsFrom(rng, [2, 3, 4, 6]) }], sats: rng() < 0.6 ? 1 + Math.floor(rng() * 3) : 0 };
    }
  }

  function makeShapeField(map) {
    const m = map.mask || {};
    switch (map.shape) {
      case 'mainland':
        return (x, y) => lineField(m.line, x, y);
      case 'inland':
        return (x, y) => {
          let f = -blobField(m.lake, x, y);
          for (const b of m.isles || []) f = Math.max(f, blobField(b, x, y));
          return f;
        };
      case 'strait': {
        const nx = Math.cos(m.angle);
        const ny = Math.sin(m.angle);
        return (x, y) => {
          const u = -x * ny + y * nx;
          const d = x * nx + y * ny - m.c - m.amp * Math.sin((Math.PI * 2 * u) / m.lam + m.phi);
          const w = m.width * (0.8 + 0.4 * (0.5 + 0.5 * Math.sin((Math.PI * 2 * u) / (m.lam * 0.63) + m.phi2)));
          return (Math.abs(d) - w / 2) / 100;
        };
      }
      case 'fjords': {
        const L = m.line;
        const nx = Math.cos(L.angle);
        const ny = Math.sin(L.angle);
        const curves = (m.inlets || []).map((f) => {
          const s = L.c + L.A * harmonicU(L.waves, f.u);
          const x0 = nx * s - ny * f.u;
          const y0 = ny * s + nx * f.u;
          return { f, pts: bentCurve(x0, y0, L.angle + Math.PI + f.tilt, f.len, f.bend, -0.2, 18) };
        });
        return (x, y) => {
          let v = lineField(L, x, y);
          for (const c of curves) {
            if (Math.abs(x - c.pts[0][0]) > c.f.len + 80 && Math.abs(y - c.pts[0][1]) > c.f.len + 80) continue;
            const [d, t] = curveDistance(c.pts, x, y);
            const hw = (c.f.width / 2) * (1 - 0.8 * Math.max(0, t * 1.2 - 0.2));
            v = Math.min(v, (d - hw) / 100);
          }
          return v;
        };
      }
      case 'peninsula': {
        const pts = bentCurve(m.x0, m.y0, m.angle, m.len, m.bend, -0.3, 24);
        return (x, y) => {
          const [d, t] = curveDistance(pts, x, y);
          return (m.width * (1 - 0.45 * clamp(t * 1.3 - 0.3, 0, 1)) - d) / 100;
        };
      }
      default:
        return (x, y) => {
          let f = -Infinity;
          for (const b of m.blobs || []) f = Math.max(f, blobField(b, x, y));
          return f;
        };
    }
  }

  function fineWarp(map) {
    const g = normGen(map.gen);
    const mult = [0.55, 1, 1.45][g.rough];
    const octaves = [
      [10, 1 / 170],
      [3.5, 1 / 50],
      [1.2, 1 / 15],
    ].map(([amp, freq], i) => ({ amp: amp * mult, freq, nx: valueNoise(map.seed + 211 * i + 3), ny: valueNoise(map.seed + 211 * i + 4) }));
    return function (x, y) {
      let X = x;
      let Y = y;
      for (const o of octaves) {
        X += o.amp * o.nx(x * o.freq, y * o.freq);
        Y += o.amp * o.ny(x * o.freq, y * o.freq);
      }
      return [X, Y];
    };
  }

  /*
   * The fine grid: cells, their shared corners, which cells are land, and the
   * fields generation and rivers need (distance from the coast, elevation, moisture).
   */
  function buildFine(map) {
    const W = map.width;
    const H = map.height;
    const s = FINE;
    const pad = FRAME_PAD;
    const g = normGen(map.gen);
    const rng = mulberry32((map.seed ^ 0x27d4eb2d) >>> 0);
    const cols = Math.ceil((W + 2 * pad) / s);
    const rows = Math.ceil((H + 2 * pad) / s);
    const pts = [];
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) pts.push([-pad + (i + 0.5 + (rng() - 0.5) * 0.7) * s, -pad + (j + 0.5 + (rng() - 0.5) * 0.7) * s]);
    }
    const frame = [[-pad, -pad], [W + pad, -pad], [W + pad, H + pad], [-pad, H + pad]];
    const vkey = new Map();
    const verts = [];
    function vid(p) {
      const kx = Math.round(p[0] * 100);
      const ky = Math.round(p[1] * 100);
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          const id = vkey.get((kx + dx) * 200003 + (ky + dy));
          if (id !== undefined && Math.abs(verts[id][0] - p[0]) < 1e-4 && Math.abs(verts[id][1] - p[1]) < 1e-4) return id;
        }
      }
      verts.push(p);
      vkey.set(kx * 200003 + ky, verts.length - 1);
      return verts.length - 1;
    }
    const field = makeShapeField(map);
    const nm = [0.45, 1, 1.6][g.rough];
    const n1 = valueNoise(map.seed + 17);
    const n2 = valueNoise(map.seed + 29);
    const cells = pts.map((p, idx) => {
      const ci = idx % cols;
      const cj = (idx / cols) | 0;
      const near = [];
      for (let dj = -2; dj <= 2; dj++) {
        for (let di = -2; di <= 2; di++) {
          const ni = ci + di;
          const nj = cj + dj;
          if ((di || dj) && ni >= 0 && nj >= 0 && ni < cols && nj < rows) near.push(nj * cols + ni);
        }
      }
      near.sort((a, b) => dist(p, pts[a]) - dist(p, pts[b]));
      let poly = frame.slice();
      let labels = [-2, -2, -2, -2];
      for (const j of near) if (poly.length) [poly, labels] = clipCell(poly, labels, p, pts[j], j);
      const vids = poly.map(vid);
      const f = field(p[0], p[1]) + nm * (0.16 * n1(p[0] / 160, p[1] / 160) + 0.06 * n2(p[0] / 50, p[1] / 50));
      return { p, poly, labels, vids, area: Math.abs(polygonArea(poly)), land: f > 0 };
    });
    const n = cells.length;
    // Distance from the sea over land, for elevation.
    const coastDist = new Float64Array(n).fill(Infinity);
    const queue = [];
    cells.forEach((c, i) => {
      if (!c.land) return;
      if (c.labels.some((L) => L >= 0 && !cells[L].land)) {
        coastDist[i] = 0;
        queue.push(i);
      }
    });
    for (let qi = 0; qi < queue.length; qi++) {
      const i = queue[qi];
      for (const L of cells[i].labels) {
        if (L < 0 || !cells[L].land) continue;
        const d = coastDist[i] + dist(cells[i].p, cells[L].p);
        if (d < coastDist[L] - 1e-9) {
          coastDist[L] = d;
          queue.push(L);
        }
      }
    }
    const ridge = valueNoise(map.seed + 41);
    const hills = valueNoise(map.seed + 53);
    const wet = valueNoise(map.seed + 67);
    cells.forEach((c, i) => {
      const [x, y] = c.p;
      const cd = Number.isFinite(coastDist[i]) ? coastDist[i] : 400;
      c.coastDist = cd;
      c.elev = c.land ? 0.55 * Math.min(1, cd / 230) + 0.35 * (1 - Math.abs(ridge(x / 240, y / 240))) + 0.15 * hills(x / 90, y / 90) : -1;
      c.moist = wet(x / 220, y / 220) + (cd < 40 ? 0.15 : 0);
    });
    return { cells, verts, cols, rows };
  }

  function landComponents(cells) {
    const comp = new Int32Array(cells.length).fill(-1);
    const comps = [];
    cells.forEach((c, i) => {
      if (!c.land || comp[i] >= 0) return;
      const id = comps.length;
      const members = [i];
      comp[i] = id;
      for (let qi = 0; qi < members.length; qi++) {
        for (const L of cells[members[qi]].labels) {
          if (L >= 0 && cells[L].land && comp[L] < 0) {
            comp[L] = id;
            members.push(L);
          }
        }
      }
      comps.push({ id, members, area: members.reduce((s, m) => s + cells[m].area, 0) });
    });
    return { comp, comps };
  }

  // Grow territories outward from their seats over land; noisy costs make the borders organic.
  function growRegions(map, cells, comp, seeds) {
    const g = normGen(map.gen);
    const k = [0.15, 0.55, 1.0][g.borders];
    const bn = valueNoise(map.seed + 79);
    const owner = new Int32Array(cells.length).fill(-1);
    const cost = new Float64Array(cells.length).fill(Infinity);
    // Binary heap keyed by cost.
    const heap = [];
    const push = (i, c) => {
      heap.push([c, i]);
      let j = heap.length - 1;
      while (j > 0) {
        const p = (j - 1) >> 1;
        if (heap[p][0] <= heap[j][0]) break;
        [heap[p], heap[j]] = [heap[j], heap[p]];
        j = p;
      }
    };
    const pop = () => {
      const top = heap[0];
      const last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        let j = 0;
        for (;;) {
          const l = 2 * j + 1;
          const r = l + 1;
          let m = j;
          if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if (m === j) break;
          [heap[m], heap[j]] = [heap[j], heap[m]];
          j = m;
        }
      }
      return top;
    };
    seeds.forEach((s, t) => {
      cost[s] = 0;
      owner[s] = t;
      push(s, 0);
    });
    while (heap.length) {
      const [c0, i] = pop();
      if (c0 > cost[i]) continue;
      const pi = cells[i].p;
      for (const L of cells[i].labels) {
        if (L < 0 || !cells[L].land || comp[L] !== comp[i]) continue;
        const pl = cells[L].p;
        const mx = (pi[0] + pl[0]) / 2;
        const my = (pi[1] + pl[1]) / 2;
        const c1 = c0 + dist(pi, pl) * Math.exp(k * bn(mx / 90, my / 90));
        if (c1 < cost[L]) {
          cost[L] = c1;
          owner[L] = owner[i];
          push(L, c1);
        }
      }
    }
    return owner;
  }

  function nearestCell(cells, x, y, pred) {
    let best = -1;
    let bd = Infinity;
    for (let i = 0; i < cells.length; i++) {
      if (pred && !pred(i)) continue;
      const d = (cells[i].p[0] - x) ** 2 + (cells[i].p[1] - y) ** 2;
      if (d < bd) {
        bd = d;
        best = i;
      }
    }
    return best;
  }

  function chaikin(pts, iterations, closed) {
    let p = pts;
    for (let it = 0; it < iterations && p.length > 2; it++) {
      const out = closed ? [] : [p[0]];
      const n = p.length;
      const last = closed ? n : n - 1;
      for (let i = 0; i < last; i++) {
        const a = p[i];
        const b = p[(i + 1) % n];
        out.push([0.75 * a[0] + 0.25 * b[0], 0.75 * a[1] + 0.25 * b[1]]);
        out.push([0.25 * a[0] + 0.75 * b[0], 0.25 * a[1] + 0.75 * b[1]]);
      }
      if (!closed) {
        out[1] = out[1];
        out.splice(1, 1);
        out.splice(out.length - 1, 1);
        out.push(p[n - 1]);
      }
      p = out;
    }
    return p;
  }

  /*
   * Outlines of every region (territory or islet): the cell edges where the
   * neighbour belongs elsewhere, chained into rings and cut into runs that share
   * one neighbour. A run between two territories is smoothed and warped the same
   * way from both sides, so shared borders match exactly.
   */
  function traceRegions(map, fine, region, regionCount, warp) {
    const { cells, verts } = fine;
    const g = normGen(map.gen);
    const coastSmooth = [2, 1, 0][g.rough];
    const borderSmooth = [3, 2, 1][g.borders];
    const out = Array.from({ length: regionCount }, () => ({ rings: [], runs: [], coastLength: 0, border: new Map() }));
    const edgesBy = Array.from({ length: regionCount }, () => new Map());
    cells.forEach((c, i) => {
      const R = region[i];
      if (R < 0) return;
      const n = c.vids.length;
      for (let k = 0; k < n; k++) {
        const a = c.vids[k];
        const b = c.vids[(k + 1) % n];
        if (a === b) continue;
        const L = c.labels[k];
        let lab;
        if (L === -2) lab = -2;
        else {
          const o = region[L];
          if (o === R) continue;
          lab = o < 0 ? -1 : o;
        }
        const m = edgesBy[R];
        if (!m.has(a)) m.set(a, []);
        m.get(a).push({ a, b, lab, used: false });
      }
    });
    const runCache = new Map();
    function processRun(ids, lab, closed) {
      const key = closed ? null : ids.join(',');
      const rkey = closed ? null : ids.slice().reverse().join(',');
      if (key && runCache.has(rkey)) return runCache.get(rkey).slice().reverse();
      let pts = ids.map((v) => verts[v]);
      const it = lab === -2 ? 0 : lab === -1 ? coastSmooth : borderSmooth;
      pts = chaikin(pts, it, closed).map((p) => warp(p[0], p[1]));
      if (key) runCache.set(key, pts);
      return pts;
    }
    for (let R = 0; R < regionCount; R++) {
      const m = edgesBy[R];
      for (const list of m.values()) {
        for (const e0 of list) {
          if (e0.used) continue;
          const loop = [];
          let e = e0;
          while (e && !e.used) {
            e.used = true;
            loop.push(e);
            const next = (m.get(e.b) || []).find((x) => !x.used);
            e = next;
          }
          if (loop.length < 3) continue;
          // Rotate so the loop starts where the neighbour changes.
          let start = loop.findIndex((x, i) => x.lab !== loop[(i - 1 + loop.length) % loop.length].lab);
          const single = start === -1;
          if (single) start = 0;
          const ordered = loop.slice(start).concat(loop.slice(0, start));
          const ring = [];
          let i = 0;
          while (i < ordered.length) {
            const lab = ordered[i].lab;
            const ids = [ordered[i].a];
            while (i < ordered.length && ordered[i].lab === lab) {
              ids.push(ordered[i].b);
              i++;
            }
            const len = ids.reduce((s, v, k) => (k ? s + dist(verts[ids[k - 1]], verts[v]) : 0), 0);
            let pts;
            if (single) {
              ids.pop();
              pts = processRun(ids, lab, true);
            } else pts = processRun(ids, lab, false);
            out[R].runs.push({ lab, pts, len, closed: single });
            if (lab === -1) out[R].coastLength += len;
            else if (lab >= 0) out[R].border.set(lab, (out[R].border.get(lab) || 0) + len);
            const add = single ? pts : pts.slice(0, -1);
            for (const p of add) ring.push(p);
          }
          out[R].rings.push(ring);
        }
      }
      out[R].rings.sort((a, b) => Math.abs(polygonArea(b)) - Math.abs(polygonArea(a)));
    }
    return out;
  }

  function fineRivers(map, fine, region, warp) {
    const { cells, verts } = fine;
    const g = normGen(map.gen);
    const nv = verts.length;
    const elev = new Float64Array(nv);
    const cnt = new Int32Array(nv);
    const coast = new Uint8Array(nv);
    const edge = new Uint8Array(nv);
    const nbrs = Array.from({ length: nv }, () => []);
    cells.forEach((c, i) => {
      if (!c.land) return;
      const n = c.vids.length;
      for (let k = 0; k < n; k++) {
        const a = c.vids[k];
        const b = c.vids[(k + 1) % n];
        elev[a] += c.elev;
        cnt[a]++;
        const L = c.labels[k];
        if (L === -2) edge[a] = edge[b] = 1;
        else if (!cells[L].land) coast[a] = coast[b] = 1;
        else if (a !== b && region[i] >= 0 && region[L] >= 0) {
          nbrs[a].push(b);
        }
      }
    });
    for (let v = 0; v < nv; v++) elev[v] = coast[v] ? 0 : cnt[v] ? elev[v] / cnt[v] : -1;
    const rng = mulberry32(hashString('rivers2:' + map.seed));
    const want = [2, 4, 7][g.rivers];
    const visible = (p) => p[0] > 25 && p[0] < map.width - 25 && p[1] > 25 && p[1] < map.height - 25 && clearOfDecor(p[0], p[1], 10);
    const cand = [];
    for (let v = 0; v < nv; v++) if (cnt[v] >= 2 && !coast[v] && !edge[v] && nbrs[v].length && visible(verts[v])) cand.push(v);
    cand.sort((a, b) => elev[b] - elev[a]);
    const top = cand.slice(0, Math.max(want * 6, Math.round(cand.length * 0.12)));
    const used = new Set();
    const sources = [];
    const rivers = [];
    const lakes = [];
    for (const start of top) {
      if (rivers.length >= want) break;
      if (used.has(start) || sources.some((s) => dist(verts[s], verts[start]) < 100)) continue;
      const path = [start];
      const seen = new Set(path);
      let cur = start;
      let end = 'lake';
      let budget = 0.05;
      for (let step = 0; step < 400; step++) {
        if (coast[cur]) {
          end = 'sea';
          break;
        }
        let best = -1;
        for (const nb of nbrs[cur]) if (!seen.has(nb) && (best === -1 || elev[nb] < elev[best])) best = nb;
        if (best === -1) break;
        const rise = elev[best] - elev[cur];
        if (rise > 0) {
          budget -= rise;
          if (budget < 0) break;
        }
        path.push(best);
        seen.add(best);
        if (used.has(best)) {
          end = 'join';
          break;
        }
        cur = best;
      }
      if (path.length < 7 || (end === 'lake' && path.length < 12)) continue;
      const points = chaikin(path.map((v) => verts[v]), 2, false).map((p) => warp(p[0], p[1]));
      rivers.push({ points, end });
      if (end === 'lake') {
        const p = points[points.length - 1];
        lakes.push({ x: p[0], y: p[1], r: 9 + rng() * 5 });
      }
      path.forEach((v) => used.add(v));
      sources.push(start);
    }
    return { rivers, lakes };
  }

  // Which cell each territory's seat sits on (nearest land cell to its stored position).
  function seatCells(fine, positions) {
    const taken = new Set();
    return positions.map((p) => {
      const i = nearestCell(fine.cells, p.x, p.y, (k) => fine.cells[k].land && !taken.has(k));
      taken.add(i);
      return i;
    });
  }

  function buildGeometry2(campaign) {
    const map = campaign.map;
    const fine = buildFine(map);
    const { cells } = fine;
    const { comp, comps } = landComponents(cells);
    const seeds = seatCells(fine, campaign.territories.map((t) => t.position));
    const owner = growRegions(map, cells, comp, seeds);
    // Land nobody's seat reaches (separate islets) becomes unowned islets.
    const T = campaign.territories.length;
