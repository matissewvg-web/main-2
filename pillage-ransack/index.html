  /* ---------- new-map preview ---------- */

  let previewTimer = 0;
  function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(renderPreview, 120);
  }

  // The map the New campaign form would create, drawn small with its terrain, rivers and sea lanes.
  function renderPreview() {
    const box = $('newPreview');
    if (!box) return;
    const shape = $('newShape').value;
    const count = Number($('newCount').value);
    const kn = Number(($('newKingdoms') || {}).value || 1);
    const c = E.newCampaign({ seed: $('newSeed').value.trim() || 'x', count, shape: shape === 'random' ? undefined : shape, kingdoms: kn, gen: readGen(), now: 1 });
    const g = E.buildGeometry(c);
    const pal = SEASON_PALETTE.summer;
    let out = '<svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"><rect width="1000" height="700" fill="' + pal.sea + '"/>';
    const land = g.shapes.map((sh) => sh.d).join('') + g.islets.map((r) => E.pathData(r, true)).join('');
    out += '<path d="' + land + '" fill="none" stroke="#e6e0c6" stroke-opacity="0.45" stroke-width="16" stroke-linejoin="round"/>';
    g.shapes.forEach((sh, i) => (out += '<path d="' + sh.d + '" fill-rule="evenodd" fill="' + pal[c.territories[i].terrain] + '"/>'));
    if (g.islets.length) out += '<path d="' + g.islets.map((r) => E.pathData(r, true)).join('') + '" fill="' + pal.coast + '"/>';
    out += '<path d="' + g.borders.map((b) => E.pathData(b.points, false)).join('') + '" fill="none" stroke="#3a2817" stroke-opacity="0.5" stroke-width="1.5"/>';
    out += '<path d="' + g.rivers.map((r) => E.pathData(r.points, false)).join('') + '" fill="none" stroke="#3f7186" stroke-width="4" stroke-linecap="round"/>';
    for (const ln of g.seaLanes) {
      const a = g.shapes[ln.a].centroid;
      const b = g.shapes[ln.b].centroid;
      out += '<path d="M' + a[0].toFixed(0) + ' ' + a[1].toFixed(0) + 'L' + b[0].toFixed(0) + ' ' + b[1].toFixed(0) + '" stroke="#2f4f5a" stroke-width="3" stroke-dasharray="14 10"/>';
    }
    out += '<path d="' + g.coast.map((sg) => E.pathData(sg, false)).join('') + '" fill="none" stroke="#3a2817" stroke-width="3" stroke-linecap="round"/>';
    for (const k of c.kingdoms) {
      const home = g.shapes[g.index.get(k.capital)].centroid;
      out += '<circle cx="' + home[0].toFixed(0) + '" cy="' + home[1].toFixed(0) + '" r="15" fill="' + E.kingdomColor(k) + '" stroke="#efe1bf" stroke-width="4"/>';
    }
    out += '</svg>';
    box.innerHTML = out;
    $('newPreviewCap').textContent = E.SHAPE_LABEL[c.map.shape] + (g.landCount > 1 ? ' of ' + g.landCount + ' islands' : '') + ' · ' + count + ' territories · ' + g.rivers.length + ' river' + (g.rivers.length === 1 ? '' : 's') + ' \u00b7 ' + (kn > 1 ? 'dots are the capitals' : 'the dot is home') + '. Suggested name: ' + c.name;
    $('newName').placeholder = c.name;
  }

  /* ---------- actions ---------- */

  function setTab(tab) {
    S.tab = tab;
    S.confirm = null;
    S.resolving = null;
    if (tab !== 'campaign') S.jsonBox = null;
    renderTabs();
    renderPanel();
    renderFrontier();
    renderPlanPath();
    renderSelection();
  }

  function logRaid() {
    readPlan();
    const p = S.plan;
    const c = S.campaign;
    if (!p.target || !terr(p.target)) return toast('Choose a target first.');
    const ongoing = p.outcome === 'ongoing';
    if (!canPlay(S.active)) return toast(K().name + ' belongs to another player.');
    const raid = {
      id: E.nextRaidId(),
      by: S.active,
      updatedAt: Date.now(),
      sourceTerritory: p.source,
      targetTerritory: p.target,
      outcome: p.outcome,
      timestamp: Date.now(),
      losses: ongoing ? 0 : p.losses,
      lootGained: ongoing ? 0 : p.loot,
      warband: p.warband,
      year: c.year,
      season: c.season,
      notes: p.notes.trim().slice(0, 500),
    };
    c.raids.push(raid);
    S.lastLogged = { id: raid.id, at: Date.now() };
    S.selected = p.target;
    const name = terr(p.target).name;
    p.notes = '';
    p.losses = 0;
    p.loot = 0;
    if (S.uid) raid.authorId = S.uid;
    const who = $('planWho') ? (c.players || []).find((x) => x.id === $('planWho').value) : atTable(S.active);
    if (who) {
      raid.playerId = who.id;
      S.playerFor.set(S.active, who.id);
    }
    const msg = (c.kingdoms.length > 1 ? K().name + ': ' : '') + (ongoing ? 'raiders set out for ' + name + '.' : OUTCOME[raid.outcome].label + ' at ' + name + (raid.lootGained ? ': ' + signed(raid.lootGained) + ' gold' : '') + (raid.losses ? ', ' + raid.losses + ' men lost' : '') + '.');
    commit(msg);
  }

  function resolveRaid(id, outcome, form) {
    const r = S.campaign.raids.find((x) => x.id === id);
    if (!r) return;
    r.outcome = outcome;
    r.losses = Math.max(0, Math.round(Number(form.querySelector('#resLosses').value) || 0));
    r.lootGained = Math.max(0, Math.round(Number(form.querySelector('#resLoot').value) || 0));
    r.resolvedAt = Date.now();
    r.updatedAt = Date.now();
    S.resolving = null;
    S.lastLogged = null;
    commit(OUTCOME[outcome].label + ' at ' + terrName(r.targetTerritory) + '.');
    flashCell(r.targetTerritory);
  }

  function focusRaid(id) {
    const r = S.campaign.raids.find((x) => x.id === id);
    if (!r) return;
    S.selected = r.targetTerritory;
    S.hotRaid = recentRaids().some((x) => x.id === id) ? id : null;
    if (!S.showRaids) {
      S.showRaids = true;
      $('optRaids').checked = true;
    }
    renderRaids();
    renderSelection();
    startTokens();
    if (S.tab === 'territory') renderPanel();
    clearTimeout(focusRaid.t);
    focusRaid.t = setTimeout(() => {
      S.hotRaid = null;
      renderRaids();
      startTokens();
    }, 2600);
    if (!S.hotRaid) toast('That raid is older than the last 10, so it isn’t drawn. Its territory is outlined.');
  }

  function advanceSeason(dir) {
    const c = S.campaign;
    const idx = E.seasonIndex(c.year, c.season) + dir;
    if (idx < 0) return;
    const before = S.result.kingdoms.get(S.active).treasury;
    const s = E.seasonFromIndex(idx);
    c.year = s.year;
    c.season = s.season;
    c.seasonAt = Date.now();
    S.roundFrom = null; // a new season starts a new round of turns
    S.campaign.updatedAt = Date.now();
    recompute();
    persist(c);
    renderAll();
    if (dir > 0) {
      const gain = S.result.kingdoms.get(S.active).treasury - before;
      toast(seasonText(c.year, c.season) + ' begins. ' + (c.kingdoms.length > 1 ? K().name + '\u2019s tribute ' : 'Tribute ') + signed(gain) + ' gold; garrisons recover.');
    } else toast('Back to ' + seasonText(c.year, c.season) + '.');
  }

  async function exportCampaigns(list, label) {
    const json = E.exportJSON(list.map(stripRuntime));
    const safe = label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'campaign';
    const filename = 'pillage-ransack-' + safe + '.json';
    if (inViewer) {
      let dl = null;
      try {
        dl = await window.claude.use('downloads');
      } catch (e) {
        dl = null;
      }
      if (dl) {
        try {
          await dl.save({ filename, data: json });
          toast('Saved ' + filename);
        } catch (e) {
          if (e && e.code === 'declined') return;
          showJson(json, 'Saving files isn’t available here. Copy this JSON instead:');
        }
        return;
      }
      showJson(json, 'Saving files isn’t available here. Copy this JSON instead:');
      return;
    }
    try {
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('Saved ' + filename);
    } catch (e) {
      showJson(json, 'Copy this JSON:');
    }
  }

  function showJson(text, label) {
    S.jsonBox = { text, label };
    renderPanel();
    const box = $('jsonOut');
    if (box) {
      box.focus();
      box.select();
    }
  }

  async function copyJson() {
    const json = E.exportJSON([stripRuntime(S.campaign)]);
    try {
      await navigator.clipboard.writeText(json);
      toast('Campaign JSON copied.');
    } catch (e) {
      showJson(json, 'Copying was blocked. Select all and copy:');
    }
  }

  const SAFE_ID = /^[A-Za-z0-9_\-~:@+]{1,120}$/;
  function importText(text) {
    let res;
    try {
      res = E.parseImport(text);
    } catch (e) {
      toast(e.message);
      return;
    }
    let first = null;
    for (const c of res.campaigns) {
      if (!SAFE_ID.test(c.id) || S.campaigns.has(c.id)) {
        c.id = E.newId('c');
        if ([...S.campaigns.values()].some((x) => x.name === c.name)) c.name = c.name + ' (imported)';
      }
      c.updatedAt = Date.now();
      S.campaigns.set(c.id, c);
      persist(c);
      first = first || c;
    }
    setCampaign(first);
    S.tab = 'campaign';
    renderTabs();
    renderPanel();
    toast('Imported ' + res.campaigns.length + ' campaign' + (res.campaigns.length === 1 ? '' : 's') + (res.warnings.length ? '. ' + res.warnings[0] + (res.warnings.length > 1 ? ' (+' + (res.warnings.length - 1) + ' more notes)' : '') : '.'));
  }

  // A new campaign on a random seed, shape and size. Rolling again replaces a
  // fresh map you haven't kept, so rerolling doesn't pile up campaigns.
  function randomMap() {
    const prev = S.campaign;
    const lvl = () => (Math.random() < 0.5 ? 1 : Math.random() < 0.5 ? 0 : 2);
    const gen = { rough: lvl(), borders: lvl(), mountains: lvl(), forests: lvl(), wetlands: lvl(), rivers: lvl(), wealth: 1, defences: 1 };
    const nc = E.newCampaign({ seed: E.randomSeed(), count: E.MIN_TERRITORIES + Math.floor(Math.random() * (E.MAX_TERRITORIES - E.MIN_TERRITORIES + 1)), shape: E.SHAPES[Math.floor(Math.random() * E.SHAPES.length)], kingdoms: prev ? prev.kingdoms.length : 1, gen });
    nc.saved = false;
    nc.fresh = true;
    if (prev && prev.fresh && !prev.saved) S.campaigns.delete(prev.id);
    setCampaign(nc, false, true);
    toast('Rolled \u201c' + nc.name + '\u201d: ' + E.SHAPE_LABEL[nc.map.shape].toLowerCase() + ', ' + nc.territories.length + ' territories.');
  }

  async function shareCampaign() {
    const c = S.campaign;
    if (store.mode !== 'cloud' || c.shared) return;
    const privateRef = store.col.doc(c.id);
    c.shared = true;
    c.example = false;
    if (!myPlayer()) {
      c.players = c.players || [];
      c.players.push(E.newPlayer('', S.active, { userId: S.uid }));
    }
    commit('Shared. Invite players from the Share menu on claude.ai; each joins a kingdom in Kingdoms.');
    try {
      await privateRef.delete();
    } catch (e) {
      /* the private copy is harmless if it lingers */
    }
  }

  function deleteCampaign() {
    const c = S.campaign;
    S.campaigns.delete(c.id);
    removeCloud(c);
    saveLocal();
    const next = [...S.campaigns.values()].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
    setCampaign(next || makeExample());
    toast('Deleted “' + c.name + '”.');
  }

  document.addEventListener('click', (e) => {
    const tabBtn = e.target.closest('.tabs button');
    if (tabBtn) return setTab(tabBtn.dataset.tab);
    const go = e.target.closest('[data-tab-go]');
    if (go) return setTab(go.dataset.tabGo);
    const mode = e.target.closest('#viewModes button');
    if (mode) {
      S.mode = mode.dataset.mode;
      document.querySelectorAll('#viewModes button').forEach((b) => b.setAttribute('aria-pressed', String(b === mode)));
      renderMap();
      return;
    }
    const a = e.target.closest('[data-action]');
    if (!a) return;
    const c = S.campaign;
    const act = a.dataset.action;
    const rid = a.dataset.raid;
    switch (act) {
      case 'select':
        onMapTap(a.dataset.id);
        break;
      case 'random-map':
        randomMap();
        break;
      case 'keep-fresh':
        commit('Map kept as \u201c' + c.name + '\u201d.');
        break;
      case 'plan-here':
        S.plan.target = S.selected;
        setTab('raid');
        break;
      case 'play-as':
        if (!canPlay(a.dataset.id)) break;
        S.active = a.dataset.id;
        S.plan.source = 'base';
        if (S.kEdit) S.kEdit = a.dataset.id;
        renderAll();
        break;
      case 'edit-kingdom':
        S.kEdit = S.kEdit === a.dataset.id ? null : a.dataset.id;
        renderPanel();
        break;
      case 'cancel-kingdom':
        S.kEdit = null;
        renderPanel();
        break;
      case 'roll-arms': {
        const arms = E.randomArms(E.mulberry32(Math.floor(Math.random() * 1e9)));
        $('kDivision').value = arms.division;
        $('kCharge').value = arms.charge;
        for (const [n, v] of [['kField', arms.field], ['kSecond', arms.second], ['kChargeColor', arms.chargeColor]]) {
          const r = document.querySelector('input[name="' + n + '"][value="' + v + '"]');
          if (r) r.checked = true;
        }
        $('armsPreview').innerHTML = shieldSVG(readArmsForm(), 64, 'Preview of the arms');
        break;
      }
      case 'roll-identity': {
        const k = kOf(S.kEdit);
        const fresh = E.randomKingdom(E.mulberry32(Math.floor(Math.random() * 1e9)), c.kingdoms.indexOf(k), k.capital, terr(k.capital).name);
        Object.assign(k, { name: fresh.name, ruler: fresh.ruler, motto: fresh.motto, arms: fresh.arms, trait: fresh.trait, updatedAt: Date.now() });
        commit(k.name + ' has a new identity.');
        break;
      }
      case 'pick-capital':
        S.pickCapital = a.dataset.id;
        toast('Tap a territory on the map to make it the capital of ' + kOf(a.dataset.id).name + '.');
        break;
      case 'join-kingdom': {
        const k = kOf(a.dataset.id);
        c.players = c.players || [];
        const mine = myPlayer();
        if (mine) {
          mine.kingdom = k.id;
          mine.updatedAt = Date.now();
        } else {
          if (c.players.length >= E.MAX_PLAYERS) return toast('This campaign already has ' + E.MAX_PLAYERS + ' players.');
          c.players.push(E.newPlayer('', k.id, { userId: S.uid }));
        }
        S.active = k.id;
        commit('You now play ' + k.name + (E.playersOf(c, k.id).length > 1 ? ' with ' + E.playersOf(c, k.id).filter((x) => x.userId !== S.uid).map(playerName).join(', ') : '') + '.');
        break;
      }
      case 'leave-kingdom': {
        const mine = myPlayer();
        if (!mine) break;
        c.players = c.players.filter((x) => x.id !== mine.id);
        c.deleted = (c.deleted || []).concat([mine.id]);
        commit('You left ' + kOf(a.dataset.id).name + '.');
        break;
      }
      case 'remove-player': {
        const pl = (c.players || []).find((x) => x.id === a.dataset.id);
        if (!pl) break;
        c.players = c.players.filter((x) => x.id !== pl.id);
        c.deleted = (c.deleted || []).concat([pl.id]);
        commit(playerName(pl) + ' left ' + kOf(pl.kingdom).name + '.');
        break;
      }
      case 'next-turn':
        nextTurn();
        break;
      case 'add-kingdom': {
        if (c.kingdoms.length >= E.MAX_KINGDOMS) break;
        const used = new Set(c.kingdoms.map((k) => k.capital));
        const touched = new Set(c.raids.map((r) => r.targetTerritory));
        const caps = E.chooseCapitals(c, S.geo, Math.min(c.territories.length, E.MAX_KINGDOMS + 6)).filter((id) => !used.has(id));
        const cap = caps.find((id) => !touched.has(id) && S.result.territories.get(id).status === 'unclaimed') || caps[0];
        if (!cap) return toast('There is no free territory left for a capital.');
        const k = E.randomKingdom(E.mulberry32(Math.floor(Math.random() * 1e9)), c.kingdoms.length, cap, terr(cap).name, { id: E.newId('k'), now: Date.now() });
        k.color = (E.KINGDOM_COLORS.find((x) => !c.kingdoms.some((o) => o.color === x.id)) || E.KINGDOM_COLORS[0]).id;
        c.kingdoms.push(k);
        S.kEdit = k.id;
        commit(k.name + ' joins the war, ruled from ' + terr(cap).name + '.');
        break;
      }
      case 'ask-remove-kingdom':
        S.confirm = 'kingdom:' + a.dataset.id;
        renderPanel();
        break;
      case 'remove-kingdom': {
        const kid = a.dataset.id;
        if (c.kingdoms.length < 2) break;
        const gone = c.raids.filter((r) => r.by === kid).map((r) => r.id).concat(c.adjustments.filter((x) => x.kingdom === kid).map((x) => x.id));
        c.deleted = (c.deleted || []).concat([kid], gone);
        c.raids = c.raids.filter((r) => r.by !== kid);
        c.adjustments = c.adjustments.filter((x) => x.kingdom !== kid);
        const name = kOf(kid).name;
        c.kingdoms = c.kingdoms.filter((k) => k.id !== kid);
        for (const pl of (c.players || []).filter((x) => x.kingdom === kid)) {
          const smallest = c.kingdoms.slice().sort((x, y) => E.playersOf(c, x.id).length - E.playersOf(c, y.id).length)[0];
          pl.kingdom = smallest.id;
          pl.updatedAt = Date.now();
        }
        for (const t of c.territories) {
          if (t.overrideBy === kid) {
            t.overrideBy = null;
            t.editedAt = Date.now();
          }
        }
        if (S.active === kid) S.active = null;
        S.confirm = null;
        commit(name + ' has been removed with its raids.');
        break;
      }
      case 'share-campaign':
        shareCampaign();
        break;
      case 'roll-gen':
        for (const [key] of GEN_FIELDS) {
          const f = $('gen-' + key);
          if (f) f.value = String(Math.random() < 0.4 ? 1 : Math.random() < 0.5 ? 0 : 2);
        }
        renderPreview();
        break;

      case 'raid-from':
        S.plan.source = S.selected;
        if (S.plan.target === S.selected) S.plan.target = null;
        setTab('raid');
        toast('Raids now set out from ' + terr(S.selected).name + '. Pick a target.');
        break;
      case 'resolve':
        S.resolving = rid;
        S.confirm = null;
        renderPanel();
        break;
      case 'cancel-resolve':
        S.resolving = null;
        renderPanel();
        break;
      case 'ask-delete-raid':
        S.confirm = 'raid:' + rid;
        S.resolving = null;
        renderPanel();
        break;
      case 'delete-raid':
        c.raids = c.raids.filter((x) => x.id !== rid);
        c.deleted = (c.deleted || []).concat([rid]);
        S.confirm = null;
        commit('Raid deleted; the map has been recalculated.');
        break;
      case 'cancel-confirm':
        S.confirm = null;
        renderPanel();
        break;
      case 'focus-raid':
        focusRaid(rid);
        break;
      case 'start-own':
        setTab('campaign');
        setTimeout(() => {
          const n = $('newName');
          if (n) {
            n.focus();
            n.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
          }
        }, 0);
        break;
      case 'keep-example':
        c.example = false;
        c.settingsAt = Date.now();
        commit('It’s your campaign now.');
        break;
      case 'reroll':
        $('newSeed').value = E.randomSeed();
        renderPreview();
        break;
      case 'ask-delete-adj':
        S.confirm = 'adj:' + a.dataset.id;
        renderPanel();
        break;
      case 'delete-adj':
        c.adjustments = c.adjustments.filter((x) => x.id !== a.dataset.id);
        c.deleted = (c.deleted || []).concat([a.dataset.id]);
        S.confirm = null;
        commit('Entry removed.');
        break;
      case 'delete-ms':
        c.milestones = c.milestones.filter((x) => x.id !== a.dataset.id);
        c.deleted = (c.deleted || []).concat([a.dataset.id]);
        commit('Milestone removed.');
        break;
      case 'export-one':
        exportCampaigns([c], c.name);
        break;
      case 'export-all':
        exportCampaigns([...S.campaigns.values()], 'all-campaigns');
        break;
      case 'copy-json':
        copyJson();
        break;
      case 'import-text': {
        const txt = $('importText').value.trim();
        if (!txt) return toast('Paste campaign JSON first.');
        importText(txt);
        break;
      }
      case 'ask-delete-campaign':
        S.confirm = 'campaign';
        renderPanel();
        break;
      case 'delete-campaign':
        deleteCampaign();
        break;
    }
  });

  document.addEventListener('submit', (e) => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    const c = S.campaign;
    const kind = f.dataset.form;
    if (kind === 'plan') logRaid();
    else if (kind === 'resolve') {
      const outcome = e.submitter && e.submitter.value === 'failure' ? 'failure' : 'success';
      resolveRaid(f.dataset.raid, outcome, f);
    } else if (kind === 'rename') {
      const v = $('terrRename').value.trim().slice(0, 60);
      if (!v) return toast('A territory needs a name.');
      terr(S.selected).name = v;
      terr(S.selected).editedAt = Date.now();
      buildStatic();
      commit('Renamed to ' + v + '.');
    } else if (kind === 'new') {
      const shape = $('newShape').value;
      const nc = E.newCampaign({ name: $('newName').value.trim().slice(0, 80) || undefined, seed: $('newSeed').value.trim() || E.randomSeed(), count: Number($('newCount').value), shape: shape === 'random' ? undefined : shape, kingdoms: Number($('newKingdoms').value), gen: readGen(), players: $('newPlayers').value.split('\n') });
      nc.saved = false;
      setCampaign(nc, false, true);
      persist(nc);
      S.tab = nc.kingdoms.length > 1 ? 'kingdoms' : 'territory';
      renderTabs();
      renderPanel();
      toast('\u201c' + nc.name + '\u201d created. ' + (nc.kingdoms.length > 1 ? 'Customise the kingdoms, then choose who plays first.' : 'Your capital has the keep on it.'));
    } else if (kind === 'settings') {
      c.name = $('setName').value.trim().slice(0, 80) || c.name;
      c.goalPct = Math.max(5, Math.min(100, Math.round(Number($('setGoal').value) || 60)));
      c.settingsAt = Date.now();
      commit('Settings saved.');
    } else if (kind === 'add-player') {
      const input = f.querySelector('input');
      const name = input.value.trim().slice(0, 30);
      if (!name) return toast('Type a name first.');
      c.players = c.players || [];
      if (c.players.length >= E.MAX_PLAYERS) return toast('This campaign already has ' + E.MAX_PLAYERS + ' players.');
      const pl = E.newPlayer(name, f.dataset.id);
      c.players.push(pl);
      if (!S.playerFor.has(f.dataset.id)) S.playerFor.set(f.dataset.id, pl.id);
      commit(name + ' joins ' + kOf(f.dataset.id).name + '.');
      setTimeout(() => {
        const again = $('np-' + f.dataset.id);
        if (again) again.focus();
      }, 0);
    } else if (kind === 'kingdom') {
      const k = kOf(f.dataset.id);
      const color = document.querySelector('input[name="kColor"]:checked');
      Object.assign(k, {
        name: $('kName').value.trim().slice(0, 40) || k.name,
        motto: $('kMotto').value.trim().slice(0, 60),
        ruler: { title: $('kTitle').value, name: $('kRuler').value.trim().slice(0, 40) || k.ruler.name },
        color: color && !c.kingdoms.some((o) => o.id !== k.id && o.color === color.value) ? color.value : k.color,
        arms: readArmsForm(),
        trait: $('kTrait').value,
        start: {
          treasury: Math.round(Number($('kGold').value) || 0),
          army: Math.max(0, Math.round(Number($('kArmy').value) || 0)),
          morale: Math.max(0, Math.min(100, Math.round(Number($('kMorale').value) || 0))),
        },
        updatedAt: Date.now(),
      });
      if (!c.raids.length && $('kCapital').value && !capitalKingdom($('kCapital').value)) k.capital = $('kCapital').value;
      S.kEdit = null;
      commit(k.name + ' saved.');

    } else if (kind === 'adjust') {
      const a = { army: Math.round(Number($('adjArmy').value) || 0), treasury: Math.round(Number($('adjGold').value) || 0), morale: Math.round(Number($('adjMorale').value) || 0) };
      if (!a.army && !a.treasury && !a.morale) return toast('Enter a change to men, gold or morale.');
      if (!canPlay(S.active)) return toast(K().name + ' belongs to another player.');
      c.adjustments.push(Object.assign({ id: E.newId('a'), kingdom: S.active, updatedAt: Date.now(), year: c.year, season: c.season, timestamp: Date.now(), note: $('adjNote').value.trim().slice(0, 200) }, a));
      commit('Recorded.');
    } else if (kind === 'milestone') {
      const label = $('msLabel').value.trim().slice(0, 80);
      if (!label) return;
      c.milestones.push({ id: E.newId('m'), kingdom: null, updatedAt: Date.now(), year: c.year, season: c.season, timestamp: Date.now(), kind: $('msKind').value, label });
      commit('Milestone added.');
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.closest('form[data-form="plan"]')) {
      readPlan();
      updatePlanDerived();
      if (t.id === 'planTarget' || t.id === 'planSource') {
        if (t.id === 'planTarget') S.selected = S.plan.target;
        renderPlanPath();
        renderSelection();
      }
    } else if (t.closest('form[data-form="kingdom"]')) {
      if (t.id === 'kTrait') $('kTraitNote').textContent = E.TRAITS[t.value].note;
      if (['kDivision', 'kCharge'].includes(t.id) || ['kField', 'kSecond', 'kChargeColor'].includes(t.name)) $('armsPreview').innerHTML = shieldSVG(readArmsForm(), 64, 'Preview of the arms');
    } else if (t.id === 'newCount') {
      $('newCountOut').textContent = t.value;
      schedulePreview();
    } else if (t.id === 'newSeed' || t.id === 'newKingdoms' || (t.id && t.id.startsWith('gen-'))) schedulePreview();
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'playAs' || t.id === 'planBy') {
      S.active = t.value;
      S.plan.source = 'base';
      renderAll();
      return;
    }
    if (t.id === 'whoPlays' || t.id === 'planWho') {
      S.playerFor.set(S.active, t.value);
      if (t.id === 'whoPlays' && S.tab === 'raid') renderPanel();
      if (t.id === 'planWho') renderKbar();
      return;
    }
    if (t.id === 'logFilter') {
      S.logFilter = t.value;
      renderPanel();
      return;
    }
    if (t.id === 'terrOverrideBy') {
      const tt = terr(S.selected);
      tt.overrideBy = t.value;
      tt.editedAt = Date.now();
      commit('Held by ' + kOf(t.value).name + ' (set by hand).');
      return;
    }
    if (t.id === 'terrPick') {
      S.selected = t.value || null;
      if (S.selected && targetable(S.selected)) S.plan.target = S.selected;
      renderPanel();
      renderSelection();
    } else if (t.id === 'terrOverride') {
      terr(S.selected).override = t.value || null;
      terr(S.selected).editedAt = Date.now();
      if (!t.value) terr(S.selected).overrideBy = null;
      commit(t.value ? 'Status set by hand.' : 'Status follows the raid log again.');
    } else if (t.id === 'campPick') {
      const next = S.campaigns.get(t.value);
      if (next) setCampaign(next);
    } else if (t.id === 'importFile' && t.files && t.files[0]) {
      const file = t.files[0];
      if (file.size > 5e6) return toast('That file is over 5 MB; a campaign export is far smaller.');
      const reader = new FileReader();
      reader.onload = () => importText(String(reader.result));
      reader.onerror = () => toast('Couldn’t read that file.');
      reader.readAsText(file);
    } else if (t.id === 'optRaids') {
      S.showRaids = t.checked;
      renderMap();
    } else if (t.id === 'optRoutes') {
      S.showRoutes = t.checked;
      renderRoutes();
    } else if (t.id === 'optLabels') {
      S.showLabels = t.checked;
      renderLabels();
      renderIcons();
    } else if (t.id === 'newShape') {
      renderPreview();
    }
  });

  document.addEventListener('mouseover', (e) => {
    const li = e.target.closest('.log li[data-raid]');
    const id = li ? li.dataset.raid : null;
    if (id === S.hotRaid || (!id && !S.hotRaidHover)) return;
    S.hotRaidHover = !!id;
    S.hotRaid = id && recentRaids().some((x) => x.id === id) ? id : null;
    document.querySelectorAll('#layerRaids .raid').forEach((g) => {
      const me = g.dataset.raid;
      g.classList.toggle('dim', !!S.hotRaid && me !== S.hotRaid);
      g.classList.toggle('hot', me === S.hotRaid);
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey || !S.campaign) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
    const n = Number(e.key);
    const ks = S.campaign.kingdoms;
    if (n >= 1 && n <= ks.length && ks.length > 1 && canPlay(ks[n - 1].id) && ks[n - 1].id !== S.active) {
      S.active = ks[n - 1].id;
      S.plan.source = 'base';
      if (S.kEdit) S.kEdit = S.active;
      renderAll();
    } else if (e.key === ']') nextTurn();
  });

  $('seasonNext').addEventListener('click', () => advanceSeason(1));
  $('seasonBack').addEventListener('click', () => advanceSeason(-1));

  function renderAll() {
    renderHeader();
    renderMap();
    renderChronicle();
    renderTabs();
    renderPanel();
  }

  /* ---------- boot ---------- */

  function boot(hot) {
    const local = loadLocal();
    for (const c of local) {
      c.saved = true;
      S.campaigns.set(c.id, c);
    }
    const want = (hot && hot.active) || prefs().active;
    const first = S.campaigns.get(want) || local.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0] || makeExample();
    if (hot) {
      S.tab = hot.tab || S.tab;
      S.mode = hot.mode || S.mode;
      document.querySelectorAll('#viewModes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
    }
    setCampaign(first);
    if (hot && hot.playing && S.campaign.kingdoms.some((k) => k.id === hot.playing)) {
      S.active = hot.playing;
      renderAll();
    }
    if (hot && hot.selected && terr(hot.selected)) {
      S.selected = hot.selected;
      renderPanel();
      renderSelection();
    }
    connectCloud();
  }

  window.PillageRansack = {
    // For a tracker running in the same page or console: log a raid without the form.
    logRaid(r) {
      const c = S.campaign;
      const by = r && r.by && c.kingdoms.some((k) => k.id === r.by) ? r.by : S.active;
      if (!r || !terr(r.targetTerritory) || r.targetTerritory === kOf(by).capital || !E.OUTCOMES.includes(r.outcome)) throw new Error('logRaid needs a targetTerritory id (not the raider\u2019s own capital) and an outcome of success, failure or ongoing.');
      const raid = { id: E.nextRaidId(), by, updatedAt: Date.now(), sourceTerritory: r.sourceTerritory && terr(r.sourceTerritory) ? r.sourceTerritory : 'base', targetTerritory: r.targetTerritory, outcome: r.outcome, timestamp: Date.now(), losses: Math.max(0, r.losses | 0), lootGained: Math.max(0, r.lootGained | 0), warband: Math.max(0, r.warband | 0), year: c.year, season: c.season, notes: String(r.notes || '').slice(0, 500) };
      c.raids.push(raid);
      S.lastLogged = { id: raid.id, at: Date.now() };
      commit();
      return raid.id;
    },
    campaign: () => JSON.parse(JSON.stringify(stripRuntime(S.campaign))),
    selectTerritory: (id) => onMapTap(id),
    playAs: (kid) => {
      S.active = kid;
      renderAll();
    },
  };

  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') {
    hot.snapshot(() => ({ tab: S.tab, mode: S.mode, selected: S.selected, active: S.campaign && S.campaign.id, playing: S.active }));
  }
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot((hot && hot.data) || null);
})();
</script>
