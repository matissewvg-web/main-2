  function setStoreError(msg) {
    store.error = msg;
    if (S.tab === 'campaign') renderPanel();
  }

  async function connectCloud() {
    if (!inViewer) return;
    let db;
    let user;
    try {
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    } catch (e) {
      return;
    }
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const col = db.collection('data/users/' + uid);
    const sharedCol = db.collection('shared');
    let mine;
    let theirs = { docs: [] };
    try {
      mine = await col.get();
    } catch (e) {
      return;
    }
    try {
      theirs = await sharedCol.get();
    } catch (e) {
      /* no shared campaigns readable */
    }
    store.db = db;
    store.col = col;
    store.user = user;
    store.mode = 'cloud';
    S.uid = uid;
    const remote = new Map();
    for (const [snap, shared] of [[mine, false], [theirs, true]]) {
      for (const d of snap.docs) {
        try {
          remote.set(d.id, fromRemote(d.data(), d.id, shared));
        } catch (e) {
          /* ignore unreadable documents */
        }
      }
    }
    // Fold in campaigns saved in this browser: new ones upload, changed ones merge.
    for (const c of S.campaigns.values()) {
      if (!c.saved) continue;
      const r = remote.get(c.id);
      const merged = r ? E.mergeCampaigns(r, c) : c;
      if (!r || sig(merged) !== sig(r)) {
        merged.saved = true;
        remote.set(c.id, merged);
        S.campaigns.set(c.id, merged);
        writeCloud(c.id);
      }
    }
    if (remote.size) {
      const activeId = S.campaign && remote.has(S.campaign.id) ? S.campaign.id : prefs().active;
      const keep = S.campaign && !S.campaign.saved && S.campaign.fresh ? S.campaign : null;
      S.campaigns = remote;
      if (keep) S.campaigns.set(keep.id, keep);
      const pick = keep || remote.get(activeId) || [...remote.values()].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
      setCampaign(pick, true);
    }
    saveLocal();
    store.unsub = col.onSnapshot((snap) => onRemoteSnapshot(snap, false), () => {});
    store.unsubShared = sharedCol.onSnapshot((snap) => onRemoteSnapshot(snap, true), () => {});
    ensureActive();
    renderHeader();
    renderPanel();
    refreshNames();
  }

  function onRemoteSnapshot(snap, shared) {
    let activeChanged = false;
    let listChanged = false;
    for (const ch of snap.docChanges()) {
      const id = ch.doc.id;
      const have = S.campaigns.get(id);
      if (ch.type === 'removed') {
        if (have && !!have.shared === shared) {
          S.campaigns.delete(id);
          listChanged = true;
          if (S.campaign && S.campaign.id === id) activeChanged = true;
        }
        continue;
      }
      try {
        if (adopt(id, fromRemote(ch.doc.data(), id, shared))) {
          listChanged = true;
          if (S.campaign && S.campaign.id === id) activeChanged = true;
        }
      } catch (e) {
        /* ignore */
      }
    }
    if (!listChanged) return;
    saveLocal();
    if (activeChanged) {
      const next = S.campaigns.get(S.campaign.id) || [...S.campaigns.values()][0];
      if (next) setCampaign(next, true);
      else setCampaign(makeExample(), true);
      toast(shared ? 'Another player moved; the map is up to date.' : 'Updated from another device');
    } else if (S.tab === 'campaign') renderPanel();
    refreshNames();
  }

  // Another tab in this browser saved (offline file or signed-out use).
  window.addEventListener('storage', (e) => {
    if (e.key !== LS_KEY || store.mode === 'cloud') return;
    const list = loadLocal();
    if (!list.length) return;
    const keepExample = S.campaign && !S.campaign.saved ? S.campaign : null;
    S.campaigns = new Map(list.map((c) => [c.id, Object.assign(c, { saved: true })]));
    if (keepExample) S.campaigns.set(keepExample.id, keepExample);
    const cur = S.campaign && S.campaigns.get(S.campaign.id);
    if (cur && cur !== S.campaign) {
      setCampaign(cur, true);
      toast('Updated from another tab');
    } else if (!cur) setCampaign(list[0], true);
  });

  /* ---------- campaign lifecycle ---------- */

  function makeExample() {
    const c = E.exampleCampaign(Date.now());
    c.saved = false;
    return c;
  }

  function setCampaign(c, keepUi, reveal) {
    S.campaigns.set(c.id, c);
    S.campaign = c;
    if (!keepUi) S.active = null;
    ensureActive();
    S.geo = E.buildGeometry(c);
    S.glyphs = null;
    savePrefs({ active: c.id });
    if (!keepUi || (S.selected && !terr(S.selected))) S.selected = null;
    if (!keepUi) S.view = { k: 1, x: 0, y: 0 };
    S.plan.target = S.plan.target && terr(S.plan.target) && !capitalKingdom(S.plan.target) ? S.plan.target : null;
    if (S.kEdit && !c.kingdoms.some((k) => k.id === S.kEdit)) S.kEdit = null;
    if (S.plan.source !== 'base' && !terr(S.plan.source)) S.plan.source = 'base';
    S.confirm = null;
    S.resolving = null;
    recompute();
    buildStatic();
    renderAll();
    if (reveal && !reduceMotion) revealMap();
  }

  // New maps rise out of the sea from the middle outward.
  function revealMap() {
    const layer = $('layerCells');
    const cells = layer.children;
    S.geo.shapes.forEach((sh, i) => {
      const d = Math.hypot(sh.centroid[0] - W / 2, sh.centroid[1] - H / 2);
      cells[i].style.animationDelay = Math.round(d) + 'ms';
      cells[i].style.transformOrigin = sh.centroid[0].toFixed(0) + 'px ' + sh.centroid[1].toFixed(0) + 'px';
    });
    layer.classList.add('reveal');
    clearTimeout(revealMap.t);
    revealMap.t = setTimeout(() => layer.classList.remove('reveal'), 1500);
  }

  function recompute() {
    S.result = E.replay(S.campaign);
    E.snapshot(S.campaign, S.result);
  }

  function commit(message) {
    S.campaign.updatedAt = Date.now();
    recompute();
    persist(S.campaign);
    renderAll();
    if (message) toast(message);
  }

  /* ---------- static map layers (rebuilt when the geometry changes) ---------- */

  function buildStatic() {
    const geo = S.geo;
    const halo = $('layerHalo');
    const cells = $('layerCells');
    const borders = $('layerBorders');
    halo.textContent = '';
    cells.textContent = '';
    borders.textContent = '';
    const landD = geo.shapes.map((s) => s.d).join('') + (geo.islets || []).map((r) => E.pathData(r, true)).join('');
    [[22, 0.18], [12, 0.3], [5, 0.5]].forEach(([w, o]) => halo.appendChild(el('path', { class: 'halo', d: landD, stroke: '#e6e0c6', 'stroke-width': w, 'stroke-opacity': o })));
    geo.shapes.forEach((s) => {
      const p = el('path', { class: 'cell', d: s.d, 'fill-rule': 'evenodd', 'data-id': s.id });
      cells.appendChild(p);
    });
    borders.appendChild(el('path', { class: 'border', d: geo.borders.map((b) => E.pathData(b.points, false)).join('') }));
    borders.appendChild(el('path', { class: 'coastline', d: geo.coast.map((c) => E.pathData(c, false)).join('') }));
    S.sea = seaFeatures();
    S.lakes = placeLakes();
    placeGlyphs();
    drawSea();
    drawDecor();
    if (!$('paper').getAttribute('href')) $('paper').setAttribute('href', paperTexture());
    applyView();
  }

  // Aged-parchment mottling, drawn once to a canvas and laid over the map with multiply.
  function paperTexture() {
    try {
      const cw = 800;
      const ch = 560;
      const cv = document.createElement('canvas');
      cv.width = cw;
      cv.height = ch;
      const ctx = cv.getContext('2d');
      const img = ctx.createImageData(cw, ch);
      const n1 = E.valueNoise(11);
      const n2 = E.valueNoise(23);
      const rnd = E.mulberry32(7);
      for (let y = 0; y < ch; y++) {
        for (let x = 0; x < cw; x++) {
          const ex = (x / cw - 0.5) * 2;
          const ey = (y / ch - 0.5) * 2;
          const vign = Math.max(0, Math.sqrt(ex * ex * 0.8 + ey * ey * 0.9) - 0.55) * 0.55;
          let v = 0.12 + 0.1 * n1(x / 70, y / 70) + 0.06 * n2(x / 18, y / 18) + 0.05 * (rnd() - 0.5) + vign;
          v = Math.max(0, Math.min(0.6, v));
          const i = (y * cw + x) * 4;
          img.data[i] = 255 - v * 70;
          img.data[i + 1] = 255 - v * 95;
          img.data[i + 2] = 255 - v * 140;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      return cv.toDataURL('image/jpeg', 0.82);
    } catch (e) {
      return '';
    }
  }

  function labelSize(shape) {
    return Math.max(10.5, Math.min(15, Math.sqrt(shape.area) / 9.5));
  }

  function placeGlyphs() {
    const out = [];
    const want = { mountains: 4, forest: 5, hills: 3, marsh: 3, grassland: 2, coast: 1 };
    S.geo.shapes.forEach((sh, i) => {
      const t = S.campaign.territories[i];
      const rng = E.mulberry32(E.hashString('glyph:' + t.id + ':' + S.campaign.seed));
      const pts = sh.points;
      let minx = Infinity;
      let miny = Infinity;
      let maxx = -Infinity;
      let maxy = -Infinity;
      for (const p of pts) {
        if (p[0] < minx) minx = p[0];
        if (p[0] > maxx) maxx = p[0];
        if (p[1] < miny) miny = p[1];
        if (p[1] > maxy) maxy = p[1];
      }
      const c = sh.centroid;
      const fs = labelSize(sh);
      const halfW = t.name.length * fs * 0.34 + 8;
      const count = Math.max(1, Math.min(9, Math.round((want[t.terrain] * sh.area) / 8000)));
      const inside = (x, y) => x > 8 && x < W - 8 && y > 8 && y < H - 8 && E.clearOfDecor(x, y, 8) && E.pointInShape([x, y], sh);
      const nearRiver = (x, y) => S.geo.rivers.some((rv) => rv.points.some((q, k) => k % 2 === 0 && Math.abs(q[0] - x) < 8 && Math.abs(q[1] - y) < 8));
      const lakes = S.lakes.concat(S.geo.lakes);
      const conifers = 0.25 + rng() * 0.6;
      const placed = [];
      for (let tries = 0; tries < 200 && placed.length < count; tries++) {
        const x = minx + rng() * (maxx - minx);
        const y = miny + rng() * (maxy - miny);
        if (!inside(x, y) || !inside(x + 11, y) || !inside(x - 11, y) || !inside(x, y + 10) || !inside(x, y - 10)) continue;
        if (Math.abs(x - c[0]) < halfW && y > c[1] - fs - 24 && y < c[1] + 26) continue;
        if (placed.some((q) => Math.hypot(q[0] - x, q[1] - y) < 17)) continue;
        if (lakes.some((l) => Math.hypot(l.x - x, l.y - y) < l.r + 11) || nearRiver(x, y)) continue;
        let kind = t.terrain;
        let scale = 1;
        if (kind === 'forest' && rng() < conifers) kind = 'forest2';
        if (kind === 'mountains') scale = 0.85 + rng() * 0.55;
        else if (kind === 'hills') scale = 0.9 + rng() * 0.3;
        else if (kind.startsWith('forest')) scale = 0.85 + rng() * 0.3;
        placed.push([x, y, kind, scale]);
      }
      out.push({ id: t.id, terrain: t.terrain, pts: placed });
    });
    S.glyphs = out;
    const g = $('layerGlyphs');
    g.textContent = '';
    for (const set of out) {
      // Top to bottom, so nearer glyphs overlap the ones behind them.
      for (const p of set.pts.slice().sort((a, b) => a[1] - b[1])) {
        g.appendChild(csNode(el('use', { href: '#g-' + p[2], class: 'glyph g-' + set.terrain }), p[0], p[1], true, p[3]));
      }
    }
  }

  // Ponds in marshes (and the odd one elsewhere), added to the lakes rivers end in.
  function placeLakes() {
    const out = [];
    const rng = E.mulberry32(E.hashString('lakes:' + S.campaign.seed));
    S.geo.shapes.forEach((sh, i) => {
      const t = S.campaign.territories[i];
      const chance = t.terrain === 'marsh' ? 0.85 : t.terrain === 'grassland' || t.terrain === 'forest' ? 0.12 : 0;
      if (out.length >= 4 || rng() >= chance) return;
      const fs = labelSize(sh);
      const c = sh.centroid;
      for (let tries = 0; tries < 60; tries++) {
        const a = rng() * Math.PI * 2;
        const d = 20 + rng() * Math.sqrt(sh.area) * 0.3;
        const x = c[0] + Math.cos(a) * d;
        const y = c[1] + Math.sin(a) * d;
        const r = 7 + rng() * 5;
        const ok = [[0, 0], [r + 8, 0], [-r - 8, 0], [0, r + 8], [0, -r - 8]].every(([dx, dy]) => E.pointInShape([x + dx, y + dy], sh));
        if (!ok || x < 15 || x > W - 15 || y < 15 || y > H - 15 || !E.clearOfDecor(x, y, r + 6)) continue;
        if (Math.abs(x - c[0]) < t.name.length * fs * 0.34 + r + 6 && y > c[1] - fs - 24 - r && y < c[1] + 12 + r) continue;
        out.push({ x, y, r });
        break;
      }
    });
    return out;
  }

  function blobPath(x, y, r, seed, n) {
    const noise = E.valueNoise(seed);
    const pts = [];
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2;
      const rr = r * (0.78 + 0.32 * noise(Math.cos(a) * 1.6 + 10, Math.sin(a) * 1.6 + 10));
      pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
    }
    return E.pathData(pts, true);
  }

  // Islets, longships and a sea serpent, in open water away from the map furniture.
  function seaFeatures() {
    const geo = S.geo;
    const rng = E.mulberry32(E.hashString('sea:' + S.campaign.seed));
    const coastPts = [];
    for (const seg of geo.coast) for (let k = 0; k < seg.length; k += 2) coastPts.push(seg[k]);
    const zones = E.DECOR_ZONES.concat([[820, 630, 1000, 700]]);
    const free = (x, y, r) => zones.every(([x0, y0, x1, y1]) => Math.hypot(Math.max(x0 - x, 0, x - x1), Math.max(y0 - y, 0, y - y1)) > r);
    const onLand = (x, y) => geo.shapes.some((sh) => E.pointInShape([x, y], sh)) || (geo.islets || []).some((r) => E.pointInPolygon([x, y], r));
    const coastDist = (x, y) => coastPts.reduce((m, p) => Math.min(m, Math.hypot(p[0] - x, p[1] - y)), Infinity);
    const taken = [];
    const find = (minCoast, r, tries) => {
      for (let t = 0; t < tries; t++) {
        const x = 20 + r + rng() * (W - 40 - 2 * r);
        const y = 20 + r + rng() * (H - 40 - 2 * r);
        if (!free(x, y, r + 4) || taken.some((q) => Math.hypot(q[0] - x, q[1] - y) < q[2] + r + 26)) continue;
        if (coastDist(x, y) < minCoast + r || onLand(x, y)) continue;
        taken.push([x, y, r]);
        return [x, y];
      }
      return null;
    };
    const islets = [];
    const nIslets = geo.engine === 2 ? 0 : 3 + Math.floor(rng() * 4);
    for (let k = 0; k < nIslets; k++) {
      const r = 6 + rng() * 9;
      const p = find(30, r, 120);
      if (p) islets.push({ x: p[0], y: p[1], r, seed: k + 1 });
    }
    const ships = [];
    const nShips = 1 + Math.floor(rng() * 2);
    for (let k = 0; k < nShips; k++) {
      const p = find(48, 22, 160);
      if (p) ships.push({ x: p[0], y: p[1], flip: rng() < 0.5, s: 0.8 + rng() * 0.25 });
    }
    let serpent = null;
    if (rng() < 0.65) {
      const p = find(55, 32, 160);
      if (p) serpent = { x: p[0], y: p[1], flip: rng() < 0.5 };
    }
    return { islets, ships, serpent };
  }

  function drawSea() {
    const sea = S.sea;
    const halo = $('layerHalo');
    const islets = $('layerIslets');
    const deco = $('layerSeaDecor');
    const lakes = $('layerLakes');
    islets.textContent = '';
    deco.textContent = '';
    lakes.textContent = '';
    const isletD = sea.islets.map((i) => blobPath(i.x, i.y, i.r, i.seed * 31 + 5, 14)).join('') + (S.geo.islets || []).map((r) => E.pathData(r, true)).join('');
    if (isletD) {
      if (sea.islets.length) [[12, 0.25], [5, 0.5]].forEach(([w, o]) => halo.appendChild(el('path', { class: 'halo', d: isletD, stroke: '#e6e0c6', 'stroke-width': w, 'stroke-opacity': o })));
      islets.appendChild(el('path', { id: 'isletPath', class: 'islet', d: isletD }));
    }
    for (const sh of sea.ships) deco.appendChild(csNode(el('use', { href: '#g-ship', 'pointer-events': 'none' }), sh.x, sh.y, false, sh.s, sh.flip));
    if (sea.serpent) deco.appendChild(csNode(el('use', { href: '#g-serpent', 'pointer-events': 'none' }), sea.serpent.x, sea.serpent.y, false, 1, sea.serpent.flip));
    for (const l of S.lakes.concat(S.geo.lakes)) {
      lakes.appendChild(el('path', { class: 'lake lake-fill', d: blobPath(l.x, l.y, l.r, Math.round(l.x * 7 + l.y), 12) }));
      lakes.appendChild(el('path', { d: 'M' + (l.x - l.r * 0.45).toFixed(1) + ' ' + (l.y + 1).toFixed(1) + 'h' + (l.r * 0.5).toFixed(1), stroke: '#2f4f5a', 'stroke-width': 0.7, 'stroke-opacity': 0.6, 'pointer-events': 'none' }));
    }
    const rivers = $('layerRivers');
    rivers.textContent = '';
    for (const r of S.geo.rivers) {
      const pts = r.points;
      const n = pts.length;
      rivers.appendChild(el('path', { class: 'river-halo', d: E.pathData(pts, false), 'stroke-width': 4.6 }));
      // Wider downstream: three runs of increasing width.
      [[0, 0.4, 1.3], [0.4, 0.75, 1.9], [0.75, 1, 2.6]].forEach(([a, b, w]) => {
        const i0 = Math.floor(a * (n - 1));
        const seg = pts.slice(i0, Math.max(Math.floor(b * (n - 1)) + 1, i0 + 2));
        if (seg.length > 1) rivers.appendChild(el('path', { class: 'river', d: E.pathData(seg, false), 'stroke-width': w }));
      });
    }
    const lanes = $('layerLanes');
    lanes.textContent = '';
    for (const ln of S.geo.seaLanes) {
      const a = S.geo.shapes[ln.a].centroid;
      const b = S.geo.shapes[ln.b].centroid;
      const at = (t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      const nx = -(b[1] - a[1]) / len;
      const ny = (b[0] - a[0]) / len;
      const s0 = at(0.2);
      const s1 = at(0.8);
      const m = at(0.5);
      const ctrl = [m[0] + nx * len * 0.08, m[1] + ny * len * 0.08];
      lanes.appendChild(el('path', { class: 'sea-lane', d: 'M' + s0[0].toFixed(1) + ' ' + s0[1].toFixed(1) + 'Q' + ctrl[0].toFixed(1) + ' ' + ctrl[1].toFixed(1) + ' ' + s1[0].toFixed(1) + ' ' + s1[1].toFixed(1) }));
      const mid = [(s0[0] + 2 * ctrl[0] + s1[0]) / 4, (s0[1] + 2 * ctrl[1] + s1[1]) / 4];
      lanes.appendChild(csNode(el('use', { href: '#g-ship', 'pointer-events': 'none' }), mid[0], mid[1] - 2, false, 0.5, b[0] < a[0]));
    }
  }

  function drawDecor() {
    const g = $('layerDecor');
    g.textContent = '';
    // Compass rose
    const cx = 932;
    const cy = 84;
    const rose = el('g', { transform: 'translate(' + cx + ' ' + cy + ')', 'pointer-events': 'none' });
    rose.appendChild(el('circle', { r: 30, fill: 'none', stroke: '#3a2817', 'stroke-width': 0.8, 'stroke-opacity': 0.7 }));
    rose.appendChild(el('circle', { r: 24, fill: 'none', stroke: '#3a2817', 'stroke-width': 0.5, 'stroke-opacity': 0.6 }));
    for (let i = 0; i < 8; i++) {
      const long = i % 2 === 0;
      const r = long ? 36 : 20;
      const a = (i * Math.PI) / 4 - Math.PI / 2;
      const w = long ? 6 : 4;
      const tip = [Math.cos(a) * r, Math.sin(a) * r];
      const l = [Math.cos(a - Math.PI / 2) * w, Math.sin(a - Math.PI / 2) * w];
      const rr = [Math.cos(a + Math.PI / 2) * w, Math.sin(a + Math.PI / 2) * w];
      rose.appendChild(el('path', { d: 'M0 0L' + l[0].toFixed(1) + ' ' + l[1].toFixed(1) + 'L' + tip[0].toFixed(1) + ' ' + tip[1].toFixed(1) + 'Z', fill: i === 0 ? PLAYER : '#3a2817', 'fill-opacity': long ? 0.9 : 0.55 }));
      rose.appendChild(el('path', { d: 'M0 0L' + rr[0].toFixed(1) + ' ' + rr[1].toFixed(1) + 'L' + tip[0].toFixed(1) + ' ' + tip[1].toFixed(1) + 'Z', fill: '#efe1bf', stroke: '#3a2817', 'stroke-width': 0.6 }));
    }
    const n = el('text', { y: -42, class: 'label', 'font-size': 14 });
    n.textContent = 'N';
    rose.appendChild(n);
    g.appendChild(rose);
    // Scale bar: 100 map units = 10 leagues
    const sb = el('g', { transform: 'translate(120 672)', 'pointer-events': 'none' });
    for (let i = 0; i < 4; i++) sb.appendChild(el('rect', { x: i * 25, y: 0, width: 25, height: 5, fill: i % 2 ? '#efe1bf' : '#3a2817', stroke: '#3a2817', 'stroke-width': 0.7 }));
    [0, 5, 10].forEach((v, i) => {
      const tx = el('text', { x: i * 50, y: -4, class: 'label sub', 'font-size': 10 });
      tx.textContent = v;
      sb.appendChild(tx);
    });
    const unit = el('text', { x: 118, y: 6, class: 'label', 'font-size': 11, 'text-anchor': 'start' });
    unit.textContent = 'leagues';
    unit.style.textAnchor = 'start';
    sb.appendChild(unit);
    g.appendChild(sb);
    // Cartouche with the campaign name
    const ct = el('g', { transform: 'translate(18 16)', 'pointer-events': 'none' });
    ct.appendChild(el('rect', { width: 236, height: 52, rx: 3, fill: '#efe1bf', 'fill-opacity': 0.88, stroke: '#3a2817', 'stroke-width': 1.2 }));
    ct.appendChild(el('rect', { x: 4, y: 4, width: 228, height: 44, rx: 2, fill: 'none', stroke: '#3a2817', 'stroke-width': 0.5 }));
    const title = el('text', { id: 'cartoucheName', x: 118, y: 26, 'text-anchor': 'middle', 'font-family': 'Grenze Gotisch, Georgia, serif', 'font-size': 19, 'font-weight': 700, fill: '#3a2817' });

  /* ---------- dynamic map layers ---------- */

  function fillFor(t, d, pal) {
    const base = pal[t.terrain] || pal.grassland;
    if (S.mode === 'terrain') return base;
    if (S.mode === 'wealth') return WEALTH[bin(t.goldValue, S.wealthRange)];
    if (S.mode === 'resistance') return RESIST[bin(d.garrison, S.resistRange)];
    const muted = mix(base, NEUTRAL, 0.55);
    if (!d.owner) return muted;
    const kc = kColor(d.owner);
    if (d.status === 'conquered') return kc;
    if (d.control > 0) return mix(muted, kc, 0.12 + 0.43 * (d.control / 100));
    return muted;
  }

  function bin(v, range) {
    const [lo, hi] = range;
    if (hi <= lo) return 0;
    return Math.max(0, Math.min(4, Math.floor(((v - lo) / (hi - lo)) * 5 - 1e-9)));
  }

  function renderMap() {
    const c = S.campaign;
    const res = S.result;
    const pal = SEASON_PALETTE[c.season];
    svg.style.setProperty('--glyph-fill', pal.glyph);
    svg.style.setProperty('--mtn-fill', pal.rock);
    svg.style.setProperty('--hill-fill', mix(pal.hills, '#3a2817', 0.12));
    svg.style.setProperty('--boat-fill', '#d9c7a0');
    svg.style.setProperty('--cap', pal.cap);
    $('seaRect').setAttribute('fill', pal.sea);
    const isl = $('isletPath');
    if (isl) isl.setAttribute('fill', mix(pal.coast, NEUTRAL, 0.35));
    document.querySelectorAll('.lake-fill').forEach((l) => l.setAttribute('fill', c.season === 'winter' ? '#dfe8ec' : mix(pal.sea, '#ffffff', 0.18)));
    $('mapFrame').style.background = pal.sea;
    const golds = c.territories.map((t) => t.goldValue);
    S.wealthRange = [Math.min(...golds), Math.max(...golds)];
    S.resistRange = [0, Math.max(1, ...c.territories.map((t) => res.territories.get(t.id).garrison))];

    const cellEls = $('layerCells').children;
    c.territories.forEach((t, i) => {
      const d = res.territories.get(t.id);
      const p = cellEls[i];
      p.setAttribute('fill', fillFor(t, d, pal));
      p.setAttribute('aria-label', t.name + ', ' + STATUS_LABEL[d.status]);
    });
    $('cartoucheName').textContent = c.name.length > 24 ? c.name.slice(0, 23) + '…' : c.name;
    $('cartoucheSeason').textContent = seasonText(c.year, c.season);

    renderOverlay();
    renderFrontier();
    renderRoutes();
    renderRoads();
    renderRaids();
    renderPlanPath();
    renderIcons();
    renderLabels();
    renderSelection();
    renderLegend();
    startTokens();
  }

  function renderOverlay() {
    const g = $('layerOverlay');
    g.textContent = '';
    const c = S.campaign;
    c.territories.forEach((t, i) => {
      const d = S.result.territories.get(t.id);
      const sh = S.geo.shapes[i];
      const d0 = sh.d;
      if (S.mode === 'political' && d.status === 'contested') {
        // Stripes in the colour of whoever is fighting the owner (or of the raiders under way).
        const rivals = Object.keys(d.inf).filter((k) => k !== d.owner).sort((a, b) => d.inf[b] - d.inf[a]);
        const raiders = S.campaign.raids.filter((r) => r.outcome === 'ongoing' && r.targetTerritory === t.id).map((r) => r.by);
        const who = rivals[0] || raiders.find((k) => k !== d.owner) || raiders[0];
        const pat = who ? 'stripes-' + kOf(who).color : 'stripes-war';
        g.appendChild(el('path', { d: d0, 'fill-rule': 'evenodd', fill: 'url(#' + pat + ')', 'pointer-events': 'none' }));
      }
      if (S.mode !== 'political' && d.control > 0 && d.owner) {
        g.appendChild(el('path', { class: 'owned-ring', d: d0, fill: 'none', stroke: kColor(d.owner), 'stroke-width': d.status === 'conquered' ? 3.2 : 1.8, 'stroke-opacity': 0.85, 'stroke-dasharray': d.status === 'conquered' ? null : '6 4', 'pointer-events': 'none' }));
      }
      const level = Math.ceil(d.damage);
      if (level > 0) {
        const clipId = 'clip-' + t.id;
        const clip = el('clipPath', { id: clipId });
        clip.appendChild(el('path', { d: d0, 'clip-rule': 'evenodd' }));
        g.appendChild(clip);
        const grp = el('g', { 'clip-path': 'url(#' + clipId + ')', 'pointer-events': 'none' });
        const rng = E.mulberry32(E.hashString('burn:' + t.id));
        const n = 2 + level * 2;
        const r0 = Math.sqrt(sh.area) * 0.22;
        for (let k = 0; k < n; k++) {
          const a = rng() * Math.PI * 2;
          const rr = rng() * Math.sqrt(sh.area) * 0.32;
          const x = sh.centroid[0] + Math.cos(a) * rr;
          const y = sh.centroid[1] + Math.sin(a) * rr;
          grp.appendChild(el('ellipse', { cx: x.toFixed(1), cy: y.toFixed(1), rx: (r0 * (0.6 + rng() * 0.7)).toFixed(1), ry: (r0 * (0.4 + rng() * 0.5)).toFixed(1), fill: 'url(#scorch)', transform: 'rotate(' + Math.round(rng() * 180) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')' }));
          if (rng() < 0.6) grp.appendChild(el('circle', { cx: (x + (rng() - 0.5) * 8).toFixed(1), cy: (y + (rng() - 0.5) * 8).toFixed(1), r: 1.3, fill: '#e2661f', 'fill-opacity': 0.85 }));
        }
        g.appendChild(grp);
      }
    });
  }

  function renderFrontier() {
    const g = $('layerFrontier');
    g.textContent = '';
    if (S.tab !== 'raid') return;
    const ids = E.frontier(S.campaign, S.geo, S.result, S.active);
    for (const id of ids) {
      const sh = S.geo.shapes[S.geo.index.get(id)];
      g.appendChild(el('path', { class: 'frontier', d: sh.d }));
    }
  }

  function renderRoutes() {
    const g = $('layerRoutes');
    g.textContent = '';
    if (!S.showRoutes) return;
    let d = '';
    S.geo.adjacency.forEach((set, i) => {
      for (const j of set) {
        if (j < i) continue;
        const a = S.geo.shapes[i].centroid;
        const b = S.geo.shapes[j].centroid;
        d += 'M' + a[0].toFixed(1) + ' ' + a[1].toFixed(1) + 'L' + b[0].toFixed(1) + ' ' + b[1].toFixed(1);
      }
    });
    g.appendChild(el('path', { class: 'route-line', d }));
  }

  // Smooth curve through route centroids, shifted sideways so raids on the same road stay visible.
  function routeOpts(kid) {
    const tr = E.TRAITS[kOf(kid).trait] || {};
    return tr.seaCost ? { seaCost: tr.seaCost } : null;
  }
  function raidCurve(srcId, dstId, offset, kid) {
    const geo = S.geo;
    const a = geo.index.get(resolveSource(srcId, kid));
    const b = geo.index.get(dstId);
    const route = E.findRoute(geo, a, b, routeOpts(kid));
    let pts = route.map((i) => geo.shapes[i].centroid.slice());
    if (pts.length === 2) {
      const [p, q] = pts;
      const mx = (p[0] + q[0]) / 2;
      const my = (p[1] + q[1]) / 2;
      const len = Math.hypot(q[0] - p[0], q[1] - p[1]) || 1;
      pts = [p, [mx - ((q[1] - p[1]) / len) * len * 0.18, my + ((q[0] - p[0]) / len) * len * 0.18], q];
    }
    if (offset) {
      pts = pts.map((p, i) => {
        const prev = pts[Math.max(0, i - 1)];
        const next = pts[Math.min(pts.length - 1, i + 1)];
        const dx = next[0] - prev[0];
        const dy = next[1] - prev[1];
        const l = Math.hypot(dx, dy) || 1;
        const k = i === 0 || i === pts.length - 1 ? 0.35 : 1;
        return [p[0] - (dy / l) * offset * k, p[1] + (dx / l) * offset * k];
      });
    }
    let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[Math.min(pts.length - 1, i + 2)];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += 'C' + c1[0].toFixed(1) + ' ' + c1[1].toFixed(1) + ' ' + c2[0].toFixed(1) + ' ' + c2[1].toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    return { d, route, end: pts[pts.length - 1], start: pts[0], mid: pts[Math.floor(pts.length / 2)] };
  }

  function recentRaids() {
    return S.campaign.raids.slice().sort((a, b) => b.timestamp - a.timestamp).slice(0, 10);
  }

  function renderRaids() {
    const g = $('layerRaids');
    g.textContent = '';
    S.raidPaths = new Map();
    if (!S.showRaids) return;
    const list = recentRaids().reverse(); // oldest first so the newest draws on top
    list.forEach((r, k) => {
      const o = OUTCOME[r.outcome];
      const offset = (k - (list.length - 1) / 2) * 3.2;
      const curve = raidCurve(r.sourceTerritory, r.targetTerritory, offset, r.by);
      const age = list.length - 1 - k;
      const grp = el('g', { class: 'raid' + (S.hotRaid && S.hotRaid !== r.id ? ' dim' : '') + (S.hotRaid === r.id ? ' hot' : ''), opacity: (1 - age * 0.06).toFixed(2), 'data-raid': r.id });
      grp.appendChild(el('path', { class: 'raid-glow', d: curve.d, stroke: o.glow, 'stroke-width': 7, 'stroke-opacity': 0.38 }));
      const line = el('path', { class: 'raid-line ' + r.outcome, d: curve.d, stroke: o.ink, 'stroke-width': 2 });
      grp.appendChild(line);
      const [ex, ey] = curve.end;
      if (r.outcome === 'success') {
        const f = el('g');
        f.appendChild(el('path', { d: 'M0 2 V-14', stroke: '#2a1b0e', 'stroke-width': 1.3 }));
        f.appendChild(el('path', { d: 'M0.6 -14 L10 -10.5 L0.6 -7 Z', fill: S.campaign.kingdoms.length > 1 ? kColor(r.by) : o.glow, stroke: '#2a1b0e', 'stroke-width': 0.7 }));
        grp.appendChild(csNode(f, ex, ey));
      } else if (r.outcome === 'failure') {
        const x = el('g');
        x.appendChild(el('path', { d: 'M-5 -5l10 10m0 -10l-10 10', stroke: '#f6ecd2', 'stroke-width': 4.5, 'stroke-linecap': 'round' }));
        x.appendChild(el('path', { d: 'M-5 -5l10 10m0 -10l-10 10', stroke: o.ink, 'stroke-width': 2.2, 'stroke-linecap': 'round' }));
        grp.appendChild(csNode(x, ex, ey));
      }
      g.appendChild(grp);
      S.raidPaths.set(r.id, line);
    });
  }

  function renderPlanPath() {
    const g = $('layerPlan');
    g.textContent = '';
    const p = S.plan;
    if (S.tab !== 'raid' || !p.target || !terr(p.target)) return;
    const curve = raidCurve(p.source, p.target, 0, S.active);
    const path = el('path', { class: 'plan-line', d: curve.d });
    g.appendChild(path);
    const lg = E.routeLeagues(S.geo, curve.route);
    const half = path.getTotalLength() / 2;
    const pt = half > 0 ? path.getPointAtLength(half) : { x: curve.mid[0], y: curve.mid[1] };
    const holder = el('g');
    const t = el('text', { class: 'plan-label', y: -9 });
    t.textContent = lg + ' leagues';
    holder.appendChild(t);
    g.appendChild(csNode(holder, pt.x, pt.y));
  }

  function renderIcons() {
    const g = $('layerIcons');
    g.textContent = '';
    const c = S.campaign;
    c.territories.forEach((t, i) => {
      const sh = S.geo.shapes[i];
      const d = S.result.territories.get(t.id);
      const [x, y] = sh.centroid;
      const fs = labelSize(sh);
      const capK = capitalKingdom(t.id);
      if (capK) {
        const keep = el('g', { 'pointer-events': 'none' });
        const holder = d.owner ? kOf(d.owner) : capK;
        const use = el('use', { href: '#g-keep', y: -(fs + 12) });
        use.style.setProperty('--flag', E.kingdomColor(holder));
        keep.appendChild(use);
        const arms = el('g', { transform: 'translate(10 ' + -(fs + 21) + ') scale(0.16)' });
        arms.innerHTML = shieldSVG(capK.arms, 100);
        keep.appendChild(arms);
        g.appendChild(csNode(keep, x, y));
      } else if (S.showLabels) {
        const seat = el('g', { 'pointer-events': 'none' });
        const ruined = d.damage >= 1.5;
        const use = el('use', { href: '#f-' + E.territoryFeature(c, t, sh.coastLength), y: -(fs + 9) });
        if (ruined) use.setAttribute('opacity', '0.5');
        seat.appendChild(use);
        if (ruined) seat.appendChild(el('path', { d: 'M5 ' + -(fs + 9) + 'c-2.2 -2 -0.6 -3.6 0 -5.8c0.9 2.2 2.2 3.5 0 5.8z', fill: '#e2661f', stroke: '#2a1b0e', 'stroke-width': 0.5 }));
        if (d.status === 'conquered' && d.owner) {
          seat.appendChild(el('path', { d: 'M9 ' + -(fs + 4) + 'V' + -(fs + 17), stroke: '#2a1b0e', 'stroke-width': 0.9 }));
          seat.appendChild(el('path', { d: 'M9.4 ' + -(fs + 17) + 'L15 ' + -(fs + 15) + 'L9.4 ' + -(fs + 13) + 'Z', fill: kColor(d.owner), stroke: '#2a1b0e', 'stroke-width': 0.5 }));
        }
        g.appendChild(csNode(seat, x, y));
      }
      if (S.mode === 'resistance' && !d.isCapital) {
        const s = d.garrison <= 0 ? 0 : 0.7 + Math.sqrt(d.garrison / S.resistRange[1]) * 1.3;
        if (s > 0) {
          const holder = el('g', { 'pointer-events': 'none' });
          const grp = el('g', { transform: 'translate(0 15) scale(' + s.toFixed(2) + ')' });
          grp.appendChild(el('use', { href: '#g-shield', fill: '#efe1bf', stroke: '#2a1b0e', 'stroke-width': (1.1 / s).toFixed(2) }));
          holder.appendChild(grp);
          const tx = el('text', { class: 'label sub', y: 19, 'font-size': 9.5 });
          tx.textContent = d.garrison;
          holder.appendChild(tx);
          g.appendChild(csNode(holder, x, y));
        }
      }
    });
  }

  // Roads grow between neighbouring territories the same kingdom has conquered.
  function renderRoads() {
    const g = $('layerRoads');
    g.textContent = '';
    if (S.mode !== 'political') return;
    let d = '';
    S.geo.adjacency.forEach((set, i) => {
      const ti = S.result.territories.get(S.campaign.territories[i].id);
      if (ti.status !== 'conquered' || !ti.owner) return;
      for (const j of set) {
        if (j < i || S.geo.laneSet.has(i + '|' + j)) continue;
        const tj = S.result.territories.get(S.campaign.territories[j].id);
        if (tj.status !== 'conquered' || tj.owner !== ti.owner) continue;
        const a = S.geo.shapes[i].centroid;
        const b = S.geo.shapes[j].centroid;
        const m = [(a[0] + b[0]) / 2 + (b[1] - a[1]) * 0.08, (a[1] + b[1]) / 2 - (b[0] - a[0]) * 0.08];
        d += 'M' + a[0].toFixed(1) + ' ' + (a[1] + 6).toFixed(1) + 'Q' + m[0].toFixed(1) + ' ' + (m[1] + 6).toFixed(1) + ' ' + b[0].toFixed(1) + ' ' + (b[1] + 6).toFixed(1);
      }
    });
    if (d) g.appendChild(el('path', { class: 'road', d }));
  }

  function renderLabels() {
    const g = $('layerLabels');
    g.textContent = '';
    if (!S.showLabels) return;
    S.campaign.territories.forEach((t, i) => {
      const sh = S.geo.shapes[i];
      const fs = labelSize(sh);
      const holder = el('g');
      const tx = el('text', { class: 'label', 'font-size': fs.toFixed(1) });
      tx.textContent = t.name;
      holder.appendChild(tx);
      if (S.mode === 'wealth') {
        const v = el('text', { class: 'label sub', y: 13, 'font-size': 10.5 });
        v.textContent = t.goldValue + ' gold';
        holder.appendChild(v);
      }
      g.appendChild(csNode(holder, sh.centroid[0], sh.centroid[1]));
    });
  }

  function renderSelection() {
    const g = $('layerSelect');
    g.textContent = '';
    if (S.tab === 'raid' && S.plan.target && terr(S.plan.target)) {
      const sh = S.geo.shapes[S.geo.index.get(S.plan.target)];
      g.appendChild(el('path', { class: 'target-ring', d: sh.d }));
    }
    if (S.selected && terr(S.selected) && !(S.tab === 'raid' && S.selected === S.plan.target)) {
      const d = S.geo.shapes[S.geo.index.get(S.selected)].d;
      g.appendChild(el('path', { class: 'select-ring', d }));
      g.appendChild(el('path', { class: 'select-ring inner', d }));
    }
  }

  function renderLegend() {
    const lg = $('legend');
    const pal = SEASON_PALETTE[S.campaign.season];
    let html = '<div class="group">';
    const item = (sw, text) => '<li>' + sw + '<span>' + text + '</span></li>';
    if (S.campaign.kingdoms.length > 1 || S.mode === 'political') {
      html += '<h4>' + (S.campaign.kingdoms.length > 1 ? 'Kingdoms' : 'Kingdom') + '</h4><ul>';
      for (const k of S.campaign.kingdoms) html += '<li><span class="sw" style="background:' + E.kingdomColor(k) + '"></span>' + kChip(k, 13) + '</li>';
      html += '</ul></div><div class="group">';
    }
    if (S.mode === 'political') {
      html += '<h4>Territory</h4><ul>';
      html += item('<span class="sw" style="background:' + mix(pal.grassland, NEUTRAL, 0.55) + '"></span>', 'Unclaimed');
      html += item('<span class="sw claimed"></span>', 'Claimed (darker = more control)');
      html += item('<span class="sw stripes"></span>', 'Contested (stripes in the rival\u2019s colour)');
      html += item('<span class="sw" style="background:' + E.kingdomColor(K()) + '"></span>', 'Conquered (full colour)');
      html += item('<span class="sw" style="background:#2a1b0e;opacity:.75;border-radius:50%"></span>', 'Scorched by a failed raid');
      html += '</ul>';
    } else if (S.mode === 'wealth') {
      html += '<h4>Gold value</h4><ul>' + rampItems(WEALTH, S.wealthRange, ' gold') + '</ul>';
    } else if (S.mode === 'resistance') {
      html += '<h4>Garrison now (shield size)</h4><ul>' + rampItems(RESIST, S.resistRange, ' men') + '</ul>';
    } else {
      html += '<h4>Terrain in ' + S.campaign.season + '</h4><ul>';
      for (const k of E.TERRAINS) html += item('<span class="sw" style="background:' + pal[k] + '"></span>', E.TERRAIN_STATS[k].label);
      html += '</ul>';
    }
    html += '</div>';
    if (S.geo.rivers.length || S.geo.seaLanes.length) {
      html += '<div class="group"><h4>Map</h4><ul>';
      if (S.geo.rivers.length) html += item('<span class="sw river"></span>', 'River');
      if (S.geo.seaLanes.length) html += item('<span class="sw lane"></span>', 'Sea lane (raids can cross)');
      if (S.mode === 'political' && $('layerRoads').childNodes.length) html += item('<span class="sw lane" style="border-top-color:#5d4630"></span>', 'Road (land one kingdom holds)');
      html += '</ul></div>';
    }
    if (S.showRaids && S.campaign.raids.length) {
      html += '<div class="group"><h4>Raids</h4><ul>';
      for (const k of ['success', 'failure', 'ongoing']) html += item('<span class="sw line" style="background:' + OUTCOME[k].glow + '"></span>', OUTCOME[k].sym + ' ' + OUTCOME[k].label);
      html += '</ul></div>';
    }
    lg.innerHTML = html;
  }

  function rampItems(ramp, range, unit) {
    const [lo, hi] = range;
    const step = (hi - lo) / 5;
    let out = '';
    for (let i = 4; i >= 0; i--) {
      const a = Math.round(lo + step * i);
      const b = Math.round(lo + step * (i + 1));
      out += '<li><span class="sw" style="background:' + ramp[i] + '"></span><span class="num">' + fmt(a) + '–' + fmt(b) + unit + '</span></li>';
    }
    return out;
  }

  /* ---------- raiding-party tokens ---------- */

  let tokenFrame = 0;
  function startTokens() {
    cancelAnimationFrame(tokenFrame);
    const g = $('layerTokens');
    g.textContent = '';
    if (!S.showRaids || !S.raidPaths) return;
    const tokens = [];
    for (const r of recentRaids()) {
      const line = S.raidPaths.get(r.id);
      if (!line) continue;
      const oneShot = S.lastLogged && S.lastLogged.id === r.id && Date.now() - S.lastLogged.at < 2500;
      if (r.outcome !== 'ongoing' && !oneShot) continue;
      const tok = el('g', { 'pointer-events': 'none' });
      tok.appendChild(el('circle', { r: 6.5, fill: '#efe1bf', stroke: '#2a1b0e', 'stroke-width': 1.4 }));
      tok.appendChild(el('path', { d: 'M-2.5 3 V-4 L3 -2 L-2.5 0', fill: kColor(r.by), stroke: '#2a1b0e', 'stroke-width': 0.8 }));
      g.appendChild(tok);
      tokens.push({ r, line, tok, len: line.getTotalLength(), oneShot, t0: oneShot ? S.lastLogged.at : 0 });
    }
    if (!tokens.length) return;
    const place = (tk, f) => {
      const pt = tk.line.getPointAtLength(tk.len * f);
      tk.tok.setAttribute('transform', 'translate(' + pt.x.toFixed(1) + ' ' + pt.y.toFixed(1) + ') scale(' + ((S.csf && S.csf.label) || 1).toFixed(3) + ')');
    };
    if (reduceMotion) {
      tokens.forEach((tk) => place(tk, tk.oneShot && tk.r.outcome !== 'ongoing' ? 1 : 0.6));
      return;
    }
    const loop = (now) => {
      let alive = false;
      for (const tk of tokens) {
        if (tk.oneShot) {
          const f = Math.min(1, (Date.now() - tk.t0) / 1600);
          const eased = 1 - Math.pow(1 - f, 2);
          if (f >= 1 && tk.r.outcome !== 'ongoing') {
            if (tk.tok.parentNode) {
              tk.tok.remove();
              flashCell(tk.r.targetTerritory);
            }
            continue;
          }
          if (f >= 1) tk.oneShot = false;
          place(tk, eased);
          alive = true;
        } else {
          place(tk, ((now / 4200) % 1) * 0.94 + 0.03);
          alive = true;
        }
      }
      if (alive && !document.hidden) tokenFrame = requestAnimationFrame(loop);
    };
    tokenFrame = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && S.campaign) startTokens();
  });

  function flashCell(id) {
    const idx = S.geo.index.get(id);
    const p = $('layerCells').children[idx];
    if (!p || reduceMotion) return;
    p.classList.remove('flash');
    void p.getBoundingClientRect();
    p.classList.add('flash');
    setTimeout(() => p.classList.remove('flash'), 2400);
  }

  /* ---------- zoom & pan ---------- */

  function applyView() {
    const v = S.view;
    viewport.setAttribute('transform', 'translate(' + v.x.toFixed(2) + ' ' + v.y.toFixed(2) + ') scale(' + v.k.toFixed(4) + ')');
    counterScale();
  }
  if (window.ResizeObserver) new ResizeObserver(() => S.campaign && counterScale()).observe($('mapFrame'));
  function clampView() {
    const v = S.view;
    v.k = Math.max(1, Math.min(6, v.k));
    v.x = Math.max(W - W * v.k, Math.min(0, v.x));
    v.y = Math.max(H - H * v.k, Math.min(0, v.y));
  }
  function zoomAt(px, py, factor) {
    const v = S.view;
    const k2 = Math.max(1, Math.min(6, v.k * factor));
    const f = k2 / v.k;
    v.x = px - (px - v.x) * f;
    v.y = py - (py - v.y) * f;
    v.k = k2;
    clampView();
    applyView();
  }
  function toViewBox(clientX, clientY) {
    const r = svg.getBoundingClientRect();
    const s = Math.min(r.width / W, r.height / H) || 1;
    const ox = (r.width - W * s) / 2;
    const oy = (r.height - H * s) / 2;
    return [(clientX - r.left - ox) / s, (clientY - r.top - oy) / s, s];
  }
  function toWorld(vbx, vby) {
    return [(vbx - S.view.x) / S.view.k, (vby - S.view.y) / S.view.k];
  }

  const pointers = new Map();
  let gesture = null;
  svg.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    svg.setPointerCapture(e.pointerId);
    const cell = e.target.closest && e.target.closest('.cell');
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      gesture = { type: 'pan', sx: e.clientX, sy: e.clientY, vx: S.view.x, vy: S.view.y, moved: false, cell: cell ? cell.getAttribute('data-id') : null };
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const mid = toViewBox((a.x + b.x) / 2, (a.y + b.y) / 2);
      gesture = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, k0: S.view.k, x0: S.view.x, y0: S.view.y, mid0: mid, moved: true };
    }
    hideTooltip();
  });
  svg.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) {
      if (e.pointerType === 'mouse') hoverTooltip(e);
      return;
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!gesture) return;
    if (gesture.type === 'pan' && pointers.size === 1) {
      const dx = e.clientX - gesture.sx;
      const dy = e.clientY - gesture.sy;
      if (!gesture.moved && Math.hypot(dx, dy) < 6) return;
      gesture.moved = true;
      svg.classList.add('dragging');
      const s = toViewBox(0, 0)[2];
      S.view.x = gesture.vx + dx / s;
      S.view.y = gesture.vy + dy / s;
      clampView();
      applyView();
    } else if (gesture.type === 'pinch' && pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const mid = toViewBox((a.x + b.x) / 2, (a.y + b.y) / 2);
      const k2 = Math.max(1, Math.min(6, gesture.k0 * (d / gesture.d0)));
      const f = k2 / gesture.k0;
      S.view.k = k2;
      S.view.x = mid[0] - (gesture.mid0[0] - gesture.x0) * f;
      S.view.y = mid[1] - (gesture.mid0[1] - gesture.y0) * f;
      clampView();
      applyView();
    }
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    svg.classList.remove('dragging');
    if (gesture && gesture.type === 'pan' && !gesture.moved && e.type === 'pointerup') {
      onMapTap(gesture.cell);
      if (gesture.cell && e.pointerType !== 'mouse') showTip(gesture.cell, e.clientX, e.clientY, 2600);
    }
    if (pointers.size === 1 && gesture && gesture.type === 'pinch') {
      const [p] = [...pointers.values()];
      gesture = { type: 'pan', sx: p.x, sy: p.y, vx: S.view.x, vy: S.view.y, moved: true, cell: null };
    } else if (!pointers.size) gesture = null;
  }
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);
  svg.addEventListener('pointerleave', (e) => {
    if (e.pointerType === 'mouse') hideTooltip();
  });
  svg.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault();
      const [x, y] = toViewBox(e.clientX, e.clientY);
      zoomAt(x, y, Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0018)));
    },
    { passive: false }
  );
  $('zoomIn').addEventListener('click', () => zoomAt(W / 2, H / 2, 1.4));
  $('zoomOut').addEventListener('click', () => zoomAt(W / 2, H / 2, 1 / 1.4));
  $('zoomFit').addEventListener('click', () => {
    S.view = { k: 1, x: 0, y: 0 };
    applyView();
  });

  function hoverTooltip(e) {
    const cell = e.target.closest && e.target.closest('.cell');
    if (!cell) return hideTooltip();
    showTip(cell.getAttribute('data-id'), e.clientX, e.clientY);
  }
  let tipTimer = 0;
  function showTip(id, clientX, clientY, hideAfter) {
    const tip = $('tooltip');
    clearTimeout(tipTimer);
    const t = terr(id);
    const d = S.result.territories.get(id);
    const feat = E.FEATURES[E.territoryFeature(S.campaign, t, S.geo.shapes[S.geo.index.get(id)].coastLength)];
    tip.innerHTML = '<strong>' + esc(t.name) + '</strong>' + (feat ? ' <span class="muted">' + feat.label.toLowerCase() + '</span>' : '') + '<br>' + (d.isCapital ? 'Capital of ' + esc(kOf(d.capitalOf).name) + (d.owner && d.owner !== d.capitalOf ? ', held by ' + esc(kOf(d.owner).name) : '') : STATUS_LABEL[d.status] + (d.owner ? ' by ' + esc(kOf(d.owner).name) : '') + (d.control > 0 && d.control < 100 ? ' · ' + d.control + '%' : '')) + '<br><span class="num">' + t.goldValue + ' gold · garrison ' + d.garrison + '</span>';
    tip.hidden = false;
    const fr = $('mapFrame').getBoundingClientRect();
    let x = clientX - fr.left + 14;
    let y = clientY - fr.top + 14;
    if (x + tip.offsetWidth > fr.width - 6) x = clientX - fr.left - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > fr.height - 6) y = clientY - fr.top - tip.offsetHeight - 14;
    tip.style.left = Math.max(4, x) + 'px';
    tip.style.top = Math.max(4, y) + 'px';
    if (hideAfter) tipTimer = setTimeout(hideTooltip, hideAfter);
  }
  function hideTooltip() {
    $('tooltip').hidden = true;
  }

  // The active kingdom can raid anything except its own capital and land it already holds outright.
  function targetable(id) {
    const d = S.result.territories.get(id);
    return id !== K().capital && !(d.status === 'conquered' && d.owner === S.active);
  }

  // A tap selects the territory and pre-fills it as the raid target.
  function onMapTap(id) {
    if (!id) {
      S.selected = null;
      renderSelection();
      if (S.tab === 'territory') renderPanel();
      return;
    }
    if (S.pickCapital) {
      const k = kOf(S.pickCapital);
      S.pickCapital = null;
      if (capitalKingdom(id) && capitalKingdom(id).id !== k.id) return toast(terr(id).name + ' is already a capital.');
      k.capital = id;
      k.updatedAt = Date.now();
      S.tab = 'kingdoms';
      commit(terr(id).name + ' is now the capital of ' + k.name + '.');
      return;
    }
    S.selected = id;
    if (targetable(id)) S.plan.target = id;
    if (S.tab !== 'raid') S.tab = 'territory';
    S.confirm = null;
    renderTabs();
    renderPanel();
    renderPlanPath();
    renderSelection();
  }

  function nextTurn() {
    const c = S.campaign;
    const order = c.kingdoms.filter((k) => canPlay(k.id));

    if (!S.roundFrom || !order.some((k) => k.id === S.roundFrom)) S.roundFrom = S.active;
    const i = order.findIndex((k) => k.id === S.active);
    const next = order[(i + 1) % order.length];
    S.active = next.id;
    S.plan.source = 'base';
    if (S.kEdit) S.kEdit = canPlay(next.id) ? next.id : null;
    renderAll();
    const who = atTable(next.id);

  function renderChronicle() {
    const c = S.campaign;
    const r = S.result;
    const multi = c.kingdoms.length > 1;
    const ks = r.kingdoms.get(S.active);
    $('progressPct').textContent = Math.round(ks.progressPct) + '%';
    const bar = $('progressBar');
    let html = '';
    if (multi) {
      let left = 0;
      for (const k of c.kingdoms) {
        const p = r.kingdoms.get(k.id).progressPct;
        if (p > 0) html += '<div class="fill k" style="left:' + left + '%;width:' + p + '%;background:' + E.kingdomColor(k) + '"></div>';
        left += p;
      }
    } else {
      const claimedPct = ((ks.claimed + ks.contested) / ks.totalTargets) * 100;
      html += '<div class="fill claimed" style="width:' + Math.min(100, ks.progressPct + claimedPct) + '%"></div><div class="fill conquered" style="width:' + ks.progressPct + '%"></div>';

    const need = (k) => Math.max(0, Math.ceil((c.goalPct / 100) * ks.totalTargets) - r.kingdoms.get(k).conquered);

      $('progressText').innerHTML = '<span class="scores">' + c.kingdoms.map((k) => {

      }).join('') + '</span>' + (r.winner ? '' : '<span>First to ' + c.goalPct + '% of the realm wins. ' + esc(K().name) + ' needs ' + need(S.active) + ' more.</span>');

      cols += '<div class="dots">' + entry.raids.map((x) => {

      cols += '</div></li>';

        html += '<div class="confirm"><span>Delete this raid? The map recalculates without it.</span><button class="btn small danger" type="button" data-action="delete-raid" data-raid="' + id + '">Delete</button><button class="btn small ghost" type="button" data-action="cancel-confirm">Keep</button></div>';
      } else {
        html += '<div class="actions">';
        if (r.outcome === 'ongoing') html += '<button class="btn small primary" type="button" data-action="resolve" data-raid="' + id + '">Record the result</button>';
        html += '<button class="btn small ghost" type="button" data-action="focus-raid" data-raid="' + id + '">Show on map</button>';
        html += '<button class="btn small ghost" type="button" data-action="ask-delete-raid" data-raid="' + id + '">Delete</button></div>';
      }
    }
    return html + '</li>';
  }

  function territoryTab() {
    const c = S.campaign;
    const r = S.result;
    const me = K();
    const multi = c.kingdoms.length > 1;
    const pick = '<div class="field"><label for="terrPick">Territory</label><select id="terrPick"><option value="">Choose a territory…</option>' + territoryOptions(S.selected) + '</select></div>';
    if (!S.selected || !terr(S.selected)) {
      const ongoing = c.raids.filter((x) => x.outcome === 'ongoing' && x.by === me.id).length;
      const ks = r.kingdoms.get(me.id);
      const row = (t) => {
        const d = r.territories.get(t.id);
        const cap = capitalKingdom(t.id);
        const st = cap ? (cap.id === me.id ? 'your capital' : 'capital of ' + cap.name) : STATUS_LABEL[d.status].toLowerCase() + (d.owner && d.owner !== me.id ? ' by ' + kOf(d.owner).name : '') + (d.control > 0 && d.control < 100 ? ' ' + d.control + '%' : '');
        return '<li><button type="button" data-action="select" data-id="' + esc(t.id) + '"><span class="nm">' + esc(t.name) + '</span><span class="mt">' + t.goldValue + ' gold · ' + d.garrison + ' men · ' + esc(st) + '</span></button></li>';
      };
      const front = [...E.frontier(c, S.geo, r, me.id)].map(terr).sort((a, b) => b.goldValue - a.goldValue);
      const held = c.territories.filter((t) => (r.territories.get(t.id).inf[me.id] || 0) > 0).sort((a, b) => (r.territories.get(b.id).inf[me.id] || 0) - (r.territories.get(a.id).inf[me.id] || 0));
      return (
        pick +
        '<div class="empty"><p>Tap a territory on the map to see its gold, garrison and raid history. Tapping also sets it as ' + esc(me.name) + '’s target in <b>Raid</b>.</p>' +
        '<div class="callout">' + esc(me.name) + ' holds <b>' + (ks.conquered + (ks.capitalHeld ? 1 : 0)) + '</b> territories' + (ks.capitalHeld ? ' including its capital' : ' (its capital has fallen)') + ', has claims on <b>' + (ks.claimed + ks.contested) + '</b> more, and <b>' + ongoing + '</b> raid' + (ongoing === 1 ? ' is' : 's are') + ' under way.</div></div>' +
        '<h3>Frontier, richest first</h3><ul class="picklist">' + front.map(row).join('') + '</ul>' +
        '<h3>' + (multi ? esc(me.name) + '’s land' : 'Your land') + '</h3><ul class="picklist">' + held.map(row).join('') + '</ul>'
      );
    }
    const t = terr(S.selected);
    const d = r.territories.get(t.id);
    const cap = capitalKingdom(t.id);
    const ts = E.TERRAIN_STATS[t.terrain];
    const raids = c.raids.filter((x) => x.targetTerritory === t.id).sort((a, b) => b.timestamp - a.timestamp);
    const derived = (function () {
      const tmp = Object.assign({}, c, { territories: c.territories.map((x) => (x.id === t.id ? Object.assign({}, x, { override: null }) : x)) });
      return E.replay(tmp).territories.get(t.id).status;
    })();
    const feat = E.FEATURES[E.territoryFeature(c, t, S.geo.shapes[S.geo.index.get(t.id)].coastLength)];
    let html = pick;
    html += '<div class="terr-head"><h2>' + esc(t.name) + '</h2><div class="chips"><span class="pill ' + d.status + '">' + STATUS_LABEL[d.status] + '</span>' + (d.owner ? '<span class="chip">' + kChip(kOf(d.owner), 13) + '</span>' : '') + '<span class="chip">' + ts.label + '</span>' + (feat ? '<span class="chip">' + feat.label + '</span>' : '') + (t.override ? '<span class="chip">Set by hand</span>' : '') + '</div>';
    html += cap ? '<p class="hint">Capital of ' + esc(cap.name) + ', seat of ' + esc(cap.ruler.title + ' ' + cap.ruler.name) + '.' + (d.owner && d.owner !== cap.id ? ' Now held by ' + esc(kOf(d.owner).name) + '.' : '') + '</p>' : feat ? '<p class="hint">' + feat.note + '</p>' : '';
    html += '</div>';
    const holders = Object.keys(d.inf).filter((k) => d.inf[k] > 0).sort((a, b) => d.inf[b] - d.inf[a]);
    if (holders.length) {
      html += '<div><span class="hint">Control</span><div class="ibar">' + holders.map((k) => '<i style="width:' + d.inf[k] + '%;background:' + kColor(k) + '"></i>').join('') + '</div><div class="kstats" style="margin-top:4px">' + holders.map((k) => '<span class="kchip"><span class="dotk" style="background:' + kColor(k) + '"></span>' + esc(kOf(k).name) + ' <b>' + d.inf[k] + '%</b></span>').join('') + '</div></div>';
    }
    html += '<dl class="facts">';
    html += '<div><dt>Gold value</dt><dd>' + t.goldValue + ' <small>gold</small></dd></div>';
    html += '<div><dt>Garrison</dt><dd>' + d.garrison + ' <small>of ' + t.garrisonBase + ' at full strength</small></dd></div>';
    html += '<div><dt>Defence</dt><dd>×' + ts.defense.toFixed(2) + ' <small>' + ts.label.toLowerCase() + '</small></dd></div>';
    html += '<div><dt>Raids here</dt><dd>' + d.wins + ' won · ' + d.fails + ' lost' + (d.ongoing ? ' · ' + d.ongoing + ' under way' : '') + '</dd></div>';
    html += '<div><dt>Loot taken</dt><dd>' + fmt(d.loot) + ' <small>gold</small></dd></div>';
    html += '<div><dt>Men lost here</dt><dd>' + d.losses + '</dd></div>';
    html += '<div><dt>Scorched</dt><dd>' + (d.damage > 0 ? ['', 'Singed', 'Burnt', 'Razed'][Math.ceil(d.damage)] + ' <small>heals ' + E.RULES.damageHealPerSeason + '/season</small>' : 'No') + '</dd></div>';
    html += '</dl>';
    html += '<div class="actions">';
    if (targetable(t.id)) html += '<button class="btn primary" type="button" data-action="plan-here">Raid ' + esc(t.name) + (multi ? ' as ' + esc(me.name) : '') + '</button>';
    if (t.id !== me.capital && (d.inf[me.id] || 0) > 0) html += '<button class="btn" type="button" data-action="raid-from">Raid from here</button>';
    html += '</div>';
    if (!cap) {
      html += '<div class="grid2"><div class="field"><label for="terrOverride">Status on the map</label><select id="terrOverride">';
      html += '<option value=""' + (!t.override ? ' selected' : '') + '>From the raid log (' + STATUS_LABEL[derived].toLowerCase() + ')</option>';
      for (const s of E.STATUSES) html += '<option value="' + s + '"' + (t.override === s ? ' selected' : '') + '>' + STATUS_LABEL[s] + ' (by hand)</option>';
      html += '</select></div>';
      if (multi && t.override && t.override !== 'unclaimed') html += '<div class="field"><label for="terrOverrideBy">Held by</label><select id="terrOverrideBy">' + c.kingdoms.map((k) => '<option value="' + esc(k.id) + '"' + ((t.overrideBy || d.owner) === k.id ? ' selected' : '') + '>' + esc(k.name) + '</option>').join('') + '</select></div>';
      html += '</div><p class="hint">Setting it by hand changes the colour and the conquest count, not the raid history.</p>';
    }
    html += '<form class="field" data-form="rename"><label for="terrRename">Rename</label><div class="row"><input id="terrRename" maxlength="60" value="' + esc(t.name) + '"><button class="btn" type="submit">Save name</button></div></form>';
    html += '<h3>Raids on ' + esc(t.name) + '</h3>';
    html += raids.length ? '<ol class="log">' + raids.map((x) => raidLine(x)).join('') + '</ol>' : '<p class="hint">No raids here yet.</p>';
    return html;
  }

  function raidTab() {
    const c = S.campaign;
    const r = S.result;
    const p = S.plan;
    const me = K();
    const multi = c.kingdoms.length > 1;
    const sources = E.raidSources(c, r, me.id);
    if (p.source !== 'base' && !sources.includes(p.source)) p.source = 'base';
    if (p.target && !targetable(p.target)) p.target = null;
    let html = '<form data-form="plan" class="tab-form" style="display:grid;gap:12px">';
    if (multi) {
      html += '<div class="field"><label for="planBy">Raiding kingdom</label><select id="planBy">' + c.kingdoms.map((k) => '<option value="' + esc(k.id) + '"' + (k.id === me.id ? ' selected' : '') + (canPlay(k.id) ? '' : ' disabled') + '>' + esc(k.name) + (ownerName(k) ? ' (' + esc(ownerName(k)) + ')' : '') + '</option>').join('') + '</select></div>';
    }
    html += '<p class="hint">Tap a territory on the map to set the target. Dotted outlines mark ' + esc(me.name) + '’s frontier.</p>';
    html += '<div class="field"><label for="planTarget">Target</label><select id="planTarget" required><option value="">Choose a target…</option>' + territoryOptions(p.target, (t) => targetable(t.id)) + '</select></div>';
    html += '<div class="field"><label for="planSource">Setting out from</label><select id="planSource"><option value="base"' + (p.source === 'base' ? ' selected' : '') + '>Capital (' + esc(terr(me.capital).name) + ')</option>';
    for (const id of sources) html += '<option value="' + esc(id) + '"' + (p.source === id ? ' selected' : '') + '>' + esc(terr(id).name) + ' (' + STATUS_LABEL[r.territories.get(id).status].toLowerCase() + ')</option>';
    html += '</select></div>';
    html += '<div class="callout" id="routeInfo"></div>';
    html += '<div class="grid2"><div class="field"><label for="planWarband">Raiders sent</label><input id="planWarband" type="number" min="0" step="1" inputmode="numeric" value="' + p.warband + '"></div><div class="field"><span class="label">Odds (rough guide)</span><div id="oddsInfo" class="callout" style="padding:6px 10px"></div></div></div>';
    html += '<div class="field"><span class="label" id="outcomeLabel">Result</span><div class="seg" role="radiogroup" aria-labelledby="outcomeLabel">';
    for (const k of ['ongoing', 'success', 'failure']) html += '<label><input type="radio" name="outcome" value="' + k + '"' + (p.outcome === k ? ' checked' : '') + '><span>' + OUTCOME[k].sym + ' ' + OUTCOME[k].label + '</span></label>';
    html += '</div></div>';
    html += '<div class="grid2"><div class="field"><label for="planLosses">Men lost</label><input id="planLosses" type="number" min="0" step="1" inputmode="numeric" value="' + p.losses + '"></div><div class="field"><label for="planLoot">Gold taken</label><input id="planLoot" type="number" min="0" step="1" inputmode="numeric" value="' + p.loot + '"></div></div>';
    html += '<p class="hint" id="lootHint"></p>';
    html += '<div class="field"><label for="planNotes">Notes</label><textarea id="planNotes" maxlength="500" placeholder="Burned the mill, took the abbot’s silver…">' + esc(p.notes) + '</textarea></div>';
    const ps = E.playersOf(c, me.id);
    if (ps.length > 1 && !(sharedLive() && myPlayer() && myPlayer().kingdom === me.id)) {
      const cur = atTable(me.id);
      html += '<div class="field"><label for="planWho">Logged by</label><select id="planWho">' + ps.map((pl) => '<option value="' + esc(pl.id) + '"' + (cur && cur.id === pl.id ? ' selected' : '') + '>' + esc(playerName(pl)) + '</option>').join('') + '</select></div>';
    }
    html += '<div id="planWarn"></div>';
    html += '<button class="btn primary" type="submit" id="planSubmit">Log raid' + (multi ? ' for ' + esc(me.name) : '') + '</button>';
    html += '</form>';
    return html;
  }

  function readPlan() {
    const f = document.querySelector('[data-form="plan"]');
    if (!f) return;
    const p = S.plan;
    p.target = $('planTarget').value || null;
    p.source = $('planSource').value || 'base';
    p.warband = Math.max(0, Math.round(Number($('planWarband').value) || 0));
    const o = f.querySelector('input[name="outcome"]:checked');
    p.outcome = o ? o.value : 'ongoing';
    p.losses = Math.max(0, Math.round(Number($('planLosses').value) || 0));
    p.loot = Math.max(0, Math.round(Number($('planLoot').value) || 0));
    p.notes = $('planNotes').value;
  }

  function updatePlanDerived() {
    const p = S.plan;
    const c = S.campaign;
    const r = S.result;
    const me = K();
    const ongoing = p.outcome === 'ongoing';
    $('planLosses').disabled = ongoing;
    $('planLoot').disabled = ongoing;
    $('planSubmit').disabled = !p.target || !canPlay(me.id);
    const info = $('routeInfo');
    const odds = $('oddsInfo');
    const warn = [];
    if (!canPlay(me.id)) warn.push(me.name + ' is played by ' + ownerName(me) + '. Join an open kingdom in the Kingdoms tab to play.');
    if (!p.target || !terr(p.target)) {
      info.innerHTML = 'No target yet.';
      odds.textContent = '—';
      $('lootHint').textContent = '';
    } else {
      const t = terr(p.target);
      const d = r.territories.get(t.id);
      const route = E.findRoute(S.geo, S.geo.index.get(resolveSource(p.source, me.id)), S.geo.index.get(t.id), routeOpts(me.id));
      const through = route.slice(1, -1).map((i) => c.territories[i].name);
      const sea = route.some((v, i) => i && S.geo.laneSet.has(Math.min(route[i - 1], v) + '|' + Math.max(route[i - 1], v)));
      info.innerHTML = '<b>' + esc(t.name) + '</b>: ' + t.goldValue + ' gold, garrison <b>' + d.garrison + '</b>, ' + E.TERRAIN_STATS[t.terrain].label.toLowerCase() + (d.owner ? ', ' + STATUS_LABEL[d.status].toLowerCase() + ' by ' + esc(kOf(d.owner).name) : '') + '.<br>Route: ' + E.routeLeagues(S.geo, route) + ' leagues' + (sea ? ' by sea' : '') + (through.length ? ' through ' + esc(through.join(', ')) : ', a direct border crossing') + '.';
      const od = E.raidOdds(p.warband, d.garrison, t.terrain);
      odds.innerHTML = '<b>' + od.label + '</b>' + (Number.isFinite(od.ratio) ? ' <span class="num">(' + od.ratio.toFixed(2) + ' to 1)</span>' : '');
      $('lootHint').textContent = ongoing ? 'Men lost and gold taken are recorded when the raid comes back (Log → Record the result).' : 'A good haul here is around ' + Math.round(t.goldValue * 0.3) + '–' + Math.round(t.goldValue * 0.6) + ' gold.';
      const cap = capitalKingdom(t.id);
      if (cap) warn.push(t.name + ' is the capital of ' + cap.name + '. Take it and their realm loses its heart.');
    }
    const ks = r.kingdoms.get(me.id);
    const home = ks.army - ks.inField;
    if (p.warband > home) warn.push(me.name + ' is sending ' + p.warband + ' but only ' + home + ' men are at home.');
    if (!ongoing && p.losses > p.warband && p.warband > 0) warn.push('More men lost than were sent.');
    $('planWarn').innerHTML = warn.map((w) => '<div class="callout warn">' + esc(w) + '</div>').join('');
  }

  function logTab() {
    const c = S.campaign;
    const multi = c.kingdoms.length > 1;
    const all = c.raids.slice().sort((a, b) => b.timestamp - a.timestamp);
    if (!all.length) return '<div class="empty"><p>No raids logged yet. Pick a target on the map, then log it from <b>Raid</b>.</p><button class="btn primary" type="button" data-tab-go="raid">Plan a raid</button></div>';
    const raids = S.logFilter ? all.filter((x) => x.by === S.logFilter) : all;
    const won = raids.filter((x) => x.outcome === 'success').length;
    const lost = raids.filter((x) => x.outcome === 'failure').length;
    const loot = raids.reduce((s, x) => s + (x.outcome === 'ongoing' ? 0 : x.lootGained), 0);
    const fallen = raids.reduce((s, x) => s + (x.outcome === 'ongoing' ? 0 : x.losses), 0);
    let html = '';
    if (multi) html += '<div class="field"><label for="logFilter">Show raids by</label><select id="logFilter"><option value="">Every kingdom</option>' + c.kingdoms.map((k) => '<option value="' + esc(k.id) + '"' + (S.logFilter === k.id ? ' selected' : '') + '>' + esc(k.name) + '</option>').join('') + '</select></div>';
    html += '<div class="callout"><b>' + raids.length + '</b> raids: <b>' + won + '</b> won, <b>' + lost + '</b> lost, <b>' + (raids.length - won - lost) + '</b> under way. <b>' + fmt(loot) + '</b> gold taken, <b>' + fmt(fallen) + '</b> men lost. The last 10 are drawn on the map.</div>';
    return html + '<ol class="log">' + raids.map((x) => raidLine(x, { controls: true })).join('') + '</ol>';
  }

  function swatchRadios(name, options, current, disabled) {
    return '<div class="swatches" role="radiogroup">' + options.map(([value, hex, label]) => '<label title="' + esc(label) + '"><input type="radio" name="' + name + '" value="' + esc(value) + '"' + (value === current ? ' checked' : '') + (disabled && disabled(value) ? ' disabled' : '') + ' aria-label="' + esc(label) + '"><span style="background:' + hex + '"></span></label>').join('') + '</div>';
  }

  function kingdomEditor(k) {

    const a = k.arms;
    const tincts = Object.entries(E.TINCTURES).map(([id, t]) => [id, t.hex, t.label]);

    html += '<div class="grid2"><div class="field"><label for="kTitle">Ruler’s title</label><select id="kTitle">' + E.TITLES.map((t) => '<option' + (t === k.ruler.title ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></div><div class="field"><label for="kRuler">Ruler</label><input id="kRuler" maxlength="40" value="' + esc(k.ruler.name) + '"></div></div>';
    html += '<div class="field"><span class="label">Colour on the map</span>' + swatchRadios('kColor', E.KINGDOM_COLORS.map((x) => [x.id, x.hex, x.label]), k.color, (v) => c.kingdoms.some((o) => o.id !== k.id && o.color === v)) + '</div>';

    html += '<div class="field"><label for="kCharge">Charge</label><select id="kCharge">' + Object.entries(E.CHARGES).map(([v, l]) => '<option value="' + v + '"' + (v === a.charge ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div></div>';
    html += '<button class="btn small" type="button" data-action="roll-arms">↻ Roll new arms</button></div></div>';
    html += '<div class="field"><span class="label">Field</span>' + swatchRadios('kField', tincts, a.field) + '</div>';
    html += '<div class="field"><span class="label">Second tincture (for divided fields)</span>' + swatchRadios('kSecond', tincts, a.second) + '</div>';
    html += '<div class="field"><span class="label">Charge colour</span>' + swatchRadios('kChargeColor', tincts, a.chargeColor) + '</div>';
    html += '<div class="field"><label for="kTrait">Trait</label><select id="kTrait">' + Object.entries(E.TRAITS).map(([v, t]) => '<option value="' + v + '"' + (v === k.trait ? ' selected' : '') + '>' + t.label + '</option>').join('') + '</select><p class="hint" id="kTraitNote">' + esc(E.TRAITS[k.trait].note) + '</p></div>';
    html += '<div class="field"><label for="kCapital">Capital</label><div class="row"><select id="kCapital"' + (capFixed ? ' disabled' : '') + '>' + territoryOptions(k.capital, (t) => !capitalKingdom(t.id) || t.id === k.capital) + '</select><button class="btn" type="button" data-action="pick-capital" data-id="' + esc(k.id) + '"' + (capFixed ? ' disabled' : '') + '>Pick on map</button></div>' + (capFixed ? '<p class="hint">Capitals are fixed once raiding starts; moving one would rewrite the war.</p>' : '') + '</div>';
    html += '<div class="grid3"><div class="field"><label for="kGold">Starting gold</label><input id="kGold" type="number" step="1" value="' + k.start.treasury + '"></div><div class="field"><label for="kArmy">Starting men</label><input id="kArmy" type="number" min="0" step="1" value="' + k.start.army + '"></div><div class="field"><label for="kMorale">Starting morale</label><input id="kMorale" type="number" min="0" max="100" step="1" value="' + k.start.morale + '"></div></div>';
    html += '<div class="actions"><button class="btn primary" type="submit">Save kingdom</button><button class="btn" type="button" data-action="roll-identity">↻ Random identity</button><button class="btn ghost" type="button" data-action="cancel-kingdom">Close</button></div>';
    return html + '</form>';
  }

  function readArmsForm() {
    const v = (name) => {
      const el2 = document.querySelector('input[name="' + name + '"]:checked');
      return el2 ? el2.value : null;
    };
    return { division: $('kDivision').value, field: v('kField'), second: v('kSecond'), charge: $('kCharge').value, chargeColor: v('kChargeColor') };
  }

  function kingdomsTab() {
    const c = S.campaign;
    const r = S.result;
    let html = '<p class="hint">' + (c.kingdoms.length > 1 ? 'Every kingdom raids the same map. Switch kingdoms with the bar at the top (or keys 1\u2013' + c.kingdoms.length + '); Next kingdom passes the turn. ' : '') + 'Name the people at the table and put them in a kingdom; several players can rule one kingdom together. ' + (sharedLive() ? 'This campaign is shared: join a kingdom to play it from your own device. Co-rulers can join the same kingdom.' : store.mode === 'cloud' ? 'To play from separate devices, share the campaign (Campaign tab).' : '') + '</p>';
    html += '<ol class="kingdoms">';
    for (const k of c.kingdoms) {
      const s = r.kingdoms.get(k.id);
      html += '<li class="kcard' + (k.id === S.active ? ' active' : '') + '" style="--kc:' + E.kingdomColor(k) + '">';
      html += '<div class="khead">' + shieldSVG(k.arms, 48, k.name + ' coat of arms') + '<div><h3>' + esc(k.name) + '</h3><p>' + esc(k.ruler.title + ' ' + k.ruler.name) + (k.motto ? ' · “' + esc(k.motto) + '”' : '') + '</p></div></div>';
      html += '<div class="chips"><span class="chip"><span class="kchip"><span class="dotk" style="background:' + E.kingdomColor(k) + '"></span>' + esc((E.KINGDOM_COLORS.find((x) => x.id === k.color) || {}).label || '') + '</span></span><span class="chip" title="' + esc(E.TRAITS[k.trait].note) + '">' + esc(E.TRAITS[k.trait].label) + '</span><span class="chip">Capital: ' + esc(terr(k.capital).name) + (s.capitalHeld ? '' : ' (fallen)') + '</span>' + '</div>';
