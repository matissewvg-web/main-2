<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frontlinie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Layout: stafkaart links, orderboek rechts; op een telefoon onder elkaar. */
:root {
  --bg: #dfe3d8; --vlak: #f0f2ea; --vel: #fbfaf5; --inkt: #18211d; --stil: #56625a; --lijn: #b4bcab;
  --accent: #14506b; --accent-inkt: #ffffff; --zee: #b5ccd3; --land: #c9cabd; --kop: #18211d; --kop-inkt: #eef1e8; --kop-lijn: #3b4a43; --schaduw: 0 1px 2px rgba(24, 33, 29, 0.08), 0 10px 28px -14px rgba(24, 33, 29, 0.35);
  --aanval: #a9361f; --verdedig: #2a568f; --ok: #2f6b45; --let: #a35a0c; --let-vlak: #f6e7c8; --ok-vlak: #d5e8d7;
  --f-kop: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-tekst: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #12181a; --vlak: #1b2326; --vel: #222b2e; --inkt: #e3e8e1; --stil: #96a39b; --lijn: #37454a; --accent: #7cc0dc; --accent-inkt: #0d1a20; --zee: #1e3038; --land: #2c3639; --kop: #0b1012; --kop-inkt: #e3e8e1; --kop-lijn: #2c383c; --schaduw: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 30px -14px rgba(0, 0, 0, 0.8); --aanval: #ef8d75; --verdedig: #8db4ea; --ok: #86c79a; --let: #e9b565; --let-vlak: #3a2f18; --ok-vlak: #1d3526; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #12181a; --vlak: #1b2326; --vel: #222b2e; --inkt: #e3e8e1; --stil: #96a39b; --lijn: #37454a; --accent: #7cc0dc; --accent-inkt: #0d1a20; --zee: #1e3038; --land: #2c3639; --kop: #0b1012; --kop-inkt: #e3e8e1; --kop-lijn: #2c383c; --schaduw: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 30px -14px rgba(0, 0, 0, 0.8); --aanval: #ef8d75; --verdedig: #8db4ea; --ok: #86c79a; --let: #e9b565; --let-vlak: #3a2f18; --ok-vlak: #1d3526; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--inkt); font: 15px/1.5 var(--f-tekst); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--kop); }
h1, h2, h3, h4 { font-family: var(--f-kop); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h1 { font-size: 2.1rem; } h2 { font-size: 1.45rem; } h3 { font-size: 1.12rem; } h4 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--stil); margin-top: 0.7rem; }
p { margin: 0; } ul, ol { margin: 0; padding: 0; list-style: none; }
.stil { color: var(--stil); font-size: 0.9rem; }
.mono { font-family: var(--f-mono); font-size: 0.9em; }
.oog { font-family: var(--f-kop); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.8rem; color: var(--stil); }
.fout { color: var(--aanval); font-weight: 600; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.kop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; background: var(--kop); color: var(--kop-inkt); border-bottom: 3px solid var(--accent); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.merk { font: 700 1.5rem/1 var(--f-kop); letter-spacing: 0.2em; background: none; border: 0; color: var(--kop-inkt); padding: 4px 0; cursor: pointer; }
.kop .chip { background: transparent; border-color: var(--kop-lijn); color: var(--kop-inkt); }
.kop .chip.let { background: var(--let-vlak); border-color: var(--let); color: var(--let); }
.kop .knop { background: transparent; border-color: var(--kop-lijn); color: var(--kop-inkt); }
.kop .knop:hover:not(:disabled) { border-color: var(--kop-inkt); }
.kopinfo b { font: 700 1.15rem var(--f-kop); letter-spacing: 0.04em; margin-right: 4px; }
.kopinfo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.kopknoppen { display: flex; gap: 6px; margin-left: auto; }
main { padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 28px; max-width: 1500px; margin: 0 auto; }
section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.knop { font: 600 0.92rem/1.2 var(--f-tekst); padding: 9px 15px; border-radius: 6px; border: 1px solid var(--lijn); background: var(--vel); color: var(--inkt); cursor: pointer; transition: border-color 0.12s, transform 0.08s; }
.knop:active:not(:disabled) { transform: translateY(1px); }
.knop:hover:not(:disabled) { border-color: var(--inkt); }
.knop.hoofd { background: var(--accent); border-color: var(--accent); color: var(--accent-inkt); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
.knop.hoofd:hover:not(:disabled) { filter: brightness(1.1); }
.knop.gevaar { background: var(--aanval); border-color: var(--aanval); color: var(--accent-inkt); }
.knop.mini { padding: 4px 9px; font-size: 0.82rem; }
.knop:disabled { opacity: 0.5; cursor: not-allowed; }
.knoppen { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.8rem; padding: 2px 8px; border: 1px solid var(--lijn); border-radius: 999px; background: var(--vlak); white-space: nowrap; }
.chip.let { background: var(--let-vlak); border-color: var(--let); color: var(--let); }
.chip.ok { background: var(--ok-vlak); border-color: var(--ok); color: var(--ok); }
.stip { display: inline-block; width: 0.75em; height: 0.75em; border-radius: 2px; border: 1px solid var(--inkt); margin-right: 5px; vertical-align: -0.05em; flex: none; }
.code { font: 500 0.72rem/1 var(--f-mono); background: var(--inkt); color: var(--bg); padding: 3px 4px; border-radius: 3px; margin-right: 7px; }

.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--inkt); overflow-x: auto; }
.tab { font: 600 1rem/1 var(--f-kop); letter-spacing: 0.06em; text-transform: uppercase; padding: 10px 14px; background: none; border: 0; border-radius: 6px 6px 0 0; color: var(--stil); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--inkt); }
.tab.aan { background: var(--inkt); color: var(--bg); }

/* start */
.intro { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; align-items: center; padding: 28px; border-radius: 10px; color: var(--kop-inkt);
  background: repeating-radial-gradient(circle at 88% 30%, transparent 0 22px, rgba(255, 255, 255, 0.06) 22px 23px), radial-gradient(circle at 88% 30%, #1f5d78, var(--kop) 62%); box-shadow: var(--schaduw); }
.intro h1 { font-size: 2.7rem; }
.intro .lus { border-left-color: var(--kop-inkt); }
.intro .knop.hoofd { background: var(--kop-inkt); border-color: var(--kop-inkt); color: var(--kop); }
.intro > div { display: flex; flex-direction: column; gap: 14px; }
.intro p { max-width: 62ch; font-size: 1.02rem; }
.lus { counter-reset: stap; display: flex; flex-direction: column; gap: 6px; border-left: 3px solid var(--inkt); padding-left: 14px; }
.lus li { counter-increment: stap; font-size: 0.92rem; }
.lus li::before { content: counter(stap); font: 700 0.9rem var(--f-mono); margin-right: 8px; }
.rijen { display: flex; flex-direction: column; border-top: 1px solid var(--lijn); }
.rij { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--lijn); }
.rij.smal { padding: 6px 0; }
.galerij { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.scnknop { display: flex; flex-direction: column; width: 100%; height: 100%; text-align: left; font: inherit; color: inherit; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 8px; padding: 0; cursor: pointer; overflow: hidden; box-shadow: var(--schaduw); transition: transform 0.14s, border-color 0.14s; }
.scnknop:hover { border-color: var(--accent); transform: translateY(-3px); }
.minikaart { background: var(--zee); border-bottom: 1px solid var(--lijn); height: 190px; flex: none; }
.minikaart { overflow: hidden; }
.minikaart svg.kaart { width: 100%; height: 100%; }
.scntekst { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.scntekst p { font-size: 0.9rem; }
textarea, input[type="text"], input[type="number"], select { font: inherit; color: var(--inkt); background: var(--vel); border: 1px solid var(--lijn); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
textarea { font-family: var(--f-mono); font-size: 0.8rem; }

/* kaart */
.camp, .nieuw { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(330px, 1fr); gap: 20px; align-items: start; }
.kaartvak { gap: 8px; }
.kaartbalk { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 30px; }
.instructie { font-weight: 600; color: var(--accent); }
.kaartrol { overflow: auto; max-height: 76vh; border: 2px solid var(--kop); background: var(--zee); border-radius: 8px; box-shadow: var(--schaduw); }
.kaartrol > div { min-width: 560px; }
.kaartrol.past svg.kaart { max-height: 74vh; }
svg.kaart { display: block; width: 100%; height: auto; font-family: var(--f-kop); }
svg.kaart .zee { fill: var(--zee); }
svg.kaart .land { fill: var(--land); stroke: none; }
svg.kaart .rg { cursor: pointer; }
svg.kaart .rg:hover > path:first-child { filter: brightness(1.12); }
svg.kaart .rg.dof { opacity: 0.42; }
svg.kaart .rg.kan > path:first-child { stroke: #f2c230; stroke-opacity: 1; stroke-width: 6px; paint-order: fill; }
svg.kaart .rg.bron > path:first-child, svg.kaart .rg.sel > path:first-child { stroke: #ffffff; stroke-opacity: 1; stroke-width: 6px; }
svg.kaart .rn { text-anchor: middle; font-weight: 700; fill: #14181c; stroke: rgba(255, 255, 255, 0.72); stroke-width: 0.2em; paint-order: stroke; stroke-linejoin: round; }
svg.kaart .ri { text-anchor: middle; font-family: var(--f-mono); font-weight: 500; fill: #14181c; stroke: rgba(255, 255, 255, 0.6); stroke-width: 0.2em; paint-order: stroke; }
svg.kaart .zeelink { stroke: #14181c; stroke-opacity: 0.5; fill: none; }
.geenklik { pointer-events: none; }
.kaartlaag { position: relative; margin: 0 auto; background: var(--zee); }
.kaartlaag canvas, .kaartlaag svg.kaart { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; }
.kaartlaag.tekent { touch-action: none; cursor: crosshair; }
.kaartlaag.tekent svg.kaart .rg { cursor: crosshair; }
svg.kaart.verfmodus .zee { fill: none; }
svg.kaart.verfmodus .rg > path:first-child { stroke-opacity: 0.2; }
svg.kaart.verfmodus .rg.kan > path:first-child { fill-opacity: 0.3; stroke-opacity: 1; }
svg.kaart.verfmodus .rg.sel > path:first-child, svg.kaart.verfmodus .rg.bron > path:first-child { stroke-opacity: 1; }
svg.kaart.verfmodus .rg:hover > path:first-child { fill-opacity: 0.12; }
.tekenbalk { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; background: var(--vel); border: 2px solid var(--accent); border-radius: 8px; padding: 8px 10px; }
.knop.gekozen { box-shadow: inset 0 0 0 2px var(--accent); border-color: var(--accent); }
.bezit { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 0.82rem var(--f-mono); }
.legenda { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 0.78rem; }
.regiokaart { border-left: 3px solid var(--inkt); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 8px; }
.feiten { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 16px; margin: 0; }
.feiten.smal { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.feiten dt { font: 600 0.72rem var(--f-kop); text-transform: uppercase; letter-spacing: 0.08em; color: var(--stil); }
.feiten dd { margin: 0; font-size: 0.92rem; }

/* paneel */
.paneel { background: var(--vlak); border: 1px solid var(--lijn); border-radius: 10px; padding: 16px; gap: 14px; box-shadow: var(--schaduw); }
.tabinhoud { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.doorgeef { border: 2px dashed var(--accent); border-radius: 8px; background: var(--vel); padding: 14px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.planner { display: flex; flex-direction: column; gap: 10px; }
.ordknoppen { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.ordknop { display: flex; align-items: center; font: 600 0.88rem var(--f-tekst); text-align: left; padding: 8px 9px; border: 1px solid var(--lijn); border-radius: 4px; background: var(--vel); color: var(--inkt); cursor: pointer; }
.ordknop.aan { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.ordknop:disabled { opacity: 0.4; cursor: not-allowed; }
.uitleg { font-size: 0.9rem; }
.let-tekst { background: var(--let-vlak); color: var(--let); padding: 8px 10px; border-radius: 4px; font-size: 0.9rem; }
.orders { display: flex; flex-direction: column; gap: 5px; }
.orders li { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 0.92rem; }
.orders .knop { margin-left: auto; }
.blokken { display: flex; flex-direction: column; gap: 12px; }
.blok { border-top: 2px solid var(--inkt); padding-top: 9px; display: flex; flex-direction: column; gap: 8px; }
.blok.uit, .facrij.uit { opacity: 0.55; }
.lijst { display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.gevechten { display: flex; flex-direction: column; gap: 8px; }
.gev { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; background: var(--vel); border: 1px solid var(--lijn); border-left: 5px solid var(--stil); border-radius: 6px; }
.gev.open { border-left-color: var(--aanval); }
.banner { background: var(--inkt); color: var(--bg); padding: 16px; border-radius: 4px; display: flex; flex-direction: column; gap: 6px; }
.banner .oog { color: inherit; opacity: 0.75; }
.doelvak, .doelregel { background: var(--vel); border: 1px solid var(--lijn); border-radius: 4px; padding: 11px 13px; display: flex; flex-direction: column; gap: 7px; }
.doelregel { display: block; }
.tabel { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.tabel th, .tabel td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--lijn); vertical-align: top; }
.tabel thead th { font: 600 0.74rem var(--f-kop); text-transform: uppercase; letter-spacing: 0.08em; color: var(--stil); }
.tabel .num { text-align: right; }
.balk { width: 30%; } .balk span { display: block; height: 10px; border: 1px solid var(--inkt); }
.logblok ul { display: flex; flex-direction: column; gap: 5px; font-size: 0.9rem; border-left: 2px solid var(--lijn); padding-left: 10px; margin-top: 6px; }
.log-gevecht { font-weight: 500; } .log-event { color: var(--accent); } .log-order { color: var(--stil); }
.veldgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; align-items: end; }
.veldgrid label, .voorraad label, .tweede { display: flex; flex-direction: column; gap: 3px; font-size: 0.8rem; font-weight: 600; color: var(--stil); }
.veldgrid .breed { grid-column: 1 / -1; }
label.vink { flex-direction: row; align-items: center; gap: 7px; font-size: 0.9rem; font-weight: 400; color: var(--inkt); }
fieldset { border: 1px solid var(--lijn); border-radius: 4px; display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 8px 10px; margin: 0; }
legend { font: 600 0.74rem var(--f-kop); text-transform: uppercase; letter-spacing: 0.08em; color: var(--stil); padding: 0 4px; }
.voorraad { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px 10px; }
.spelers { display: flex; flex-direction: column; gap: 8px; }
.spelers li { display: grid; grid-template-columns: minmax(110px, 180px) minmax(0, 1fr); gap: 10px; align-items: center; }
.facrijen { display: flex; flex-direction: column; gap: 10px; }
.facrij { border-top: 2px solid var(--inkt); padding-top: 8px; display: flex; flex-direction: column; gap: 7px; }
.fackop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.facvelden { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.facvelden label, .inlijn { font-size: 0.8rem; font-weight: 600; color: var(--stil); display: flex; flex-direction: column; gap: 3px; }
.inlijn { flex-direction: row; align-items: center; gap: 8px; } .inlijn select { width: auto; }
.doctekst, .doc p { font-size: 0.86rem; color: var(--stil); } .doctekst b, .doc p b { color: var(--inkt); }
.verf { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.verfknop { display: inline-flex; align-items: center; font: 600 0.82rem var(--f-tekst); padding: 5px 9px; border: 1px solid var(--lijn); border-radius: 4px; background: var(--vlak); color: var(--inkt); cursor: pointer; }
.verfknop.aan { box-shadow: inset 0 0 0 2px var(--accent); border-color: var(--accent); }
details { border-top: 1px solid var(--lijn); padding-top: 7px; } details > * + * { margin-top: 7px; }
summary { cursor: pointer; font-weight: 600; }
.vets { display: flex; flex-direction: column; gap: 6px; } .vets li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; font-size: 0.9rem; }

/* scenarioblad */
.bladscherm, .losscherm { max-width: 1500px; }
.losscherm { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); align-items: start; gap: 20px; }
.vel { background: var(--vel); border: 1px solid var(--lijn); border-radius: 10px; box-shadow: var(--schaduw); padding: 22px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.velkop { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px 30px; border-bottom: 3px solid var(--inkt); padding-bottom: 14px; }
.velkop > div { display: flex; flex-direction: column; gap: 5px; flex: 1 1 300px; }
.velkop h2 { font-size: 2.3rem; text-transform: uppercase; letter-spacing: 0.03em; }
.velkop .feiten { flex: 1 1 320px; align-content: start; }
.velgrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.tafel { margin: 0; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.tafel svg { display: block; width: 100%; height: auto; border: 1px solid var(--lijn); }
.tafel figcaption { font-size: 0.84rem; color: var(--stil); }
.let { background: var(--let-vlak); color: var(--let); border-radius: 4px; padding: 8px 10px 8px 26px; font-size: 0.88rem; } .let ul { list-style: disc; }
.veltekst { display: flex; flex-direction: column; gap: 15px; min-width: 0; }
.veltekst section { gap: 6px; } .veltekst ul { list-style: disc; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 0.92rem; }
.verwijzing { border-left: 4px solid var(--let); padding-left: 10px; font-style: italic; }
.kanten { display: grid !important; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.kant { border-top: 4px solid var(--aanval); padding-top: 8px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.kantV { border-top-color: var(--verdedig); }
.brief { font-style: italic; }
.uitslag { background: var(--vlak); border: 1px solid var(--lijn); border-radius: 10px; box-shadow: var(--schaduw); padding: 18px; gap: 12px; }
.keuzes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px; }
.keuze { font: 700 1.2rem var(--f-kop); letter-spacing: 0.03em; padding: 18px 10px; border: 1px solid var(--lijn); border-top: 4px solid var(--stil); border-radius: 3px; background: var(--vel); color: var(--inkt); cursor: pointer; }
.keuze.kA { border-top-color: var(--aanval); } .keuze.kV { border-top-color: var(--verdedig); }
.keuze.aan { box-shadow: inset 0 0 0 3px var(--accent); background: var(--ok-vlak); }

// ── kaarten.js ──
// Kaarten. Eén regel per regio: id|naam|x|y|terrein|infrastructuur|waarde|versterking[:linienaam]
// terrein: steppe akkers bocage woestijn stad bos heuvels bergen rivier strand moeras
// infra:   stad haven kust brug spoor vliegveld
// versterking: 0 geen, 1 ingegraven, 2 fort, 3 linie
// Buren volgen uit de geometrie (geo.js); `links` voegt verbindingen toe, `cuts` haalt ze weg.


function rg(tekst) {
  return tekst.trim().split('\n').map((l) => {
    const [id, naam, x, y, terrein, infra, waarde, fort] = l.trim().split('|');
    const [f, linie] = (fort || '0').split(':');
    return { id, naam, x: +x, y: +y, terrein, infra: infra ? infra.split(',') : [], waarde: +waarde || 1, fort: +f || 0, linie: linie || '' };
  });
}

}

function vul(t, m) { return t.replace(/\{(\w+)\}/g, (_, k) => (m[k] !== undefined ? m[k] : '')); }

// Gewichten per scenariotype voor een gegeven context. Los te testen.
function scenarioGewichten(c) {
  const r = c.regio, V = c.V || {}, A = c.A || {};
  const brug = r.infra.includes('brug') || r.terrein === 'rivier';
  const w = {};
  if (c.soort === 'ontmoeting') return { ontmoeting: 1 };
  if (c.soort === 'raid') return { raid: 1 };
  if (c.soort === 'landing') return { strandlanding: 1 };
  if (c.soort === 'luchtlanding') return { luchtlanding: 1 };
  const mag = (t) => !((V.doctrines || []).includes('festung') && (t === 'achterhoede' || t === 'brugopblazen'));
  w.doorbraak = 3 + (r.fort === 0 ? 2 : 0);
  w.houden = (r.fort >= 1 || V.versterkt || V.verdedigt) ? 3 + r.fort + (V.versterkt ? 2 : 0) + (V.verdedigt ? 1 : 0) : 0.5;
  w.bruginnemen = brug ? 6 : 0;
  w.brugopblazen = brug && mag('brugopblazen') ? (V.afgesneden || V.verloorVorige ? 4 : 1) : 0;
  w.stad = r.terrein === 'stad' ? 8 : (r.infra.includes('stad') ? 2 : 0);
  w.achterhoede = V.verloorVorige && mag('achterhoede') && r.fort < 2 ? 4 : 0;
  w.konvooi = V.afgesneden && !V.ingesloten ? 6 : 0;
  w.raid = r.waarde <= 1 && r.fort === 0 && !V.versterkt ? 1 : 0;
  w.uitbreken = V.ingesloten ? 9 : 0;
  w.ontzet = c.ontzet ? 8 : 0;
  w.tegenaanval = A.tegenaanval ? 7 : 0;
  w.linie = r.fort >= 3 ? 10 : 0;
  w.nacht = 1;
  if (r.fort >= 3) { w.doorbraak = 0.5; w.raid = 0; }
  if (c.omstreden > 0) { w.stad *= 1.5; w.houden += 1; }
  return w;
}

function tijdEnWeer(c, type, rng) {
  const g = c.grond || 'normaal';
  let tijd = rng.gewogen([{ k: 'dag', w: 60 }, { k: 'dageraad', w: 16 }, { k: 'schemer', w: 10 }, { k: 'nacht', w: type === 'raid' ? 20 : 4 }]).k;
  if (type === 'nacht') tijd = 'nacht';
  if (type === 'strandlanding') tijd = 'dageraad';
  const weerOpties = g === 'sneeuw' ? [{ k: 'sneeuwval', w: 30 }, { k: 'bewolkt', w: 40 }, { k: 'helder', w: 20 }, { k: 'mist', w: 10 }]
    : g === 'modder' ? [{ k: 'regen', w: 45 }, { k: 'bewolkt', w: 35 }, { k: 'mist', w: 10 }, { k: 'helder', w: 10 }]
      : g === 'droog' ? [{ k: 'helder', w: 70 }, { k: 'stofstorm', w: 12 }, { k: 'bewolkt', w: 18 }]
        : [{ k: 'helder', w: 45 }, { k: 'bewolkt', w: 30 }, { k: 'regen', w: 12 }, { k: 'mist', w: 13 }];
  let weer = rng.gewogen(weerOpties).k;
  if (c.geenLucht && weer === 'helder') weer = 'bewolkt';
  const eff = [];
  const TIJD = { dag: 'Dag', dageraad: 'Dageraad', schemer: 'Schemer', nacht: 'Nacht' };
  const WEER = { helder: 'helder', bewolkt: 'bewolkt', regen: 'regen', mist: 'mist', sneeuwval: 'sneeuwval', stofstorm: 'stofstorm' };
  if (tijd === 'dageraad') eff.push('Dageraad: beurt 1 en 2 gelden als nacht, daarna is het licht.');
  if (tijd === 'schemer') eff.push('Schemer: vanaf beurt 5 geldt nacht.');
  if (tijd === 'nacht' && type !== 'nacht') eff.push('Nacht: het hele gevecht gelden de nachtregels. ' + RULESETS[c.ruleset].nacht);
  if (weer === 'mist') eff.push('Mist: zicht maximaal 16″ / 40 cm tot en met beurt 3. Geen luchtsteun.');
  if (weer === 'regen') eff.push('Regen: geen luchtsteun. Voertuigen buiten de weg bewegen 2″ / 5 cm trager.');
  if (weer === 'sneeuwval') eff.push('Sneeuwval: zicht maximaal 24″ / 60 cm. Geen luchtsteun.');
  if (weer === 'stofstorm') eff.push('Stofstorm: zicht maximaal 16″ / 40 cm in beurt 1 tot 3. Geen luchtsteun.');
  if (g === 'sneeuw') eff.push('Sneeuw: open terrein is moeilijk terrein voor wielvoertuigen; infanterie beweegt 2″ / 5 cm trager.');
  if (g === 'modder') eff.push('Modder: buiten de weg bewegen voertuigen als in moeilijk terrein en lopen ze vast op een 1.');
  if (g === 'droog') eff.push('Droog en stoffig: voertuigen die meer dan de helft van hun beweging doen, verliezen hun verborgen status.');
  const lucht = !(tijd === 'nacht' || weer !== 'helder' && weer !== 'bewolkt' || c.geenLucht);
  return { tijd, weer, tijdNaam: TIJD[tijd], weerNaam: WEER[weer], effecten: eff, luchtKan: lucht, slechtWeer: weer !== 'helder' && weer !== 'bewolkt' };
}

// Voordelen zonder punten: uit versterking, orders, bevoorrading en doctrines van beide kanten.
function voordelen(c, type, tw, rng) {
  const A = c.A, V = c.V, r = c.regio;
  const vA = [], vV = [];
  const zetA = (bron, tekst) => vA.push({ bron, tekst });
  const zetV = (bron, tekst) => vV.push({ bron, tekst });
  const ont = type === 'ontmoeting';
  const winterWeer = c.grond === 'sneeuw' || c.grond === 'modder';

  if (!ont) {
    if (r.fort === 1) zetV('Versterking', 'Ingegraven: infanterie en geschut van de verdediger beginnen ingegraven.');
    if (r.fort === 2) zetV('Versterking', 'Fort: ingegraven, plus één bunker en één strook prikkeldraad.');
    if (r.fort >= 3 && type !== 'linie') zetV('Versterking', (r.linie || 'Linie') + ': ingegraven, twee bunkers, een mijnenveld en prikkeldraad.');
    if (V.versterkt) zetV('Order: versterken', 'Eén extra eenheid uit de vaste reservelijst komt als reserve aan vanaf beurt 2.');
    if (V.verdedigt) zetV('Order: verdedigen', 'De verdediger kiest de tafelkant en krijgt voorbereide posities voor één eenheid.');
    if (V.recon) zetV('Recon', 'De verdediger zag de aanval komen: hij mag na de opstelling van de aanvaller één eenheid verplaatsen.');
    if (A.recon) zetA('Order: recon', 'De aanvaller kent het terrein: de verdediger stelt eerst en volledig op, zonder verborgen eenheden.');
    if (A.steun) zetA('Gezamenlijke aanval', 'Een bondgenoot valt mee aan: één eenheid mag via een flankrand binnenkomen vanaf beurt 2.');
    if (A.voorbereid) { zetA('Set-piece', 'Voorbereide aanval: voorbereidend bombardement en één extra eenheid uit de vaste reservelijst.'); }
    if (A.diepFlank) zetA('Diepe operatie', 'Gekoppelde aanvallen: één eenheid mag via een flankrand binnenkomen vanaf beurt 2.');
    if (V.afgesneden && !V.altijdBevoorraad) zetA('Bevoorrading', 'De verdediger is afgesneden: zijn artillerie vuurt maar om de beurt en hij heeft geen luchtsteun.');
    if (A.afgesneden) zetV('Bevoorrading', 'De aanvaller valt aan vanuit een afgesneden regio: zijn reserves komen een beurt later.');
    if (A.zwak) zetV('Vastgelopen aanval', 'De aanvaller heeft zich hier net stukgelopen: de verdediger mag één eenheid in hinderlaag houden.');
  }
  if (c.omstreden > 0) zetV('Vervolggevecht', 'De verdediger kent het slagveld: hij plaatst één objective 6″ / 15 cm naar keuze.');

  // doctrines aanvaller
  const hA = (d) => (A.doctrines || []).includes(d), hV = (d) => (V.doctrines || []).includes(d);
  if (hA('blitzkrieg') && !ont) {
    if (A.afgesneden) zetV('Blitzkrieg (nadeel)', 'De speerpunt staat droog: de verdediger mag één eenheid in hinderlaag houden.');
    else zetA('Blitzkrieg', 'De aanvaller stelt als tweede op en speelt de eerste beurt.');
  }
  if (hV('blitzkrieg') && V.afgesneden && !ont) zetA('Blitzkrieg (nadeel)', 'De afgesneden verdediger wordt verrast: de aanvaller mag één eenheid in hinderlaag houden.');
  if (hA('auftragstaktik')) zetA('Auftragstaktik', 'Eén eenheid mag zich vóór beurt 1 herpositioneren binnen de opstelzone.');
  if (hV('auftragstaktik')) zetV('Auftragstaktik', 'Eén eenheid mag zich vóór beurt 1 herpositioneren binnen de opstelzone.');
  if (hV('elastisch') && !ont) zetV('Elastische verdediging', 'Tot de helft van het leger mag in reserve blijven en komt via de eigen rand binnen.');
  if (hV('festung') && !ont) {
    if (r.terrein === 'stad' || r.infra.includes('stad')) zetV('Festung', 'Gratis voorbereide posities voor alle infanterie en geschut.');
    zetA('Festung (nadeel)', 'De verdediger mag geen eenheid vrijwillig van tafel halen.');
  }
  if (hA('diepeoperatie') && !ont) zetA('Diepe operatie', 'Tweede golf: één vernietigde eenheid komt één keer terug als reserve via de eigen rand.');
  if (hV('diepeoperatie') && V.vielNetAan && !ont) zetA('Diepe operatie (nadeel)', 'De verdediger viel vorige beurt aan en is niet ingegraven, ook niet door versterking.');
  if (hA('massa')) zetA('Massa en volharding', 'Eén vernietigd peloton komt één keer terug vanaf de eigen tafelrand.');
  if (hV('massa')) zetV('Massa en volharding', 'Eén vernietigd peloton komt één keer terug vanaf de eigen tafelrand.');
  if (hA('partizanen') && A.thuis) zetA('Partizanen', 'Eén vijandelijke reserve komt een beurt later aan.');
  if (hV('partizanen') && V.thuis && !ont) zetV('Partizanen', 'Eén vijandelijke reserve komt een beurt later aan.');
  if (winterWeer) {
    if (hA('winter')) zetA('Generaal Winter', 'Geen weernadelen voor jou; de vijand beweegt door open terrein als door moeilijk terrein.');
    if (hV('winter')) zetV('Generaal Winter', 'Geen weernadelen voor jou; de vijand beweegt door open terrein als door moeilijk terrein.');
  }
  if (r.terrein === 'woestijn') {
    if (hA('woestijnratten')) zetA('Woestijnratten', 'Eén eenheid mag via een flankrand binnenkomen vanaf beurt 2.');
    if (hV('woestijnratten')) zetV('Woestijnratten', 'Eén eenheid mag via een flankrand binnenkomen vanaf beurt 2.');
  }
  if (hA('commandos') && type === 'raid') zetA('Commando\'s', 'Je kiest de tafelrand en stelt verborgen op; de verdediger mag in beurt 1 niet vuren op meer dan 8″ / 20 cm.');
  if (hA('vuurkracht')) zetA('Vuurkracht en logistiek', 'Eén keer per gevecht een extra artillerie- of luchtsteunbeurt.');
  if (hV('vuurkracht')) zetV('Vuurkracht en logistiek', 'Eén keer per gevecht een extra artillerie- of luchtsteunbeurt.');
  if (tw.luchtKan) {
    if (hA('luchtoverwicht')) zetA('Luchtoverwicht', 'Luchtsteun elke beurt, zonder puntenkost.');
    if (hV('luchtoverwicht')) zetV('Luchtoverwicht', 'Luchtsteun elke beurt, zonder puntenkost.');
  }
  if (hA('amfibisch') && type === 'strandlanding') zetA('Amfibische operaties', 'Scheepsgeschut: het voorbereidend bombardement pint op 4+ in plaats van 5+.');
  if (hA('rapido')) zetA('Guerra di rapido corso', 'Je snelle eenheden (verkenning, lichte tanks, gemotoriseerd) doen vóór beurt 1 een volledige beweging.');
  if (hA('cavalerie')) zetA('Cavalerie en snelle troepen', 'Je snelle eenheden (cavalerie, verkenning, lichte tanks) doen vóór beurt 1 een volledige beweging.');
  if (hV('cavalerie') && r.fort === 0 && !ont) zetA('Cavalerie (nadeel)', 'De verdediger is niet ingegraven.');
  if (hV('waterlinie') && r.terrein === 'rivier' && !ont) zetV('Waterlinie', 'Inundaties: voertuigen van de aanvaller bewegen buiten de weg als door moeilijk terrein.');
  const mottiTerrein = ['bos', 'moeras'].includes(r.terrein) || c.grond === 'sneeuw';
  if (hA('motti') && mottiTerrein) zetA('Motti-tactiek', 'Eén eenheid blijft in hinderlaag en mag vanaf beurt 2 via een flankrand binnenkomen.');
  if (hV('motti') && mottiTerrein) zetV('Motti-tactiek', 'Eén eenheid blijft in hinderlaag en mag vanaf beurt 2 via een flankrand binnenkomen.');
  if (hV('rapido') && r.fort === 0 && !ont) zetA('Rapido (nadeel)', 'De verdediger is niet ingegraven.');
  if (hV('bergverdediging') && ['heuvels', 'bergen'].includes(r.terrein) && !ont) zetV('Bergverdediging', 'Voorbereide posities op elke heuvel in de opstelzone.');
  if (hV('methodisch') && !ont) zetV('Methodische strijd', 'Een extra mijnenveld en één voorgeregistreerd artilleriedoel.');
  if (hV('ingraven') && !ont && r.fort === 0 && V.heleBeurt) zetV('Ingraven', 'Infanterie en geschut beginnen ingegraven en verborgen.');
  if (hA('reconinkracht') && !ont) zetA('Recon in kracht', 'Na de opstelling van de verdediger mag je één eigen eenheid verplaatsen.');
  if (c.geenLucht) { zetA('Weer', 'Geen luchtsteun deze beurt.'); zetV('Weer', 'Geen luchtsteun deze beurt.'); }
  return { vA, vV };
}

function genereerScenario(c, seed) {
  const rng = maakRng('scn:' + seed);
  const gew = scenarioGewichten(c);
  let type = c.forceType;
  if (!type) type = rng.gewogen(Object.entries(gew).map(([k, w]) => ({ k, w }))).k;
  const T = SCENARIOTYPES[type];
  const opst = rng.gewogen(T.opst.map(([k, w]) => ({ k, w }))).k;
  const beurten = rng.int(T.beurten[0], T.beurten[1]);
  const tw = tijdEnWeer(c, type, rng);
  const { vA, vV } = voordelen(c, type, tw, rng);
  const m = { A: c.A.naam, V: c.V.naam, R: c.regio.naam, n: beurten, L: c.regio.linie || 'linie' };

  const regels = T.regels.map((k) => REGELTEKST[k]);
  if (type === 'nacht') regels.push(RULESETS[c.ruleset].nacht);
  const fortExtra = { bunkers: 0, mijnen: 0, draad: 0 };
  if (type === 'linie') { fortExtra.bunkers = 3; fortExtra.mijnen = 2; fortExtra.draad = 2; }
  else if (type === 'strandlanding') { fortExtra.bunkers = c.regio.fort >= 3 ? 3 : 2; fortExtra.mijnen = 1; fortExtra.draad = 2; }
  else if (type === 'houden') { fortExtra.mijnen = 1; }
  if (type !== 'linie' && type !== 'ontmoeting' && type !== 'strandlanding') {
    if (c.regio.fort === 2) { fortExtra.bunkers += 1; fortExtra.draad += 1; }
    if (c.regio.fort >= 3) { fortExtra.bunkers += 2; fortExtra.mijnen += 1; fortExtra.draad += 1; }
  }
  if ((c.V.doctrines || []).includes('methodisch') && type !== 'ontmoeting') fortExtra.mijnen += 1;

  // Wie stelt eerst op, wie begint
  let volgorde = 'De verdediger stelt eerst op. De aanvaller speelt de eerste beurt.';
  if (type === 'ontmoeting') volgorde = 'Werp: de winnaar stelt eerst één eenheid op, daarna om de beurt. De winnaar speelt de eerste beurt.';
  if (type === 'uitbreken') volgorde = 'De aanvaller (de ring) stelt eerst op. De verdediger speelt de eerste beurt.';
  if (type === 'achterhoede') volgorde = 'De verdediger stelt alles op. De aanvaller speelt de eerste beurt.';

  let verwijzing = '';
  if (c.omstreden > 0) {
    verwijzing = c.ruine ? `Dit is gevecht ${c.omstreden + 1} om ${c.regio.naam}. De verdediger zit nu in de ruïnes van het vorige gevecht.`
      : `Dit is gevecht ${c.omstreden + 1} om ${c.regio.naam}. Wrakken en kraters van het vorige gevecht liggen er nog: leg 2 extra stukken puin of krater neer.`;
  } else if (c.vorigeTekst) verwijzing = c.vorigeTekst;

  const klein = !!T.klein;
  const rs = RULESETS[c.ruleset];
  return {
    seed, type, naam: T.naam, doel: T.doel, obj: T.obj,
    opstelling: opst, opstellingTekst: OPSTELLINGEN[opst], volgorde,
    tijd: tw.tijd, weer: tw.weer, tijdNaam: tw.tijdNaam, weerNaam: tw.weerNaam, grond: c.grond || 'normaal',
    effecten: tw.effecten, luchtKan: tw.luchtKan,
    regels, voordelenA: vA, voordelenV: vV,
    beurten, winA: vul(T.winA, m), winV: vul(T.winV, m),
    briefingA: vul(T.brA, m), briefingV: vul(T.brV, m), verwijzing,
    analoog: c.ruleset === 'fow' ? T.fow : T.bg, ruleset: c.ruleset,
    punten: klein ? Math.round(c.punten / 2) : c.punten, klein,
    winst: rs.winst, marge: rs.marge, reserve: rs.reserve,
    fortExtra, gewichten: gew,
    ruine: !!c.ruine || c.omstreden > 0,
  };
}

// Kansverdeling voor "recon in kracht" en de recon-order: wat is hier waarschijnlijk?
function scenarioKansen(c) {
  const g = scenarioGewichten(c);
  const tot = Object.values(g).reduce((s, x) => s + x, 0) || 1;
  return Object.entries(g).filter(([, w]) => w > 0).map(([k, w]) => ({ type: k, naam: SCENARIOTYPES[k].naam, kans: w / tot })).sort((a, b) => b.kans - a.kans);
}

const STANDAARD_VOORRAAD = { bos: 4, heuvel: 3, gebouw: 5, kerk: 1, ruine: 3, haag: 8, muur: 4, veld: 4, rotsen: 3, wadi: 1, duin: 2, moeras: 1, krater: 3, bunker: 2, mijnen: 2, draad: 3, rivier: 1, brug: 2, weg: 2 };
const STANDAARD_TAFEL = { b: 72, h: 48, eenheid: 'inch' };

// Gewenste aantallen voor een tafel van 6x4 ft; schaalt mee met het oppervlak.
const TERREINSETS = {
  steppe: { tekst: 'Open steppe, enkele dorpjes en ravijnen (balka\'s).', s: { heuvel: 2, veld: 3, gebouw: 3, wadi: 2, bos: 1, rotsen: 1 }, wegen: 1, dorpen: 1 },
  akkers: { tekst: 'Akkerland met boerderijen, bosjes en hagen.', s: { veld: 4, bos: 2, gebouw: 4, haag: 5, heuvel: 1, muur: 2 }, wegen: 2, dorpen: 1 },
  bocage: { tekst: 'Bocage: hagen, kleine velden en holle wegen.', s: { haag: 12, veld: 4, gebouw: 3, bos: 2, muur: 2 }, wegen: 2, dorpen: 1 },
  woestijn: { tekst: 'Woestijn: wadi\'s, ruggen en verspreide rotsen.', s: { rotsen: 4, wadi: 2, heuvel: 2, duin: 3, gebouw: 1 }, wegen: 1, dorpen: 0 },
  stad: { tekst: 'Stad: straten, ruïnes en pleinen.', s: { gebouw: 9, ruine: 4, kerk: 1, muur: 4, krater: 3 }, wegen: 2, stad: true },
  bos: { tekst: 'Dicht bos met paden en open plekken.', s: { bos: 7, heuvel: 2, gebouw: 1, veld: 1 }, wegen: 1, dorpen: 0 },
  heuvels: { tekst: 'Heuvels, terrassen en dorpjes op de hoogte.', s: { heuvel: 4, bos: 3, gebouw: 3, veld: 2, muur: 3, haag: 2 }, wegen: 1, dorpen: 1 },
  bergen: { tekst: 'Bergland: steile ruggen, rotsen en een enkele pasweg.', s: { heuvel: 5, rotsen: 4, bos: 2, gebouw: 2, muur: 2 }, wegen: 1, dorpen: 1 },
  rivier: { tekst: 'Rivierlandschap: rivier rand tot rand, brug en oevers.', s: { bos: 2, gebouw: 3, veld: 3, heuvel: 1, haag: 3, moeras: 1 }, wegen: 1, dorpen: 1, rivier: true },
  strand: { tekst: 'Kust: zee, strand, duinen en bunkers.', s: { duin: 4, heuvel: 1, gebouw: 2, haag: 3, bos: 1 }, wegen: 1, dorpen: 1 },
  moeras: { tekst: 'Moeras: natte laagtes, bos en een dijkweg.', s: { moeras: 4, bos: 4, gebouw: 1, veld: 1 }, wegen: 1, dorpen: 0 },
};

const DOELWITTEN = ['Brandstofdepot', 'Radiopost', 'Geschutsstelling', 'Munitieopslag', 'Hoofdkwartier', 'Radarpost'];
const klem = (x, a, b) => Math.max(a, Math.min(b, x));

function afstandTotLijn(p, lijn) {
  let d = Infinity;
  for (let i = 0; i < lijn.length - 1; i++) {
    const a = lijn[i], b = lijn[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy || 1;
    const t = klem(((p.x - a.x) * dx + (p.y - a.y) * dy) / l2, 0, 1);
    d = Math.min(d, Math.hypot(p.x - (a.x + dx * t), p.y - (a.y + dy * t)));
  }
  return d;
}
function puntOpLijn(lijn, t) {
  const i = klem(Math.floor(t * (lijn.length - 1)), 0, lijn.length - 2), f = t * (lijn.length - 1) - i;
  const a = lijn[i], b = lijn[i + 1];
  return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, hoek: Math.atan2(b.y - a.y, b.x - a.x) };
}

function maakFrame(opst, B, H) {
  // u: 0 = rand van de aanvaller, 1 = rand van de verdediger. v: dwars, 0..1
  if (opst === 'kort') return { as: 'h', pt: (u, v) => ({ x: B * (1 - u), y: H * v }) };
  if (opst === 'diagonaal' || opst === 'hoeken') {
    return { as: 'd', pt: (u, v) => ({ x: klem(B * (1 - u) + (v - 0.5) * B * 0.6, 4, B - 4), y: klem(H * (1 - u) - (v - 0.5) * H * 0.6, 4, H - 4) }) };
  }
  if (opst === 'midden') return { as: 'h', pt: (u, v) => ({ x: B / 2 + (v - 0.5) * B * 0.3, y: H / 2 + (0.6 - u) * H * 0.5 }) };
  return { as: 'v', pt: (u, v) => ({ x: B * v, y: H * (1 - u) }) };
}

function maakZones(opst, B, H, rng) {
  const d = Math.max(8, Math.round(H / 4)), d2 = Math.max(10, Math.round(B / 5));
  const rechth = (x, y, w, h) => [{ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h }];
  const z = [];
  if (opst === 'kort') {
    z.push({ zijde: 'V', label: 'Verdediger', poly: rechth(0, 0, d2, H) }, { zijde: 'A', label: 'Aanvaller', poly: rechth(B - d2, 0, d2, H) });
  } else if (opst === 'diagonaal') {
    z.push({ zijde: 'V', label: 'Verdediger', poly: [{ x: 0, y: 0 }, { x: B * 0.55, y: 0 }, { x: 0, y: H * 0.72 }] },
      { zijde: 'A', label: 'Aanvaller', poly: [{ x: B, y: H }, { x: B * 0.45, y: H }, { x: B, y: H * 0.28 }] });
  } else if (opst === 'hoeken') {
    z.push({ zijde: 'V', label: 'Verdediger', poly: rechth(0, 0, B / 2 - 6, H / 2 - 3) }, { zijde: 'A', label: 'Aanvaller', poly: rechth(B / 2 + 6, H / 2 + 3, B / 2 - 6, H / 2 - 3) });
  } else if (opst === 'midden') {
    z.push({ zijde: 'V', label: 'Verdediger', poly: rechth(B * 0.3, H * 0.2, B * 0.4, H * 0.6) },
      { zijde: 'A', label: 'Aanvaller', poly: rechth(0, 0, 8, H) }, { zijde: 'A', label: 'Aanvaller', poly: rechth(B - 8, 0, 8, H) });
  } else if (opst === 'strand') {
    z.push({ zijde: 'V', label: 'Verdediger', poly: rechth(0, 0, B, H * 0.45) }, { zijde: 'zee', label: 'Zee', poly: rechth(0, H - 6, B, 6) },
      { zijde: 'A', label: 'Landingsstrook', poly: rechth(0, H - 14, B, 8) });
  } else if (opst === 'verspreid') {
    z.push({ zijde: 'V', label: 'Verdediger', poly: rechth(0, 0, B, d) });
    for (let i = 0; i < 3; i++) {
      const cx = B * (0.2 + 0.3 * i) + rng.tussen(-4, 4), cy = H * rng.tussen(0.5, 0.8), r = 7, poly = [];
      for (let k = 0; k < 20; k++) poly.push({ x: klem(cx + Math.cos(k / 20 * 6.283) * r, 0, B), y: klem(cy + Math.sin(k / 20 * 6.283) * r, 0, H) });
      z.push({ zijde: 'A', label: 'Dropzone ' + (i + 1), poly });
    }
  } else {
    z.push({ zijde: 'V', label: 'Verdediger', poly: rechth(0, 0, B, d) }, { zijde: 'A', label: 'Aanvaller', poly: rechth(0, H - d, B, d) });
  }
  return z;
}

function genereerTafel(opts, seed) {
  const rng = maakRng('tafel:' + seed);
  const eenheid = opts.tafel.eenheid || 'inch';
  const naarInch = eenheid === 'cm' ? 1 / 2.54 : 1;
  const B = opts.tafel.b * naarInch, H = opts.tafel.h * naarInch;
  const scn = opts.scenario || { type: 'doorbraak', obj: 'diep', opstelling: 'lang', fortExtra: {}, grond: 'normaal' };
  const set = TERREINSETS[opts.terrein] || TERREINSETS.akkers;
  const voorraad = Object.assign({}, opts.voorraad || STANDAARD_VOORRAAD);
  const factor = (B * H) / (72 * 48);
  const frame = maakFrame(scn.opstelling, B, H);
  const zones = maakZones(scn.opstelling, B, H, rng);
  const waarschuwingen = [], tekort = [], gebruikt = {};
  const stukken = [], objectives = [], randen = [];
  const neem = (type) => { if ((voorraad[type] || 0) - (gebruikt[type] || 0) > 0) { gebruikt[type] = (gebruikt[type] || 0) + 1; return true; } return false; };
  const over = (type) => (voorraad[type] || 0) - (gebruikt[type] || 0);

  // ── rivier en bruggen ──
  let rivier = null; const bruggen = []; let doorwaad = null;
  const brugScn = scn.obj === 'brug';
  const wilRivier = brugScn || set.rivier || (opts.infraBrug && rng.kans(0.6));
  if (wilRivier) {
    const heeft = (voorraad.rivier || 0) > 0;
    if (heeft || brugScn) {
      if (!heeft) waarschuwingen.push('Geen rivier in je voorraad: markeer hem met blauw lint, vilt of papier.');
      else gebruikt.rivier = 1;
      let langs = frame.as === 'v';
      if (!brugScn && frame.as === 'v' && rng.kans(0.5)) langs = false;
      const basis = langs ? H * (brugScn ? rng.tussen(0.44, 0.56) : rng.tussen(0.4, 0.6)) : B * (brugScn || frame.as !== 'v' ? rng.tussen(0.45, 0.55) : rng.kies([0.28, 0.72]));
      const amp = (langs ? H : B) * 0.06, pts = [];
      let o = 0;
      for (let i = 0; i <= 8; i++) {
        o = klem(o + rng.tussen(-amp, amp) * 0.7, -amp, amp);
        pts.push(langs ? { x: B * i / 8, y: basis + o } : { x: basis + o, y: H * i / 8 });
      }
      rivier = { punten: pts, breedte: 3.5, langs, geimproviseerd: !heeft };
      let nBrug = brugScn && rng.kans(0.35) ? 2 : 1;
      if ((voorraad.brug || 0) < nBrug) {
        if ((voorraad.brug || 0) === 0) { waarschuwingen.push('Geen brug in je voorraad: leg een strook karton over de rivier.'); nBrug = 1; } else nBrug = voorraad.brug;
      }
      const ts = nBrug === 2 ? [0.3, 0.7] : [rng.tussen(0.4, 0.6)];
      for (const t of ts) { const p = puntOpLijn(pts, t); bruggen.push({ x: p.x, y: p.y, hoek: p.hoek, t }); if ((voorraad.brug || 0) > 0) gebruikt.brug = (gebruikt.brug || 0) + 1; }
      if (scn.type !== 'brugopblazen') { const t = rng.kies([0.12, 0.88]); const p = puntOpLijn(pts, t); doorwaad = { x: p.x, y: p.y, hoek: p.hoek }; }
    }
  }

  // ── wegen ──
  const wegen = [];
  const wilWegen = Math.max(set.wegen || 0, scn.obj === 'konvooi' || bruggen.length ? 1 : 0);
  const maakWeg = (lijn) => {
    if ((voorraad.weg || 0) - (gebruikt.weg || 0) > 0) gebruikt.weg = (gebruikt.weg || 0) + 1;
    else if (!waarschuwingen.some((w) => w.startsWith('Te weinig weg'))) waarschuwingen.push('Te weinig weg in je voorraad: markeer de weg met tape of zand.');
    wegen.push(lijn);
  };
  const slinger = (vast, van, tot, horizontaal, ankers) => {
    const pts = []; let o = 0; const amp = 3;
    for (let i = 0; i <= 8; i++) {
      const s = van + (tot - van) * i / 8;
      o = klem(o + rng.tussen(-amp, amp) * 0.6, -amp * 1.5, amp * 1.5);
      let dw = vast + o;
      for (const a of ankers || []) { const d = Math.abs(s - a.s); if (d < 10) dw = a.dw + (dw - a.dw) * (d / 10); }
      pts.push(horizontaal ? { x: s, y: dw } : { x: dw, y: s });
    }
    return pts;
  };
  if (scn.obj === 'konvooi') {
    maakWeg(slinger(H * 0.42, 0, B, true, bruggen.filter(() => rivier && !rivier.langs).map((b) => ({ s: b.x, dw: b.y }))));
  } else if (bruggen.length) {
    for (const b of bruggen) {
      if (rivier.langs) maakWeg(slinger(b.x, 0, H, false, [{ s: b.y, dw: b.x }]));
      else maakWeg(slinger(b.y, 0, B, true, [{ s: b.x, dw: b.y }]));
    }
  } else if (wilWegen >= 1 && ((voorraad.weg || 0) > 0)) {
    if (frame.as === 'h') maakWeg(slinger(H * rng.tussen(0.35, 0.65), 0, B, true));
    else maakWeg(slinger(B * rng.tussen(0.35, 0.65), 0, H, false));
  }
  if (wilWegen >= 2 && wegen.length === 1 && over('weg') > 0 && scn.obj !== 'konvooi') {
    const eersteHor = Math.abs(wegen[0][0].x - wegen[0][8].x) > Math.abs(wegen[0][0].y - wegen[0][8].y);
    const kruistRivier = rivier && (rivier.langs === eersteHor ? false : true);
    if (!kruistRivier) { // tweede weg dwars op de eerste, maar nooit door de rivier zonder brug
      if (eersteHor) { if (!rivier || !rivier.langs) maakWeg(slinger(B * rng.tussen(0.3, 0.7), 0, H, false)); }
      else if (!rivier || rivier.langs === false) maakWeg(slinger(H * rng.tussen(0.3, 0.7), 0, B, true));
    }
  }

  // ── botsingen ──
  const cirkels = (s) => {
    const def = STUKKEN[s.type];
    if (def.vorm === 'lijn' || def.vorm === 'draad') {
      const c = Math.cos(s.rot * Math.PI / 180), si = Math.sin(s.rot * Math.PI / 180), uit = [];
      for (const t of [-0.4, 0, 0.4]) uit.push({ x: s.x + c * s.b * t, y: s.y + si * s.b * t, r: 0.9 });
      return uit;
    }
    return [{ x: s.x, y: s.y, r: Math.max(s.b, s.h) / 2 * 0.88 }];
  };
  const vrij = (s, marge, opties = {}) => {
    const cs = cirkels(s);
    for (const c of cs) {
      if (c.x - c.r < 0.5 || c.y - c.r < 0.5 || c.x + c.r > B - 0.5 || c.y + c.r > H - 0.5) return false;
      if (rivier && afstandTotLijn(c, rivier.punten) < c.r + rivier.breedte / 2 + 0.5) return false;
      if (!opties.opWeg) for (const w of wegen) if (afstandTotLijn(c, w) < c.r * 0.8 + 1.3) return false;
      if (scn.opstelling === 'strand' && c.y + c.r > H - 15 && !opties.strand) return false;
      for (const o of objectives) if (!opties.opDoel && Math.hypot(c.x - o.x, c.y - o.y) < c.r + 2) return false;
      for (const p of stukken) {
        const mg = (STUKKEN[p.type].vorm === 'lijn' || STUKKEN[s.type].vorm === 'lijn') ? Math.min(marge, 0.6) : marge;
        for (const pc of p._c) if (Math.hypot(c.x - pc.x, c.y - pc.y) < c.r + pc.r + mg) return false;
      }
    }
    return true;
  };
  const zet = (type, x, y, rot, opties) => {
    const def = STUKKEN[type];
    const s = { type, x, y, b: def.b, h: def.h, rot: rot || 0, z: rng.int(1, 99999) };
    if (!vrij(s, opties && opties.marge !== undefined ? opties.marge : 2, opties)) return null;
    s._c = cirkels(s); stukken.push(s); return s;
  };
  const probeer = (type, n, kiesPlek, opties) => {
    let gezet = 0;
    for (let i = 0; i < n; i++) {
      if (over(type) <= 0) break;
      for (let k = 0; k < 50; k++) {
        const p = kiesPlek(i, k);
        if (zet(type, p.x, p.y, p.rot, opties)) { gebruikt[type] = (gebruikt[type] || 0) + 1; gezet++; break; }
      }
    }
    return gezet;
  };
  const willekeurig = (type) => () => {
    const def = STUKKEN[type], r = Math.max(def.b, def.h) / 2 + 1;
    return { x: rng.tussen(r, B - r), y: rng.tussen(r, H - r), rot: rng.int(0, 179) };
  };

  // ── objectives (die niet van terrein afhangen) ──
  const doel = (p, label, zijde) => objectives.push({ x: klem(p.x, 3, B - 3), y: klem(p.y, 3, H - 3), label, zijde: zijde || '' });
  const P = frame.pt;
  switch (scn.obj) {
    case 'diep': doel(P(0.86, 0.3), 'Objective 1'); doel(P(0.86, 0.7), 'Objective 2'); break;
    case 'houden': doel(P(0.7, 0.3), 'Objective 1'); doel(P(0.7, 0.7), 'Objective 2'); break;
    case 'snel': doel(P(0.74, 0.3), 'Objective 1'); doel(P(0.74, 0.7), 'Objective 2'); break;
    case 'brug':
      if (bruggen.length) bruggen.forEach((b, i) => doel(b, bruggen.length > 1 ? 'Brug ' + (i + 1) : 'De brug'));
      else doel(P(0.5, 0.5), 'Kruispunt');
      break;
    case 'centraal':
      doel(P(0.3, 0.3), 'Objective', 'A'); doel(P(0.3, 0.7), 'Objective', 'A'); doel(P(0.7, 0.3), 'Objective', 'V'); doel(P(0.7, 0.7), 'Objective', 'V'); break;
    case 'doelwitten': { const n = rng.schud(DOELWITTEN); doel(P(0.8, 0.25), n[0]); doel(P(0.86, 0.55), n[1]); doel(P(0.76, 0.8), n[2]); break; }
    case 'uitgangen': [0.2, 0.5, 0.8].forEach((v, i) => doel({ x: B * v, y: H * 0.5 }, 'Uitgang ' + (i + 1))); break;
    case 'verzamel': doel(P(0.55, 0.2), 'Objective 1'); doel(P(0.72, 0.55), 'Objective 2'); doel(P(0.5, 0.82), 'Objective 3'); break;
    case 'corridor': doel(P(0.95, 0.5), 'Ontzet: ingesloten troepen'); doel(P(0.55, 0.5), 'Kruispunt'); break;
    case 'bunkers': doel(P(0.87, 0.35), 'Objective 1'); doel(P(0.87, 0.65), 'Objective 2'); break;
    case 'konvooi': if (wegen[0]) { doel(wegen[0][0], 'Ingang konvooi'); doel(wegen[0][8], 'Uitgang konvooi'); } break;
    case 'rand_v':
      if (frame.as === 'h') randen.push({ a: { x: 0, y: H * 0.1 }, b: { x: 0, y: H * 0.9 }, label: 'Aftochtrand verdediger' });
      else randen.push({ a: { x: B * 0.1, y: 0 }, b: { x: B * 0.9, y: 0 }, label: 'Aftochtrand verdediger' });
      break;
    case 'uitbraak':
      if (scn.opstelling === 'midden') randen.push({ a: { x: B, y: H * 0.2 }, b: { x: B, y: H * 0.8 }, label: 'Uitbraakrand' });
      else randen.push({ a: { x: B * 0.2, y: H }, b: { x: B * 0.8, y: H }, label: 'Uitbraakrand' });
      break;
    default: break;
  }

  // ── versterkingen uit het scenario ──
  const fx = scn.fortExtra || {};
  const linieU = scn.opstelling === 'strand' ? null : 0.62;
  const fortPlek = (i, n, uExtra) => {
    if (scn.opstelling === 'strand') return { x: B * (i + 0.5) / n + rng.tussen(-3, 3), y: H * 0.5 + uExtra * 18 + rng.tussen(-1, 1), rot: 0 };
    const p = P(linieU + uExtra, (i + 0.5) / n + rng.tussen(-0.05, 0.05));
    return { x: p.x, y: p.y, rot: frame.as === 'h' ? 90 : 0 };
  };
  const zetFort = (type, n, uExtra) => {
    if (!n) return;
    const kan = Math.min(n, over(type));
    if (kan < n) tekort.push({ type, gewenst: n, heeft: voorraad[type] || 0, scenario: true });
    probeer(type, kan, (i, k) => { const p = fortPlek(i, n, uExtra); return { x: p.x + (k ? rng.tussen(-4, 4) : 0), y: p.y + (k ? rng.tussen(-2, 2) : 0), rot: p.rot }; }, { marge: 0.5, strand: true, opWeg: type !== 'bunker' });
  };
  zetFort('bunker', fx.bunkers || 0, 0.02);
  zetFort('mijnen', fx.mijnen || 0, scn.opstelling === 'strand' ? 0.22 : -0.12);
  zetFort('draad', fx.draad || 0, scn.opstelling === 'strand' ? 0.13 : -0.07);

  // ── terreinset ──
  const gewenst = {};
  for (const [t, n] of Object.entries(set.s)) gewenst[t] = Math.max(n > 0 && factor > 0.35 ? 1 : 0, Math.round(n * factor));
  if (scn.ruine && gewenst.gebouw) { const om = Math.min(Math.ceil(gewenst.gebouw / 2), voorraad.ruine || 0); gewenst.ruine = (gewenst.ruine || 0) + om; gewenst.gebouw -= om; gewenst.krater = (gewenst.krater || 0) + 2; }
  if (scn.opstelling === 'strand') gewenst.duin = Math.max(gewenst.duin || 0, Math.round(3 * factor));
  for (const [t, n] of Object.entries(gewenst)) if ((voorraad[t] || 0) < n) tekort.push({ type: t, gewenst: n, heeft: voorraad[t] || 0 });

  // duinen op de duinenrij
  if (scn.opstelling === 'strand' && gewenst.duin) {
    probeer('duin', gewenst.duin, (i) => ({ x: B * (i + 0.5) / gewenst.duin + rng.tussen(-5, 5), y: H * 0.58 + rng.tussen(-2, 2), rot: rng.int(-15, 15) }), { strand: true, marge: 1 });
    gewenst.duin = 0;
  }
  // gebouwen: stad = blokkenraster, anders dorpen bij de weg
  const bouw = ['kerk', 'gebouw', 'ruine'];
  if (set.stad) {
    const cellen = [];
    for (let x = 7; x < B - 5; x += 7.5) for (let y = 6; y < H - 4; y += 7) cellen.push({ x: x + rng.tussen(-0.7, 0.7), y: y + rng.tussen(-0.7, 0.7) });
    const midden = rng.schud(cellen).sort((a, b) => Math.hypot(a.x - B / 2, a.y - H / 2) * rng.tussen(0.6, 1.4) - Math.hypot(b.x - B / 2, b.y - H / 2) * rng.tussen(0.6, 1.4));
    let ci = 0;
    for (const t of bouw) {
      probeer(t, gewenst[t] || 0, () => { const c = midden[ci++ % midden.length]; return { x: c.x, y: c.y, rot: rng.kies([0, 90]) }; }, { marge: 1.2 });
    }
  } else {
    const nDorp = Math.max(1, set.dorpen || 1), centra = [];
    for (let i = 0; i < nDorp; i++) {
      if (wegen.length) { const p = puntOpLijn(rng.kies(wegen), rng.tussen(0.25, 0.75)); centra.push(p); }
      else centra.push({ x: rng.tussen(B * 0.2, B * 0.8), y: rng.tussen(H * 0.25, H * 0.75) });
    }
    for (const t of bouw) {
      probeer(t, gewenst[t] || 0, (i, k) => { const c = centra[i % centra.length], r = 4 + k * 0.25; return { x: c.x + rng.tussen(-r, r), y: c.y + rng.tussen(-r, r), rot: rng.kies([0, 90]) + rng.int(-12, 12) }; }, { marge: 1 });
    }
  }
  // grote vlakken
  for (const t of ['heuvel', 'bos', 'moeras', 'veld', 'wadi', 'duin']) probeer(t, gewenst[t] || 0, willekeurig(t));
  // hagen: bocage = omheiningen op een raster, anders langs velden
  if (gewenst.haag) {
    if (opts.terrein === 'bocage') {
      const kand = [];
      for (let x = 6; x < B; x += 12) for (let y = 6; y < H; y += 12) {
        kand.push({ x: x + 3, y, rot: 0 }, { x: x + 9, y, rot: 0 }, { x, y: y + 3, rot: 90 }, { x, y: y + 9, rot: 90 });
      }
      const lijst = rng.schud(kand); let ki = 0;
      probeer('haag', gewenst.haag, () => { const c = lijst[ki++ % lijst.length]; return { x: c.x + rng.tussen(-1, 1), y: c.y + rng.tussen(-1, 1), rot: c.rot + rng.int(-6, 6) }; }, { marge: 0.4 });
    } else {
      const velden = stukken.filter((s) => s.type === 'veld');
      probeer('haag', gewenst.haag, (i, k) => {
        if (velden.length && k < 25) {
          const v = velden[(i + k) % velden.length], zij = rng.int(0, 3), a = (v.rot + zij * 90) * Math.PI / 180, afst = (zij % 2 ? v.b : v.h) / 2 + 0.9;
          return { x: v.x + Math.cos(a + Math.PI / 2) * afst, y: v.y + Math.sin(a + Math.PI / 2) * afst, rot: v.rot + zij * 90 };
        }
        return willekeurig('haag')();
      }, { marge: 0.3 });
    }
  }
  // muren bij gebouwen
  if (gewenst.muur) {
    const huizen = stukken.filter((s) => bouw.includes(s.type));
    probeer('muur', gewenst.muur, (i, k) => {
      if (huizen.length && k < 30) { const g = rng.kies(huizen), a = rng.kies([0, 90, 180, 270]) * Math.PI / 180; return { x: g.x + Math.cos(a) * (g.b / 2 + 2.2), y: g.y + Math.sin(a) * (g.h / 2 + 2.2), rot: (a * 180 / Math.PI + 90) % 180 }; }
      return willekeurig('muur')();
    }, { marge: 0.3 });
  }
  for (const t of ['rotsen', 'krater']) probeer(t, gewenst[t] || 0, willekeurig(t), { marge: 1 });

  // ── sectoren: objectives op gebouwen ──
  if (scn.obj === 'sectoren') {
    const huizen = stukken.filter((s) => bouw.includes(s.type)).sort((a, b) => Math.hypot(a.x - B / 2, a.y - H / 2) - Math.hypot(b.x - B / 2, b.y - H / 2));
    const gekozen = [];
    for (const g of huizen) { if (gekozen.length >= 5) break; if (gekozen.every((o) => Math.hypot(o.x - g.x, o.y - g.y) > 9)) gekozen.push(g); }
    gekozen.forEach((g, i) => objectives.push({ x: g.x, y: g.y, label: 'Sector ' + (i + 1), zijde: '' }));
    for (let i = gekozen.length; i < 3; i++) doel(P(0.35 + 0.15 * i, 0.25 + 0.25 * i), 'Sector ' + (i + 1));
    if (gekozen.length < 3) waarschuwingen.push('Te weinig gebouwen voor een stadsgevecht: markeer de ontbrekende sectoren als straatblok met karton.');
  }

  // ── schietbanen: geen open strook van rand tot rand ──
  const DREMPEL = 10;
  const raster = () => {
    const W = Math.ceil(B), HH = Math.ceil(H), g = new Uint8Array(W * HH);
    for (const s of stukken) {
      const def = STUKKEN[s.type]; if (!def.blok) continue;
      const c = Math.cos(-s.rot * Math.PI / 180), si = Math.sin(-s.rot * Math.PI / 180), hb = s.b / 2, hh = Math.max(s.h / 2, 0.6), R = Math.ceil(Math.max(hb, hh)) + 1;
      for (let x = Math.max(0, Math.floor(s.x - R)); x < Math.min(W, s.x + R); x++) for (let y = Math.max(0, Math.floor(s.y - R)); y < Math.min(HH, s.y + R); y++) {
        const dx = x + 0.5 - s.x, dy = y + 0.5 - s.y, lx = dx * c - dy * si, ly = dx * si + dy * c;
        const binnen = def.vorm === 'vlek' ? (lx * lx) / (hb * hb) + (ly * ly) / (hh * hh) <= 1 : Math.abs(lx) <= hb && Math.abs(ly) <= hh;
        if (binnen) g[y * W + x] = 1;
      }
    }
    return { g, W, HH };
  };
  const openBanen = () => {
    const { g, W, HH } = raster(), banen = [];
    const scan = (n, m, cel, richting) => {
      let start = -1;
      for (let i = 0; i <= n; i++) {
        let open = i < n;
        if (open) for (let j = 0; j < m; j++) if (cel(i, j)) { open = false; break; }
        if (open && start < 0) start = i;
        if (!open && start >= 0) { if (i - start >= DREMPEL) banen.push({ richting, van: start, tot: i }); start = -1; }
      }
    };
    if (frame.as !== 'h') scan(W, HH, (x, y) => g[y * W + x], 'v');
    if (frame.as !== 'v') scan(HH, W, (y, x) => g[y * W + x], 'h');
    return banen;
  };
  let banen = openBanen();
  for (let ronde = 0; ronde < 12 && banen.length; ronde++) {
    const baan = banen[0], mid = (baan.van + baan.tot) / 2;
    const type = ['bos', 'heuvel', 'rotsen', 'ruine', 'gebouw', 'duin', 'haag'].find((t) => over(t) > 0);
    if (!type) break;
    let ok = false;
    for (let k = 0; k < 40 && !ok; k++) {
      const langs = rng.tussen(0.22, 0.78), dw = mid + rng.tussen(-2, 2);
      const p = baan.richting === 'v' ? { x: dw, y: H * langs } : { x: B * langs, y: dw };
      if (zet(type, p.x, p.y, baan.richting === 'v' ? rng.int(-20, 20) : 90 + rng.int(-20, 20), { marge: 1 })) { gebruikt[type] = (gebruikt[type] || 0) + 1; ok = true; }
    }
    if (!ok) break;
    banen = openBanen();
  }
  if (banen.length) waarschuwingen.push(`${banen.length} open schietba${banen.length > 1 ? 'nen' : 'an'} van rand tot rand: je voorraad is op. Leg er zelf iets in, of speel het als open terrein.`);

  for (const s of stukken) delete s._c;
  return { seed, eenheid, B, H, terrein: opts.terrein, setTekst: set.tekst, grond: scn.grond || 'normaal', opstelling: scn.opstelling, stukken, rivier, bruggen, doorwaad, wegen, objectives, zones, randen, waarschuwingen, tekort, gebruikt };
}

// ───────────────────────── SVG ─────────────────────────
const GROND = { normaal: '#d5dcae', sneeuw: '#eef1f2', modder: '#bfae8b', droog: '#e6d3a1' };
const TERREINGROND = { woestijn: '#e6d3a1', stad: '#cfcbc2', strand: '#d9d9a8', moeras: '#c3cfa6', bergen: '#cfc7a8' };
const f1 = (n) => Math.round(n * 10) / 10;

function vlekPad(s, S) {
  const rng = maakRng(s.z), n = 10, pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, r = rng.tussen(0.78, 1.05); pts.push({ x: Math.cos(a) * s.b / 2 * r * S, y: Math.sin(a) * s.h / 2 * r * S }); }
  let d = '';
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n], mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    d += i === 0 ? `M${f1(mx)} ${f1(my)}` : `Q${f1(p.x)} ${f1(p.y)} ${f1(mx)} ${f1(my)}`;
  }
  const p0 = pts[0], q0 = pts[1];
  return d + `Q${f1(p0.x)} ${f1(p0.y)} ${f1((p0.x + q0.x) / 2)} ${f1((p0.y + q0.y) / 2)}Z`;
}

function tekenStuk(s, S) {
  const def = STUKKEN[s.type], w = s.b * S, h = s.h * S;
  const t = `transform="translate(${f1(s.x * S)} ${f1(s.y * S)}) rotate(${s.rot})"`;
  const st = `fill="${def.kleur}" stroke="${def.rand}" stroke-width="1.2"`;
  switch (def.vorm) {
    case 'vlek': {
      let extra = '';
      if (s.type === 'bos') { const r = maakRng(s.z + 7); for (let i = 0; i < 6; i++) extra += `<circle cx="${f1(r.tussen(-w / 3, w / 3))}" cy="${f1(r.tussen(-h / 3, h / 3))}" r="${f1(S * 0.9)}" fill="#4f7d40" stroke="none"/>`; }
      if (s.type === 'heuvel' || s.type === 'duin') extra = `<path d="${vlekPad({ z: s.z, b: s.b * 0.55, h: s.h * 0.55 }, S)}" fill="none" stroke="${def.rand}" stroke-width="0.8" opacity="0.7"/>`;
      if (s.type === 'moeras') extra = `<path d="M${-w / 4} 0h${w / 6}M0 ${h / 6}h${w / 6}M${-w / 8} ${-h / 5}h${w / 6}" stroke="#3f7397" stroke-width="1.4" fill="none"/>`;
      return `<g ${t}><path d="${vlekPad(s, S)}" ${st}/>${extra}</g>`;
    }
    case 'recht': return `<g ${t}><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" ${st}/><path d="M${-w / 2} 0H${w / 2}" stroke="${def.rand}" stroke-width="0.9"/></g>`;
    case 'ruine': return `<g ${t}><path d="M${-w / 2} ${-h / 2}H${w / 5}M${w / 2} ${-h / 5}V${h / 2}H${-w / 4}M${-w / 2} ${h / 2}V${-h / 2}" fill="none" stroke="${def.rand}" stroke-width="2.4"/><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="${def.kleur}" opacity="0.55"/></g>`;
    case 'veld': return `<g ${t}><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" ${st} stroke-dasharray="3 2"/>${[-0.25, 0, 0.25].map((k) => `<path d="M${-w / 2 + 3} ${h * k}H${w / 2 - 3}" stroke="${def.rand}" stroke-width="0.6" opacity="0.6"/>`).join('')}</g>`;
    case 'lijn': return `<g ${t}><path d="M${-w / 2} 0H${w / 2}" stroke="${def.kleur}" stroke-width="${Math.max(3, h)}" stroke-linecap="round"/></g>`;
    case 'draad': { let d = `M${-w / 2} 0`; for (let i = 1; i <= 16; i++) d += `L${f1(-w / 2 + w * i / 16)} ${i % 2 ? -3 : 3}`; return `<g ${t}><path d="${d}" fill="none" stroke="${def.kleur}" stroke-width="1.2"/></g>`; }
    case 'mijnen': return `<g ${t}><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="${def.kleur}" fill-opacity="0.45" stroke="${def.rand}" stroke-width="1.2" stroke-dasharray="4 2"/><text y="4" text-anchor="middle" font-size="10" font-weight="700" fill="${def.rand}">MIJNEN</text></g>`;
    case 'bunker': { const r = w / 2; let p = ''; for (let i = 0; i < 6; i++) p += `${f1(Math.cos(i / 6 * 6.283) * r)},${f1(Math.sin(i / 6 * 6.283) * r)} `; return `<g ${t}><polygon points="${p}" ${st} stroke-width="2"/><rect x="${-r / 3}" y="${-r / 6}" width="${r / 1.5}" height="${r / 3}" fill="${def.rand}"/></g>`; }
    default: return '';
  }
}

function staal(type) {
  const def = STUKKEN[type];
  if (def.vorm === 'lijn' || def.vorm === 'draad') return `<path d="M0 7H22" stroke="${def.kleur}" stroke-width="${type === 'draad' ? 1.5 : 4}" stroke-linecap="round" ${type === 'draad' ? 'stroke-dasharray="2 2"' : ''}/>`;
  return `<rect x="1" y="1" width="20" height="12" rx="${def.vorm === 'vlek' ? 6 : 1}" fill="${def.kleur}" stroke="${def.rand}" stroke-width="1"/>`;
}

function tafelSvg(m, opties = {}) {
  const S = 10, mg = 30, W = m.B * S, H = m.H * S;
  const cm = m.eenheid === 'cm';
  const maat = (inch) => (cm ? Math.round(inch * 2.54) + ' cm' : Math.round(inch) + '″');
  const grond = m.grond !== 'normaal' ? GROND[m.grond] : (TERREINGROND[m.terrein] || GROND.normaal);
  const pad = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + f1(p.x * S) + ' ' + f1(p.y * S)).join('');
  let o = '';
  // raster
  const stap = cm ? 30 / 2.54 : 12;
  let ras = '';
  for (let x = stap; x < m.B - 0.1; x += stap) ras += `<path d="M${f1(x * S)} 0V${H}"/>`;
  for (let y = stap; y < m.H - 0.1; y += stap) ras += `<path d="M0 ${f1(y * S)}H${W}"/>`;
  o += `<rect width="${W}" height="${H}" fill="${grond}"/><g stroke="#000" stroke-opacity="0.13" stroke-width="1" stroke-dasharray="2 4">${ras}</g>`;
  // zones
  const ZK = { A: '#b3402e', V: '#2f5d9b', zee: '#4f8fb8' };
  for (const z of m.zones) {
    const d = pad(z.poly) + 'Z';
    if (z.zijde === 'zee') { o += `<path d="${d}" fill="#7fb0d0"/>`; continue; }
    o += `<path d="${d}" fill="${ZK[z.zijde]}" fill-opacity="0.13" stroke="${ZK[z.zijde]}" stroke-width="2" stroke-dasharray="8 5"/>`;
  }
  // wegen, rivier
  for (const w of m.wegen) o += `<path d="${pad(w)}" fill="none" stroke="#9a8a66" stroke-width="${2.6 * S}" stroke-linejoin="round"/><path d="${pad(w)}" fill="none" stroke="#d9c9a3" stroke-width="${2.2 * S}" stroke-linejoin="round"/>`;
  if (m.rivier) {
    const d = pad(m.rivier.punten);
    o += `<path d="${d}" fill="none" stroke="#3f7397" stroke-width="${(m.rivier.breedte + 0.4) * S}" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#7fb0d0" stroke-width="${m.rivier.breedte * S}" stroke-linejoin="round"/>`;
    if (m.doorwaad) o += `<g transform="translate(${f1(m.doorwaad.x * S)} ${f1(m.doorwaad.y * S)}) rotate(${f1(m.doorwaad.hoek * 180 / Math.PI + 90)})"><rect x="${-2.6 * S}" y="${-1.2 * S}" width="${5.2 * S}" height="${2.4 * S}" fill="#b9d3e2" stroke="#3f7397" stroke-dasharray="3 3"/></g>`;
    for (const b of m.bruggen) o += `<g transform="translate(${f1(b.x * S)} ${f1(b.y * S)}) rotate(${f1(b.hoek * 180 / Math.PI + 90)})"><rect x="${-3 * S}" y="${-1.3 * S}" width="${6 * S}" height="${2.6 * S}" fill="#8a6a45" stroke="#4a3520" stroke-width="2"/><path d="M${-3 * S} ${-0.5 * S}H${3 * S}M${-3 * S} ${0.5 * S}H${3 * S}" stroke="#4a3520" stroke-width="1"/></g>`;
  }
  // stukken: vlakken eerst, dan lijnen en gebouwen
  const volg = (s) => ({ veld: 0, moeras: 0, wadi: 0, heuvel: 1, duin: 1, bos: 2, krater: 2, rotsen: 2 }[s.type] ?? 3);
  for (const s of m.stukken.slice().sort((a, b) => volg(a) - volg(b))) o += tekenStuk(s, S);
  // randen
  for (const r of m.randen) {
    const mx = (r.a.x + r.b.x) / 2 * S, my = (r.a.y + r.b.y) / 2 * S, vert = Math.abs(r.a.x - r.b.x) < 0.1;
    o += `<path d="${pad([r.a, r.b])}" stroke="#1d7a4a" stroke-width="9" stroke-linecap="round"/>`;
    o += `<text x="${f1(klem(mx, 60, W - 60))}" y="${f1(vert ? my : klem(my + (my < H / 2 ? 22 : -12), 16, H - 8))}" text-anchor="${vert ? (mx > W / 2 ? 'end' : 'start') : 'middle'}" ${vert ? `dx="${mx > W / 2 ? -12 : 12}"` : ''} font-size="15" font-weight="700" fill="#14573a" stroke="#fff" stroke-width="3" paint-order="stroke">${r.label}</text>`;
  }
  // zonelabels
  for (const z of m.zones) {
    if (z.zijde === 'zee') continue;
    const cx = z.poly.reduce((s, p) => s + p.x, 0) / z.poly.length * S, cy = z.poly.reduce((s, p) => s + p.y, 0) / z.poly.length * S;
    o += `<text x="${f1(cx)}" y="${f1(cy + 5)}" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1" fill="${ZK[z.zijde]}" stroke="#fff" stroke-opacity="0.8" stroke-width="3.5" paint-order="stroke">${z.label.toUpperCase()}</text>`;
  }
  // objectives
  m.objectives.forEach((ob, i) => {
    const x = ob.x * S, y = ob.y * S, links = x > W - 150;
    o += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${2 * S}" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="3 3"/><circle cx="${f1(x)}" cy="${f1(y)}" r="9" fill="#f2c230" stroke="#111" stroke-width="2"/><text x="${f1(x)}" y="${f1(y + 4)}" text-anchor="middle" font-size="11" font-weight="700" fill="#111">${i + 1}</text>`;
    o += `<text x="${f1(x + (links ? -14 : 14))}" y="${f1(y - 12)}" text-anchor="${links ? 'end' : 'start'}" font-size="13" font-weight="700" fill="#111" stroke="#fff" stroke-width="3" paint-order="stroke">${ob.label}${ob.zijde ? ' (helft ' + ob.zijde + ')' : ''}</text>`;
  });
  // kader en maten
  let maten = `<rect width="${W}" height="${H}" fill="none" stroke="#111" stroke-width="2.5"/>`;
  for (let x = 0; x <= m.B + 0.01; x += stap) maten += `<path d="M${f1(x * S)} ${H}v6" stroke="#111"/><text x="${f1(x * S)}" y="${H + 18}" text-anchor="middle" font-size="11" fill="#333">${maat(x)}</text>`;
  for (let y = 0; y <= m.H + 0.01; y += stap) maten += `<path d="M0 ${f1(y * S)}h-6" stroke="#111"/><text x="-9" y="${f1(y * S + 4)}" text-anchor="end" font-size="11" fill="#333">${cm ? Math.round(y * 2.54) : Math.round(y)}</text>`;
  // legenda
  const items = Object.entries(m.gebruikt).filter(([, n]) => n > 0);
  const kol = Math.max(1, Math.floor(W / 170)), rijen = Math.ceil((items.length + 3) / kol);
  let leg = '';
  const alle = items.map(([t, n]) => ({ sw: STUKKEN[t].speciaal ? `<rect x="1" y="3" width="20" height="8" fill="${STUKKEN[t].kleur}" stroke="${STUKKEN[t].rand}"/>` : staal(t), tekst: `${n}× ${STUKKEN[t].naam}` }));
  alle.push({ sw: '<circle cx="11" cy="7" r="6" fill="#f2c230" stroke="#111" stroke-width="1.5"/>', tekst: 'Objective' },
    { sw: '<rect x="1" y="1" width="20" height="12" fill="#b3402e" fill-opacity="0.2" stroke="#b3402e" stroke-dasharray="3 2"/>', tekst: 'Zone aanvaller' },
    { sw: '<rect x="1" y="1" width="20" height="12" fill="#2f5d9b" fill-opacity="0.2" stroke="#2f5d9b" stroke-dasharray="3 2"/>', tekst: 'Zone verdediger' });
  alle.forEach((it, i) => { leg += `<g transform="translate(${(i % kol) * 170} ${Math.floor(i / kol) * 20})">${it.sw}<text x="28" y="11" font-size="12" fill="#222">${it.tekst}</text></g>`; });
  const legH = rijen * 20 + 8;
  const totW = W + mg * 2, totH = H + mg + 26 + legH + 10;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totW} ${totH}" width="${opties.breedte || '100%'}" font-family="system-ui, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Tafelmap"><rect width="${totW}" height="${totH}" fill="#fbfaf5"/><g transform="translate(${mg + 6} ${14})"><defs><clipPath id="tk${m.seed}"><rect width="${W}" height="${H}"/></clipPath></defs><g clip-path="url(#tk${m.seed})">${o}</g>${maten}<g transform="translate(0 ${H + 34})">${leg}</g></g></svg>`;
}

// ── engine.js ──
// Campagne-engine: kaartstaat, orders, conflicten, bevoorrading, uitslagen, AI en winst.
// Alles is een pure bewerking op één state-object, zodat opslaan = JSON en testen = node.







// ───────── kaart ─────────
const kaartCache = {};
function kaartInfo(kaartId, subset) {
  const sleutel = kaartId + '|' + (subset ? subset.join(',') : '');
  if (kaartCache[sleutel]) return kaartCache[sleutel];
  const k = KAARTEN[kaartId];
  const regios = subset ? k.regios.filter((r) => subset.includes(r.id)) : k.regios;
  const opId = Object.fromEntries(regios.map((r) => [r.id, r]));
  let buren, cellen = null, bbox, links;
  if (k.geo) {

// ───────── bevoorrading ─────────
function altijdBevoorraad(state, regioId) {

}

        if (gezien.has(r.id) || !eigen(r.id) || !r.infra.includes('kust')) continue;
        if (havens.some((h) => afstandPt(info.opId[h], r) <= info.zeeBereik)) { gezien.add(r.id); rij.push(r.id); nieuw = true; }
      }
    }
    for (const id of gezien) bereikt.add(id);

    if (!factie(state, rs.eigenaar)) { rs.bev = true; rs.ingesloten = false; rs.verbonden = true; continue; }

// ───────── orders ─────────
const ORDERTYPES = {

  luchtlanding: { naam: 'Luchtlanding', tekst: 'Parachutisten landen in een vijandelijke regio.', aanval: true },
  raid: { naam: 'Raid', tekst: 'Klein gevecht op een kustregio: sloopt versterking en verstoort de bevoorrading.' },
  versterk: { naam: 'Versterken', tekst: 'De regio krijgt een extra reserve in het volgende gevecht daar.' },
  verdedig: { naam: 'Verdedigen', tekst: 'Je kiest deze beurt de tafelkant en krijgt voorbereide posities.' },

function effectieveFort(state, regioId) {

function eigenHavens(state, fid) {

    }

  }
  if (bestaande.some((x) => x.type === o.type && x.naar === o.naar)) return 'Die order heb je al gegeven.';
  if (ORDERTYPES[o.type].aanval && bestaande.some((x) => ORDERTYPES[x.type].aanval && x.naar === o.naar)) return 'Je valt die regio al aan.';

    if (!factie(state, rs.eigenaar)) continue;
    if (rs.verbonden) { rs.afgesnedenSinds = 0; continue; }
    if (!rs.afgesnedenSinds) rs.afgesnedenSinds = b;
    if (b - rs.afgesnedenSinds + 1 >= state.capitulatieNa && rs.luchtbrug < b) {
      const z = zijdeVan(state, rs.eigenaar), telling2 = {};
      for (const n of info.buren[r.id]) { const e = state.regios[n].eigenaar; if (factie(state, e) && zijdeVan(state, e) !== z) telling2[e] = (telling2[e] || 0) + 1; }
      const naar = Object.keys(telling2).sort((x, y) => telling2[y] - telling2[x])[0];
      if (naar) { const oud = factie(state, rs.eigenaar); wisselEigenaar(state, r.id, naar); oud.verloor = b; logRegel(state, 'kaart', `${r.naam} is ${state.capitulatieNa} beurten afgesneden en capituleert voor ${factie(state, naar).naam}.`); }
    }
  }
  for (const f of state.facties) {
    f.extraOrders = 0;
    f.herkans = f.herkans.filter((h) => h.beurt > b);
    if (f.tegenaanval && f.tegenaanval.beurt <= b) f.tegenaanval = null;
    for (const k of Object.keys(f.voorbereid)) if (f.voorbereid[k] < b) delete f.voorbereid[k];
    if (!f.verslagen && !f.later && regiosVan(state, f.id).length === 0) { f.verslagen = true; logRegel(state, 'event', `${f.naam} is verslagen.`); }
    if (f.later && regiosVan(state, f.id).length > 0) f.later = false;
    if (f.slots < 2 && b >= 5 && f.speler === 'mens') { f.slots = 2; logRegel(state, 'event', `${f.naam} mag na vijf beurten een tweede doctrine kiezen.`); }
  }
  // winst?
  const st = stand(state);
  const speelt = (z) => state.facties.some((f) => f.zijde === z && f.speler === 'mens');
  const levend = new Set(state.facties.filter((f) => f.speler === 'mens' && regiosVan(state, f.id).length > 0).map((f) => f.zijde));
  const zijdenMetSpeler = [...new Set(state.facties.map((f) => f.zijde))].filter(speelt);
  if (state.doel && st.doel.heeft >= st.doel.nodig) state.winnaar = { zijde: state.doel.zijde, reden: 'Het campagnedoel is gehaald.' };
  else if (levend.size === 1 && zijdenMetSpeler.length > 1) state.winnaar = { zijde: [...levend][0], reden: 'De tegenstander heeft geen regio\'s meer.' };
  else if (b >= state.maxBeurten) {
    if (state.doel) { const top = Object.entries(st.perZijde).filter(([z]) => z !== state.doel.zijde && speelt(z)).sort((x, y) => y[1] - x[1]); state.winnaar = { zijde: top.length ? top[0][0] : null, reden: 'Het campagnedoel is niet op tijd gehaald.' }; }
    else { const top = Object.entries(st.perZijde).filter(([z]) => speelt(z)).sort((x, y) => y[1] - x[1]); state.winnaar = top.length > 1 && top[0][1] === top[1][1] ? { zijde: null, reden: 'Gelijke stand in overwinningspunten.' } : { zijde: top[0][0], reden: 'De meeste overwinningspunten na de laatste beurt.' }; }
  }
  if (state.winnaar) {
    state.fase = 'einde';
    logRegel(state, 'event', state.winnaar.zijde ? `De campagne is voorbij: ${ZIJDEN[state.winnaar.zijde]} winnen. ${state.winnaar.reden}` : `De campagne eindigt onbeslist. ${state.winnaar.reden}`);
    return null;
  }
  state.beurt = b + 1;
  // doorlopende periode
  if (state.doorlopend) {
    const nieuw = periodeVanJaar(datumVan(state).jaar);
    if (PERIODE_VOLGORDE.indexOf(nieuw) > PERIODE_VOLGORDE.indexOf(state.periode)) {
      state.periode = nieuw;
      logRegel(state, 'event', `De oorlog schuift op naar ${PERIODES[state.periode].naam} (${PERIODES[state.periode].jaren}). Doctrines en toegelaten eenheden schuiven mee.`);
      for (const f of state.facties) {
        const geldig = doctrinesVoor(f.id, state.periode).map((d) => d.id);
        const weg = f.doctrines.filter((d) => !geldig.includes(d));
        if (!weg.length) continue;
        f.doctrines = f.doctrines.filter((d) => geldig.includes(d));
        if (!f.doctrines.length) f.doctrines = [geldig[0]];
        f.magWisselen = f.speler === 'mens';
        logRegel(state, 'event', `${f.naam}: ${weg.map((d) => doctrineVan(d).naam).join(', ')} bestaat niet meer in deze periode. Nieuwe doctrine: ${doctrineVan(f.doctrines[0]).naam}.`);
      }
    }
  }
  pasEventsToe(state, state.beurt);
  herberekenBevoorrading(state);
  startOrderFase(state);
  return null;
}

function wisselDoctrine(state, fid, index, docId) {
  const f = factie(state, fid);
  if (!doctrinesVoor(fid, state.periode).some((d) => d.id === docId) || f.doctrines.includes(docId)) return;
  f.doctrines[index] = docId; f.magWisselen = false;
}

// Veteranen (optioneel): een eenheid die gevechten overleeft, krijgt een naam en een kleine bonus.
function veteraanBonus(v) { return v.gevechten >= 5 ? 'Elite: één herworp per gevecht en +1 op moraal.' : v.gevechten >= 3 ? 'Veteraan: één herworp per gevecht.' : 'Nog geen bonus (vanaf 3 gevechten).'; }

function splitsNaam(naam) {
  if (naam.length <= 13 || !naam.includes(' ')) return [naam];

// s: {kaart, subset, regios:{id:{eigenaar,...}}, facties:[{id,kleur,zijde,hoofdstad}], doel}

    if (rs.bev === false) cellen += `<path d="${d}" fill="url(#arc)" class="geenklik"/>`;
    if (rs.omstreden > 0) cellen += `<path d="${d}" fill="none" stroke="#e8792b" stroke-width="${n1(R * 0.07)}" stroke-dasharray="${n1(R * 0.12)} ${n1(R * 0.1)}" class="geenklik"/>`;

      const z1 = zijde(rs.eigenaar), z2 = zijde(s.regios[a.bron].eigenaar);
      if (z1 !== z2 && z1 !== 'neutraal' && z2 !== 'neutraal') front += `M${n1(a.x)} ${n1(a.y)}L${n1(b.x)} ${n1(b.y)}`;
    }

  for (const g of o.gevechten || []) {

      boven += `<g class="geenklik"><rect x="${n1(x)}" y="${n1(y)}" width="${n1(bw)}" height="${n1(bh)}" rx="${n1(bh * 0.25)}" fill="#14181c" stroke="${kleur(m.fid)}" stroke-width="${n1(R * 0.035)}"/><text x="${n1(x + bw / 2)}" y="${n1(y + bh * 0.76)}" font-size="${n1(bh * 0.72)}" text-anchor="middle" fill="#fff" font-weight="700">${m.code}</text></g>`;
