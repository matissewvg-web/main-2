<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Lifeboard</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0d0e; color: #efeee9; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #8f8c86; margin: 0 0 20px; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 16px; background: #d6c4a1; color: #1e180d; font: 700 15px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Je bent offline</h1>
  <p>Lifeboard bewaart je taken, studie, budget en skills in je claude.ai-account, dus het heeft internet nodig. Controleer je wifi en probeer opnieuw.</p>
  <button id="retry" type="button">Opnieuw proberen</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () {
    var to = new URLSearchParams(location.search).get('to');
    if (to) location.href = to;
  });
</script>
</body>
</html>
