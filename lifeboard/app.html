<title>Lifeboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap">
<style>
/* Layout: on a laptop a quiet sidebar beside a two-column board; on iPhone one column with a frosted tab bar and bottom sheets. Graphite glass, a champagne accent and muted category hues: Carryover's calmer sibling. */
:root {
  --bg: #0d0d0e;
  --side: rgba(255, 255, 255, .022);
  --fg: #efeee9;
  --muted: #8f8c86;
  --faint: #5b5955;
  --glass: rgba(255, 255, 255, .045);
  --glass-2: rgba(255, 255, 255, .085);
  --line: rgba(255, 255, 255, .075);
  --line-2: rgba(255, 255, 255, .14);
  --track: rgba(255, 255, 255, .08);
  --input: rgba(0, 0, 0, .28);
  --sheet: rgba(24, 24, 26, .94);
  --bar: rgba(34, 34, 36, .68);
  --scrim: rgba(0, 0, 0, .55);
  --lift: 0 18px 50px rgba(0, 0, 0, .55);
  --edge: inset 0 1px 0 rgba(255, 255, 255, .05);
  --accent: #d6c4a1;
  --accent-ink: #1e180d;
  --accent-soft: rgba(214, 196, 161, .14);
  --on-c: #0d0d0e;
  --good: #93c2a0;
  --warn: #e0b56e;
  --bad: #e7887c;
  --bad-soft: rgba(231, 136, 124, .12);
  --c1: #93c2a0; --c2: #8fa9d8; --c3: #dc9d7c; --c4: #d6c4a1;
  --c5: #b9a0d2; --c6: #7fbab7; --c7: #d891a6; --c8: #bcbc7e;
  --bloom-a: rgba(214, 196, 161, .085);
  --bloom-b: rgba(143, 169, 216, .065);
  --paper: #ffffff;
  --paper-ink: #333333;
  --font-display: "Sora", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eeedea; --side: rgba(255, 255, 255, .45); --fg: #1b1a18; --muted: #6c6963; --faint: #a3a09a;
    --glass: rgba(255, 255, 255, .62); --glass-2: rgba(255, 255, 255, .95); --line: rgba(27, 26, 24, .085); --line-2: rgba(27, 26, 24, .16);
    --track: rgba(27, 26, 24, .075); --input: rgba(255, 255, 255, .85); --sheet: rgba(248, 247, 245, .96); --bar: rgba(255, 255, 255, .74);
    --scrim: rgba(20, 18, 15, .32); --lift: 0 18px 46px rgba(40, 32, 20, .16); --edge: 0 1px 2px rgba(40, 32, 20, .04);
    --accent: #7a6234; --accent-ink: #fffaf0; --accent-soft: rgba(122, 98, 52, .12); --on-c: #ffffff;
    --good: #3d7d51; --warn: #9a6512; --bad: #b4463a; --bad-soft: rgba(180, 70, 58, .09);
    --c1: #4d8861; --c2: #4b6ca6; --c3: #ad603c; --c4: #8a7041; --c5: #7d5ea1; --c6: #3b817e; --c7: #a8546f; --c8: #74742e;
    --bloom-a: rgba(190, 165, 120, .16); --bloom-b: rgba(120, 145, 190, .1);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eeedea; --side: rgba(255, 255, 255, .45); --fg: #1b1a18; --muted: #6c6963; --faint: #a3a09a;
  --glass: rgba(255, 255, 255, .62); --glass-2: rgba(255, 255, 255, .95); --line: rgba(27, 26, 24, .085); --line-2: rgba(27, 26, 24, .16);
  --track: rgba(27, 26, 24, .075); --input: rgba(255, 255, 255, .85); --sheet: rgba(248, 247, 245, .96); --bar: rgba(255, 255, 255, .74);
  --scrim: rgba(20, 18, 15, .32); --lift: 0 18px 46px rgba(40, 32, 20, .16); --edge: 0 1px 2px rgba(40, 32, 20, .04);
  --accent: #7a6234; --accent-ink: #fffaf0; --accent-soft: rgba(122, 98, 52, .12); --on-c: #ffffff;
  --good: #3d7d51; --warn: #9a6512; --bad: #b4463a; --bad-soft: rgba(180, 70, 58, .09);
  --c1: #4d8861; --c2: #4b6ca6; --c3: #ad603c; --c4: #8a7041; --c5: #7d5ea1; --c6: #3b817e; --c7: #a8546f; --c8: #74742e;
  --bloom-a: rgba(190, 165, 120, .16); --bloom-b: rgba(120, 145, 190, .1);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; padding-inline: 16px; padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 116px); min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(60% 40% at 6% -8%, var(--bloom-a), transparent 70%), radial-gradient(50% 36% at 100% 0%, var(--bloom-b), transparent 70%); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* shell */
.shell { position: relative; z-index: 1; }
.side { display: none; }
.main { max-width: 680px; margin-inline: auto; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.grid2 { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
.mt { margin-top: 16px; }

/* header */
.vh { padding-block: 18px 2px; display: flex; flex-direction: column; gap: 16px; }
.brand { display: flex; align-items: center; gap: 9px; }
.bm { flex: none; color: var(--fg); }
.wm { font: 600 17px/1 var(--font-display); letter-spacing: -.045em; }
.wm em { font-style: normal; color: var(--accent); }
.vh-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.vh-t { min-width: 0; }
.eyebrow { margin: 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { margin: 5px 0 0; font: 600 28px/1.08 var(--font-display); letter-spacing: -.03em; text-wrap: balance; }
.vh-r { display: flex; align-items: center; gap: 8px; flex: none; }
.add { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px var(--accent-soft); transition: transform .12s; }
.add .ic { stroke-width: 2.2; }
.add:active { transform: scale(.92); }

/* cards */
.card { background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px; box-shadow: var(--edge); min-width: 0; }
.ch { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.ch h2 { margin: 0; font: 600 15px/1.3 var(--font-display); letter-spacing: -.01em; }
.meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.subh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-top: 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.subh.bad { color: var(--bad); }
.subh .link { font-size: 12px; letter-spacing: 0; text-transform: none; }
.note { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.notice { margin-top: 14px; padding: 10px 14px; border-radius: 14px; background: var(--bad-soft); color: var(--bad); font-size: 13px; }
.empty { padding: 18px 4px 8px; text-align: center; color: var(--muted); font-size: 13.5px; }
.empty strong { display: block; color: var(--fg); font: 600 16px var(--font-display); margin-bottom: 4px; }
.empty p { margin: 0 auto; max-width: 40ch; }
.loading { display: flex; align-items: center; gap: 12px; color: var(--muted); margin-top: 16px; }
.loading .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: breathe 1.2s ease-in-out infinite; }
.none { color: var(--faint); font-size: 13px; }
.bad { color: var(--bad); }
.good { color: var(--good); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 13px 16px; border-radius: 15px; font-weight: 600; border: 1px solid var(--line-2); background: var(--glass); transition: transform .12s, background .2s; }
.btn:active { transform: scale(.96); }
.btn.go { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.sm { padding: 9px 14px; border-radius: 12px; font-size: 13px; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.link { color: var(--accent); font-weight: 600; font-size: 13px; }
.link.mute { color: var(--muted); font-weight: 500; }
.pill-btn { font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--fg); background: var(--glass); }
.iconbtn { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--glass); color: var(--fg); }
.row-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.row-acts.c { justify-content: center; }
.more { display: block; width: 100%; margin-top: 6px; padding: 9px 0 2px; text-align: left; color: var(--muted); font-size: 12.5px; font-weight: 600; border-top: 1px solid var(--line); }

/* rows */
.rows { list-style: none; margin: 0; padding: 0; }
.it { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; column-gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.rows > .it:first-child { border-top: 0; }
.it.wt { grid-template-columns: 40px 26px minmax(0, 1fr) auto; }
.tm { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chk { position: relative; width: 24px; height: 24px; border-radius: 50%; border: 1.6px solid var(--c); display: grid; place-items: center; color: transparent; justify-self: center; transition: background .15s, transform .12s; }
.chk::after { content: ""; position: absolute; inset: -10px; }
.chk .ic { width: 13px; height: 13px; stroke-width: 3; }
.done .chk { background: var(--c); color: var(--on-c); }
.chk:active { transform: scale(.86); }
.pop .chk { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
.mk { width: 10px; height: 10px; border-radius: 3px; background: var(--c); justify-self: center; }
.mk.ex { transform: rotate(45deg); border-radius: 2px; }
.mk.round { border-radius: 50%; }
.im { display: block; min-width: 0; width: 100%; text-align: left; padding-block: 2px; }
.it-t { display: block; font-weight: 500; overflow-wrap: anywhere; }
.done .it-t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.it-m { display: flex; flex-wrap: wrap; align-items: center; gap: 1px 7px; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.it-m i { font-style: normal; color: var(--faint); }
.it-m .hi { color: var(--warn); }
.it-m .exm { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; background: var(--track); }
.amt { font-variant-numeric: tabular-nums; font-size: 14px; text-align: right; white-space: nowrap; }
.amt.pos { color: var(--good); }

/* chips and segmented controls */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 99px; font-size: 13px; font-weight: 500; color: var(--muted); background: var(--glass); border: 1px solid var(--line); white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip small { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { color: var(--fg); background: var(--glass-2); border-color: var(--line-2); }
.chip.ghost { border-style: dashed; color: var(--accent); }
.seg { display: inline-flex; padding: 3px; border-radius: 13px; background: var(--track); gap: 2px; }
.seg button { padding: 7px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--glass-2); color: var(--fg); box-shadow: 0 1px 4px rgba(0, 0, 0, .18); }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; text-align: center; }

/* bars */
.bar { height: 6px; border-radius: 6px; background: var(--track); overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; border-radius: 6px; background: var(--accent); }
.bar.over i { background: var(--bad); }
.pill { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--track); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill.behind { color: var(--bad); background: var(--bad-soft); }
.pill.today { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }

/* mission */
.mission { position: relative; overflow: hidden; padding: 20px 20px 16px; border-radius: 26px;
  background: var(--glass); background: linear-gradient(155deg, color-mix(in srgb, var(--mc) 15%, transparent), var(--glass) 62%);
  border-color: color-mix(in srgb, var(--mc) 26%, var(--line)); }
.mission::after { content: ""; position: absolute; width: 200px; height: 200px; right: -70px; top: -90px; border-radius: 50%; background: var(--mc); opacity: .12; filter: blur(48px); pointer-events: none; }
.ms-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; }
.tag { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.ms-h { position: relative; margin: 12px 0 0; font: 600 23px/1.18 var(--font-display); letter-spacing: -.025em; text-wrap: balance; }
.ms-p { position: relative; margin: 8px 0 0; color: var(--muted); font-size: 14.5px; max-width: 58ch; }
.focus { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.fc { display: flex; flex-direction: column; gap: 2px; padding: 12px 13px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass); text-align: left; transition: transform .12s, border-color .2s; min-width: 0; }
.fc:active { transform: scale(.97); }
.fc b { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.fc b::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.fc span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.fc.any { grid-column: 1 / -1; border-style: dashed; }
.ms-acts { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 16px; }
.ms-acts .btn:only-child { grid-column: 1 / -1; }
.ms-links { position: relative; display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.stamp { position: relative; display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.stamp .st-ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--sc); color: var(--on-c); flex: none; }
.stamp .st-ic .ic { stroke-width: 2.6; }
.stamp b { display: block; font: 600 17px var(--font-display); }
.stamp span { font-size: 13px; color: var(--muted); }
.wd { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.wd span { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.wd i { width: 12px; height: 12px; border-radius: 50%; background: var(--track); }
.wd i.done { background: var(--good); }
.wd i.skip { background: transparent; border: 1.5px solid var(--bad); }
.wd i.now { outline: 1.5px solid var(--fg); outline-offset: 2px; }
.mission.flip { animation: flipin .55s cubic-bezier(.2, .9, .3, 1) both; }

/* figures */
.figure { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.figure b { font: 600 30px/1.1 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.figure span { color: var(--muted); font-size: 13px; }
.figure.big b { font-size: 40px; }
.figure.neg b { color: var(--bad); }
.kv3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.kv3 span { display: block; font-size: 11.5px; color: var(--muted); }
.kv3 b { font: 600 15px var(--font-display); font-variant-numeric: tabular-nums; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 9px; border-top: 1px solid var(--line); font-size: 14px; }
.kv:first-of-type { border-top: 0; }
.kv span { color: var(--muted); }
.kv b { font-weight: 600; font-variant-numeric: tabular-nums; }
.kv.total { border-top: 1px solid var(--line-2); }
.kv.total span { color: var(--fg); font-weight: 600; }
.verdict { margin: 10px 0 0; padding: 11px 13px; border-radius: 14px; background: var(--track); font-size: 13.5px; }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.tile { padding: 13px 13px 12px; border-radius: 18px; }
.tile b { display: block; font: 600 22px/1.15 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile span { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); line-height: 1.3; }

/* week strip */
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wk-d { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border-radius: 14px; border: 1px solid transparent; min-width: 0; }
.wk-d > span:first-child { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.wk-d b { font: 600 16px var(--font-display); font-variant-numeric: tabular-nums; }
.wk-d.now { background: var(--glass-2); border-color: var(--line-2); }
.dots { display: flex; gap: 3px; min-height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

/* course */
.course { padding-block: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.course:first-of-type { border-top: 0; padding-top: 4px; }
.co-top { display: flex; align-items: center; gap: 10px; }
.co-top .dot, .crow .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.co-top b { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.co-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.sbar { position: relative; height: 7px; border-radius: 7px; background: var(--track); overflow: hidden; }
.sbar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 7px; background: var(--c); }
.sbar i.pl { opacity: .35; }
.co-kv { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); }
.co-kv b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.wday { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; padding-block: 8px; border-top: 1px solid var(--line); align-items: start; }
.wday:first-of-type { border-top: 0; }
.wd-l { display: flex; flex-direction: column; line-height: 1.15; padding-top: 6px; }
.wd-l b { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.wd-l span { font: 600 17px var(--font-display); font-variant-numeric: tabular-nums; }
.wday.now .wd-l b, .wday.now .wd-l span { color: var(--accent); }
.wday .none { display: block; padding-top: 9px; }
.wday .it { padding-block: 6px; }

/* budget */
.crow { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; grid-template-areas: "dot main amt" ". bar bar"; align-items: center; column-gap: 12px; row-gap: 7px; padding-block: 11px; border-top: 1px solid var(--line); }
.rows > .crow:first-child { border-top: 0; }
.crow .dot { grid-area: dot; }
.crow .im { grid-area: main; }
.crow .amt { grid-area: amt; font-size: 13px; color: var(--muted); }
.crow .amt b { color: var(--fg); font-weight: 600; }
.cbar { grid-area: bar; height: 5px; border-radius: 5px; background: var(--track); overflow: hidden; }
.cbar i { display: block; height: 100%; border-radius: 5px; background: var(--c); }
.cbar.over i { background: var(--bad); }
.chart { display: block; width: 100%; height: auto; margin-top: 14px; overflow: visible; }
.chart text { fill: var(--muted); font: 500 10.5px var(--font-body); }
.mnav { display: flex; gap: 6px; }

/* calendar */
.calnav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.calnav b { flex: 1; font: 600 16px var(--font-display); text-transform: capitalize; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-h { text-align: center; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 4px; }
.cd { min-width: 0; min-height: 52px; padding: 6px 2px 5px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 5px; border: 1px solid transparent; transition: background .15s; }
.cd-n { font-size: 13.5px; font-weight: 500; font-variant-numeric: tabular-nums; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.cd.out { opacity: .35; }
.cd.now .cd-n { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.cd.sel { background: var(--glass-2); border-color: var(--line-2); }
.cd-i { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: 100%; }
.ev { display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); font-style: normal; }
.ev b, .cd-i em { display: none; }
.ev.dn { opacity: .4; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.legend i.sq { border-radius: 2px; }
.legend i.dm { border-radius: 1px; transform: rotate(45deg); width: 7px; height: 7px; }

/* side links */
.foot-links { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 16px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.foot-links a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line-2); }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 10px); pointer-events: none; }
.tabs { pointer-events: auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; width: min(100%, 480px); padding: 5px; border-radius: 26px; background: var(--bar); border: 1px solid var(--line-2);
  backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%); box-shadow: var(--lift); }
.tabs button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px 6px; border-radius: 21px; color: var(--muted); font-size: 10.5px; font-weight: 600; transition: background .2s, color .2s, transform .12s; }
.tabs button .ic { width: 21px; height: 21px; }
.tabs button:active { transform: scale(.94); }
.tabs button[aria-current="page"] { color: var(--fg); background: var(--glass-2); }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: var(--on-c); font-size: 10px; line-height: 16px; text-align: center; font-weight: 700; }
.badge:empty { display: none; }

/* sheet */
.back { position: fixed; inset: 0; z-index: 40; background: var(--scrim); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 540px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain; border-radius: 26px 26px 0 0; background: var(--sheet); border: 1px solid var(--line-2); border-bottom: 0;
  backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); padding: 20px 18px calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; flex-direction: column; gap: 15px; box-shadow: var(--lift); }
.sheet h2 { margin: 0; font: 600 20px var(--font-display); letter-spacing: -.015em; }
.sheet .hint { margin: -6px 0 0; font-size: 13px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.field > label, .field > .lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.inp { display: block; width: 100%; min-width: 0; min-height: 46px; padding: 11px 14px; border-radius: 13px; border: 1px solid var(--line-2); background: var(--input); font-size: 16px; color: var(--fg); -webkit-appearance: none; appearance: none; }
.inp::-webkit-date-and-time-value { text-align: left; }
.inp.big { font: 600 28px/1.2 var(--font-display); letter-spacing: -.02em; }
.inp::placeholder { color: var(--faint); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sw { display: flex; flex-wrap: wrap; gap: 10px; }
.sw button { width: 32px; height: 32px; border-radius: 50%; background: var(--c); border: 2px solid transparent; outline: 2px solid transparent; outline-offset: 2px; }
.sw button[aria-pressed="true"] { outline-color: var(--fg); }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.btns { display: flex; gap: 10px; }
.btns .btn { flex: 1; }
.btns .btn.danger { flex: none; }
.err { margin: 0; color: var(--bad); font-size: 13px; min-height: 1em; }
.preview { list-style: none; margin: 0; padding: 4px 14px; border-radius: 16px; background: var(--track); max-height: 240px; overflow-y: auto; }
.preview li { display: grid; grid-template-columns: 90px 46px minmax(0, 1fr) auto; gap: 8px; padding-block: 8px; border-top: 1px solid var(--line); font-size: 13px; align-items: center; }
.preview li:first-child { border-top: 0; }
.preview .d { color: var(--muted); }
.preview .t { font-variant-numeric: tabular-nums; color: var(--muted); }
.preview .n { display: flex; align-items: center; gap: 7px; min-width: 0; }
.preview .n i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.seg.wide button { padding-inline: 4px; }
.inp.area { min-height: 84px; resize: vertical; line-height: 1.45; }
.conf { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.conf button, .rates button { border-radius: 11px; border: 1px solid var(--line-2); background: var(--glass); font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.conf button { padding: 9px 0; font-size: 13px; }
.rates { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.rates button { padding: 10px 0 8px; font: 600 16px var(--font-display); }
.rates button small { display: block; font: 500 10px var(--font-body); color: var(--muted); margin-top: 2px; }
.conf button[aria-pressed="true"], .rates button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.rates button[aria-pressed="true"] small { color: var(--accent-ink); }
.files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.files li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--track); font-size: 13px; min-width: 0; }
.files .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* study: tests, logs, material */
.rbar { position: relative; height: 7px; border-radius: 7px; background: var(--track); overflow: hidden; }
.rbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: var(--c); }
.rbar .tick { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--fg); opacity: .7; }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.co-top .dot.dm { width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); }
.co-meta .hi { color: var(--warn); }
.it-x { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
.it.mat { grid-template-columns: 34px minmax(0, 1fr) auto; }
.ft { flex: none; display: inline-grid; place-items: center; min-width: 34px; height: 34px; padding: 0 5px; border-radius: 10px; font: 700 11px/1 var(--font-display); letter-spacing: .02em; color: var(--on-c); background: var(--fc); }
.ft.sm { min-width: 26px; height: 26px; border-radius: 8px; font-size: 9.5px; }

/* skill of the day */
.deck { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.deck.mini { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.fd { position: relative; overflow: hidden; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left;
  background: linear-gradient(160deg, color-mix(in srgb, var(--lc) 22%, transparent), var(--glass) 70%); border: 1px solid color-mix(in srgb, var(--lc) 40%, var(--line)); transition: transform .25s cubic-bezier(.2, .9, .3, 1), border-color .2s, opacity .2s; }
.deck.mini .fd { aspect-ratio: 3 / 4; padding: 9px; border-radius: 14px; }
.fd .q { position: absolute; inset: 0; display: grid; place-items: center; font: 700 44px/1 var(--font-display); color: color-mix(in srgb, var(--lc) 70%, transparent); pointer-events: none; }
.deck.mini .fd .q { font-size: 26px; }
.fd .gl { position: relative; display: flex; gap: 3px; align-items: flex-end; height: 18px; }
.fd .gl i { width: 4px; border-radius: 2px; background: var(--track); }
.fd .gl i.on { background: var(--lc); }
.fd .nm { position: relative; min-width: 0; }
.fd .nm b { display: block; font: 600 14px/1.2 var(--font-display); overflow-wrap: anywhere; }
.fd .nm span { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.deck.mini .fd .nm b { font-size: 11px; }
.deck.mini .fd .nm span { font-size: 10px; }
.fd[aria-pressed="true"] { transform: translateY(-4px); border-color: var(--lc); box-shadow: 0 12px 30px color-mix(in srgb, var(--lc) 30%, transparent); }
.fd.dim { opacity: .4; }
.fd:active { transform: scale(.96); }
.confirm { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
.btn.lv { background: var(--lc); color: var(--on-c); border-color: transparent; }
.sk { position: relative; display: flex; flex-direction: column; gap: 10px; }
.sk.flip { animation: flipin .55s cubic-bezier(.2, .9, .3, 1) both; }
.sk-top { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.sk-h { margin: 0; font: 600 22px/1.15 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
.sk-task { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--track); border-left: 3px solid var(--lc); font-size: 15px; }
.sk .ms-acts, .sk .stamp, .sk .ms-links { margin-top: 2px; }
.sk-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.sk-strip b { display: block; font: 600 16px var(--font-display); font-variant-numeric: tabular-nums; }
.sk-strip span { font-size: 11.5px; color: var(--muted); }
.xpbar { height: 5px; border-radius: 5px; background: var(--track); overflow: hidden; margin-top: 6px; }
.xpbar i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
.tiles.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.dist { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; align-items: center; padding-block: 5px; font-size: 13px; }
.dist .db { height: 24px; border-radius: 8px; background: var(--bc); min-width: 26px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-weight: 700; color: var(--on-c); font-variant-numeric: tabular-nums; }
.dist .db.zero { background: var(--track); color: var(--muted); }
.hgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.hgrid .hd { text-align: center; font-size: 10.5px; color: var(--muted); font-weight: 600; }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 7px; background: var(--track); display: grid; place-items: center; font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.cell.done { background: var(--hc); color: var(--on-c); font-weight: 600; }
.cell.failed { background: transparent; border: 1.5px solid var(--bad); color: var(--bad); }
.cell.future { background: transparent; }
.cell.today { outline: 1.5px solid var(--fg); outline-offset: 1px; }
.slog { padding-block: 11px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; }
.slog:first-of-type { border-top: 0; }
.slog .l1 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.slog .l1 b { font-weight: 600; overflow-wrap: anywhere; }
.slog .l2 { font-size: 12.5px; color: var(--muted); }
.slog .l3 { font-size: 13px; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }

/* The Break 5 */
.b5-ph { margin: 2px 0 0; font: 600 17px/1.3 var(--font-display); overflow-wrap: anywhere; }
.b5-next { margin: 4px 0 0; font-size: 14px; overflow-wrap: anywhere; }

/* reader */
.reader { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.r-top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; border-bottom: 1px solid var(--line); background: var(--sheet); }
.r-title { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 10px; }
.r-title > div { min-width: 0; }
.r-title b { display: block; font: 600 15px var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-title .rm { display: block; font-size: 12.5px; color: var(--muted); }
.r-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.r-body { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 40px); }
.r-msg { max-width: 520px; margin: 60px auto; text-align: center; color: var(--muted); }
.r-msg strong { display: block; color: var(--fg); font: 600 18px var(--font-display); margin-bottom: 8px; }
.pdf { max-width: 920px; margin: 0 auto; display: grid; gap: 14px; }
.pdf-page { width: 100%; background: var(--paper); color: var(--paper-ink); border-radius: 6px; overflow: hidden; box-shadow: var(--lift); display: grid; place-items: center; }
.pdf-page canvas { display: block; width: 100%; height: auto; }
.doc { max-width: 760px; margin: 0 auto; padding: 28px 24px; border-radius: 20px; background: var(--glass); border: 1px solid var(--line); line-height: 1.65; font-size: 16px; overflow-wrap: anywhere; }
.doc h1, .doc h2, .doc h3, .doc h4 { font-family: var(--font-display); letter-spacing: -.01em; line-height: 1.25; margin: 1.4em 0 .5em; text-wrap: balance; }
.doc h1 { font-size: 26px; } .doc h2 { font-size: 21px; } .doc h3 { font-size: 18px; }
.doc :first-child { margin-top: 0; }
.doc img { max-width: 100%; height: auto; border-radius: 8px; background: var(--paper); }
.doc a { color: var(--accent); }
.doc table, .xl table { border-collapse: collapse; margin: 1em 0; font-size: 14px; }
.doc td, .doc th, .xl td, .xl th { border: 1px solid var(--line-2); padding: 6px 10px; vertical-align: top; }
.doc .tbl, .xl { overflow-x: auto; }
.slides { max-width: 900px; margin: 0 auto; display: grid; gap: 16px; }
.slide { padding: 22px 22px 20px; border-radius: 20px; background: var(--glass); border: 1px solid var(--line); }
.slide .sn { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.slide h3 { margin: 8px 0 12px; font: 600 21px/1.25 var(--font-display); letter-spacing: -.01em; }
.slide p { margin: 0 0 8px; overflow-wrap: anywhere; }
.slide p.l1 { padding-left: 20px; } .slide p.l2 { padding-left: 40px; } .slide p.l3 { padding-left: 60px; }
.slide p.b::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin: 0 10px 2px 0; }
.slide .imgs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.slide .imgs img { max-width: 100%; max-height: 360px; border-radius: 10px; background: var(--paper); }
.slide .notes { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--warn) 10%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); font-size: 14px; }
.slide .notes span { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--warn); font-weight: 600; margin-bottom: 4px; }
.xl-tabs { max-width: 1100px; margin: 0 auto 14px; }
.xl { max-width: 1100px; margin: 0 auto; border-radius: 16px; border: 1px solid var(--line); background: var(--glass); }
.xl table { margin: 0; font-variant-numeric: tabular-nums; }
.xl td { white-space: nowrap; }
.media { max-width: 1000px; margin: 0 auto; display: grid; place-items: center; }
.media img, .media video { max-width: 100%; max-height: 80vh; border-radius: 12px; }
.txt { max-width: 900px; margin: 0 auto; padding: 20px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.6 ui-monospace, "Cascadia Mono", Menlo, monospace; }

/* effects */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translateX(-50%); padding: 10px 18px; border-radius: 99px; font-weight: 600; font-size: 14px; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis;
  background: var(--sheet); border: 1px solid var(--line-2); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: var(--lift); }
@keyframes vfade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes sheetup { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes flipin { from { transform: perspective(900px) rotateX(-14deg) translateY(10px); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes breathe { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
@keyframes grow { from { width: 0; } }
.vin > * { animation: vfade .4s both cubic-bezier(.2, .8, .3, 1); }
.vin > *:nth-child(2) { animation-delay: .03s; } .vin > *:nth-child(3) { animation-delay: .06s; } .vin > *:nth-child(n+4) { animation-delay: .09s; }
.vin .bar i, .vin .cbar i, .vin .sbar i { animation: grow .8s cubic-bezier(.2, .8, .2, 1) both; }
.back:not([hidden]) { animation: fadein .22s; }
.back:not([hidden]) .sheet { animation: sheetup .34s cubic-bezier(.2, .9, .3, 1); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* laptop and desktop */
@media (min-width: 700px) {
  .back { align-items: center; padding: 24px; }
  .sheet { border-radius: 24px; border-bottom: 1px solid var(--line-2); max-height: 88%; padding-bottom: 20px; }
}
@media (min-width: 1000px) {
  body { padding-inline: 0; padding-block: 0; }
  .shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); align-items: start; }
  .side { display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 26px 16px 22px; border-right: 1px solid var(--line); background: var(--side); }
  .side .brand { padding-inline: 8px; }
  .side-nav { display: flex; flex-direction: column; gap: 2px; }
  .side-nav button { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 12px; color: var(--muted); font-weight: 500; font-size: 14.5px; transition: background .15s, color .15s; }
  .side-nav button:hover { color: var(--fg); background: var(--glass); }
  .side-nav button[aria-current="page"] { color: var(--fg); background: var(--glass-2); }
  .side-nav .cnt { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .side-nav .cnt.bad { color: var(--bad); }
  .side-add { width: 100%; }
  .side-card { padding: 14px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); }
  .side-card .side-t { margin: 6px 0 0; font-weight: 600; font-size: 14px; line-height: 1.35; }
  .side-card .side-s { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-inline: 8px; }
  .side-foot a { display: flex; justify-content: space-between; color: var(--fg); text-decoration: none; font-size: 13.5px; padding-block: 3px; }
  .side-foot a span { color: var(--muted); }
  .side-foot .ex { font-size: 12.5px; color: var(--muted); }
  .main { max-width: 1200px; width: 100%; padding-inline: 40px; padding-block: 0 56px; }
  .tabbar, .mob { display: none !important; }
  .vh { padding-block: 34px 4px; }
  h1 { font-size: 32px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .card { padding: 18px 20px; }
  .ms-h { font-size: 27px; }
  .calwrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  .daycard { position: sticky; top: 24px; }
  .cal { gap: 6px; }

    let active30 = 0; for (let i = 0; i < 30; i++) if (skAttempted(S.skill[addDays(today, -i)])) active30++;

    const rated = recent.filter((d) => d.rating), avgRate = rated.length ? rated.reduce((a, d) => a + d.rating, 0) / rated.length : 0;

    else if (spanDays >= 7 && active30 / spanDays < 0.6) verdict = "Je slaat te veel dagen over. Een dagelijkse skill werkt alleen als het dagelijks is. Kies desnoods Makkelijk, maar speel.";
    else if (easyShare >= 0.6 && (!avgRate || avgRate <= 2.5)) verdict = "Je trekt vooral de Makkelijk-kaart en noemt het zelf licht. Dat is comfort, geen groei. Durf Normaal of Moeilijk.";
    else if (success < 50 && hardShare < 0.5) verdict = "Je faalt meer dan je slaagt op gewone niveaus. Kies een kaart die je echt afmaakt en bouw van daaruit op.";
    else if (success >= 80 && hardShare >= 0.5) verdict = "Sterk. Je kiest zware kaarten en maakt ze af. Tijd voor Onmogelijk.";
    else verdict = "Goed ritme. Blijf eerlijk invullen, ook als het niet lukt. Daar leer je het meest van.";
    left += '<section class="card"><div class="ch"><h2>Niveau ' + t.level + '</h2><span class="meta">' + t.xp + " XP totaal</span></div>" +
      '<div class="figure"><b>' + t.into + " / " + XP_LEVEL + "</b><span>nog " + (XP_LEVEL - t.into) + " XP tot niveau " + (t.level + 1) + '</span></div><div class="bar"><i style="width:' + Math.round(t.into / XP_LEVEL * 100) + '%"></i></div>' +
      '<p class="verdict">' + verdict + '</p><p class="note">XP: Makkelijk 1, Normaal 2, Moeilijk 3, Onmogelijk 5. Een eerlijke mislukking op Moeilijk of Onmogelijk geeft 1 XP. Elke 15 XP is een niveau. Gemiste dagen vul je niet achteraf in.</p></section>';

    let right = '<div class="tiles four" style="margin-top:0"><div class="tile card"><b>' + list.length + '</b><span>gespeeld</span></div><div class="tile card"><b>' + success + '%</b><span>gelukt</span></div><div class="tile card"><b>' + t.streak + '</b><span>reeks</span></div><div class="tile card"><b>' + t.best + "</b><span>record</span></div></div>";
    const counts = LV.map((x) => done.filter((d) => d.level === x.id).length), mx = Math.max.apply(null, counts.concat([1]));
    right += '<section class="card"><div class="ch"><h2>Gelukt per moeilijkheid</h2></div>' + LV.map((x, i) => '<div class="dist"><span>' + x.name + '</span><div><div class="db' + (counts[i] ? "" : " zero") + '" style="--bc:' + x.c + ";width:" + Math.max(8, Math.round(counts[i] / mx * 100)) + '%">' + counts[i] + "</div></div></div>").join("") + "</section>";
    const dow = (parse(today).getDay() + 6) % 7, start = addDays(today, -dow - 28);
    let cells = ["M", "D", "W", "D", "V", "Z", "Z"].map((x) => '<div class="hd">' + x + "</div>").join("");
    for (let k = 0; k < 35; k++) {

      if (ds > today) cls += " future";
      else if (dd && dd.status === "done" && LVI[dd.level] !== undefined) { cls += " done"; stl = ' style="--hc:' + LV[LVI[dd.level]].c + '"'; }

    right += '<section class="card"><div class="ch"><h2>Logboek</h2><span class="meta">laatste 10</span></div>' + (recent.length ? recent.map((d) => {

  /* ---------- view: budget */
  function spendChart(B) {
    const W = 320, H = 132, L = 40, R = 10, Tp = 10, Bt = 20, n = B.dim;
    const capv = Math.max(0, B.varBudget), fixed = {};
    S.cats.forEach((c) => { if (c.kind === "vast") fixed[c.id] = 1; });
    const byDay = {}; B.list.forEach((t) => { if (t.dir === "out" && !fixed[t.cat]) { const d = +t.date.slice(8); byDay[d] = (byDay[d] || 0) + t.amount; } });
    const pts = [[0, 0]]; let run = 0;
    for (let d = 1; d <= B.dayNo; d++) { run += byDay[d] || 0; pts.push([d, run]); }
    const maxY = Math.max(capv, run, 10) * 1.08;
    const x = (d) => L + d / n * (W - L - R), y = (v) => Tp + (1 - v / maxY) * (H - Tp - Bt);
    const paceAt = (d) => capv * d / n, overPace = B.dayNo > 0 && run > paceAt(B.dayNo);
    const line = pts.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" ");
    const last = pts[pts.length - 1];
    let s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Uitgaven buiten vaste kosten: ' + money(run) + " na dag " + B.dayNo + ", tegenover " + money(capv) + ' voor de hele maand">';
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '" style="stroke:var(--line-2)" stroke-width="1"/>';
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(capv).toFixed(1) + '" y2="' + y(capv).toFixed(1) + '" style="stroke:var(--line)" stroke-width="1"/>';
    s += '<text x="' + (L - 6) + '" y="' + (y(0) + 3.5) + '" text-anchor="end">€0</text><text x="' + (L - 6) + '" y="' + (y(capv) + 3.5).toFixed(1) + '" text-anchor="end">' + money0(Math.round(capv)) + "</text>";
    s += '<line x1="' + x(0) + '" y1="' + y(0) + '" x2="' + x(n) + '" y2="' + y(capv).toFixed(1) + '" style="stroke:var(--muted)" stroke-width="1.2" stroke-dasharray="3 4"/>';
    if (pts.length > 1) {
      s += '<path d="' + line + " L" + x(last[0]).toFixed(1) + " " + y(0) + " L" + x(0) + " " + y(0) + 'Z" style="fill:' + (overPace ? "var(--bad-soft)" : "var(--accent-soft)") + '"/>';
      s += '<path d="' + line + '" fill="none" style="stroke:' + (overPace ? "var(--bad)" : "var(--accent)") + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      s += '<circle cx="' + x(last[0]).toFixed(1) + '" cy="' + y(last[1]).toFixed(1) + '" r="3.5" style="fill:' + (overPace ? "var(--bad)" : "var(--accent)") + '"/>';
    }
    [1, 15, n].forEach((d) => { s += '<text x="' + x(d).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle">' + d + "</text>"; });
    return s + "</svg>";
  }
  function viewBudget() {

    h += notice();
    if (!b.income && !S.cats.length && !S.tx.length) {
      return h + '<section class="card mt">' + emptyBlock("Maak je maandplan", "Drie stappen: je inkomen per maand, je spaardoel, en potjes voor wat je uitgeeft. Daarna toont Lifeboard elke dag hoeveel je nog vrij hebt.",
        '<button type="button" class="btn go sm" data-act="editplan">Inkomen en spaardoel</button><button type="button" class="btn sm" data-act="defcats">Standaardcategorieën</button>') + "</section>";
    }
    let hero = '<section class="card"><p class="eyebrow">Vrij te besteden · ' + monthName(mk) + '</p><div class="figure big' + (B.free < 0 ? " neg" : "") + '"><b>' + money(B.free) + "</b></div>";
    hero += '<p class="note">' + (B.save ? "Na vaste kosten en " + money0(B.save) + " sparen" : "Na vaste kosten") + (B.cur && B.daysLeft ? ". ≈ " + money(Math.max(0, B.perDay)) + " per dag, nog " + plural(B.daysLeft, "dag", "dagen") + "." : ".") + "</p>";
    if (B.varBudget > 0) hero += spendChart(B) + '<p class="note">Volle lijn: wat je uitgaf buiten vaste kosten. Stippellijn: een gelijkmatig tempo tot ' + money0(Math.round(B.varBudget)) + ".</p>";

      const gap = B.projected - B.varBudget;
      hero += gap > 5 ? '<p class="verdict bad">Aan dit tempo geef je deze maand ' + money(B.projected) + " uit aan niet-vaste kosten. Dat is " + money(gap) + " meer dan je plan toelaat.</p>"
        : '<p class="verdict">Op koers. Aan dit tempo hou je ongeveer ' + money(-gap) + " over bovenop je spaardoel.</p>";
    }
    hero += '<div class="kv3"><div><span>Inkomen</span><b>' + money0(B.income) + "</b></div><div><span>Uitgegeven</span><b>" + money(B.spent) + "</b></div><div><span>Spaardoel</span><b>" + money0(B.save) + "</b></div></div></section>";

    let cats = '<section class="card"><div class="ch"><h2>Categorieën</h2><button type="button" class="link" data-act="new" data-type="cat">+ Categorie</button></div>';
    if (!S.cats.length) cats += emptyBlock("Nog geen categorieën", "Verdeel je geld over potjes zoals boodschappen en vervoer.", '<button type="button" class="btn sm" data-act="defcats">Standaardcategorieën</button>');
    else {
      cats += '<ul class="rows">' + S.cats.slice().sort((a, b) => (a.kind === b.kind ? a.createdAt - b.createdAt : a.kind === "vast" ? 1 : -1)).map((c) => catRow(c, B.per[c.id] || 0)).join("");
      const known = {}; S.cats.forEach((c) => { known[c.id] = 1; });
      const unc = Object.keys(B.per).filter((k) => !known[k]).reduce((a, k) => a + B.per[k], 0);
      if (unc) cats += catRow(catOf(""), unc, true);
      cats += "</ul>";
    }
    cats += "</section>";

    const left = B.planned - B.fixedPlan - B.varPlan;
    let verdict;
    if (!B.planned) verdict = ['', "Vul je maandinkomen in om te zien of je plan klopt."];
    else if (left < 0) verdict = ["bad", "Je plant " + money(-left) + " meer uit te geven dan je verdient. Schrap in je budgetten."];
    else if (left < b.save) verdict = ["bad", "Je plan laat " + money(left) + " over, maar je spaardoel is " + money0(b.save) + ". Verlaag een budget met " + money(b.save - left) + "."];
    else verdict = ["", "Je plan haalt je spaardoel" + (left > b.save ? ", met " + money(left - b.save) + " marge." : ".")];
    let plan = '<section class="card"><div class="ch"><h2>Maandplan</h2><button type="button" class="link" data-act="editplan">Aanpassen</button></div>' +
      '<div class="kv"><span>Inkomen</span><b>' + money(B.planned) + '</b></div><div class="kv"><span>Vaste kosten</span><b>− ' + money(B.fixedPlan) + '</b></div><div class="kv"><span>Budgetten</span><b>− ' + money(B.varPlan) + "</b></div>" +
      '<div class="kv total"><span>Blijft over</span><b' + (left < 0 ? ' class="bad"' : "") + ">" + money(left) + "</b></div>" + '<p class="verdict ' + verdict[0] + '">' + verdict[1] + "</p>" +
      (B.inc > 0 && Math.abs(B.inc - B.planned) > 0.005 ? '<p class="note">Ontvangen in ' + monthName(mk) + ": " + money(B.inc) + "</p>" : "") + "</section>";

    let tx = '<section class="card"><div class="ch"><h2>Uitgaven en inkomsten</h2><span class="meta">' + B.list.length + '</span></div><div class="row-acts" style="margin-top:0"><button type="button" class="btn sm" data-act="new" data-type="tx">+ Uitgave</button><button type="button" class="btn sm ghost" data-act="new" data-type="tx" data-dir="in">+ Inkomen</button></div>';
    if (!B.list.length) tx += '<p class="none" style="margin-top:12px">Nog niets genoteerd in ' + monthName(mk) + ".</p>";
    else {
      const byDate = {}; B.list.forEach((t) => { (byDate[t.date] = byDate[t.date] || []).push(t); });
      Object.keys(byDate).sort().reverse().forEach((d) => {
        tx += '<div class="subh"><span>' + dayLabel(d) + "</span></div><ul class=\"rows\">" + byDate[d].sort((a, b) => b.createdAt - a.createdAt).map((t) => {
          const c = catOf(t.cat), isIn = t.dir === "in";
          return '<li class="it" style="--c:' + (isIn ? "var(--good)" : cv(c.color)) + '"><span class="mk round" aria-hidden="true"></span><button type="button" class="im" data-act="edit" data-k="tx" data-id="' + esc(t.id) + '"><span class="it-t">' + esc(t.note || (isIn ? "Inkomen" : c.name)) + '</span><span class="it-m">' + (isIn ? "Inkomen" : esc(c.name)) + (t.example ? '<i aria-hidden="true">·</i><span class="exm">Voorbeeld</span>' : "") + '</span></button><span class="amt' + (isIn ? " pos" : "") + '">' + (isIn ? "+" : "−") + money(t.amount) + "</span></li>";
        }).join("") + "</ul>";
      });
    }
    tx += "</section>";
    return h + '<div class="grid2"><div class="stack">' + hero + cats + '</div><div class="stack">' + plan + tx + "</div></div>";
  }
  function catRow(c, s, ro) {

    const meta = c.kind === "vast" ? "Vaste kost" : c.limit ? (over ? '<span class="bad">' + money(s - c.limit) + " over budget</span>" : "nog " + money(c.limit - s)) : "geen limiet";
    return '<li class="crow" style="--c:' + cv(c.color) + '"><span class="dot"></span><button type="button" class="im" ' + (ro ? "disabled" : 'data-act="edit" data-k="cat" data-id="' + esc(c.id) + '"') + '><span class="it-t">' + esc(c.name) + '</span><span class="it-m">' + meta + (c.example ? '<i aria-hidden="true">·</i><span class="exm">Voorbeeld</span>' : "") + "</span></button>" +
      '<span class="amt"><b>' + money(s) + "</b>" + (c.limit ? " / " + money0(c.limit) : "") + '</span><span class="cbar' + (over ? " over" : "") + '"><i style="width:' + p + '%"></i></span></li>';
  }

  /* ---------- render */
  const VIEWS = { home: viewHome, agenda: viewAgenda, tasks: viewTasks, study: viewStudy, skill: viewSkill, budget: viewBudget };
  let raf = 0;
  function schedule() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; render(); }); }
  function render() {
    const a = document.activeElement, keep = a && app.contains(a) && a.dataset ? { act: a.dataset.act, id: a.dataset.id, v: a.dataset.v, date: a.dataset.date, go: a.dataset.go } : null;
    app.innerHTML = VIEWS[view]();
    app.className = "main" + (animNext && !reduce ? " vin" : "");
    animNext = false;
    if (keep && (keep.act || keep.go)) {
      const sel = keep.go ? '[data-go="' + keep.go + '"]' : '[data-act="' + keep.act + '"]' + (keep.id ? '[data-id="' + CSS.escape(keep.id) + '"]' : "") + (keep.v ? '[data-v="' + CSS.escape(keep.v) + '"]' : "") + (keep.date ? '[data-date="' + keep.date + '"]' : "");
      try { const el = app.querySelector(sel); if (el) el.focus({ preventScroll: true }); } catch (e) {}
    }
    syncNav();
  }
  function examples() {
    const l = [];
    ["tasks", "lists", "events", "courses", "study", "tests", "cats", "tx"].forEach((c) => S[c].forEach((x) => { if (x.example) l.push([c, x.id]); }));
    if (S.settings.budget && S.settings.budget.example === true) l.push(["settings", "budget"]);

  }
  function syncNav() {
    document.querySelectorAll(".side-nav [data-go], .tabs [data-go]").forEach((b) => b.setAttribute("aria-current", b.dataset.go === view ? "page" : "false"));
    if (!isLoaded()) return;
    const late = lateTasks().length, openToday = dayItems(today, false).filter((x) => x.k !== "event" && x.k !== "exam").length;
    const set = (id, txt, bad) => { const el = document.getElementById(id); if (el) { el.textContent = txt; el.classList.toggle("bad", !!bad); } };

      '<p class="hint">Eén studiepunt staat voor 25 à 30 uur werk, lessen inbegrepen. Zet hier enkel de uren die je zelf wil studeren.</p>' + fSwatch(d.color) },
    cat: { title: (e) => (e ? "Categorie bewerken" : "Nieuwe categorie"), submit: "Toevoegen", body: (d) => fInp("name", "Naam", d.name, 'maxlength="30" placeholder="Boodschappen"') +
      '<div class="two">' + fInp("limit", "Per maand", d.limit, 'inputmode="decimal" placeholder="0,00"') + '<div class="field"><span class="lbl">Soort</span><div class="seg wide" role="group" aria-label="Soort">' + [["var", "Variabel"], ["vast", "Vast"]].map((o) => '<button type="button" data-sh="kind" data-v="' + o[0] + '" aria-pressed="' + (o[0] === d.kind) + '">' + o[1] + "</button>").join("") + "</div></div></div>" +
      '<p class="hint">Vast is wat elke maand vertrekt, zoals je gsm-abonnement. Variabel is een potje dat je zelf bewaakt.</p>' + fSwatch(d.color) },
    list: { title: (e) => (e ? "Lijst bewerken" : "Nieuwe lijst"), submit: "Lijst maken", body: (d) => fInp("name", "Naam", d.name, 'maxlength="24" placeholder="Examens, kot, verjaardagen…"') + fSwatch(d.color) },
    plan: { title: () => "Maandplan", submit: "Bewaar", body: (d) => '<p class="hint">Lifeboard trekt je spaardoel en vaste kosten af van je inkomen. Wat overblijft, is wat je vrij kan uitgeven.</p>' +
      '<div class="two">' + fInp("income", "Inkomen per maand", d.income, 'inputmode="decimal" placeholder="0,00"') + fInp("save", "Spaardoel per maand", d.save, 'inputmode="decimal" placeholder="0,00"') + "</div>" },
    week: { title: () => "Plan mijn week", submit: "", body: (d) => {
      let h = '<p class="hint">Lifeboard verdeelt je studietijd over 7 dagen. Vakken met een nabij examen of een achterstand krijgen meer blokken. Dagen die al vol zitten, slaat het over.</p>';
      h += fChips("daily", "Per dag", ["60", "90", "120", "180", "240"].map((m) => [m, hm(+m)]), String(d.daily));
      h += '<div class="two">' + fInp("time", "Start om", d.time, 'type="time"') + fInp("from", "Vanaf", d.from, 'type="date"') + "</div>";
      h += '<label class="toggle"><input type="checkbox" id="f-weekend" data-f="weekend"' + (d.weekend ? " checked" : "") + "> Ook in het weekend</label>";
      const plan = planWeek(d);
      sh.plan = plan;
      h += plan.length ? '<ul class="preview">' + plan.map((b) => { const c = courseOf(b.course); return '<li style="--c:' + cv(c.color) + '"><span class="d">' + fmt(b.date, SHORT) + '</span><span class="t">' + b.time + '</span><span class="n"><i></i>' + esc(c.name) + "</span><span>" + hm(b.minutes) + "</span></li>"; }).join("") + "</ul>"
        : '<p class="verdict">Niets te plannen. Voeg vakken met een urendoel en examendatum toe, of je week zit al vol.</p>';
      return h; } }
  };
  function renderSheet() {
    if (!sh) return;
    const def = SHEETS[sh.mode], edit = !!sh.id, d = sh.d;
    let h = "";
    if (!edit && QUICK.some((q) => q[0] === sh.mode)) h += '<div class="seg wide" role="group" aria-label="Wat voeg je toe">' + QUICK.map((q) => '<button type="button" data-sh="type" data-v="' + q[0] + '" aria-pressed="' + (q[0] === sh.mode) + '">' + q[1] + "</button>").join("") + "</div>";
    h += '<h2 id="sh-title">' + def.title(edit, d) + "</h2>" + def.body(d, edit);
    h += '<p class="err" id="sh-err" role="alert">' + esc(sh.err) + "</p>";
    const st = sh.mode === "skres" && skToday();
    const submit = sh.mode === "week" ? (sh.plan && sh.plan.length ? "Zet " + plural(sh.plan.length, "blok", "blokken") + " in je agenda" : "Sluiten") : st ? (d.status === "done" ? "Bevestig +" + st.lv.xp + " XP" : "Bevestig") : edit ? "Bewaar" : def.submit;
    const canDel = edit && ["task", "event", "study", "test", "tx", "course", "cat", "list"].indexOf(sh.mode) >= 0;
    h += '<div class="btns">' + (canDel ? '<button type="button" class="btn danger" data-act="sh-del">' + (sh.del ? "Zeker? Verwijder" : "Verwijder") + "</button>" : "") +
      '<button type="button" class="btn" data-act="sh-cancel">Annuleer</button><button type="submit" class="btn go">' + submit + "</button></div>";
    form.innerHTML = h;
  }
  function readForm() { if (!sh) return; form.querySelectorAll("[data-f]").forEach((el) => { sh.d[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value; }); }
  function planWeek(o) {
    const daily = clamp(parseInt(o.daily, 10) || 90, 15, 600), t0 = tm(o.time) || "19:00", from = dt(o.from, today);
    const cs = S.courses.map((c) => ({ c, s: cstats(c) })).filter((x) => x.s.unplanned > 0 && (!x.c.exam || x.c.exam > from));
    if (!cs.length) return [];
    const alloc = {}; cs.forEach((x) => { alloc[x.c.id] = 0; });
    const out = [];
    for (let i = 0; i < 7; i++) {
      const d = addDays(from, i), dow = parse(d).getDay();
      if (!o.weekend && (dow === 0 || dow === 6)) continue;
      const existing = S.study.filter((s) => s.kind === "blok" && s.date === d).reduce((a, s) => a + s.minutes, 0);
      const room = daily - existing; if (room < 25) continue;
      const n = Math.max(1, Math.round(room / 50)), len = Math.max(25, Math.round(room / n / 5) * 5);
      let t = t0, prev = "";
      for (let k = 0; k < n; k++) {
        let best = null, score = -1;
        cs.forEach((x) => {
          if (x.c.exam && x.c.exam <= d) return;
          const need = x.s.unplanned - alloc[x.c.id]; if (need <= 0) return;
          let sc = need / (x.c.exam ? Math.max(1, between(d, x.c.exam)) : 60);
          if (x.c.id === prev && cs.length > 1) sc *= 0.5;
          if (sc > score) { score = sc; best = x; }
        });
        if (!best) break;
        out.push({ date: d, time: t, minutes: len, course: best.c.id });
        alloc[best.c.id] += len; prev = best.c.id;
        const nt = addMin(t, len + 10); if (nt < t) break; t = nt;
      }
    }
    return out;
  }
  const E = (m) => ({ err: m });
  const SAVE = {
    task(d, id) {
      if (!d.title.trim()) return E("Geef de taak een naam.");
      const old = id && find(S.tasks, id);
      put("tasks", id || newId("t"), { title: d.title.trim(), date: dt(d.date, ""), time: tm(d.time), list: d.list, prio: d.prio, repeat: REPEAT[d.repeat] !== undefined ? d.repeat : "none", series: old ? old.series : "", done: old ? old.done : false, doneAt: old ? old.doneAt : "", example: false, createdAt: old ? old.createdAt : Date.now() });
      return id ? "Taak bewaard" : "Taak toegevoegd";
    },
    event(d, id) {
      if (!d.title.trim()) return E("Geef de afspraak een naam.");
      if (!D.test(d.date)) return E("Kies een dag.");
      if (d.start && d.end && d.end < d.start) return E("Het einduur ligt voor het startuur.");
      if (d.repeat === "weekly" && d.until && d.until < d.date) return E("De laatste keer ligt voor de eerste keer.");
      const old = id && find(S.events, id);
      put("events", id || newId("e"), { title: d.title.trim(), date: d.date, start: tm(d.start), end: tm(d.end), cat: d.cat, repeat: d.repeat, until: d.repeat === "weekly" ? dt(d.until, "") : "", example: false, createdAt: old ? old.createdAt : Date.now() });
      return id ? "Afspraak bewaard" : "Afspraak toegevoegd";
    },
    study(d, id) {
      if (!d.course || !find(S.courses, d.course)) return E("Kies een vak.");
      if (d.kind === "deadline" && !d.title.trim()) return E("Zeg wat er af moet.");
      if (!D.test(d.date)) return E("Kies een dag.");
      const mins = parseInt(d.minutes, 10) || 0, isLog = d.kind === "log", dl = d.kind === "deadline";
      if (!dl && mins <= 0) return E("Kies een duur.");
      if (!dl && mins > 720) return E("Eén sessie duurt hoogstens 12 uur.");
      if (isLog && d.date > today) return E("Een sessie in de toekomst kan je niet loggen. Kies Plannen.");
      const old = id && find(S.study, id), conf = parseInt(d.conf, 10) || 0;
      put("study", id || newId("s"), { kind: dl ? "deadline" : "blok", course: d.course, title: d.title.trim(), date: d.date, time: tm(d.time), minutes: dl ? 0 : mins,
        done: dl ? (old ? old.done : false) : isLog, doneAt: isLog ? d.date : dl && old ? old.doneAt : "",
        topics: isLog ? (d.topics || "").trim() : old ? old.topics : "", conf: isLog ? clamp(conf, 0, 10) : old ? old.conf : 0, mats: isLog ? d.mats.slice() : old ? old.mats : [],
        example: false, createdAt: old ? old.createdAt : Date.now() });
      if (isLog && !id) return hm(mins) + " " + courseOf(d.course).name + " gelogd";
      return id ? "Bewaard" : dl ? "Deadline toegevoegd" : "Studieblok gepland";
    },
    test(d, id) {
      if (!d.course || !find(S.courses, d.course)) return E("Kies een vak.");
      if (!D.test(d.date)) return E("Kies een datum.");
      const goal = d.goal === "" ? 0 : parseAmt(d.goal);
      if (!(goal >= 0 && goal <= 500)) return E("Het studiedoel moet tussen 0 en 500 uur liggen, of laat het leeg.");
      const old = id && find(S.tests, id), type = TTYPES[d.ttype] ? d.ttype : "quiz";
      put("tests", id || newId("q"), { course: d.course, type, date: d.date, prio: d.prio, goal, notes: (d.notes || "").trim(), example: false, createdAt: old ? old.createdAt : Date.now() });
      return id ? "Toets bewaard" : TTYPES[type].name + " " + courseOf(d.course).name + " " + rel(d.date);
    },
    mat(d) {
      if (!caps.assets) return "ok";
      if (!d.course || !find(S.courses, d.course)) return E("Kies een vak.");
      if (!sh.files.length) return E("Kies minstens één bestand.");
      uploadFiles(sh.files.slice(), { course: d.course, test: d.test });
      return "ok";
    },
    b5(d) {
      const p = d.progress === "" ? 0 : parseInt(d.progress, 10);
      if (!(p >= 0 && p <= 100)) return E("Vul een percentage tussen 0 en 100 in.");
      if (!d.phase.trim() && !d.next.trim()) return E("Vul minstens de fase of de volgende stap in.");
      put("settings", "break5", { phase: d.phase.trim(), progress: p, next: d.next.trim(), note: (d.note || "").trim(), updatedAt: Date.now() });
      return "Status bewaard";
    },
    skres(d) {
      const st = skToday(); if (!st) return "ok";
      const rating = parseInt(d.rating, 10) || 0, note = (d.note || "").trim();
      if (!rating) return E("Kies hoe zwaar het voelde.");
      if (d.status === "done" && note.length < 3) return E("Schrijf kort wat je deed. Dat is je bewijs.");
      const t0 = skTotals();
      put("skill", today, Object.assign({}, st.d, { status: d.status, rating, note, updatedAt: Date.now() }));
      if (d.status === "done") { const after = Math.floor((t0.xp + st.lv.xp) / XP_LEVEL) + 1; return after > t0.level ? "Niveau " + after + " bereikt" : "+" + st.lv.xp + " XP"; }
      return LVI[st.d.level] >= 2 ? "Eerlijk geprobeerd, +1 XP" : "Genoteerd. Morgen nieuwe kaarten.";
    },
    share() { return "ok"; },
    tx(d, id) {
      const amt = parseAmt(d.amount);
      if (!(amt > 0)) return E("Vul een bedrag in, bijvoorbeeld 12,50.");
      if (!D.test(d.date)) return E("Kies een dag.");
      const old = id && find(S.tx, id);
      put("tx", id || newId("x"), { date: d.date, amount: amt, dir: d.dir, cat: d.dir === "out" ? d.cat : "", note: d.note.trim(), example: false, createdAt: old ? old.createdAt : Date.now() });
      if (monthKey(d.date) !== ui.budMonth && view === "budget") ui.budMonth = monthKey(d.date);
      return (d.dir === "in" ? "+" : "−") + money(amt) + " genoteerd";
    },
    course(d, id) {
      if (!d.name.trim()) return E("Geef het vak een naam.");
      const goal = parseAmt(d.goal);
      if (d.goal !== "" && !(goal >= 0)) return E("Het urendoel moet een getal zijn.");
      const old = id && find(S.courses, id);
      put("courses", id || newId("c"), { name: d.name.trim(), exam: dt(d.exam, ""), goal: goal > 0 ? goal : 0, color: d.color, start: old ? old.start || today : today, example: false, createdAt: old ? old.createdAt : Date.now() });
      return id ? "Vak bewaard" : "Vak toegevoegd";
    },
    cat(d, id) {
      if (!d.name.trim()) return E("Geef de categorie een naam.");
      const lim = d.limit === "" ? 0 : parseAmt(d.limit);
      if (!(lim >= 0)) return E("Het bedrag per maand moet een getal zijn.");
      const old = id && find(S.cats, id);
      put("cats", id || newId("k"), { name: d.name.trim(), limit: lim, kind: d.kind, color: d.color, example: false, createdAt: old ? old.createdAt : Date.now() });
      return id ? "Categorie bewaard" : "Categorie toegevoegd";
    },
    list(d, id) {
      if (!d.name.trim()) return E("Geef de lijst een naam.");
      const old = id && find(S.lists, id), nid = id || newId("l");
      put("lists", nid, { name: d.name.trim(), color: d.color, example: false, createdAt: old ? old.createdAt : Date.now() });
      if (!id) ui.list = nid;
      return id ? "Lijst bewaard" : "Lijst gemaakt";
    },
    plan(d) {
      const inc = d.income === "" ? 0 : parseAmt(d.income), sv = d.save === "" ? 0 : parseAmt(d.save);
      if (!(inc >= 0) || !(sv >= 0)) return E("Vul bedragen in, bijvoorbeeld 850 of 850,00.");
      put("settings", "budget", { income: inc, save: sv, example: false });
      return "Maandplan bewaard";
    },
    week(d) {
      const plan = sh.plan || [];
      if (!plan.length) return "ok";
      const base = Date.now();
      put("settings", "study", { daily: clamp(parseInt(d.daily, 10) || 90, 15, 600), time: tm(d.time) || "19:00", weekend: !!d.weekend });
      serial(plan.map((b, i) => () => put("study", newId("s"), { kind: "blok", course: b.course, title: "", date: b.date, time: b.time, minutes: b.minutes, done: false, doneAt: "", example: false, createdAt: base + i })));
      return plural(plan.length, "studieblok", "studieblokken") + " gepland";
    }
  };
  function submitSheet() {
    readForm();
    const msg = SAVE[sh.mode](sh.d, sh.id);
    if (msg && msg.err) { sh.err = msg.err; renderSheet(); return; }
    closeSheet();
    if (msg && msg !== "ok") toast(msg);
  }
  function deleteSheet() {
    if (!sh.del) { sh.del = true; readForm(); renderSheet(); return; }
    const m = sh.mode, id = sh.id;
    const C = { task: "tasks", event: "events", study: "study", test: "tests", tx: "tx", course: "courses", cat: "cats", list: "lists" }[m];
    if (m === "course") { const bl = S.study.filter((s) => s.course === id), ts = S.tests.filter((t) => t.course === id); serial(bl.map((s) => () => del("study", s.id)).concat(ts.map((t) => () => del("tests", t.id)))); }
    if (m === "list" && ui.list === id) ui.list = "all";
    del(C, id);
    closeSheet(); toast("Verwijderd");
  }

  /* ---------- events */
  document.addEventListener("click", (e) => {
    const g = e.target.closest("[data-go]");
    if (g && !e.target.closest("[data-act]")) { go(g.dataset.go); return; }
    const s = e.target.closest("[data-sh]");
    if (s && sh) {
      readForm();
      const f = s.dataset.sh, v = s.dataset.v;
      if (f === "type") { const title = sh.d.title || ""; sh = { mode: v, id: "", d: defaults(v, "", { date: sh.d.date }), del: false, err: "", files: [] }; if (v !== "tx" && v !== "test") sh.d.title = title; else if (v === "tx") sh.d.note = title; }
      else if (f === "mat") { const i = sh.d.mats.indexOf(v); if (i >= 0) sh.d.mats.splice(i, 1); else sh.d.mats.push(v); }
      else if (f === "test") sh.d.test = sh.d.test === v ? "" : v;
      else { sh.d[f] = v; if (f === "course" && sh.mode === "mat") sh.d.test = ""; }
      sh.err = ""; renderSheet(); return;
    }
    const b = e.target.closest("[data-act]");
    if (!b) { if (e.target === back) closeSheet(); return; }
    const a = b.dataset.act, id = b.dataset.id, k = b.dataset.k;
    switch (a) {
      case "new": {
        const type = b.dataset.type || TYPES_FROM_VIEW[view];
        openSheet(type, "", { date: b.dataset.date, course: b.dataset.course, dir: b.dataset.dir, kind: b.dataset.kind });
        break;
      }
      case "edit": {
        if (k === "exam") openSheet("course", id);
        else openSheet({ task: "task", event: "event", study: "study", deadline: "study", test: "test", tx: "tx", cat: "cat", course: "course", list: "list" }[k], id);
        break;
      }
      case "toggle": toggle(k, id, b); break;
      case "totoday": toToday(k, id); break;
      case "alltoday": allToday(); break;
      case "draw": draw(b.dataset.area); break;
      case "mdone": missionStatus("done", b); break;
      case "mskip": missionStatus("skipped"); break;
      case "mundo": missionStatus("open"); break;
      case "mtask": missionTask(); break;
      case "mreroll": reroll(); break;
      case "homedone": ui.homeDone = !ui.homeDone; render(); break;
      case "showdone": ui.showDone = !ui.showDone; render(); break;
      case "opday": ui.calSel = b.dataset.date; ui.calMonth = monthKey(ui.calSel); ui.calMode = "maand"; go("agenda"); break;
      case "selday": ui.calSel = b.dataset.date; if (monthKey(ui.calSel) !== ui.calMonth) ui.calMonth = monthKey(ui.calSel); render();
        if (!matchMedia("(min-width: 1000px)").matches) { const dc = app.querySelector(".daycard"); if (dc) dc.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" }); }
        break;
      case "calprev": ui.calMonth = addMonths(ui.calMonth, -1); render(); break;
      case "calnext": ui.calMonth = addMonths(ui.calMonth, 1); render(); break;
      case "caltoday": ui.calMonth = monthKey(today); ui.calSel = today; render(); break;
      case "calmode": ui.calMode = b.dataset.v; try { localStorage.setItem("lifeboard.calmode", ui.calMode); } catch (err) {} animNext = true; render(); break;
      case "listf": ui.list = b.dataset.v; render(); break;
      case "budprev": if (ui.budMonth > monthKey(addDays(today, -360))) { ui.budMonth = addMonths(ui.budMonth, -1); animNext = true; render(); } else toast("Lifeboard toont tot 12 maanden terug"); break;
      case "budnext": if (ui.budMonth < addMonths(monthKey(today), 6)) { ui.budMonth = addMonths(ui.budMonth, 1); animNext = true; render(); } break;
      case "editplan": openSheet("plan"); break;
      case "defcats": defCats(); break;
      case "planweek": openSheet("week"); break;
      case "clearex": if (askConfirm("clearex")) clearExamples(); else render(); break;
      case "cleardone": if (askConfirm("cleardone")) clearDone(); else render(); break;
      case "sh-cancel": closeSheet(); break;
      case "sh-del": deleteSheet(); break;
      case "sh-nodate": readForm(); sh.d.date = ""; renderSheet(); break;
      case "sh-course": closeSheet(); openSheet("course"); break;
      case "sh-pick": readForm(); document.getElementById("file-in").value = ""; document.getElementById("file-in").click(); break;
      case "sh-unfile": readForm(); sh.files.splice(+b.dataset.v, 1); renderSheet(); break;
      case "sh-open": { const mid = b.dataset.id; closeSheet(); openReader(mid); break; }
      case "sh-addmat": { const tt = find(S.tests, sh.id); closeSheet(); if (tt) openSheet("mat", "", { course: tt.course, test: tt.id }); break; }
      case "skpick": if (!skToday()) { ui.skPick = ui.skPick === b.dataset.v ? "" : b.dataset.v; render(); } break;
      case "skreveal": skReveal(); break;
      case "skdone": openSheet("skres", "", { status: "done" }); break;
      case "skfail": openSheet("skres", "", { status: "failed" }); break;
      case "skundo": { const st = skToday(); if (st) put("skill", today, Object.assign({}, st.d, { status: "chosen", rating: 0, note: "", updatedAt: Date.now() })); break; }
      case "skshare": skShare(); break;
      case "editb5": openSheet("b5"); break;
      case "openmat": openReader(id); break;
      case "matf": ui.mf = b.dataset.v; render(); break;
      case "r-close": closeReader(); break;
      case "r-log": logFromReader(); break;
      case "r-save": saveCopy(); break;
      case "r-del": delFromReader(b); break;
      case "r-sheet": if (rd && rd.wb) { rd.sheet = +b.dataset.v; renderXlTab(); } break;
    }
  });
  document.getElementById("file-in").addEventListener("change", (e) => {
    if (!sh || sh.mode !== "mat") return;
    const bad = [];
    Array.prototype.forEach.call(e.target.files || [], (f) => { const err = checkFile(f); if (err) bad.push(err); else sh.files.push(f); });
    sh.err = bad.join(" "); renderSheet();
  });
  form.addEventListener("submit", (e) => { e.preventDefault(); if (sh) submitSheet(); });
  form.addEventListener("change", (e) => { if (sh && sh.mode === "week" && e.target.matches("[data-f]")) { readForm(); renderSheet(); } });
  document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; if (sh) closeSheet(); else if (rd) closeReader(); });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1), v = Object.keys(HASH).find((k) => HASH[k] === h); if (v && v !== view) go(v); });
  setInterval(() => {
    const n = ymd(new Date());
    if (n !== today) { today = n; ui.calSel = n; ui.calMonth = monthKey(n); ui.budMonth = monthKey(n); ui.skPick = ""; }
    if (!sh) render();
  }, 60000);

  render();
  connect();
})();
</script>
